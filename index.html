<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps de Matemática</title>
<style>
  :root { --bg: #f4f5f7; --ink: #1d2433; --muted: #5b6475; --card: #fff; --line: #dde1e8; --accent: #e8710a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171d; --ink: #e8ebf0; --muted: #9aa3b2; --card: #1d2129; --line: #2e3440; --accent: #f59a3c; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  a.card { display: block; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  a.card b { color: var(--accent); }
  a.card span { display: block; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Apps de Matemática</h1>
  <p class="sub">Matemática A · aplicações interativas</p>
  <a class="card" href="funcao-enrolamento/"><b>Função de enrolamento</b>
    <span>A reta real enrola-se na circunferência trigonométrica: E(t) = (cos t, sin t).</span></a>
</main>
</body>
</html>
