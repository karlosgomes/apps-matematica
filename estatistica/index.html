<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estatística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.19/dist/plot.umd.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --ink: #17202b; --muted: #333d4a; --faint: #6b7685; --grid: #e6eaf0; --grid2: #c4cdd8;
    --btn: #eef2f6; --line: #b3bfcc; --band: #f6f8fb; --on: #ffffff; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5;
    --c1: #1565c0; --c2: #d32f2f; --c3: #2e7d32; --hot: #ef6c00; --pi: #7b3fb0; --bar: #90b4e0;
    /* cores dos grupos (sem o vermelho, que é o da curva de regressão e dos outliers) */
    --g0: #1565c0; --g1: #e65100; --g2: #2e7d32; --g3: #8e24aa; --g4: #00838f; --g5: #ad1457; --g6: #6d4c41; --g7: #a07800; --g8: #546e7a; --g9: #827717;
    --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #151b22; --ink: #e6ebf1; --muted: #b4bdc8; --faint: #8592a1; --grid: #232c36; --grid2: #3a4552;
    --btn: #212b36; --line: #46525f; --band: #1c242d; --on: #151b22; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22;
    --c1: #64a8ff; --c2: #ff6b6b; --c3: #5cc26a; --hot: #ffa040; --pi: #c79bff; --bar: #3d6aa3;
    --g0: #64a8ff; --g1: #ffa040; --g2: #5cc26a; --g3: #ce93d8; --g4: #4dd0e1; --g5: #f48fb1; --g6: #bcaaa4; --g7: #ffd54f; --g8: #b0bec5; --g9: #d4e157;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { min-height: 100vh; display: flex; flex-direction: column; gap: 0.6rem; padding: 0.7rem; font-size: 15px; }
  .katex { font-size: 1.08em; }

  /* faixa de cima: título, modo (uma ou duas variáveis) e modo escuro */
  .top { display: flex; gap: 0.5rem; }
  .band { flex: 1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem 1rem;
          background: var(--band); border: 1.5px solid var(--line); border-radius: 8px; padding: 0.35rem 0.8rem; min-height: 2.6rem; }
  .band h1 { margin: 0; font-size: 1.25rem; }
  .seg { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; }
  button.b { font: inherit; font-weight: 700; font-size: 0.9rem; padding: 0.25rem 0.75rem; border-radius: 8px; cursor: pointer;
             background: var(--btn); color: var(--ink); border: 2px solid var(--line); white-space: nowrap; line-height: 1.3; }
  button.b[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--on); }
  button.b.small { font-size: 0.82rem; padding: 0.15rem 0.55rem; }
  button.b:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #cols select.inp { max-width: 11rem; }
  #ex-sel { min-width: 0; max-width: 15rem; font-size: 0.85rem; }
  /* cada nome com a sua lista, sempre na mesma linha (descem juntos) */
  /* botões dos grupos (uma variável) e legenda clicável (duas): esbatidos e riscados quando escondidos */
  .gchips { display: inline-flex; flex-wrap: wrap; gap: 0.25rem; }
  .gchip { font: inherit; font-size: 0.76rem; font-weight: 700; font-style: normal; padding: 0.05rem 0.5rem; border-radius: 999px; cursor: pointer;
           color: var(--gc); background: color-mix(in srgb, var(--gc) 12%, transparent); border: 1.5px solid var(--gc); }
  .gchip.off { opacity: 0.4; text-decoration: line-through; background: none; }
  svg .legi { cursor: pointer; }
  #cols .pair { display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
  #theme { width: 3.2rem; font-size: 1.1rem; align-self: flex-start; height: max(2.6rem, 100%); max-height: 3.4rem; }

  /* cartões dos controlos: numa coluna à esquerda no ecrã largo; em cima, numa grelha, nos ecrãs estreitos */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 0.6rem; align-content: start; }
  @media (min-width: 900px) {
    body { display: grid; grid-template-columns: minmax(330px, 25rem) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
           height: 100vh; min-height: 0; }
    .top { grid-column: 1 / -1; }
    /* (max-content: os cartões não encolhem — a coluna é que desce) */
    .cards { grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; overflow-y: auto; min-height: 0; padding-right: 2px; }
    .plots { min-height: 0; }
  }
  .card { position: relative; background: var(--band); border: 1.2px solid var(--line); border-radius: 9px; padding: 0.55rem 0.7rem 0.6rem 1rem;
          display: flex; flex-direction: column; gap: 0.4rem; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bar-c, var(--muted)); border-radius: 9px 0 0 9px; }
  /* menus pendentes do tipo de gráfico e do modelo de regressão */
  select.inp.sel { font-family: var(--font); font-weight: 700; font-size: 0.9rem; padding: 0.25rem 0.45rem; min-width: 14rem; cursor: pointer; }
  .card h2 { margin: 0; font-size: 0.85rem; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .row { display: flex; align-items: center; gap: 0.4rem 0.6rem; flex-wrap: wrap; font-size: 0.9rem; }
  .lbl { color: var(--muted); font-size: 0.85rem; }
  textarea, input.inp, select.inp {
    font-family: var(--mono); font-size: 0.85rem; color: var(--ink); background: var(--bg);
    border: 2px solid var(--line); border-radius: 7px; padding: 0.25rem 0.4rem; outline: none; }
  textarea { width: 100%; resize: vertical; min-height: 6.2rem; line-height: 1.35; }
  textarea:focus, input.inp:focus, select.inp:focus { border-color: var(--focus); }
  input.inp { width: 5rem; text-align: right; }
  input.inp.bad { border-color: var(--bad); background: var(--badbg); }
  .msg { font-size: 0.8rem; color: var(--bad); min-height: 1em; }
  .msg.info { color: var(--faint); font-style: italic; }
  .chk { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; font-size: 0.88rem; }
  .chk input { width: 1rem; height: 1rem; margin: 0; accent-color: var(--muted); cursor: pointer; }

  /* medidas e resultados */
  .meas { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: 0.15rem 0.8rem; font-size: 0.9rem; }
  .meas div { display: flex; justify-content: space-between; gap: 0.4rem; border-bottom: 1px dotted var(--grid2); padding: 0.1rem 0; }
  .meas .k { color: var(--muted); }
  .meas .v { font-variant-numeric: tabular-nums; }
  .eq { font-size: 1.15rem; padding: 0.15rem 0; overflow: hidden; }
  .eq .katex-html { white-space: nowrap; }
  .eq.none { font-size: 0.88rem; color: var(--faint); font-style: italic; }   /* a equação numa só linha; o fitEq encolhe a letra até caber */
  /* medidas por grupo: uma coluna por grupo */
  .gmeas { overflow-x: auto; }
  .gmeas table.freq th { text-align: right; font-weight: 700; white-space: nowrap; }
  .gmeas table.freq td:first-child { color: var(--muted); }
  .geq { display: flex; align-items: baseline; gap: 0.45rem; font-size: 1rem; overflow: hidden; }
  .geq .sw, .gname .sw { flex: none; width: 0.7rem; height: 0.7rem; border-radius: 50%; border: 2.5px solid; display: inline-block; }
  .geq .t { flex: 1; min-width: 0; overflow: hidden; } .geq .t .katex-html { white-space: nowrap; }
  .geq .m { flex: none; font-size: 0.85rem; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .geq .e { font-size: 0.82rem; color: var(--faint); font-style: italic; }
  .gname { font-weight: 700; display: inline-flex; align-items: center; gap: 0.3rem; }
  #yest .gname { margin-right: 0.7rem; font-weight: 400; }
  /* cartões que se fecham (Medidas, Resultados): fica só o título */
  .card.folded > :not(h2) { display: none !important; }
  .card.folded h2 .lbl, .card.folded h2 select { display: none; }
  button.b.close { width: 1.7rem; padding: 0 0 0.1rem; font-size: 1.05rem; line-height: 1.15; margin-left: 0.2rem; }
  button.b.fold { width: 1.9rem; padding: 0.05rem 0; font-size: 0.95rem; line-height: 1.2; }
  .note { font-size: 0.75rem; color: var(--faint); font-style: italic; }

  /* gráficos */
  .plots { flex: 1; min-height: 340px; display: grid; gap: 0.6rem; }
  .plots.uni { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto auto; }
  /* barra horizontal (arrastar) entre o gráfico principal e o de baixo (extremos e quartis / resíduos) */
  .plots .main { grid-column: 1; grid-row: 1; }
  .plots .box, .plots .resid { grid-column: 1; grid-row: 3; }
  .hgrip { display: none; grid-column: 1; grid-row: 2; height: 8px; margin: -0.45rem 0; cursor: row-resize; border-radius: 4px; position: relative; touch-action: none; }
  .plots.lower .hgrip { display: block; }
  /* «Diagrama de extremos e quartis» como gráfico: ocupa a área toda */
  .plots.boxonly .main, .plots.boxonly .hgrip { display: none !important; }
  .plots.boxonly .box { grid-row: 1 / -1; }
  .plots.boxonly #fig-box { flex: 1; height: auto; min-height: 120px; }
  .hgrip::after { content: ""; position: absolute; top: 3px; left: 50%; height: 2px; width: 2.6rem; margin-left: -1.3rem; border-radius: 1px; background: var(--line); }
  .hgrip:hover, .hgrip.on { background: color-mix(in srgb, var(--focus) 18%, transparent); }
  /* com a coluna da direita (tabelas, caule e folhas): gráficos | barra de arrastar | coluna (largura em --side-w, guardada) */
  .plots.tab { grid-template-columns: minmax(0, 1fr) 8px var(--side-w, minmax(15rem, 22rem)); column-gap: 0.25rem; }
  .plots.tab .main { grid-column: 1; grid-row: 1; }
  .plots.uni.tab .box { grid-column: 1; grid-row: 3; }
  .grip { display: none; }
  .plots.tab .grip { display: block; grid-column: 2; grid-row: 1 / -1; cursor: col-resize; border-radius: 4px; position: relative; touch-action: none; }
  .plots.tab .grip::after { content: ""; position: absolute; left: 3px; top: 50%; width: 2px; height: 2.6rem; margin-top: -1.3rem; border-radius: 1px; background: var(--line); }
  .plots.tab .grip:hover, .plots.tab .grip.on { background: color-mix(in srgb, var(--focus) 18%, transparent); }
  .side { display: none; }
  .plots.uni.tab .side { grid-column: 3; grid-row: 1 / -1; display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; overflow: auto; }
  .side .frame { flex: none; }
  .plots.uni.tab #dat-frame { flex: 1 0 14rem; overflow: auto; }
  .plots.bi { grid-template-rows: minmax(0, 1fr) auto auto; }
  #fig-res { flex: none; height: 150px; }
  .plots.bi.tab .side { grid-column: 3; grid-row: 1 / -1; display: flex; flex-direction: column; min-height: 0; }
  .plots.bi.tab #dat-frame { flex: 1; min-height: 0; overflow: auto; }
  /* tabela dos dados com todas as colunas: o cabeçalho escolhe o papel da coluna */
  #dat th.col { cursor: pointer; white-space: nowrap; }
  #dat th.col:hover { color: var(--focus); }
  #dat .role { display: inline-block; margin-left: 0.3rem; padding: 0 0.3rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; background: var(--muted); color: var(--on); }
  table.freq td.rc, table.freq th.rc { background: color-mix(in srgb, var(--c1) 9%, transparent); }
  table.freq td.na { color: var(--faint); font-style: italic; }
  table.freq tr.miss td { color: var(--faint); }
  /* tabela dos dados (duas variáveis): tudo centrado */
  #dat table.freq th, #dat table.freq td { text-align: center; }
  table.freq tr.excl td { color: var(--faint); text-decoration: line-through; }
  table.freq tr.excl td:first-child { text-decoration: none; }
  #dat input.exc { accent-color: var(--c2); width: 0.95rem; height: 0.95rem; margin: 0; cursor: pointer; vertical-align: middle; }
  table.freq tr.hot td { background: color-mix(in srgb, var(--hot) 22%, transparent); }
  table.freq tbody tr { cursor: default; }
  /* seleção com o rato (linhas da tabela dos dados ↔ pontos do gráfico) */
  #dat tbody { user-select: none; }
  /* menu do botão direito (pares selecionados) */
  #ctx { position: fixed; z-index: 50; display: flex; flex-direction: column; min-width: 13rem; padding: 0.3rem; background: var(--band);
         border: 1.2px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); font-size: 0.88rem; }
  #ctx button { font: inherit; text-align: left; padding: 0.35rem 0.6rem; border: 0; border-radius: 5px; background: none; color: var(--ink); cursor: pointer; }
  #ctx button:hover:not(:disabled), #ctx button:focus-visible { background: var(--btn); }
  #ctx button:disabled { color: var(--faint); cursor: default; }
  #ctx hr { border: 0; border-top: 1px solid var(--line); margin: 0.2rem 0; }
  #dat-frame h3 { position: sticky; top: -0.4rem; z-index: 2; background: var(--bg); margin: -0.4rem -0.6rem 0.2rem; padding: 0.4rem 0.6rem 0.2rem; }
  #dat tbody tr { cursor: pointer; }
  table.freq tr.sel td { background: color-mix(in srgb, var(--c1) 20%, transparent); }
  table.freq tr.sel.hot td { background: color-mix(in srgb, var(--hot) 30%, transparent); }
  /* caule e folhas: só texto, discreto */
  #stem { font-family: var(--mono); font-size: 0.92rem; line-height: 1.5; overflow-x: auto; }
  #stem .r { display: flex; white-space: nowrap; }
  #stem .s { min-width: 2.6ch; text-align: right; font-weight: 600; padding-right: 0.5ch; border-right: 1.5px solid var(--ink); margin-right: 0.6ch; }
  #stem .l { color: var(--c1); letter-spacing: 0.08ch; }
  #stem .gh { font-family: var(--font); font-weight: 700; font-size: 0.85rem; margin: 0.5rem 0 0.15rem; }
  #stem .gh:first-child { margin-top: 0; }
  #stem .k { font-family: var(--font); font-style: italic; font-size: 0.78rem; color: var(--faint); margin-top: 0.35rem; white-space: normal; }
  .frame { border: 1.2px solid var(--line); border-radius: 9px; padding: 0.4rem 0.6rem; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .frame h3 { margin: 0 0 0.2rem; font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
  .frame h3 span { font-weight: 400; color: var(--faint); font-style: italic; font-size: 0.78rem; }
  .frame h3 .hr { display: inline-flex; align-items: center; gap: 0.35rem; font-style: normal; }
  .frame h3 .hr > span { font-style: italic; }
  .frame h3 .chk.out { font-size: 0.8rem; font-weight: 700; color: var(--muted); font-style: normal; margin-right: 0.3rem; }
  .frame h3 .chk.out input { accent-color: var(--c2); }
  .frame h3 .chk.vio input { accent-color: var(--pi); }
  button.b.exp { font-size: 0.72rem; padding: 0.05rem 0.45rem; font-weight: 700; color: var(--muted); }
  .fig { flex: 1; min-height: 0; position: relative; }
  .fig svg { display: block; overflow: visible; }
  /* fundo das dicas do Plot (Plot.tip usa --plot-background, branco por omissão): o da página, para se lerem no modo escuro */
  .fig svg { --plot-background: var(--bg) !important; }
  /* (o gráfico não pode determinar o tamanho do seu quadro: mede-se o quadro e desenha-se lá dentro) */
  #fig-main > svg { position: absolute; left: 0; top: 0; }
  #fig-box { flex: none; height: 96px; }
  .table { overflow: auto; }
  table.freq { border-collapse: collapse; font-size: 0.85rem; width: 100%; font-variant-numeric: tabular-nums; }
  table.freq th, table.freq td { border-bottom: 1px solid var(--grid2); padding: 0.2rem 0.35rem; text-align: right; }
  table.freq th:first-child, table.freq td:first-child { text-align: left; white-space: nowrap; }
  table.freq tfoot td { font-weight: 700; border-top: 1.5px solid var(--line); }
  @media (max-width: 760px) {
    .plots.uni.tab, .plots.bi.tab { grid-template-columns: 1fr; }
    .plots.tab .grip { display: none; }
    .plots .main, .plots .box, .plots .resid, .plots.uni.tab .box { grid-row: auto; }
    .plots.lower .hgrip { display: none; }
    /* no ecrã estreito a coluna vai para baixo, e a altura arrasta-se pelo canto */
    .plots.bi.tab .side { grid-column: 1; grid-row: auto; height: 20rem; resize: vertical; overflow: auto; }
    .plots.uni.tab .side { grid-column: 1; grid-row: auto; }
    .plots.uni.tab #dat-frame { height: 20rem; flex: none; resize: vertical; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="top">
  <div class="band">
    <h1>Estatística</h1>
    <div class="seg" role="group" aria-label="Tipo de dados">
      <button class="b" id="m-uni" aria-pressed="true">Uma variável</button>
      <button class="b" id="m-bi" aria-pressed="false">Duas variáveis (regressão)</button>
      <button class="b" id="report" title="Relatório com os dados, as medidas, as tabelas e os gráficos, pronto a guardar em PDF">📄 Relatório (PDF)</button>
    </div>
  </div>
  <button class="b" id="theme" title="Modo claro / escuro">☾</button>
</div>

<div class="cards">
  <div class="card" style="--bar-c: var(--c1)">
    <h2><span id="data-title">Dados</span><select class="inp sel" id="ex-sel" aria-label="Exemplos e conjuntos de dados"></select></h2>
    <textarea id="data" spellcheck="false" aria-label="Dados"></textarea>
    <div class="row">
      <button class="b small" id="open" title="Abrir um ficheiro de dados (.csv, .tsv ou .txt), por exemplo descarregado do Kaggle">📂 Abrir ficheiro</button>
      <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>
      <label class="chk" title="Mostra os dados numa tabela à direita dos gráficos; com uma tabela (CSV), clicar no cabeçalho de uma coluna escolhe-a"><input type="checkbox" id="sh-dat"> Tabela dos dados</label>
      <span class="lbl" id="tinfo"></span>
    </div>
    <div class="note" id="src" hidden></div>
    <div class="row" id="cols" hidden></div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- uma variável -->
  <div class="card uni-only" style="--bar-c: var(--hot)">
    <h2>Gráfico</h2>
    <div class="row">
      <select class="inp sel" id="g-sel" aria-label="Tipo de gráfico">
        <option value="hist" selected>Histograma</option>
        <option value="bars">Diagrama de barras</option>
        <option value="dots">Diagrama de pontos</option>
        <option value="box">Diagrama de extremos e quartis</option>
        <option value="dens" id="g-dens" hidden disabled>Densidades sobrepostas (por grupo)</option>
      </select>
    </div>
    <div class="row" id="hist-opts">
      <span class="lbl">Classes</span>
      <label class="chk"><input type="checkbox" id="k-auto" checked> automático</label>
      <input class="inp" id="k" type="text" inputmode="numeric" aria-label="Número de classes" style="width:3.2rem">
      <span class="lbl">amplitude</span>
      <input class="inp" id="h" type="text" inputmode="decimal" aria-label="Amplitude das classes" style="width:4.2rem">
      <span class="lbl">início</span>
      <input class="inp" id="a0" type="text" inputmode="decimal" aria-label="Início da primeira classe" style="width:4.2rem">
    </div>
    <div class="row" id="freq-row">
      <span class="lbl">Frequência</span>
      <div class="seg" role="group" aria-label="Frequência">
        <button class="b small" data-f="abs" aria-pressed="true">absoluta</button>
        <button class="b small" data-f="rel" aria-pressed="false">relativa</button>
      </div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="sh-box"> Diagrama de extremos e quartis</label>
      <label class="chk"><input type="checkbox" id="sh-mean"> Média e mediana</label>
      <label class="chk"><input type="checkbox" id="sh-tab"> Tabela de frequências</label>
      <label class="chk"><input type="checkbox" id="sh-stem"> Caule e folhas</label>
      <label class="chk" title="Estimativa da densidade por núcleo gaussiano, sobreposta ao gráfico, na escala das frequências"><input type="checkbox" id="sh-dens"> Curva de densidade</label>
    </div>
  </div>
  <div class="card uni-only" style="--bar-c: var(--c3)">
    <h2>Medidas <span class="row"><span class="lbl">casas decimais</span>

      <label class="chk out" title="Cada caule em duas linhas: folhas de 0 a 4 e de 5 a 9"><input type="checkbox" id="stem-split"> Caules divididos</label><button class="b small close" type="button" data-close="stem" title="Fechar o caule e folhas" aria-label="Fechar o caule e folhas">×</button></span></h3>

  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ---------- modo escuro (a mesma chave do weblog) ----------
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    document.documentElement.dataset.theme = on ? "dark" : "light";
    $("theme").textContent = on ? "☀" : "☾";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  $("theme").onclick = () => { setDark(!dark, true); render(); };

  // ---------- estado ----------
  const KEY = "apps-mat-estatistica";
  const S = {
    mode: "uni", graph: "hist", freq: "abs", kAuto: true, k: null, h: null, a0: null,
    box: false, violin: false, mean: false, tab: false, stem: false, dens: false, out: false, split: false, dec: 2,
    col: { v: null, x: null, y: null, g: null },   // colunas escolhidas, quando os dados são uma tabela (CSV); g = coluna dos grupos
    model: null, curve: true, res: false, cg: false, dat: false, mdens: false, byG: false, dec2: 3, xest: "",
    data: { uni: null, bi: null },
    picked: { uni: "", bi: "" },   // escolha no menu de exemplos («e0», «d:penguins», …)
  };
  // conjuntos de dados clássicos: ficheiros CSV em dados/, carregados quando se escolhem; colunas escolhidas à partida
  const DATASETS = [
    { id: "penguins", name: "Pinguins de Palmer", file: "penguins.csv", uni: { v: "bill_length_mm" }, bi: { x: "bill_length_mm", y: "bill_depth_mm" },
      src: "Pinguins de Palmer (Horst, Hill e Gorman, pacote palmerpenguins do R; também no TidyTuesday de 2020), domínio público (CC0)" },
    { id: "iris", name: "Íris (Fisher)", file: "iris.csv", uni: { v: "Petal.Length" }, bi: { x: "Petal.Length", y: "Petal.Width" },
      src: "Íris de Fisher e Anderson (1935), conjunto iris do R" },
    { id: "faithful", name: "Géiser Old Faithful", file: "faithful.csv", uni: { v: "waiting" }, bi: { x: "eruptions", y: "waiting" },
      src: "Géiser Old Faithful (Yellowstone): duração das erupções e espera até à seguinte, em minutos; conjunto faithful do R" },
    { id: "anscombe", name: "Quarteto de Anscombe", file: "anscombe.csv", uni: { v: "y", g: "conjunto" }, bi: { x: "x", y: "y", g: "conjunto" },
      src: "Quarteto de Anscombe (1973): quatro conjuntos com as mesmas médias, desvios padrão e reta de regressão, mas muito diferentes no gráfico; conjunto anscombe do R" },
    { id: "mtcars", name: "Automóveis (mtcars)", file: "mtcars.csv", uni: { v: "mpg" }, bi: { x: "wt", y: "mpg" },
      src: "32 automóveis da revista Motor Trend (1974): mpg = milhas por galão, wt = peso (milhares de libras), cyl = cilindros; conjunto mtcars do R" },
    { id: "mpg", name: "Consumo de combustível (mpg)", file: "mpg.csv", uni: { v: "hwy" }, bi: { x: "displ", y: "hwy" },
      src: "234 automóveis (1999 e 2008): displ = cilindrada (L), hwy e cty = milhas por galão em estrada e em cidade; conjunto mpg do ggplot2 (Tidyverse), dados da EPA" },
    { id: "gapminder", name: "Gapminder", file: "gapminder.csv", uni: { v: "lifeExp" }, bi: { x: "gdpPercap", y: "lifeExp" },
      src: "Gapminder: esperança de vida, população e PIB por habitante de 142 países, de 5 em 5 anos (1952–2007); pacote gapminder do R (Jenny Bryan), CC0, dados de gapminder.org" },
  ];
  const EXAMPLES = {
    uni: [
      ["Teste", "Classificações de um teste\n12 14 9 16 11 13 15 8 17 12\n10 14 13 18 11 9 15 12 16 14\n7 13 19 11 14"],
      ["Alturas", "Altura (cm)\n158 162 170 165 172 168 175 160 166 171\n169 163 177 159 174 167 161 173 164 168\n181 156 170 166 163 176 169 171 165 160"],
      ["Irmãos", "Número de irmãos\n0 1 1 2 0 1 3 1 2 1\n0 2 1 1 4 0 1 2 1 0\n1 2 3 1 0"],
    ],
    bi: [
      ["Horas de estudo", "Horas de estudo\tClassificação\n1\t8\n2\t9,5\n2\t11\n3\t10\n3\t12,5\n4\t12\n4\t13,5\n5\t14\n5\t15,5\n6\t15\n7\t17\n8\t18"],
      ["Bactérias", "Tempo (h)\tBactérias\n0\t100\n1\t152\n2\t227\n3\t341\n4\t509\n5\t768\n6\t1150"],
      ["Temperaturas", "Mês\tTemperatura média (°C)\n1\t11,6\n2\t12,6\n3\t14,6\n4\t15,9\n5\t18,1\n6\t21\n7\t22,8\n8\t23,2\n9\t21,8\n10\t18,9\n11\t14,9\n12\t12,4"],
      ["Lançamento", "Tempo (s)\tAltura (m)\n0\t1,5\n0,2\t4,6\n0,4\t7,1\n0,6\t8,7\n0,8\t9,6\n1\t9,9\n1,2\t9,4\n1,4\t8,1\n1,6\t6,4\n1,8\t3,9\n2\t0,9"],
    ],
  };
  try { Object.assign(S.data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  if (!S.data.uni) S.data.uni = EXAMPLES.uni[0][1];
  if (!S.data.bi) S.data.bi = EXAMPLES.bi[0][1];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S.data)); } catch (e) {} };

  // ---------- números ----------
  const fmt = (x, dec) => {
    if (!isFinite(x)) return "—";
    if (Math.abs(x) < 0.5 * 10 ** -dec) x = 0;
    return x.toLocaleString("pt-PT", { minimumFractionDigits: 0, maximumFractionDigits: dec, useGrouping: false }).replace("-", "−");
  };
  const tnum = (x, dec) => fmt(x, dec).replace(",", "{,}").replace("−", "-");
  const num = s => { s = String(s).trim().replace("−", "-").replace(",", "."); return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s) ? parseFloat(s) : NaN; };
  const tex = (el, src) => { if (window.katex) katex.render(src, el, { throwOnError: false, strict: false }); else el.textContent = src; };

  // ---------- leitura dos dados ----------
  // uma variável: números separados por espaços, «;» ou mudanças de linha (vírgula decimal);
  // uma primeira linha com texto dá o nome da variável
  // ---------- tabelas (CSV/TSV com cabeçalho, p. ex. do Kaggle) ----------
  // deteta o separador (tabulação, «;» ou «,») pela primeira linha; o cabeçalho tem de ter texto e pelo menos 2 colunas,
  // e pelo menos 80 % das linhas o mesmo número de campos. Valores em falta: vazio, NA, N/A, NaN, null, ?, -
  const MISSING = /^(|na|n\/a|nan|null|none|\?|-)$/i;
  const MAXG = 10;   // número máximo de grupos
  let TCACHE = { text: null, T: null };
  function parseTable(text) {
    if (TCACHE.text === text) return TCACHE.T;
    let T = null;
    const first = text.split(/\r?\n/).find(l => l.trim());
    if (first) {
      for (const sep of ["\t", ";", ","].filter(c => first.includes(c))) {
        const rows = d3.dsvFormat(sep).parseRows(text.trim()).filter(r => r.some(c => c.trim() !== ""));
        if (rows.length < 2) continue;
        const head = rows[0].map(c => c.trim());
        if (head.length < 2 || !head.some(h => isNaN(num(h)))) continue;
        const body = rows.slice(1).filter(r => r.length === head.length);
        if (body.length / (rows.length - 1) < 0.8) continue;
        const cols = head.map((h, j) => {
          const raw = body.map(r => r[j].trim());
          const vals = raw.map(v => MISSING.test(v) ? null : num(v));
          const present = raw.filter(v => !MISSING.test(v)).length, numeric = vals.filter(v => v !== null && !isNaN(v)).length;
          const isNum = present > 0 && numeric / present >= 0.8;
          // níveis (valores diferentes) — a coluna pode servir de grupos se tiver de 2 a MAXG níveis
          let lv = [...new Set(raw.filter(v => !MISSING.test(v)))];
          if (isNum) lv.sort((u, v) => num(u) - num(v));
          return { name: h || `coluna ${j + 1}`, vals, raw, levels: lv.length >= 2 && lv.length <= MAXG ? lv : null,
                   missing: raw.length - present, numeric: isNum };
        });
        if (!T || cols.length > T.cols.length) T = { sep, cols, n: body.length };
      }
      if (T && !T.cols.some(c => c.numeric)) T = null;
    }
    TCACHE = { text, T };
    return T;
  }
  const numCols = T => T.cols.filter(c => c.numeric);
  const colOf = (T, name, k = 0) => { const nc = numCols(T); return nc.find(c => c.name === name) || nc[Math.min(k, nc.length - 1)]; };
  const groupCols = T => T.cols.filter(c => c.levels);
  const groupCol = T => (S.col.g && groupCols(T).find(c => c.name === S.col.g)) || null;
  // escolha das colunas (só aparece com uma tabela); refaz as listas só quando as colunas ou o modo mudam
  let colsKey = "";
  function colsUI(T) {
    const box = $("cols");
    if (!T) { box.hidden = true; $("tinfo").textContent = ""; colsKey = ""; return; }
    const nc = numCols(T), miss = d3.sum(T.cols, c => c.missing);
    $("tinfo").textContent = `Tabela: ${T.n} linhas · ${T.cols.length} colunas (${nc.length} numéricas)${miss ? ` · ${miss} valores em falta` : ""}`;
    box.hidden = false;
    const key = S.mode + "|" + T.cols.map(c => c.name + c.numeric + !!c.levels).join(",");
    const gc = groupCols(T);
    // grupos: colunas com 2 a MAXG valores diferentes (texto, como a espécie, ou números, como o ano)
    const gsel = gc.length ? `<span class="pair"><span class="lbl" title="Coluna que divide os dados em grupos">Grupos</span><select class="inp" id="c-g"><option value="">(nenhum)</option>${gc.map(c => `<option${c.name === S.col.g ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></span>` : "";
    const opts = sel => nc.map(c => `<option${c.name === sel ? " selected" : ""}>${esc(c.name)}</option>`).join("");
    if (key !== colsKey) {
      colsKey = key;
      box.innerHTML = S.mode === "uni"
        ? `<span class="pair"><span class="lbl">Variável</span><select class="inp" id="c-v">${opts(colOf(T, S.col.v).name)}</select></span>${gsel}`
        : `<span class="pair"><span class="lbl">x</span><select class="inp" id="c-x">${opts(colOf(T, S.col.x, 0).name)}</select></span><span class="pair"><span class="lbl">y</span><select class="inp" id="c-y">${opts(colOf(T, S.col.y, 1).name)}</select></span>${gsel}`;
      box.querySelectorAll("select").forEach(sl => sl.onchange = () => { S.col[sl.id.slice(2)] = sl.value || null; EXCL.clear(); SEL.clear(); HIDDEN.clear(); render(); });
    }
  }

  function readUni(text) {
    const T = parseTable(text);
    colsUI(T);
    if (T) {
      const c = colOf(T, S.col.v), gc = groupCol(T);
      const miss = c.missing ? `${c.missing} valores em falta em «${c.name}» foram ignorados.` : "";
      if (gc) {
        // um conjunto de valores por grupo (pela ordem dos níveis); sem grupo, o valor fica de fora
        const by = new Map(gc.levels.map(l => [l, []]));
        let noG = 0;
        c.vals.forEach((v, i) => { if (v === null || isNaN(v)) return; const g = gc.raw[i]; if (MISSING.test(g)) noG++; else by.get(g).push(v); });
        const groups = [...by].filter(([, xs]) => xs.length).map(([name, xs]) => ({ name, xs }));
        const note = [miss, noG ? `${noG} valores sem «${gc.name}» ficaram de fora.` : ""].filter(Boolean).join(" ");
        if (groups.length >= 2) return { name: c.name, xs: groups.flatMap(g => g.xs), bad: [], note, groups, gname: gc.name };
      }
      const xs = c.vals.filter(v => v !== null && !isNaN(v));
      return { name: c.name, xs, bad: [], note: miss };
    }
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let name = "", bad = [];
    if (lines.length && lines[0].split(/[\s;]+/).some(t => isNaN(num(t)))) name = lines.shift();
    const xs = [];
    lines.forEach(l => l.split(/[\s;]+/).filter(Boolean).forEach(t => { const v = num(t); if (isNaN(v)) bad.push(t); else xs.push(v); }));
    return { name, xs, bad };
  }
  // duas variáveis: um par por linha (tabulação, «;» ou espaços entre x e y); a primeira linha pode ter os nomes
  function readBi(text) {
    const T = parseTable(text);
    colsUI(T);
    if (T) {
      const cx = colOf(T, S.col.x, 0), cy = colOf(T, S.col.y, 1), gc = groupCol(T), pts = [];
      let lost = 0, noG = 0;
      // com grupos, cada par leva o seu grupo em terceiro lugar: [x, y, grupo]
      cx.vals.forEach((x, i) => {
        const y = cy.vals[i];
        if (x === null || y === null || isNaN(x) || isNaN(y)) lost++;
        else if (gc && MISSING.test(gc.raw[i])) noG++;
        else { const p = gc ? [x, y, gc.raw[i]] : [x, y]; p.r = i; pts.push(p); }   // (p.r: linha da tabela)
      });
      let groups = gc ? gc.levels.filter(l => pts.some(p => p[2] === l)) : null;
      if (groups && groups.length < 2) { groups = null; pts.forEach(p => p.length = 2); }   // (o comprimento não mexe em p.r)
      const note = [lost ? `${lost} linhas sem um dos valores foram ignoradas.` : "", noG ? `${noG} linhas sem «${gc.name}» ficaram de fora.` : ""].filter(Boolean).join(" ");
      return { nx: cx.name, ny: cy.name, pts, bad: [], note, groups, gname: groups ? gc.name : null };
    }
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let nx = "", ny = "", bad = [];
    const split = l => l.includes("\t") ? l.split("\t").map(s => s.trim()).filter(Boolean) : l.split(/\s*;\s*|\s+/).filter(Boolean);
    if (lines.length) {
      const t = split(lines[0]);
      if (t.some(s => isNaN(num(s)))) {
        lines.shift();
        if (t.length >= 2) { nx = t[0]; ny = t[1]; }
      }
    }
    const pts = [];
    lines.forEach((l, i) => {
      const t = split(l);
      const x = num(t[0]), y = num(t[1]);
      if (t.length !== 2 || isNaN(x) || isNaN(y)) bad.push(l); else pts.push([x, y]);
    });
    return { nx, ny, pts, bad };
  }

  // ---------- estatística de uma variável ----------
  const sum = a => a.reduce((s, v) => s + v, 0);
  // percentil k, como no programa de Matemática A: com L = nk/100, se L é inteiro, média de x_L e x_(L+1); senão x_(⌊L⌋+1)
  function percentil(xs, k) {
    const n = xs.length, L = n * k / 100, r = Math.round(L);
    if (Math.abs(L - r) < 1e-9) return r === 0 ? xs[0] : r >= n ? xs[n - 1] : (xs[r - 1] + xs[r]) / 2;
    return xs[Math.floor(L)];
  }
  function uniStats(raw) {
    const xs = [...raw].sort((a, b) => a - b), n = xs.length;
    const m = sum(xs) / n;
    const ss = sum(xs.map(v => (v - m) ** 2));
    const counts = d3.rollups(xs, v => v.length, v => v).sort((a, b) => a[0] - b[0]);
    const top = d3.max(counts, c => c[1]);
    const modes = top > 1 ? counts.filter(c => c[1] === top).map(c => c[0]) : [];
    return {
      xs, n, m, min: xs[0], max: xs[n - 1], med: percentil(xs, 50), q1: percentil(xs, 25), q3: percentil(xs, 75),
      s2: n > 1 ? ss / (n - 1) : NaN, s: n > 1 ? Math.sqrt(ss / (n - 1)) : NaN, sigma: Math.sqrt(ss / n), counts, modes,
    };
  }
  // classes [a, a + h[ de igual amplitude (a última fechada); por omissão regra de Sturges
  const niceUp = x => { const p = 10 ** Math.floor(Math.log10(x)), m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; };

  // ---------- regressão ----------
  function linfit(X, Y) {
    const n = X.length, mx = sum(X) / n, my = sum(Y) / n;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) { sxy += (X[i] - mx) * (Y[i] - my); sxx += (X[i] - mx) ** 2; syy += (Y[i] - my) ** 2; }
    const a = sxy / sxx;
    return { a, b: my - a * mx, r: sxy / Math.sqrt(sxx * syy), mx, my };
  }
  function solve3(M, v) {
    const A = M.map((r, i) => [...r, v[i]]);
    for (let c = 0; c < 3; c++) {
      let p = c; for (let r = c + 1; r < 3; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]];
      if (Math.abs(A[c][c]) < 1e-14) return null;
      for (let r = 0; r < 3; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k < 4; k++) A[r][k] -= f * A[c][k]; }

  }
  // cada modelo devolve f, a equação em LaTeX e as medidas (r, r² ou R²); as formas são as das calculadoras gráficas
  function fit(model, pts, dec) {
    const X = pts.map(p => p[0]), Y = pts.map(p => p[1]);
    const T = x => tnum(x, dec), sg = x => x < 0 ? "-" : "+";
    if (model === "lin") {
      const { a, b, r } = linfit(X, Y);
      return { f: x => a * x + b, eq: `y = ${T(a)}x ${sg(b)} ${T(Math.abs(b))}`, r, r2: r * r, note: "Reta dos mínimos quadrados; r é o coeficiente de correlação linear." };
    }
    if (model === "quad") {
      const s = k => sum(X.map(x => x ** k)), sy = k => sum(X.map((x, i) => x ** k * Y[i]));
      const c = solve3([[s(4), s(3), s(2)], [s(3), s(2), s(1)], [s(2), s(1), pts.length]], [sy(2), sy(1), sy(0)]);
      if (!c) return { err: "São precisos pelo menos três valores diferentes de x." };
      const [a, b, cc] = c, f = x => a * x * x + b * x + cc;
      const my = sum(Y) / Y.length, R2 = 1 - sum(pts.map(([x, y]) => (y - f(x)) ** 2)) / sum(Y.map(y => (y - my) ** 2));
      return { f, eq: `y = ${T(a)}x^2 ${sg(b)} ${T(Math.abs(b))}x ${sg(cc)} ${T(Math.abs(cc))}`, R2, note: "Mínimos quadrados; R² é o coeficiente de determinação." };
    }
    if (model === "exp") {
      if (Y.some(y => y <= 0)) return { err: "O modelo exponencial precisa de todos os valores de y positivos." };
      const { a: lb, b: la, r } = linfit(X, Y.map(Math.log)), a = Math.exp(la), b = Math.exp(lb);
      return { f: x => a * b ** x, eq: `y = ${T(a)}\\times ${T(b)}^{x}\\quad (= ${T(a)}\\,e^{${T(lb)}x})`, r, r2: r * r,
               note: "Ajuste de ln y = ln a + x ln b (como nas calculadoras); r é o de (x, ln y)." };
    }
    if (model === "log") {
      if (X.some(x => x <= 0)) return { err: "O modelo logarítmico precisa de todos os valores de x positivos." };
      const { a: b, b: a, r } = linfit(X.map(Math.log), Y);
      return { f: x => a + b * Math.log(x), eq: `y = ${T(a)} ${sg(b)} ${T(Math.abs(b))}\\ln x`, r, r2: r * r, xmin0: true,
               note: "Ajuste de y = a + b ln x (como nas calculadoras); r é o de (ln x, y)." };
    }
    if (model === "sin") {
      // y = a·sin(bx + c) + d (forma das calculadoras): para cada b, os mínimos quadrados em sin(bx), cos(bx), 1
      // são lineares; procura-se o b com menor soma dos quadrados dos resíduos (grelha + refinamento)
      const n = pts.length;
      if (n < 4) return { err: "O modelo sinusoidal precisa de pelo menos quatro pares." };
      const xs = [...new Set(X)].sort((u, v) => u - v);
      if (xs.length < 4) return { err: "O modelo sinusoidal precisa de pelo menos quatro valores diferentes de x." };
      const span = xs[xs.length - 1] - xs[0], dmin = d3.min(d3.pairs(xs), ([u, v]) => v - u);
      const bLo = Math.PI / (2 * span), bHi = Math.PI / dmin;   // de um quarto de período no intervalo até ao limite de Nyquist
      const at = b => {
        const s = k => sum(X.map(x => [Math.sin(b * x), Math.cos(b * x), 1][k]));
        const M = [[0, 1, 2].map(j => sum(X.map(x => Math.sin(b * x) * [Math.sin(b * x), Math.cos(b * x), 1][j]))),
                   [0, 1, 2].map(j => sum(X.map(x => Math.cos(b * x) * [Math.sin(b * x), Math.cos(b * x), 1][j]))),
                   [0, 1, 2].map(j => s(j))];
        const v = [sum(X.map((x, i) => Math.sin(b * x) * Y[i])), sum(X.map((x, i) => Math.cos(b * x) * Y[i])), sum(Y)];
        const c = solve3(M, v);
        if (!c) return { sse: Infinity };
        const f = x => c[0] * Math.sin(b * x) + c[1] * Math.cos(b * x) + c[2];
        return { b, c, sse: sum(pts.map(([x, y]) => (y - f(x)) ** 2)) };
      };
      let best = { sse: Infinity };
      const N = 1500;
      for (let i = 0; i <= N; i++) { const r = at(bLo * (bHi / bLo) ** (i / N)); if (r.sse < best.sse) best = r; }
      if (!isFinite(best.sse)) return { err: "Não foi possível ajustar uma sinusoide a estes dados." };
      // refinamento à volta do melhor b (secção dourada)
      let lo = best.b * (bHi / bLo) ** (-1 / N), hi = best.b * (bHi / bLo) ** (1 / N);
      const g = (Math.sqrt(5) - 1) / 2;
      for (let k = 0; k < 60; k++) {
        const m1 = hi - g * (hi - lo), m2 = lo + g * (hi - lo);
        if (at(m1).sse < at(m2).sse) hi = m2; else lo = m1;
      }
      const r = at((lo + hi) / 2); if (r.sse < best.sse) best = r;
      const b = best.b, [A, B, dd] = best.c;
      const a = Math.hypot(A, B);
      let c = Math.atan2(B, A);                 // A sin(bx) + B cos(bx) = a sin(bx + c)
      const f = x => a * Math.sin(b * x + c) + dd;
      const my = sum(Y) / n, R2 = 1 - best.sse / sum(Y.map(y => (y - my) ** 2));
      return { f, eq: `y = ${T(a)}\\sin(${T(b)}x ${sg(c)} ${T(Math.abs(c))}) ${sg(dd)} ${T(Math.abs(dd))}\\qquad T = \\tfrac{2\\pi}{b} \\approx ${T(2 * Math.PI / b)}`, R2,
               note: "Mínimos quadrados para y = a sin(bx + c) + d (a > 0, c em radianos); R² é o coeficiente de determinação." };
    }
    if (model === "pow") {
      if (X.some(x => x <= 0) || Y.some(y => y <= 0)) return { err: "O modelo potência precisa de x e y positivos." };
      const { a: b, b: la, r } = linfit(X.map(Math.log), Y.map(Math.log)), a = Math.exp(la);
      return { f: x => a * x ** b, eq: `y = ${T(a)}\\,x^{${T(b)}}`, r, r2: r * r, xmin0: true,
               note: "Ajuste de ln y = ln a + b ln x (como nas calculadoras); r é o de (ln x, ln y)." };
    }
  }

    if (S.mean) {
      marks.push(Plot.ruleX([st.m], { stroke: c2, strokeWidth: 2, strokeDasharray: "6 4" }),
                 Plot.ruleX([st.med], { stroke: c3, strokeWidth: 2 }),
                 Plot.text([st.m], { x: d => d, frameAnchor: "top", text: () => "média " + fmt(st.m, S.dec), fill: c2, dy: -4, textAnchor: st.m <= st.med ? "end" : "start", dx: st.m <= st.med ? -4 : 4, fontWeight: 700, stroke: css("--bg"), strokeWidth: 4, paintOrder: "stroke" }),
                 Plot.text([st.med], { x: d => d, frameAnchor: "top", text: () => "mediana " + fmt(st.med, S.dec), fill: c3, dy: -4, textAnchor: st.m <= st.med ? "start" : "end", dx: st.m <= st.med ? 4 : -4, fontWeight: 700, stroke: css("--bg"), strokeWidth: 4, paintOrder: "stroke" }));
    }
    const main = Plot.plot({
      width: W, height: H, marginLeft: 48, marginBottom: 40, marginTop: 26, style: plotStyle(),
      x: { domain: xdom, label: xlabel, labelAnchor: "right", ticks, tickFormat: decTick, labelArrow: "none" },
      // frequências absolutas: só marcas inteiras
      y: { label: rel ? "frequência relativa" : "frequência absoluta", grid: true, nice: GT !== "dots", tickFormat: decTick, labelArrow: "none",
           domain: GT === "dots" ? [0, dotTop] : undefined,
           ticks: rel ? undefined : d3.ticks(0, maxY || 1, Math.max(2, Math.round(H / 45))).filter(Number.isInteger).filter(t => GT !== "dots" || t <= maxY) },
      marks,
    });
    put($("fig-main"), boxOnly ? null : main);

    // diagrama de extremos e quartis com os quartis acima (a mesma escala horizontal do gráfico principal)
    if (SBOX) {
      const bw = FIXED ? FIXED[0] : ($("fig-box").clientWidth || W), bh = boxOnly ? (FIXED ? 300 : Math.max(120, $("fig-box").clientHeight)) : LOWH.box || 96;
      const q = [st.min, st.q1, st.med, st.q3, st.max];
      const lbl = [["mín.", st.min], ["Q_1", st.q1], ["Mediana", st.med], ["Q_3", st.q3], ["máx.", st.max]];
      // outliers: fora de [Q₁ − 1,5 × AIQ, Q₃ + 1,5 × AIQ]; os bigodes vão só até ao menor e ao maior valor que não o são
      const outs = S.out ? st.xs.filter(v => v < fLo - 1e-9 || v > fHi + 1e-9) : [];
      const ins = S.out ? st.xs.filter(v => v >= fLo - 1e-9 && v <= fHi + 1e-9) : st.xs;
      const wLo = ins[0], wHi = ins[ins.length - 1];
      if (S.out) {
        const distinct = [...new Set(outs)];
        $("out-hint").textContent = `barreiras ${fmt(fLo, S.dec)} e ${fmt(fHi, S.dec)} · ` +
          (outs.length ? `${outs.length === 1 ? "outlier" : outs.length + " outliers"}: ${distinct.slice(0, 6).map(v => fmt(v, S.dec)).join("; ")}${distinct.length > 6 ? "…" : ""}` : "sem outliers");
      } else $("out-hint").textContent = "";
      // os pontos repetidos empilham-se um pouco na vertical
      const outPts = d3.rollups(outs, v => v.length, v => v).flatMap(([v, n]) => d3.range(n).map(i => ({ v, y: (i - (n - 1) / 2) * 0.32 })));
      const box = Plot.plot({
        width: Math.max(260, bw), height: bh, marginLeft: 48, marginBottom: 30, marginTop: 6, style: plotStyle(),
        x: { domain: xdom, label: null, ticks, tickFormat: decTick }, y: { axis: null, domain: [-1, 1] },
        marks: [
          // as duas barreiras, sempre (tracejadas, com o valor por cima)
          ...(S.out ? [Plot.ruleX([fLo, fHi], { y1: -0.75, y2: 0.75, stroke: c2, strokeOpacity: 0.7, strokeDasharray: "4 3" }),
                       Plot.text([fLo, fHi], { x: d => d, y: 0.75, text: d => fmt(d, S.dec), dy: -7, fill: c2, fontWeight: 700, fontSize: 11 })] : []),
          // violino (por baixo do diagrama, que fica mais estreito)
          ...(S.violin ? [Plot.areaY(violinPts(st.xs, 0, violinTop([st.xs]), 0.85), { x: "x", y1: "y1", y2: "y2", fill: css("--pi"), fillOpacity: 0.15, stroke: css("--pi"), strokeWidth: 1.8, curve: "natural" })] : []),
          Plot.ruleY([0], { x1: wLo, x2: st.q1, stroke: ink, strokeWidth: 1.6 }),
          Plot.ruleY([0], { x1: st.q3, x2: wHi, stroke: ink, strokeWidth: 1.6 }),
          Plot.rect([0], { x1: st.q1, x2: st.q3, y1: S.violin ? -0.2 : -0.6, y2: S.violin ? 0.2 : 0.6, fill: bar, stroke: c1, strokeWidth: 1.6 }),
          Plot.ruleX([st.med], { y1: S.violin ? -0.2 : -0.6, y2: S.violin ? 0.2 : 0.6, stroke: c3, strokeWidth: 3 }),
          Plot.ruleX([wLo, wHi], { y1: S.violin ? -0.12 : -0.3, y2: S.violin ? 0.12 : 0.3, stroke: ink, strokeWidth: 1.6 }),
          Plot.dot(outPts, { x: "v", y: "y", r: 4.5, stroke: c2, strokeWidth: 2, fill: css("--bg") }),
          ...(S.mean ? [Plot.dot([st.m], { x: d => d, y: 0, symbol: "times", r: 5, stroke: c2, strokeWidth: 2.5 })] : []),
          Plot.tip([wLo, st.q1, st.med, st.q3, wHi].map((v, i) => ({ v, t: [S.out && outs.some(o => o < fLo) ? "menor valor que não é outlier" : "mínimo", "Q₁", "mediana", "Q₃", S.out && outs.some(o => o > fHi) ? "maior valor que não é outlier" : "máximo"][i] })), Plot.pointerX({ x: "v", y: 0, title: d => `${d.t} = ${fmt(d.v, S.dec)}` })),
        ],
      });
      put($("fig-box"), box);
    }

    // tabela de frequências
    const SL = stemLeaf(st);
    if (S.stem) $("stem").innerHTML = stemHTML(SL);
    LAST = { mode: "uni", name: xlabel, st, tableRows, SL, histTab: GT === "hist", graph: S.graph, title: $("main-title").textContent, hint: $("main-hint").textContent,
             fLo, fHi, outs: st.xs.filter(v => v < fLo - 1e-9 || v > fHi + 1e-9) };
    if (S.tab) {
      const f4 = v => fmt(v, 4);
      $("tab").innerHTML = `<table class="freq"><thead><tr><th>${GT === "hist" ? "Classe" : "Valor"}</th><th>nᵢ</th><th>fᵢ</th><th>Nᵢ</th><th>Fᵢ</th></tr></thead><tbody>` +
        tableRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${f4(r[2])}</td><td>${r[3]}</td><td>${f4(r[4])}</td></tr>`).join("") +
        `</tbody><tfoot><tr><td>Total</td><td>${st.n}</td><td>1</td><td></td><td></td></tr></tfoot></table>`;
    }
  }

  // ---------- uma variável, por grupos ----------
  const gColors = () => d3.range(MAXG).map(i => css(`--g${i}`));
  // margem esquerda com espaço para os nomes dos grupos (é a mesma nos dois gráficos, para as escalas horizontais coincidirem)
  const gMarginL = names => Math.max(48, Math.min(150, d3.max(names, n => n.length) * 7.2 + 18));
  const swatch = c => `<span class="sw" style="border-color:${c}"></span>`;
  function measG(G, st, d) {
    const modeOf = s => s.modes.length === 0 ? "—" : s.modes.length > 2 ? "várias" : s.modes.map(v => fmt(v, d)).join("; ");
    const R = [["n", s => s.n], ["\\text{mín.}", s => fmt(s.min, d)], ["\\text{máx.}", s => fmt(s.max, d)], ["\\text{amplitude}", s => fmt(s.max - s.min, d)],
      ["\\bar{x}", s => fmt(s.m, d)], ["\\tilde{x}", s => fmt(s.med, d)], ["\\text{moda}", modeOf], ["Q_1", s => fmt(s.q1, d)], ["Q_3", s => fmt(s.q3, d)],
      ["\\text{AIQ}", s => fmt(s.q3 - s.q1, d)], ["s^2", s => fmt(s.s2, d)], ["s", s => fmt(s.s, d)]];
    const cols = [...G.map(g => ({ h: `<span style="color:${g.c}">${esc(g.name)}</span>`, s: g.st })), { h: "Todos", s: st }];
    return `<table class="freq"><thead><tr><th></th>${cols.map(c => `<th>${c.h}</th>`).join("")}</tr></thead><tbody>` +
      R.map(([k, f]) => `<tr><td>${K(k)}</td>${cols.map(c => `<td>${f(c.s)}</td>`).join("")}</tr>`).join("") + "</tbody></table>";
  }

  function renderUniG(fromInputs, { name, xs, groups, gname }) {
    const boxOnly = S.graph === "box", GT = boxOnly ? "bars" : S.graph, SBOX = S.box || boxOnly;
    const st = uniStats(xs), d = S.dec, dens = GT === "dens";
    const rel = S.freq === "rel" && GT !== "dots" && !dens;
    const xlabel = name || "x", pal = gColors();
    const G = groups.map((g, i) => ({ name: g.name, xs: g.xs, st: uniStats(g.xs), c: pal[(g.ci ?? i) % MAXG] }));
    const names = G.map(g => g.name), ng = G.length;
    const color = { domain: names, range: G.map(g => g.c) };
    $("hist-opts").style.display = GT === "hist" ? "" : "none";
    $("freq-row").style.display = GT === "dots" || dens || boxOnly ? "none" : "";
    const meas = $("meas"); meas.className = "gmeas"; meas.innerHTML = measG(G, st, d);

    const ink = css("--ink"), c2 = css("--c2"), c3 = css("--c3"), bg = css("--bg");
    // (a altura do quadro dos diagramas de extremos e quartis muda com o número de grupos: fixa-se antes de medir o gráfico principal)
    const bh = boxOnly ? (FIXED ? Math.max(300, 60 + 60 * ng) : Math.max(120, $("fig-box").clientHeight)) : LOWH.box || 34 + 30 * ng;
    if (SBOX && !boxOnly) $("fig-box").style.height = bh + "px";
    const [W, H] = figSize($(boxOnly ? "fig-box" : "fig-main"));   // (sem o gráfico de cima, as marcas do eixo usam a largura do diagrama)
    const mL = gMarginL(names), mT = 26, mB = 44, Wx = W - (mL - 48);   // (Wx: largura para as marcas do eixo)
    const facetH = (H - mT - mB) / ng;
    const marks = [];
    let xdom, ticks, binW, maxY = 1, dotTop = 1, hint = "", last = [], pendDots = null;
    // classes (as mesmas para todos os grupos) e tabela de frequências por grupo
    const C = classes(st);
    if (!fromInputs && GT === "hist") {
      if (document.activeElement !== $("k")) $("k").value = C.k;
      if (document.activeElement !== $("h")) $("h").value = fmt(C.h, 4);
      if (document.activeElement !== $("a0")) $("a0").value = fmt(C.a, 4);
    }
    const inCl = (v, c) => v >= c.lo - 1e-9 && (v < c.hi - 1e-9 || (c.last && v <= c.hi + 1e-9));
    const clName = c => `[${fmt(c.lo, 4)}, ${fmt(c.hi, 4)}${c.last ? "]" : "["}`;
    const byVal = GT === "bars" || GT === "dots";
    const tableRows = byVal
      ? st.counts.map(([v, ni]) => [fmt(v, 4), ...G.map(g => g.xs.filter(x => x === v).length), ni])
      : C.cl.map(c => [clName(c), ...G.map(g => g.xs.filter(v => inCl(v, c)).length), c.ni]);
    const gLabel = g => `${g.name} (n = ${g.st.n})`;

    if (GT === "hist") {
      // um histograma por grupo, uns por baixo dos outros (facetas), com as mesmas classes
      const data = G.flatMap(g => C.cl.map(c => { const ni = g.xs.filter(v => inCl(v, c)).length; return { g: g.name, lo: c.lo, hi: c.hi, last: c.last, ni, y: rel ? ni / g.st.n : ni }; }));
      maxY = d3.max(data, r => r.y);
      marks.push(
        Plot.rectY(data, { x1: "lo", x2: "hi", y: "y", fy: "g", fill: "g", fillOpacity: 0.35, stroke: "g", strokeWidth: 1.2,
          title: r => `${r.g}\n${clName(r)}\nnᵢ = ${r.ni}\nfᵢ = ${fmt(r.ni / G[names.indexOf(r.g)].st.n, 4)}` }),
        Plot.text(data.filter(r => r.ni > 0), { x: r => (r.lo + r.hi) / 2, y: "y", fy: "g", text: r => rel ? fmt(r.y, 2) : String(r.ni), dy: -7, fill: ink, fontSize: 11, fontWeight: 700 }),
      );
      binW = C.h; xdom = [C.a, C.a + C.k * C.h]; ticks = thin(C.cl.map(c => c.lo).concat([C.a + C.k * C.h]), Wx);
      $("main-title").textContent = "Histogramas por grupo";
      hint = C.out ? `${C.out} valor(es) fora das classes` : `${C.k} classes de amplitude ${fmt(C.h, 4)}${rel ? " · fᵢ em cada grupo" : ""}`;
    } else if (byVal) {
      const vals = st.counts.map(c => c[0]);
      const gap = d3.min(d3.pairs(vals), ([a, b]) => b - a) || 1;
      binW = gap; xdom = [st.min - gap * 0.6, st.max + gap * 0.6];
      ticks = fits(vals, Wx) ? vals : niceTicks(xdom, vals, Wx);
      const data = G.flatMap(g => g.st.counts.map(([v, ni]) => ({ g: g.name, v, ni, y: rel ? ni / g.st.n : ni })));
      maxY = d3.max(data, r => r.y);
      if (GT === "bars") {
        marks.push(
          Plot.ruleX(data, { x: "v", y1: 0, y2: "y", fy: "g", stroke: "g", strokeWidth: Math.max(3, Math.min(16, (W - mL) / vals.length / 3)) }),
          Plot.text(data, { x: "v", y: "y", fy: "g", text: r => rel ? fmt(r.y, 2) : String(r.ni), dy: -7, fill: ink, fontSize: 11, fontWeight: 700 }),
        );
        $("main-title").textContent = "Diagramas de barras por grupo";
      } else {
        // pontos empilhados em cada faceta; com a curva de densidade, agrupados em intervalos de amplitude w (como sem grupos)
        let w = gap, dd = data;
        if (S.dens) {
          const bins = Math.max(5, Math.round((W - mL - 20) / 12));
          w = gap * Math.max(1, Math.ceil((xdom[1] - xdom[0]) / bins / gap - 1e-9));
          if (w > gap * (1 + 1e-9)) {
            dd = G.flatMap(g => d3.rollups(g.xs, v => v.length, v => Math.round((v - st.min) / w + 1e-9)).map(([k, ni]) => ({ g: g.name, v: st.min + k * w, ni })));
            maxY = d3.max(dd, c => c.ni); binW = w;
            xdom = [st.min - w * 0.6, Math.max(st.max, d3.max(dd, c => c.v)) + w * 0.6];
            hint = `com a curva de densidade, cada pilha junta os valores num intervalo de amplitude ${fmt(w, 4)}`;
          }
        }
        dotTop = maxY + 0.5;
        pendDots = { dots: dd.flatMap(c => d3.range(1, c.ni + 1).map(k => ({ g: c.g, v: c.v, k }))), w };
        $("main-title").textContent = "Diagramas de pontos por grupo";
      }
      if (!hint) hint = `${vals.length} valores diferentes`;
    } else {
      // densidades sobrepostas: a curva de cada grupo (área 1), com a área por baixo ténue, e o nome junto do pico
      const span = st.max - st.min || 1;
      xdom = [st.min - span * 0.12, st.max + span * 0.12];
      ticks = niceTicks(xdom, d3.ticks(xdom[0], xdom[1], 10), Wx);
      const N = 240, curves = [], peaks = [], missing = [];
      G.forEach(g => {
        const k = kdeOf(g.xs);
        if (!k) { missing.push(g.name); return; }
        const cv = d3.range(N + 1).map(i => { const x = xdom[0] + (xdom[1] - xdom[0]) * i / N; return { g: g.name, x, y: k(x) }; });
        curves.push(...cv); peaks.push(cv.reduce((a, b) => b.y > a.y ? b : a));
      });
      maxY = d3.max(curves, c => c.y) || 1;
      marks.push(
        Plot.areaY(curves, { x: "x", y1: 0, y2: "y", z: "g", fill: "g", fillOpacity: 0.1, curve: "natural" }),
        Plot.line(curves, { x: "x", y: "y", z: "g", stroke: "g", strokeWidth: 2.2, curve: "natural" }),
        Plot.ruleY([0], { stroke: ink }),
      );
      // (os nomes por cima de tudo, incluindo as linhas da média e da mediana)
      last.push(Plot.text(peaks, { x: "x", y: "y", text: p => gLabel(G[names.indexOf(p.g)]), fill: "g", dy: -9, fontWeight: 700, stroke: bg, strokeWidth: 4, paintOrder: "stroke" }));
      $("main-title").textContent = "Curvas de densidade por grupo";
      hint = "núcleo gaussiano; área 1 em cada grupo" + (missing.length ? ` · sem curva (poucos valores): ${missing.join(", ")}` : "");
    }
    // curva de densidade em cada faceta, na escala das frequências do grupo
    if (S.dens && !dens) {
      const N = 240, curves = [];
      G.forEach(g => {
        const k = kdeOf(g.xs);
        if (!k) return;
        const m = (rel ? 1 : g.st.n) * binW;
        d3.range(N + 1).forEach(i => { const x = xdom[0] + (xdom[1] - xdom[0]) * i / N; curves.push({ g: g.name, x, y: k(x) * m }); });
      });
      marks.push(Plot.areaY(curves, { x: "x", y1: 0, y2: "y", fy: "g", z: "g", fill: "g", fillOpacity: 0.1, curve: "natural" }),
                 Plot.line(curves, { x: "x", y: "y", fy: "g", z: "g", stroke: "g", strokeWidth: 2.4, curve: "natural" }));
      const top = d3.max(curves, c => c.y) || 0;
      maxY = Math.max(maxY, top);
      if (GT === "dots") dotTop = Math.max(dotTop, top * 1.05);
    }
    // o raio dos pontos só depois da curva (que pode subir o topo da escala)
    if (pendDots) {
      const pxGap = (W - mL - 20) / (xdom[1] - xdom[0]) * pendDots.w, pyUnit = facetH * 0.82 / dotTop;
      const r = Math.max(1.5, Math.min(10, Math.min(pxGap, pyUnit) / 2 - 0.5));
      marks.unshift(Plot.dot(pendDots.dots, { x: "v", y: "k", fy: "g", r, fill: bg, stroke: "g", strokeWidth: Math.max(1.4, Math.min(2.6, r * 0.28)) }));
    }
    if (!dens) marks.push(Plot.ruleY([0], { stroke: ink }));
    // diagramas de extremos e quartis (um por grupo); com outliers, as barreiras de todos ficam à vista
    const B = G.map((g, i) => {
      const s = g.st, aiq = s.q3 - s.q1, fLo = s.q1 - 1.5 * aiq, fHi = s.q3 + 1.5 * aiq;
      const outs = S.out ? s.xs.filter(v => v < fLo - 1e-9 || v > fHi + 1e-9) : [];
      const ins = S.out ? s.xs.filter(v => v >= fLo - 1e-9 && v <= fHi + 1e-9) : s.xs;
      return { i, name: g.name, n: s.n, min: s.min, max: s.max, q1: s.q1, med: s.med, q3: s.q3, m: s.m, fLo, fHi, outs, wLo: ins[0], wHi: ins[ins.length - 1] };
    });
    if (SBOX && S.out) {
      const lo = d3.min(B, b => b.fLo), hi = d3.max(B, b => b.fHi), padF = (Math.max(xdom[1], hi) - Math.min(xdom[0], lo)) * 0.03;
      xdom = [Math.min(xdom[0], lo - padF), Math.max(xdom[1], hi + padF)];
    }
    if (S.mean) {
      const fyo = dens ? {} : { fy: "name" };
      marks.push(Plot.ruleX(G, { x: g => g.st.m, ...fyo, stroke: dens ? "name" : c2, strokeWidth: 2, strokeDasharray: "6 4" }),
                 Plot.ruleX(G, { x: g => g.st.med, ...fyo, stroke: dens ? "name" : c3, strokeWidth: 2 }));
      hint += " · a tracejado, a média; a cheio, a mediana";
    }
    // nome do grupo no canto de cada faceta
    if (!dens) marks.push(Plot.text(G, { fy: "name", frameAnchor: "top-right", text: gLabel, fill: "name", dy: 2, fontWeight: 700, stroke: bg, strokeWidth: 4, paintOrder: "stroke" }));
    marks.push(...last);
    $("main-hint").textContent = hint;
    const yTicks = Math.max(2, Math.round((dens ? H : facetH) / (dens ? 70 : 40)));
    const main = Plot.plot({
      width: W, height: H, marginLeft: mL, marginBottom: mB, marginTop: mT, style: plotStyle(), color,
      x: { domain: xdom, label: xlabel, labelAnchor: "right", ticks, tickFormat: decTick, labelArrow: "none" },
      ...(dens ? {} : { fy: { axis: null, domain: names, padding: 0.16 } }),
      y: dens ? { label: "densidade", grid: true, tickFormat: decTick, labelArrow: "none", ticks: yTicks }
        : { label: rel ? "frequência relativa" : "frequência absoluta", grid: true, nice: GT !== "dots", tickFormat: decTick, labelArrow: "none",
            domain: GT === "dots" ? [0, dotTop] : undefined,
            ticks: rel ? yTicks : d3.ticks(0, maxY || 1, yTicks).filter(Number.isInteger).filter(t => GT !== "dots" || t <= maxY) },
      marks,
    });
    put($("fig-main"), boxOnly ? null : main);

    if (SBOX) {
      const bw = FIXED ? FIXED[0] : ($("fig-box").clientWidth || W);
      const tick = (v, i, h) => ({ v, i, h });
      const box = Plot.plot({
        width: Math.max(260, bw), height: bh, marginLeft: mL, marginBottom: 30, marginTop: 6, style: plotStyle(), color,
        x: { domain: xdom, label: null, ticks, tickFormat: decTick }, y: { axis: null, domain: [-0.6, ng - 0.4], reverse: true },
        marks: [
          ...(S.out ? [Plot.link(B.flatMap(b => [tick(b.fLo, b.i), tick(b.fHi, b.i)]), { x1: "v", x2: "v", y1: t => t.i - 0.42, y2: t => t.i + 0.42, stroke: c2, strokeOpacity: 0.7, strokeDasharray: "4 3" })] : []),
          // violinos (um por grupo, na cor do grupo, com a mesma escala de densidade)
          ...(S.violin ? (() => { const top = violinTop(G.map(g => g.xs));
            return [Plot.areaY(G.flatMap((g, i) => violinPts(g.xs, i, top, 0.45, { name: g.name })), { x: "x", y1: "y1", y2: "y2", z: "name", fill: "name", fillOpacity: 0.15, stroke: "name", strokeWidth: 1.6, curve: "natural" })]; })() : []),
          Plot.link(B, { x1: "wLo", x2: "q1", y1: "i", y2: "i", stroke: ink, strokeWidth: 1.5 }),

      body += `<p>Variáveis: ${K("x")} = <i>${esc(R.xl)}</i> e ${K("y")} = <i>${esc(R.yl)}</i>, com ${K(`n = ${P.length}`)} pares${R.excluded.length ? ` usados no estudo (${R.excluded.length === 1 ? "foi excluído o par" : `foram excluídos ${R.excluded.length} pares:`} ${R.excluded.map(([i, x, y]) => `n.º ${i}, (${fmt(x, 4)}; ${fmt(y, 4)})`).join("; ")})` : ""}.</p>`;
      if (R.groups) body += `<p>Os pares dividem-se em ${R.groups.length} grupos pela coluna <i>${esc(R.gname)}</i>: ${R.groups.map(g => `<i>${esc(g.name)}</i> (${g.pts.length})`).join(", ")}.</p>`;
      if (P.length <= 40) body += TAB("Dados", [K("i"), K("x_i"), K("y_i"), ...(R.groups ? [esc(R.gname)] : [])], P.map((p, i) => [i + 1, fmt(p[0], 4), fmt(p[1], 4), ...(R.groups ? [esc(p[2])] : [])]));
      body += H2("Resumo");
      body += TAB("Medidas de cada variável e correlação linear", ["", K("x"), K("y")], [
        ["Média", f(R.mx), f(R.my)], ["Desvio padrão", f(sx), f(sy)],
      ]);
      body += KD(`r = \\frac{\\sum (x_i - \\bar{x})(y_i - \\bar{y})}{\\sqrt{\\sum (x_i - \\bar{x})^2 \\sum (y_i - \\bar{y})^2}} = ${tnum(r, d)}`);
      const NAMES = { lin: "Linear", quad: "Quadrático", exp: "Exponencial", log: "Logarítmico", pow: "Potência", sin: "Sinusoidal" };
      body += FIG(figs.main, `Diagrama de dispersão de <i>${esc(R.yl)}</i> em função de <i>${esc(R.xl)}</i>${R.groups ? `, com os grupos de <i>${esc(R.gname)}</i> em cores diferentes` : ""}${S.curve && (R.byG || !R.F.err) && R.model ? `, com ${R.byG ? "as curvas do modelo" : "a curva do modelo"} ${NAMES[R.model].toLowerCase()}${R.byG ? " de cada grupo" : ""}` : ""}${S.mdens ? (R.groups ? "; nas margens, as curvas de densidade de cada variável em cada grupo" : "; nas margens, a roxo, as curvas de densidade de cada variável") : ""}.`);
      body += H2("Modelos de regressão");
      const rows = Object.keys(NAMES).map(m => {
        const G = fit(m, P, d);
        if (G.err) return [NAMES[m] + (m === R.model ? " ◂" : ""), `<span class="note">${esc(G.err)}</span>`, "—"];
        return [NAMES[m] + (m === R.model ? " ◂" : ""), K(G.eq.replace(/\\qquad.*$/, "")), G.R2 !== undefined ? K(`R^2 = ${tnum(G.R2, d)}`) : K(`r^2 = ${tnum(G.r2, d)}`)];
      });
      body += TAB("Os modelos ajustados aos dados (◂ = o escolhido)", ["Modelo", "Equação", "Ajuste"], rows);
      body += `<p class="note">Os modelos exponencial, logarítmico e potência ajustam-se por linearização, como nas calculadoras gráficas (o ${K("r^2")} é o da reta transformada); o quadrático e o sinusoidal por mínimos quadrados (${K("R^2")} = coeficiente de determinação).</p>`;
      if (R.byG) {
        body += `<p>Modelo escolhido: <b>${NAMES[R.model].toLowerCase()}</b>, ajustado a cada grupo de <i>${esc(R.gname)}</i> em separado.</p>`;
        body += TAB(`Modelo ${NAMES[R.model].toLowerCase()} em cada grupo`, ["Grupo", "Equação", "Ajuste", ...(R.xeG !== null ? [K(`\\hat{y}\\ (x = ${tnum(R.xeG, 4)})`)] : [])], R.groups.map(g => g.F.err
          ? [esc(g.name), `<span class="note">${esc(g.F.err)}</span>`, "—", ...(R.xeG !== null ? ["—"] : [])]
          : [esc(g.name), K(g.F.eq.replace(/\\qquad.*$/, "")), g.F.R2 !== undefined ? K(`R^2 = ${tnum(g.F.R2, d)}`) : K(`r^2 = ${tnum(g.F.r2, d)}`), ...(R.xeG !== null ? [f(g.F.f(R.xeG))] : [])]));
      } else if (!R.F.err) {
        body += `<p>Modelo escolhido: <b>${NAMES[R.model].toLowerCase()}</b>.</p>` + KD(R.F.eq);
        if (R.xe !== null) body += `<p>Estimativa para ${K(`x = ${tnum(R.xe, 4)}`)}: ${K(`\\hat{y} = ${tnum(R.F.f(R.xe), d)}`)}.</p>`;
        if (P.length <= 30) {
          const res = P.map(([x, y]) => y - R.F.f(x));
          body += TAB("Valores ajustados e resíduos", [K("x_i"), K("y_i"), K("\\hat{y}_i"), K("e_i = y_i - \\hat{y}_i")],
            P.map(([x, y], i) => [fmt(x, 4), fmt(y, 4), f(R.F.f(x)), f(res[i])]),
            `<tfoot><tr><td colspan="3">Soma dos quadrados dos resíduos</td><td>${f(sum(res.map(e => e * e)))}</td></tr></tfoot>`);
        }
      }
      if (figs.res) body += FIG(figs.res, `Gráfico de resíduos ${K("e_i = y_i - \\hat{y}_i")} do modelo ${NAMES[R.model].toLowerCase()}${R.byG ? " de cada grupo" : ""}, com a mesma escala de ${K("x")} do diagrama de dispersão; num modelo adequado os resíduos espalham-se ao acaso à volta de 0, sem padrão.`);
    }
    const title = R.mode === "uni" ? `Análise exploratória: ${esc(R.name)}` : `Regressão: ${esc(R.yl)} em função de ${esc(R.xl)}`;
    return `<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><title>${title}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  @page { size: A4; margin: 2.2cm 2.3cm 2.4cm; }
  body { font-family: KaTeX_Main, "Latin Modern Roman", "Computer Modern", serif; font-size: 11pt; line-height: 1.45; color: #111; max-width: 16.5cm; margin: 1.5cm auto; }
  .bar { position: sticky; top: 0; background: #f6f8fb; border: 1px solid #ccd; border-radius: 8px; padding: 6px 10px; margin-bottom: 1.2cm; font-family: system-ui, sans-serif; font-size: 10pt; display: flex; gap: 10px; align-items: center; }
  .bar button { font: inherit; font-weight: 700; padding: 4px 12px; border-radius: 6px; border: 1px solid #99a; background: #fff; cursor: pointer; }
  header { text-align: center; margin-bottom: 1cm; }
  header h1 { font-size: 17pt; font-weight: normal; margin: 0 0 0.35cm; }
  header .sub { font-size: 11pt; } header .date { margin-top: 0.25cm; }
  h2 { font-size: 13pt; margin: 0.75cm 0 0.25cm; break-after: avoid; } h2 .n { display: inline-block; min-width: 1.4em; }
  p { margin: 0.2cm 0; text-align: justify; hyphens: auto; }
  .data { font-size: 10pt; line-height: 1.6; }
  .note { font-size: 9.5pt; color: #333; }
  table { border-collapse: collapse; margin: 0.35cm auto; font-size: 10pt; break-inside: avoid; border-top: 1.4px solid #000; border-bottom: 1.4px solid #000; }
  caption { caption-side: top; font-size: 10pt; padding-bottom: 0.15cm; }
  th { font-weight: normal; border-bottom: 0.8px solid #000; padding: 3px 10px; }
  td { padding: 2px 10px; text-align: right; } td:first-child, th:first-child { text-align: left; }
  tfoot td { border-top: 0.8px solid #000; }
  figure { margin: 0.45cm 0; break-inside: avoid; text-align: center; }
  figure svg { max-width: 100%; }
  figcaption { font-size: 10pt; margin-top: 0.15cm; }
  figure.stem { text-align: left; display: table; margin-left: auto; margin-right: auto; font-size: 11pt; }
  figure.stem .r { display: flex; } figure.stem .s { min-width: 2.4em; text-align: right; padding-right: 0.4em; border-right: 0.8px solid #000; margin-right: 0.5em; }
  figure.stem .l { letter-spacing: 0.15em; } figure.stem figcaption { text-align: center; }
  .katex { font-size: 1.05em; } .katex-display { margin: 0.3cm 0; }
  @media print { .bar { display: none; } body { margin: 0; max-width: none; } }
</style></head><body>
<div class="bar"><button onclick="print()">Imprimir / Guardar como PDF</button><span>Na janela de impressão, escolhe «Guardar como PDF».</span></div>
<header><h1>${title}</h1><div class="sub">Aplicações Interativas de Matemática · Estatística</div><div class="date">${today}</div></header>
${body}
<script>document.fonts.ready.then(() => setTimeout(() => print(), 300));<\/script>
</body></html>`;
  }
  $("report").onclick = () => {
    if (!LAST) { $("msg").textContent = "Não há dados suficientes para o relatório."; return; }
    const w = window.open("", "_blank");
    if (!w) { $("msg").textContent = "O browser bloqueou a janela do relatório: autoriza as janelas deste site."; return; }
    w.document.open(); w.document.write(reportHTML()); w.document.close();
  };
  window.__reportHTML = reportHTML;   // (para testes)

  document.querySelectorAll(".exp[data-fig]").forEach(b => b.onclick = () => exportFig(b.dataset.fig, b.dataset.t));

  new ResizeObserver(() => render()).observe($("plots"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
  if (document.fonts) document.fonts.ready.then(() => render());

  // endereço: #bi abre as duas variáveis
  setMode(location.hash.includes("bi") ? "bi" : "uni");
})();
</script>
</body>
</html>
