<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Função sinusoidal simples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root { --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* caixas de texto (c e d), postas por cima do canvas pelo layout */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.3em; border: 2px solid var(--line); border-radius: 7px;
         background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; text-align: right; outline: none; }
  .inp:focus { border-color: var(--focus); }
  .inp.bad { border-color: var(--bad); background: var(--badbg); }
</style>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<script src="p5.min.js"></script>
<script>
(() => {
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", faint: "#6b7685", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    sin: "#d32f2f", cos: "#1565c0", arc: "#ef6c00", ref: "#9c7fc4",
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", faint: "#8592a1", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    sin: "#ff6b6b", cos: "#64a8ff", arc: "#ffa040", ref: "#b9a0e0",
  };
  const C = { ...LIGHT };
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const PI = Math.PI, TAU = 2 * PI;

  // ---------- estado ----------
  const DEF = { c: 1, d: 0 };
  const S = {
    ...DEF,
    sin: true, cos: false,          // funções mostradas
    t: 0, running: false, speed: 1, win: 4 * PI,
    period: true, chars: false, ref: false, base: false,
  };
  const LIM = { c: [-4, 4], d: [-TAU, TAU] };
  const STEP = { c: 0.05, d: PI / 12 };

  // ---------- números ----------
  const fmt = (x, dec = 2) => {
    if (Math.abs(x) < 0.5 * 10 ** -dec) x = 0;
    return x.toLocaleString("pt-PT", { maximumFractionDigits: dec }).replace("-", "−");
  };
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
  function fracPi(k, m) {
    if (k === 0) return "0";
    const g = gcd(k, m); k /= g; m /= g;
    const s = k < 0 ? "−" : ""; k = Math.abs(k);
    const num = (k === 1 ? "" : k) + "π";
    return s + (m === 1 ? num : num + "/" + m);
  }
  // x como múltiplo de π/12 quando o é exatamente; senão decimal (texto simples, para as caixas)
  function nice(x, dec = 2) {
    const k = Math.round(x / (PI / 12));
    if (k !== 0 && Math.abs(x - k * PI / 12) < 1e-9) return fracPi(k, 12);
    return fmt(x, dec);
  }
  // aceita "2,5", "-3π/4", "pi/2", "2pi", "π", "1/2"
  function parseX(str) {
    const s = String(str).trim().replace(/\s+/g, "").replace(/[−–]/g, "-").replace(/pi/gi, "π");
    const m = s.match(/^([-+]?)(\d*(?:[.,]\d*)?)(π?)(?:\/(\d+(?:[.,]\d+)?))?$/);
    if (!m || (!m[2] && !m[3])) return null;
    let v = m[2] ? parseFloat(m[2].replace(",", ".")) : 1;
    if (isNaN(v)) return null;
    if (m[3]) v *= PI;
    if (m[4]) { const q = parseFloat(m[4].replace(",", ".")); if (!q) return null; v /= q; }
    return m[1] === "-" ? -v : v;
  }
  // número em LaTeX: múltiplos de π/12 e frações de denominador até 12 em forma exata
  function texNum(x, frac = "\\frac") {
    const sg = x < 0 ? "-" : "", ax = Math.abs(x);
    const k = Math.round(ax / (PI / 12));
    if (k !== 0 && Math.abs(ax - k * PI / 12) < 1e-9) {
      const g = gcd(k, 12), n = k / g, m = 12 / g;
      const body = (n === 1 ? "" : n) + "\\pi";
      return sg + (m === 1 ? body : `${frac}{${body}}{${m}}`);
    }
    for (let q = 1; q <= 12; q++) {
      const n = Math.round(ax * q);
      if (Math.abs(ax - n / q) < 1e-9) return sg + (q === 1 ? String(n) : `${frac}{${n}}{${q}}`);
    }
    return sg + fmt(ax, 2).replace(",", "{,}");
  }
  const texDec = (x, dec = 2) => fmt(x, dec).replace(",", "{,}").replace("−", "-");
  // argumento ct + d
  function texArg() {
    let s = "";
    if (Math.abs(S.c) > 1e-12) s = Math.abs(S.c - 1) < 1e-12 ? "t" : Math.abs(S.c + 1) < 1e-12 ? "-t" : texNum(S.c) + " t";
    if (Math.abs(S.d) > 1e-12) s = s ? `${s} ${S.d < 0 ? "-" : "+"} ${texNum(Math.abs(S.d))}` : texNum(S.d);
    return s || "0";
  }

  // P = (cos θ, sin θ) com θ = ct + d: sin(ct + d) é a ordenada de P e cos(ct + d) a abcissa
  const theta = t => S.c * t + S.d;
  const FN = { sin: t => Math.sin(theta(t)), cos: t => Math.cos(theta(t)) };
  const active = () => ["sin", "cos"].filter(k => S[k]);

  // ---------- ações ----------
  function setParam(k, x, snapIt = true) {
    if (snapIt) x = Math.round(x / STEP[k]) * STEP[k];
    x = clamp(x, LIM[k][0], LIM[k][1]);
    if (Math.abs(x - S[k]) < 1e-12) return;
    S[k] = x; draw();
  }
  const setTime = t => { S.t = clamp(t, 0, S.win); draw(); };
  const stopAnd = f => (...a) => { S.running = false; f(...a); };
  function toggleRun() { S.running = !S.running; if (S.running && S.t >= S.win - 1e-9) S.t = 0; draw(); }
  function setWin(w) { S.win = w; if (S.t > w) S.t = w; draw(); }

  // ---------- caixas de texto (c e d) ----------
  const INP = {};
  function makeInput(key) {
    const el = document.createElement("input");
    el.className = "inp"; el.type = "text"; el.autocomplete = "off"; el.spellcheck = false;
    el.title = "Aceita, por exemplo: 1/2 · π/3 · −3pi/4 · 2π";
    el.setAttribute("aria-label", `Valor de ${key}` + (key === "d" ? " (aceita π/4 ou pi/4)" : ""));
    document.body.appendChild(el);
    const show = () => { el.classList.remove("bad"); el.value = nice(S[key]); };
    const commit = () => {
      const x = parseX(el.value);
      if (x === null) { el.classList.add("bad"); return; }
      setParam(key, x, false); show();
    };
    el.addEventListener("change", commit);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") { commit(); el.blur(); }
      else if (e.key === "Escape") { show(); el.blur(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        setParam(key, S[key] + (e.key === "ArrowUp" ? 1 : -1) * STEP[key] * (e.shiftKey ? 4 : 1)); show();
      }
    });
    INP[key] = { el, show };
  }
  makeInput("c"); makeInput("d");
  let usedInp = new Set();
  function place(key, r, px) {
    const { el, show } = INP[key];
    el.style.display = "";
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
    el.style.fontSize = px + "px";
    if (document.activeElement !== el) show();
    usedInp.add(key);
  }

  // ---------- KaTeX numa camada por cima ----------
  const layer = document.getElementById("tex");
  const pool = new Map();
  let used = new Set();
  function texAt(id, src, x, y, px, color, ax = 0.5, ay = 0.5, halo = false) {
    let el = pool.get(id);
    if (!el) { el = document.createElement("span"); layer.appendChild(el); pool.set(id, el); }
    if (el._src !== src) {
      el._src = src;
      if (window.katex) katex.render(src, el, { throwOnError: false, strict: false, trust: true });
      else el.textContent = src;
    }
    el.className = halo ? "tx halo" : "tx";
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${px}px;color:${color};transform:translate(${-ax * 100}%,${-ay * 100}%)`;
    used.add(id);
    return el;
  }
  function fit(el, w, h = Infinity) {
    const k = Math.min(w / el.offsetWidth, h / el.offsetHeight);
    if (k < 1) el.style.fontSize = parseFloat(el.style.fontSize) * k + "px";
    return k;
  }

  // ---------- desenho (p5.js) ----------
  // (nada de drawingContext.save/restore à volta de cores do p5: o p5 guarda a última cor
  // em cache e, depois de um restore, deixaria de a aplicar)
  let P = null, L = null, hits = [], W = 0, H = 0;
  const draw = () => { if (!P) return; if (S.running) P.loop(); else P.redraw(); };

  const sketch = p => {
    const dc = () => p.drawingContext;
    const FONT = "Atkinson Hyperlegible";

    // ---------- primitivas ----------
    function line(x0, y0, x1, y1, c, w, dash) {
      p.stroke(c); p.strokeWeight(w);
      if (dash) dc().setLineDash(dash);
      p.line(x0, y0, x1, y1);
      if (dash) dc().setLineDash([]);
    }
    const dashed = (x0, y0, x1, y1, c, w) => line(x0, y0, x1, y1, c, w, [5, 5]);
    function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
      if (fill) p.fill(fill); else p.noFill();
      if (stroke) { p.stroke(stroke); p.strokeWeight(lw); } else p.noStroke();
      p.rect(x, y, w, h, r);
    }
    function dot(x, y, r, fill, ring) {
      p.fill(fill);
      if (ring) { p.stroke(ring); p.strokeWeight(2); } else p.noStroke();
      p.circle(x, y, 2 * r);
    }
    function text(s, x, y, px, color, align = "left", bold = false, italic = false) {
      p.noStroke(); p.fill(color); p.textFont(FONT); p.textSize(px);
      p.textStyle(bold ? p.BOLD : italic ? p.ITALIC : p.NORMAL);
      p.textAlign(align === "left" ? p.LEFT : align === "right" ? p.RIGHT : p.CENTER, p.CENTER);
      p.text(s, x, y);
      return p.textWidth(s);
    }
    const tw = (s, px, bold = false, italic = false) => { p.textFont(FONT); p.textSize(px); p.textStyle(bold ? p.BOLD : italic ? p.ITALIC : p.NORMAL); return p.textWidth(s); };
    function arrow(x, y, ux, uy, s, c) {
      p.noStroke(); p.fill(c);
      p.triangle(x + ux * s, y + uy * s, x - uy * s * 0.6, y + ux * s * 0.6, x + uy * s * 0.6, y - ux * s * 0.6);
    }

    // botões: etiqueta em LaTeX; dentro de um grupo (group/endGroup) as etiquetas encolhem por igual
    let GRP = null;
    const group = () => { GRP = []; };
    function endGroup() {
      const k = Math.min(1, ...GRP.map(([el, w]) => w / el.offsetWidth));
      if (k < 1) GRP.forEach(([el]) => el.style.fontSize = parseFloat(el.style.fontSize) * k + "px");
      GRP = null;
    }
    function button(x, y, w, h, tex, on, kind, extra = {}, col = C.muted, px = 16) {
      rrect(x, y, w, h, 8, on ? col : C.btn, on ? col : C.line, 2);
      const el = texAt(`bt-${kind}-${extra.v ?? ""}`, tex, x + w / 2, y + h / 2, px, on ? C.on : C.ink);
      if (GRP) GRP.push([el, w - 0.6 * px]); else fit(el, w - 0.6 * px);
      hits.push({ kind, ...extra, rect: { x, y, w, h } });
    }
    function seg(x, y, w, rh, fs, items, cur, kind, col, px) {
      const g = 0.2 * fs, bh = 1.25 * fs, bw = (w - (items.length - 1) * g) / items.length;
      const own = !GRP;
      if (own) group();
      items.forEach(([v, t], i) => button(x + i * (bw + g), y + (rh - bh) / 2, bw, bh, t, Math.abs(cur - v) < 1e-9, kind, { v }, col, px));
      if (own) endGroup();
    }
    // caixa de opção; tex = id da camada KaTeX (o texto é LaTeX), senão texto normal
    function cbox(x, y, h, bs, px, on, txt, hit, col, tex = null) {
      const yy = y + (h - bs) / 2;
      rrect(x, yy, bs, bs, 5, on ? col : C.bg, col, 2);
      if (on) {
        p.noFill(); p.stroke(C.on); p.strokeWeight(0.14 * bs); p.strokeJoin(p.ROUND); p.strokeCap(p.ROUND);
        p.beginShape(); p.vertex(x + 0.24 * bs, yy + 0.52 * bs); p.vertex(x + 0.43 * bs, yy + 0.72 * bs); p.vertex(x + 0.77 * bs, yy + 0.3 * bs); p.endShape();
      }
      const w = bs * 1.45 + (tex ? texAt(tex, txt, x + bs * 1.45, y + h / 2, px * 1.08, col, 0, 0.5).offsetWidth
                                 : text(txt, x + bs * 1.45, y + h / 2 + 1, px, C.ink));
      hits.push({ ...hit, rect: { x, y, w, h } });
      return x + w;
    }
    function slider(x, y, w, h, lo, hi, v, col, fs, set, ticks = [], from = lo) {
      const cy = y + h / 2, X = u => x + (clamp(u, lo, hi) - lo) / (hi - lo) * w;
      ticks.forEach(t => line(X(t), cy + 0.25 * fs, X(t), cy + 0.45 * fs, C.faint, 1.2));
      p.strokeCap(p.ROUND);
      line(x, cy, x + w, cy, C.grid2, 0.26 * fs);
      line(X(from), cy, X(v), cy, col, 0.26 * fs);
      p.strokeCap(p.SQUARE);
      dot(X(v), cy, 0.48 * fs, col, C.bg);
      hits.push({ kind: "slide", rect: { x: x - 0.7 * fs, y, w: w + 1.4 * fs, h }, set, val: px => lo + (px - x) / w * (hi - lo) });
    }

    // ---------- disposição ----------
    // controlos em cima (três cartões numa linha, se couberem); por baixo a circunferência e o gráfico
    const ROW = 1.5, LEG = 2.2, CF = 0.8;
    let CP = 0.45, GAP = 0.75, RG = 0.3;
    const CARDS = [["fn", 3], ["tempo", 3], ["ver", 3]];
    const cardH = r => CP * 2 + r * ROW + (r - 1) * RG;
    function layout() {
      let fs = clamp(Math.min(W, H) / 26, 12, 21);
      for (let k = 0; k < 40; k++) {
        const L = tryLayout(fs);
        if (L.ok || fs <= 10) return L;
        fs *= 0.95;
      }
      return tryLayout(fs);
    }
    function tryLayout(fs) {
      const pad = Math.round(fs * 0.7), gap = GAP * fs;
      const land = W > H * 1.1 && W >= 640;
      [CP, GAP, RG] = land ? [0.45, 0.75, 0.3] : [0.35, 0.45, 0.2];
      const cfs = fs * CF, L = { fs, cfs, pad, land, cards: {} };
      const hOf = k => cardH(CARDS.find(c => c[0] === k)[1]) * cfs;
      const w = W - 2 * pad;
      let y = pad;
      L.legend = { x: pad, y, w, h: LEG * fs }; y += LEG * fs + (land ? 0.6 : 0.4) * fs;
      const nc = w >= 3 * 21 * cfs + 2 * gap ? 3 : w >= 40 * cfs ? 2 : 1, cw = (w - (nc - 1) * gap) / nc;
      const col = nc === 3 ? [["fn"], ["tempo"], ["ver"]] : nc === 2 ? [["fn", "ver"], ["tempo"]] : [CARDS.map(c => c[0])];
      const rowsOf = k => CARDS.find(c => c[0] === k)[1];
      let ymax = y;
      col.forEach((cs, ci) => { let yy = y; cs.forEach(k => { L.cards[k] = { x: pad + ci * (cw + gap), y: yy, w: cw, h: hOf(k), r: rowsOf(k) }; yy += hOf(k) + gap; }); ymax = Math.max(ymax, yy - gap); });
      y = ymax + (land ? 0.8 : 0.6) * fs;
      if (S.chars) { L.chars = { x: pad, y, w, h: 2.0 * fs }; y += 2.4 * fs; }
      const area = { x: pad, y, w, h: H - pad - y };
      L.ok = area.h >= Math.max(0.36 * H, 13 * fs) && cw >= 20 * cfs && (!land || nc === 3);
      // ecrã deitado (ou largo): circunferência numa faixa à esquerda e o gráfico à direita, com a mesma
      // escala vertical e à mesma altura (a ordenada de P vai na horizontal até ao gráfico);
      // ecrã ao alto: a circunferência por cima e o gráfico por baixo, com a mesma escala
      const g2 = 0.5 * fs;
      const top = 2.6 * fs, bot = 1.0 * fs;               // espaço do título/período e por baixo
      const Wc = Math.round(Math.min(area.w * (area.w < 34 * fs ? 0.42 : 0.36), area.h * 0.95));
      const ppuSide = Math.min((area.h - top - bot) / 2.6, (Wc - 2.6 * fs) / 2);
      const ppuStack = Math.min((area.h - g2 - 1.2 * fs - top - bot) / 5.2, (area.w - 2.6 * fs) / 2);
      L.side = land || ppuSide >= 0.85 * ppuStack;
      if (L.side) {
        L.ppu = ppuSide;
        L.circ = { x: area.x, y: area.y, w: Wc, h: area.h };
        L.gf = { x: area.x + Wc + g2, y: area.y, w: area.w - Wc - g2, h: area.h };
        L.cy = L.ym = area.y + top + (area.h - top - bot) / 2;
      } else {
        L.ppu = ppuStack;
        const ch = 2.6 * L.ppu + 1.2 * fs;
        L.circ = { x: area.x, y: area.y, w: area.w, h: ch };
        L.gf = { x: area.x, y: area.y + ch + g2, w: area.w, h: area.h - ch - g2 };
        L.cy = area.y + ch / 2;
        L.ym = L.gf.y + top + (L.gf.h - top - bot) / 2;
      }
      L.GT = L.gf.y + top; L.GB = L.gf.y + L.gf.h - bot;
      if (L.gf.w < 14 * fs || L.ppu < 2.6 * fs) L.ok = false;
      return L;
    }

    // ---------- cartões ----------
    function card(b, col, fs) {
      rrect(b.x, b.y, b.w, b.h, 9, C.band, C.line, 1.2);
      p.noStroke(); p.fill(col); p.rect(b.x + 0.6, b.y + 0.6, 0.25 * fs, b.h - 1.2, 9, 0, 0, 9);
      const ch = (b.r * ROW + (b.r - 1) * RG) * fs;
      return { x: b.x + 0.7 * fs, y: b.y + (b.h - ch) / 2, w: b.w - 1.2 * fs };
    }
    const rowY = (c, i, fs) => c.y + i * (ROW + RG) * fs;
    // linha de um parâmetro: nome (KaTeX), cursor e caixa de texto
    function paramRow(c, i, fs, key, col, ticks) {
      const rh = ROW * fs, y = rowY(c, i, fs), [lo, hi] = LIM[key];
      texAt("pl-" + key, key, c.x + 0.2 * fs, y + rh / 2, fs * 1.1, C.muted, 0, 0.5);
      const iw = 4.6 * fs, ix = c.x + c.w - iw, lx = c.x + 1.5 * fs;
      slider(lx, y, ix - 0.9 * fs - lx, rh, lo, hi, S[key], col, fs, stopAnd(v => setParam(key, v)), ticks, 0);
      place(key, { x: ix, y: y + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, fs * 0.85);
    }
    function cardFn(b, fs) {
      const c = card(b, C.sin, fs), rh = ROW * fs, bs = 0.8 * fs, px = fs * 0.9, bh = 1.25 * fs;
      const y = rowY(c, 0, fs);
      let x = cbox(c.x, y, rh, bs, px, S.sin, "y = \\sin(ct + d)", { kind: "tog", key: "sin" }, C.sin, "cb-sin");
      x = cbox(Math.max(x + 0.8 * fs, c.x + c.w * 0.37), y, rh, bs, px, S.cos, "y = \\cos(ct + d)", { kind: "tog", key: "cos" }, C.cos, "cb-cos");
      const bx = x + 0.6 * fs;
      if (c.x + c.w - bx > 2 * fs) button(bx, y + (rh - bh) / 2, c.x + c.w - bx, bh, "\\text{↺ iniciais}", false, "defaults", {}, C.muted, fs * 0.95);
      const ticksC = [-4, -3, -2, -1, 0, 1, 2, 3, 4], ticksD = [];
      for (let k = -4; k <= 4; k++) ticksD.push(k * PI / 2);
      paramRow(c, 1, fs, "c", C.sin, ticksC);
      paramRow(c, 2, fs, "d", C.sin, ticksD);
    }
    function cardTempo(b, fs) {
      const c = card(b, C.arc, fs), rh = ROW * fs, bh = 1.25 * fs, px = fs * 0.95;
      let y = rowY(c, 0, fs);
      const g = 0.2 * fs, by = y + (rh - bh) / 2;
      const rw = c.w * 0.4, zw = c.w * 0.16;
      const lab = S.running ? "\\text{❚❚ Parar}" : S.t > 0 ? "\\blacktriangleright\\ \\text{Continuar}" : "\\blacktriangleright\\ \\text{Ligar o tempo}";
      group();
      button(c.x, by, rw, bh, lab, true, "run", {}, C.arc, px);
      button(c.x + rw + g, by, zw, bh, "t = 0", false, "reset", {}, C.muted, px);
      const sx0 = c.x + rw + zw + g + 0.5 * fs;
      seg(sx0, y, c.x + c.w - sx0, rh, fs, [[0.25, "\\tfrac{1}{4}\\times"], [0.5, "\\tfrac{1}{2}\\times"], [1, "1\\times"], [2, "2\\times"]], S.speed, "speed", C.muted, px);
      endGroup();
      y = rowY(c, 1, fs);
      texAt("tl", "t", c.x + 0.2 * fs, y + rh / 2, fs * 1.1, C.muted, 0, 0.5);
      const vw = 4.6 * fs, lx = c.x + 1.5 * fs;
      slider(lx, y, c.x + c.w - vw - 0.9 * fs - lx, rh, 0, S.win, S.t, C.arc, fs, stopAnd(setTime));
      texAt("tval", texDec(S.t), c.x + c.w, y + rh / 2, fs * 1.0, C.ink, 1, 0.5);
      y = rowY(c, 2, fs);
      const lx2 = c.x + text("Janela de t", c.x, y + rh / 2 + 1, fs * 0.9, C.muted) + 0.7 * fs;
      seg(lx2, y, c.x + c.w - lx2, rh, fs, [[2 * PI, "[0, 2\\pi]"], [4 * PI, "[0, 4\\pi]"], [8 * PI, "[0, 8\\pi]"]], S.win, "win", C.muted, px);
    }
    function cardVer(b, fs) {
      const c = card(b, C.ink, fs), rh = ROW * fs, bs = 0.8 * fs, px = fs * 0.9, half = c.w * 0.5;
      let y = rowY(c, 0, fs);
      cbox(c.x, y, rh, bs, px, S.period, "Período", { kind: "tog", key: "period" }, C.arc);
      cbox(c.x + half, y, rh, bs, px, S.chars, "Características", { kind: "tog", key: "chars" }, C.muted);
      y = rowY(c, 1, fs);
      const act = active(), refT = (act.length ? act : ["sin"]).map(k => `y = \\${k} t`).join("\\ \\text{e}\\ ");
      cbox(c.x, y, rh, bs, px, S.ref, `${refT}\\ \\ (c = 1,\\ d = 0)`, { kind: "tog", key: "ref" }, C.ref, "cb-ref");
      y = rowY(c, 2, fs);
      cbox(c.x, y, rh, bs, px, S.base, "\\text{Ponto } Q \\text{ da função base (ângulo } t\\text{)}", { kind: "tog", key: "base" }, C.ref, "cb-base");
    }

    // em cima: as funções com os valores atuais e o botão do modo escuro
    function legend(b, fs) {
      const bw = b.h * 1.2, w = b.w - bw - 0.4 * fs;
      rrect(b.x, b.y, w, b.h, 8, C.band, C.line, 1.5);
      const act = active();
      const src = act.length ? act.map(k => `\\textcolor{${C[k]}}{y = \\${k}\\left(${texArg()}\\right)}`).join("\\qquad")
        : "\\text{Nenhuma função escolhida}";
      fit(texAt("legend", src, b.x + w / 2, b.y + b.h / 2, fs * 1.2, act.length ? C.ink : C.faint), w - 0.8 * fs, b.h);
      rrect(b.x + b.w - bw, b.y, bw, b.h, 8, C.btn, C.line, 2);
      text(dark ? "☀" : "☾", b.x + b.w - bw / 2, b.y + b.h / 2 + 1, fs * 1.05, C.ink, "center", true);
      hits.push({ kind: "theme", rect: { x: b.x + b.w - bw, y: b.y, w: bw, h: b.h } });
    }
    // características: período, contradomínio, ângulo inicial, sentido
    function charsStrip(b, fs) {
      rrect(b.x, b.y, b.w, b.h, 8, null, C.line, 1.2);
      const cz = Math.abs(S.c) < 1e-12, T = cz ? null : TAU / Math.abs(S.c);
      const Tt = cz ? "T:\\ \\text{— } (c = 0\\text{: função constante})"
        : `T = \\tfrac{2\\pi}{|c|} = ${texNum(T, "\\tfrac")}` + (texNum(T).includes("\\pi") ? ` \\approx ${texDec(T)}` : "");
      const Dt = cz ? "D' = " + active().map(k => `\\{${texDec(FN[k](0), 3)}\\}`).join("\\text{ e }") : "D' = [-1, 1]";
      const dt = `d = ${texNum(S.d, "\\tfrac")}` + (texNum(S.d).includes("\\pi") ? ` \\approx ${texDec(S.d)}` : "") + "\\ \\text{rad}";
      const st = cz ? "\\text{P parado}" : S.c > 0 ? "\\text{P roda no sentido positivo}" : "\\text{P roda no sentido negativo}";
      fit(texAt("chars", [Tt, Dt, dt, st].join("\\qquad "), b.x + b.w / 2, b.y + b.h / 2, fs * 0.95, C.ink), b.w - fs, b.h);
    }

    // moldura de um quadro, com o título em cima à esquerda; devolve a largura ocupada
    function frame_(b, title, fs) {
      rrect(b.x, b.y, b.w, b.h, 9, null, C.line, 1.2);
      return title ? 0.6 * fs + text(title, b.x + 0.6 * fs, b.y + 0.75 * fs, fs * 0.8, C.muted, "left", true) : 0;
    }

    // ---------- circunferência e gráfico ----------
    function panels(fs) {
      const cf = L.circ, gf = L.gf, ppu = L.ppu, ym = L.ym, GT = L.GT, GB = L.GB;
      const Y = y => ym - y * ppu;
      const gx0 = gf.x + 2.6 * fs, gx1 = gf.x + gf.w - 1.4 * fs, GW = gx1 - gx0;
      const X = t => gx0 + (t / S.win) * GW;
      const cx = cf.x + cf.w / 2, cy = L.cy, R = ppu;
      const th = theta(S.t), cs = Math.cos(th), sn = Math.sin(th);
      const Px = cx + R * cs, Py = cy - R * sn;
      const px = fs * 0.7;

      frame_(cf, "", fs);
      const tW = frame_(gf, "Gráfico", fs);

      // ---- grelha e eixos do gráfico ----
      for (const y of ppu < 3 * fs ? [-1, 1] : [-1, -0.5, 0.5, 1]) {
        line(gx0, Y(y), gx1, Y(y), C.grid, 1);
        texAt("gy" + y, texDec(y, 1), gx0 - 0.4 * fs, Y(y), px, C.muted, 1, 0.5);
      }
      // marcas de t em múltiplos de π/2 (ou π, ou 2π, se não houver espaço)
      let m = 2;
      if (GW / (S.win / (PI / 2)) < 2.6 * fs) m = 1;
      if (GW / (S.win / PI) < 2.4 * fs) m = 0.5;
      const st = PI / m;
      for (let k = 1; k * st <= S.win + 1e-9; k++) {
        const x = X(k * st);
        line(x, GT, x, GB, C.grid, 1);
        texAt("gt" + k, m === 0.5 ? texNum(2 * k * PI, "\\tfrac") : texNum(k * PI / m, "\\tfrac"), x, Y(0) + 0.3 * fs, fs * 0.72, C.muted, 0.5, 0, true);
      }
      line(gx0, Y(0), gx1, Y(0), C.axis, 1.5);
      line(gx0, GT - 0.3 * fs, gx0, GB, C.axis, 1.5);
      arrow(gx1 + 0.3 * fs, Y(0), 1, 0, 0.35 * fs, C.axis);
      arrow(gx0, GT - 0.5 * fs, 0, -1, 0.35 * fs, C.axis);
      texAt("axt", "t", gx1 - 0.1 * fs, Y(0) - 0.25 * fs, fs * 0.9, C.ink, 1, 1, true);
      texAt("axy", "y", gx0 + 0.4 * fs, GT - 0.2 * fs, fs * 0.9, C.ink, 0, 0.5, true);

      // ---- período ----
      const T = Math.abs(S.c) > 1e-9 ? TAU / Math.abs(S.c) : Infinity;
      let Tx = null;
      const yb = GT - 0.5 * fs;
      if (S.period && T <= S.win + 1e-9) {
        Tx = X(T);
        line(X(0), yb, X(T), yb, C.arc, 1.6);
        line(X(0), yb - 5, X(0), yb + 5, C.arc, 1.6); line(X(T), yb - 5, X(T), yb + 5, C.arc, 1.6);
        dc().globalAlpha = 0.5; dashed(X(T), yb, X(T), GB, C.arc, 1); dc().globalAlpha = 1;
        const el = texAt("perT", `T = ${texNum(T, "\\tfrac")}`, 0, 0, fs * 0.8, C.arc, 0.5, 0.5);
        const w = el.offsetWidth, tx = Math.max(X(0) + w / 2 + 4, X(T / 2));
        el.style.left = tx + "px"; el.style.top = yb + "px";
        rrect(tx - w / 2 - 3, yb - el.offsetHeight / 2, w + 6, el.offsetHeight, 3, C.bg, null);
      }

      // ---- curvas ----
      const N = Math.max(200, Math.round(GW * 2));
      const curve = (g, t0, t1, color, w, dash) => {
        p.noFill(); p.stroke(color); p.strokeWeight(w); p.strokeJoin(p.ROUND);
        if (dash) dc().setLineDash(dash);
        p.beginShape();
        const n = Math.max(2, Math.round(N * (t1 - t0) / S.win));
        for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n; p.vertex(X(t), Y(g(t))); }
        p.endShape();
        dc().setLineDash([]);
      };
      const act = active();
      if (S.ref) act.forEach(k => curve(Math[k], 0, S.win, C.ref, 1.8, [6, 5]));
      act.forEach(k => { dc().globalAlpha = 0.3; curve(FN[k], 0, S.win, C[k], 2); dc().globalAlpha = 1; });
      if (S.t > 0) act.forEach(k => curve(FN[k], 0, S.t, C[k], Math.max(2.6, 0.16 * fs)));

      // ---- circunferência trigonométrica ----
      const ext = R + 0.7 * fs;
      line(cx - ext, cy, cx + ext, cy, C.axis, 1.2);
      line(cx, cy + ext, cx, cy - ext, C.axis, 1.2);
      arrow(cx + ext, cy, 1, 0, 0.3 * fs, C.axis); arrow(cx, cy - ext, 0, -1, 0.3 * fs, C.axis);
      texAt("ccos", "\\cos", cx + ext + 0.1 * fs, cy + 0.35 * fs, px, C.muted, 1, 0, true);
      texAt("csin", "\\sin", cx + 0.35 * fs, cy - ext - 0.1 * fs, px, C.muted, 0, 1, true);
      p.noFill(); p.stroke(C.ink); p.strokeWeight(1.6); p.circle(cx, cy, 2 * R);
      texAt("c1x", "1", cx + R - 0.2 * fs, cy + 0.15 * fs, px * 0.95, C.muted, 1, 0, true);
      texAt("c1y", "1", cx - 0.2 * fs, cy - R - 0.1 * fs, px * 0.95, C.muted, 1, 1, true);
      texAt("cO", "O", cx - 0.2 * fs, cy + 0.15 * fs, px * 0.95, C.muted, 1, 0, true);
      // A = (1, 0), fixo: origem dos ângulos (não depende de d)
      dot(cx + R, cy, 0.22 * fs, C.bg, C.arc);
      if (Math.hypot(cx + R - Px, cy - Py) > fs) texAt("cA", "A", cx + R + 0.5 * fs, cy - 0.6 * fs, fs * 0.8, C.arc, 0.5, 0.5, true);

      // arcos dos ângulos ao centro (reduzidos a uma volta, com o sinal), com etiqueta
      const arcL = (id, a0, sw, r, color, txt) => {
        sw = sw % TAU; if (Math.abs(sw) < 1e-9) return;
        p.noFill(); p.stroke(color); p.strokeWeight(2);
        dc().beginPath(); dc().arc(cx, cy, r, -a0, -(a0 + sw), sw > 0); dc().stroke();
        const am = a0 + sw / 2, rl = r + 0.7 * fs;
        texAt(id, txt, cx + Math.cos(am) * rl, cy - Math.sin(am) * rl, fs * 0.85, color, 0.5, 0.5, true);
      };
      if (S.base) {
        // com Q: t é o ângulo de OQ e θ (= ct + d) o de OP
        const rb = clamp(R * 0.32, 1.1 * fs, 2.2 * fs);
        arcL("at", 0, S.t, rb * 0.45, C.ref, "t");
        arcL("ath", 0, th, rb, C.arc, "\\theta");
      } else arcL("ath", 0, th, clamp(R * 0.28, 0.8 * fs, 1.6 * fs), C.arc, "\\theta");

      // raio OP, cosseno (abcissa) e seno (ordenada, levada na horizontal até ao gráfico)
      line(cx, cy, Px, Py, C.ink, 1.6);
      p.strokeCap(p.SQUARE);
      if (S.cos) line(cx, cy, Px, cy, C.cos, Math.max(3, 0.18 * fs));
      if (S.sin) { line(Px, cy, Px, Py, C.sin, Math.max(3, 0.18 * fs)); if (L.side) dashed(Px, Py, X(S.t), Y(sn), C.sin, 1); }
      p.strokeCap(p.ROUND);

      // Q: ponto da função base, de ângulo t — só o ponto e o raio OQ
      if (S.base) {
        const Qx = cx + R * Math.cos(S.t), Qy = cy - R * Math.sin(S.t);
        line(cx, cy, Qx, Qy, C.ref, 1.6);
        dot(Qx, Qy, 0.3 * fs, C.ref);
        texAt("cQ", "Q", Qx + Math.cos(S.t) * 0.9 * fs, Qy - Math.sin(S.t) * 0.9 * fs, fs * 0.9, C.ref, 0.5, 0.5, true);
      }
      // P na circunferência, valor no eixo y e pontos do gráfico
      dot(Px, Py, 0.32 * fs, C.ink, C.bg);
      texAt("cP", "P", Px + cs * 0.95 * fs, Py - sn * 0.95 * fs, fs * 0.95, C.ink, 0.5, 0.5, true);
      if (S.sin && L.side) dot(gx0, Y(sn), 0.18 * fs, C.sin);
      // com Q e as curvas de base ligados: também o ponto (t, cos t) / (t, sin t) nessas curvas, a roxo (por baixo dos pontos de P)
      if (S.base && S.ref) act.forEach(k => dot(X(S.t), Y(Math[k](S.t)), 0.3 * fs, C.ref, C.bg));
      act.forEach(k => dot(X(S.t), Y(k === "sin" ? sn : cs), 0.3 * fs, C[k], C.bg));

      // valores atuais, à direita do título do gráfico (só se couberem)
      const now = [`t = ${texDec(S.t)}`, `\\theta = ct + d = ${texDec(th)}\\ \\text{rad}`, ...act.map(k => `\\${k}(ct + d) = ${texDec(FN[k](S.t), 3)}`)];
      for (let n = now.length; n >= 1; n--) {
        const el = texAt("now", now.slice(0, n).join("\\quad "), gf.x + gf.w - 0.6 * fs, gf.y + 0.75 * fs, fs * 0.75, C.arc, 1, 0.5, true);
        if (el.offsetWidth <= gf.w - tW - 1.2 * fs) break;
        if (n === 1) el.style.display = "none";
      }
      // como mexer (em baixo, à direita, se couber)
      const hint = "arrastar: P muda t · a curva muda d · o fim de T muda c · a reta de t muda t";
      if (tw(hint, fs * 0.62, false, true) < GW - 2 * fs) text(hint, gf.x + gf.w - 0.6 * fs, gf.y + gf.h - 0.55 * fs, fs * 0.62, C.faint, "right", false, true);

      L.geo = { gx0, gx1, GT, GB, X, tx: x => (x - gx0) / GW * S.win, cx, cy, Px, Py, Tx, yb };
    }

    // ---------- p5 ----------
    p.setup = () => {
      W = window.innerWidth; H = window.innerHeight;
      p.createCanvas(W, H);
      p.canvas.setAttribute("aria-label", "Circunferência trigonométrica com o ponto P = (cos(ct + d), sin(ct + d)) e o gráfico de y = sin(ct + d) e/ou y = cos(ct + d)");
      p.pixelDensity(Math.min(3, window.devicePixelRatio || 1));
      p.noLoop();
      bindPointer(p.canvas);
    };
    p.windowResized = () => { W = window.innerWidth; H = window.innerHeight; p.resizeCanvas(W, H); p.redraw(); };
    p.draw = () => {
      if (S.running) {
        S.t += Math.min(0.1, p.deltaTime / 1000) * S.speed;
        if (S.t > S.win) S.t -= S.win;
      }
      L = layout(); hits = []; used = new Set(); usedInp = new Set();
      const { fs, cfs } = L;
      p.background(C.bg);
      legend(L.legend, fs);
      cardFn(L.cards.fn, cfs);
      cardTempo(L.cards.tempo, cfs);
      cardVer(L.cards.ver, cfs);
      if (L.chars) charsStrip(L.chars, fs);
      panels(fs);
      for (const [id, el] of pool) if (!used.has(id)) el.style.display = "none";
      for (const k in INP) if (!usedInp.has(k)) INP[k].el.style.display = "none";
      if (!S.running) p.noLoop();
    };
  };

  // ---------- toque e rato ----------
  // botões e cursores; no desenho: P → t · fim do período T → c · a curva na horizontal → d · a reta de t → t
  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const hitAt = (x, y) => hits.find(h => h.rect && inRect(h.rect, x, y)) || null;
  function geoAt(x, y) {
    const g = L && L.geo, fs = L.fs;
    if (!g) return null;
    if (Math.hypot(x - g.Px, y - g.Py) < 1.1 * fs) return "P";
    if (g.Tx !== null && Math.abs(x - g.Tx) < 0.7 * fs && Math.abs(y - g.yb) < 0.8 * fs) return "T";
    if (x > g.gx0 + 4 && x < g.gx1 && y > g.GT - 4 && y < g.GB) return Math.abs(x - g.X(S.t)) < 0.7 * fs ? "t" : "d";
    return null;
  }
  const CURSOR = { P: "grab", T: "ew-resize", t: "ew-resize", d: "grab" };
  let drag = null;
  function dragTo(x, y) {
    const g = L.geo;
    if (drag.kind === "slide") { drag.set(drag.val(x)); return; }
    if (drag.kind === "P") {
      if (Math.abs(S.c) < 1e-9) return;
      let ang = Math.atan2(-(y - g.cy), x - g.cx);
      ang += TAU * Math.round((theta(S.t) - ang) / TAU);   // a volta mais próxima da atual
      setTime((ang - S.d) / S.c);
    } else if (drag.kind === "T") {
      const T = g.tx(x);
      if (T > 0.2) setParam("c", Math.sign(S.c || 1) * TAU / T);
    } else if (drag.kind === "t") {
      setTime(g.tx(x));
    } else if (drag.kind === "d") {
      // deslocar a curva h para a direita: d passa a d − c·h
      if (Math.abs(S.c) < 1e-9) return;
      setParam("d", drag.d - S.c * (g.tx(x) - drag.t0));
    }
  }
  function bindPointer(el) {
    el.addEventListener("pointerdown", e => {
      if (document.activeElement && document.activeElement.classList.contains("inp")) document.activeElement.blur();
      const x = e.clientX, y = e.clientY, h = hitAt(x, y);
      if (h) {
        e.preventDefault();
        if (h.kind === "theme") { setDark(!dark, true); for (const s of pool.values()) s._src = null; draw(); return; }
        if (h.kind === "tog") { S[h.key] = !S[h.key]; draw(); return; }
        if (h.kind === "defaults") { Object.assign(S, DEF); draw(); return; }
        if (h.kind === "run") { toggleRun(); return; }
        if (h.kind === "reset") { S.running = false; S.t = 0; draw(); return; }
        if (h.kind === "speed") { S.speed = h.v; draw(); return; }
        if (h.kind === "win") { setWin(h.v); return; }
        if (h.kind === "slide") {
          try { el.setPointerCapture(e.pointerId); } catch (_) {}
          drag = h; dragTo(x, y); el.style.cursor = "grabbing";
        }
        return;
      }
      const q = geoAt(x, y);
      if (!q) return;
      e.preventDefault();
      if (q === "P" || q === "t") S.running = false;
      drag = { kind: q, d: S.d, t0: L.geo.tx(x) };
      el.style.cursor = q === "P" || q === "d" ? "grabbing" : CURSOR[q];
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (q !== "d") dragTo(x, y);
    });
    el.addEventListener("pointermove", e => {
      const x = e.clientX, y = e.clientY;
      if (drag) { dragTo(x, y); return; }
      const h = hitAt(x, y);
      if (h) { el.style.cursor = h.kind === "slide" ? "ew-resize" : "pointer"; return; }
      const q = geoAt(x, y);
      el.style.cursor = q ? CURSOR[q] : "default";
    });
    const end = () => { drag = null; el.style.cursor = "default"; };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  // teclado (fora das caixas): espaço liga/para o tempo, r põe t = 0, s e c mostram sin e cos, p período
  window.addEventListener("keydown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === " ") toggleRun();
    else if (e.key === "r") { S.running = false; S.t = 0; draw(); }
    else if (e.key === "s") { S.sin = !S.sin; draw(); }
    else if (e.key === "c") { S.cos = !S.cos; draw(); }
    else if (e.key === "p") { S.period = !S.period; draw(); }
    else return;
    e.preventDefault();
  });

  // valores iniciais opcionais no endereço, p. ex. #sin&cos&c=2&d=π/4&t=1
  const toks = decodeURIComponent(location.hash.slice(1)).split("&");
  if (toks.some(k => k === "sin" || k === "cos")) { S.sin = toks.includes("sin"); S.cos = toks.includes("cos"); }
  toks.forEach(tok => {
    const m = tok.match(/^([cdt])=(.+)$/);
    const x = m && parseX(m[2]);
    if (x !== null && x !== undefined) S[m[1]] = m[1] === "t" ? clamp(x, 0, S.win) : clamp(x, LIM[m[1]][0], LIM[m[1]][1]);
  });

  P = new p5(sketch);
  if (window.visualViewport) visualViewport.addEventListener("resize", () => P.windowResized());
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
