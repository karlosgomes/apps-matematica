<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python no navegador</title>
<link rel="icon" href="https://karlosgomes.github.io/weblog/Homem_Guitarra_CG.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<style>
  :root { --banner: #170C3A; --bg: #ffffff; --ink: #17202b; --muted: #5b6475; --panel: #f6f7fa; --line: #d5dae2;
          --accent: #EE6A24; --hover: #FB9E07; --err: #c62828; --ok: #2e7d32;
          --kw: #7b1fa2; --str: #2e7d32; --num: #1565c0; --com: #8a94a3; --def: #c75000; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1e1f24; --ink: #e3e6eb; --muted: #a3abb8; --panel: #26282f; --line: #3b3e48;
          --err: #ef7070; --ok: #7fcf85; --kw: #d39cf0; --str: #9ad48f; --num: #82b6f5; --com: #7d8592; --def: #ffb070; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { background: var(--banner); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; }
  header h1 { font-size: 1.15rem; margin: 0 10px 0 0; font-weight: 700; white-space: nowrap; }
  header h1 a { color: inherit; text-decoration: none; }
  .grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .espaco { flex: 1; }
  select, button { font: inherit; font-size: .92rem; border-radius: 6px; border: 1px solid rgba(255,255,255,.35);
                   background: rgba(255,255,255,.1); color: #fff; padding: 5px 10px; cursor: pointer; }
  select { max-width: 14em; }
  select option { color: #17202b; background: #fff; }
  button:hover, select:hover { background: rgba(255,255,255,.2); }
  button:disabled { opacity: .5; cursor: default; }
  #executar { background: var(--accent); border-color: var(--accent); font-weight: 700; padding: 5px 16px; }
  #executar:hover:not(:disabled) { background: var(--hover); border-color: var(--hover); }
  #parar { background: #c62828; border-color: #c62828; font-weight: 700; padding: 5px 16px; }
  #parar:hover { background: #e53935; border-color: #e53935; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  #editor-caixa { min-width: 0; min-height: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .CodeMirror { flex: 1; height: auto; font: 15px/1.5 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
                background: var(--bg); color: var(--ink); }
  .CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--line); }
  .CodeMirror-linenumber { color: var(--muted); }
  .CodeMirror-cursor { border-left-color: var(--ink); }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: rgba(238,106,36,.22); }
  .CodeMirror-matchingbracket { color: var(--accent) !important; font-weight: 600; }
  .cm-keyword { color: var(--kw); font-weight: 500; } .cm-builtin { color: var(--def); }
  .cm-string { color: var(--str); } .cm-number { color: var(--num); } .cm-comment { color: var(--com); font-style: italic; }
  .cm-def { color: var(--def); font-weight: 500; } .cm-operator { color: var(--ink); } .cm-variable-2 { color: var(--ink); }
  #saida-caixa { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  .barra { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--line);
           font-size: .88rem; color: var(--muted); }
  .barra button { color: var(--ink); border-color: var(--line); background: var(--bg); padding: 2px 10px; font-size: .85rem; }
  .barra button:hover { background: var(--panel); }
  #estado { flex: 1; }
  #estado.ok { color: var(--ok); } #estado.erro { color: var(--err); }
  #saida { flex: 1; overflow: auto; margin: 0; padding: 12px 14px; font: 15px/1.5 "IBM Plex Mono", ui-monospace, monospace;
           white-space: pre-wrap; word-break: break-word; }
  #saida .err { color: var(--err); }
  #saida .info { color: var(--muted); font-style: italic; }
  #saida .entrada { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--accent); border-radius: 4px;
                    padding: 0 6px; min-width: 8em; width: 40%; outline: none; }
  #saida img { display: block; max-width: 100%; margin: 8px 0; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
  #aviso { font-size: .8rem; color: var(--muted); padding: 6px 14px; border-top: 1px solid var(--line); }
  #msg { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--banner); color: #fff;
         padding: 8px 16px; border-radius: 8px; font-size: .92rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #msg.ver { opacity: 1; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 55%) 1fr; }
    #editor-caixa { border-right: 0; border-bottom: 1px solid var(--line); }
    header { padding: 8px 12px; }
    select { max-width: 10em; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="../">Python</a></h1>
  <div class="grupo">
    <select id="lista" aria-label="Programa"></select>
    <button id="novo" title="Novo programa">Novo</button>
    <button id="renomear" title="Mudar o nome do programa">Renomear</button>
    <button id="apagar" title="Apagar este programa">Apagar</button>
  </div>
  <div class="grupo">
    <button id="abrir" title="Abrir um ficheiro .py do computador">Abrir .py</button>
    <button id="descarregar" title="Guardar o programa num ficheiro .py">Descarregar</button>
    <button id="partilhar" title="Copiar um link com este programa">Copiar link</button>
  </div>
  <span class="espaco"></span>
  <button id="executar" disabled title="Executar (Ctrl+Enter)">A carregar…</button>
  <button id="parar" hidden title="Parar o programa (Esc)">■ Parar</button>
  <input type="file" id="ficheiro" accept=".py,.txt,text/x-python,text/plain" hidden>
</header>
<main>
  <div id="editor-caixa"><textarea id="codigo"></textarea></div>
  <div id="saida-caixa">
    <div class="barra"><span id="estado">A carregar o Python (só demora da primeira vez)…</span><button id="limpar">Limpar</button></div>
    <pre id="saida"></pre>
    <div id="aviso">Os programas ficam guardados automaticamente <b>neste navegador</b>. Para os levar para outro computador, use «Descarregar».</div>
  </div>
</main>
<div id="msg" role="status"></div>
<script type="text/plain" id="worker">
importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
let py, ctl = null, bytes = null, mplPronto = false;
// input(): espera (Atomics.wait) que a página escreva a resposta no SharedArrayBuffer
function pedirInput(msg) {
  if (!ctl) return false;
  Atomics.store(ctl, 0, 0);
  postMessage({ tipo: "input", msg });
  Atomics.wait(ctl, 0, 0);
  if (Atomics.load(ctl, 0) === 2) return null;
  return new TextDecoder().decode(bytes.slice(0, ctl[1]));
}
const PREPARAR = `
import builtins, _pagina
def _input(msg=""):
    r = _pagina.input(str(msg))
    if r is False:
        raise RuntimeError("input() não funciona neste navegador: recarregue a página.")
    if r is None:
        raise KeyboardInterrupt
    return r
builtins.input = _input
`;
const MPL = `
import matplotlib
matplotlib.use("agg")
import matplotlib.pyplot as plt
def _show(*a, **k):
    import io, base64, _pagina
    for n in plt.get_fignums():
        buf = io.BytesIO()
        plt.figure(n).savefig(buf, format="png", dpi=110, bbox_inches="tight")
        _pagina.figura(base64.b64encode(buf.getvalue()).decode())
    plt.close("all")
plt.show = _show
`;
onmessage = async e => {
  const m = e.data;
  if (m.tipo === "iniciar") {
    try {
      py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
      py.setStdout({ batched: t => postMessage({ tipo: "out", t: t + "\n" }) });
      py.setStderr({ batched: t => postMessage({ tipo: "err", t: t + "\n" }) });
      py.registerJsModule("_pagina", { input: pedirInput, figura: png => postMessage({ tipo: "fig", png }) });
      if (m.sab) { ctl = new Int32Array(m.sab, 0, 2); bytes = new Uint8Array(m.sab, 16); py.setInterruptBuffer(new Uint8Array(m.sab, 8, 1)); }
      await py.runPythonAsync(PREPARAR);
      postMessage({ tipo: "pronto" });
    } catch (err) { postMessage({ tipo: "falhou", t: String(err && (err.stack || err)) }); }
  }
  else if (m.tipo === "executar") {
    const codigo = m.codigo;
    try {
      // instala as bibliotecas usadas (numpy, matplotlib, sympy, …) só quando são precisas
      await py.loadPackagesFromImports(codigo, { messageCallback: msg => /^Loading /.test(msg) && postMessage({ tipo: "instalar" }), errorCallback: () => {} });
      if (!mplPronto && /\bmatplotlib\b/.test(codigo)) { await py.runPythonAsync(MPL); mplPronto = true; }
      postMessage({ tipo: "executar" });
      const globais = py.toPy({ __name__: "__main__" });
      try { await py.runPythonAsync(codigo, { globals: globais }); } finally { globais.destroy(); }
      if (mplPronto) await py.runPythonAsync("plt.show()");
      postMessage({ tipo: "fim" });
    } catch (err) {
      if (mplPronto) try { py.runPython("plt.close('all')"); } catch (e2) {}
      postMessage({ tipo: "erro", t: String(err.message || err) });
    }
  }
};
</script>
<script>
(() => {
  const CHAVE = "apps-mat-python";
  const EXEMPLO = `# Exemplo: soma dos n primeiros números naturais
n = 10
soma = 0
for k in range(1, n + 1):
    soma = soma + k
print("Soma de 1 a", n, "=", soma)

# Gráfico de uma função
import numpy as np
import matplotlib.pyplot as plt

x = np.linspace(-2 * np.pi, 2 * np.pi, 400)
plt.plot(x, np.sin(x), label="sin x")
plt.plot(x, np.cos(x), label="cos x")
plt.axhline(0, color="black", lw=0.8)
plt.axvline(0, color="black", lw=0.8)
plt.grid(alpha=0.3)
plt.legend()
plt.show()
`;
  const $ = id => document.getElementById(id);
  const saida = $("saida"), estado = $("estado"), lista = $("lista"), btnExec = $("executar");

  // ---------- programas guardados no localStorage ----------
  let dados = { atual: 0, programas: [] };
  try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d && d.programas && d.programas.length) dados = d; } catch (e) {}
  if (!dados.programas.length) dados.programas.push({ nome: "exemplo.py", codigo: EXEMPLO });
  const guardar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch (e) {} };
  const nomeLivre = base => {
    const nomes = new Set(dados.programas.map(p => p.nome));
    if (!nomes.has(base + ".py")) return base + ".py";
    for (let i = 2; ; i++) if (!nomes.has(`${base}-${i}.py`)) return `${base}-${i}.py`;
  };
  const comPy = nome => (nome = nome.trim().replace(/[\\/:*?"<>|]/g, "_")) && (/\.py$/i.test(nome) ? nome : nome + ".py");

  // programa enviado num link (#codigo=...): abre como programa novo
  const m = location.hash.match(/^#codigo=([^&]*)(?:&nome=(.*))?$/);
  if (m) {
    try {
      const codigo = new TextDecoder().decode(Uint8Array.from(atob(decodeURIComponent(m[1])), c => c.charCodeAt(0)));
      const nome = m[2] ? comPy(decodeURIComponent(m[2])) : "";
      const igual = dados.programas.findIndex(p => p.codigo === codigo);
      if (igual >= 0) dados.atual = igual;
      else { dados.programas.push({ nome: nomeLivre((nome || "recebido.py").replace(/\.py$/i, "")), codigo }); dados.atual = dados.programas.length - 1; }
      guardar();
    } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }
  dados.atual = Math.min(Math.max(0, dados.atual | 0), dados.programas.length - 1);

  const editor = CodeMirror.fromTextArea($("codigo"), {
    mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4, matchBrackets: true, autofocus: true,
    extraKeys: {
      Tab: cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    "),
      "Shift-Tab": cm => cm.indentSelection("subtract"),
      "Ctrl-Enter": () => executar(), "Cmd-Enter": () => executar(),
      "Ctrl-/": "toggleComment",
    },
  });
  let timer = null;
  editor.on("change", () => {
    dados.programas[dados.atual].codigo = editor.getValue();
    clearTimeout(timer); timer = setTimeout(guardar, 400);
  });

  function mostrarLista() {
    lista.innerHTML = "";
    dados.programas.forEach((p, i) => lista.add(new Option(p.nome, i, false, i === dados.atual)));
  }
  function abrirPrograma(i) {
    dados.atual = i; guardar(); mostrarLista();
    editor.setValue(dados.programas[i].codigo); editor.clearHistory(); editor.focus();
  }
  lista.onchange = () => abrirPrograma(+lista.value);
  abrirPrograma(dados.atual);

  function aviso(texto) {
    const el = $("msg"); el.textContent = texto; el.classList.add("ver");
    clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.remove("ver"), 2500);
  }

  $("novo").onclick = () => {
    const nome = prompt("Nome do novo programa:", nomeLivre("programa"));
    if (nome === null || !comPy(nome)) return;
    dados.programas.push({ nome: comPy(nome), codigo: "" }); abrirPrograma(dados.programas.length - 1);
  };
  $("renomear").onclick = () => {
    const p = dados.programas[dados.atual];
    const nome = prompt("Novo nome:", p.nome);
    if (nome === null || !comPy(nome)) return;
    p.nome = comPy(nome); guardar(); mostrarLista();
  };
  $("apagar").onclick = () => {
    const p = dados.programas[dados.atual];
    if (!confirm(`Apagar «${p.nome}»? Não é possível desfazer.`)) return;
    dados.programas.splice(dados.atual, 1);
    if (!dados.programas.length) dados.programas.push({ nome: "programa.py", codigo: "" });
    abrirPrograma(Math.min(dados.atual, dados.programas.length - 1));
  };
  $("abrir").onclick = () => $("ficheiro").click();
  $("ficheiro").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const codigo = await f.text();
    dados.programas.push({ nome: nomeLivre(comPy(f.name).replace(/\.py$/i, "")), codigo });
    abrirPrograma(dados.programas.length - 1); e.target.value = "";
  };
  $("descarregar").onclick = () => {
    const p = dados.programas[dados.atual];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([editor.getValue()], { type: "text/x-python" }));
    a.download = p.nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("partilhar").onclick = async () => {
    const p = dados.programas[dados.atual];
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(editor.getValue())));
    const url = `${location.origin}${location.pathname}#codigo=${encodeURIComponent(b64)}&nome=${encodeURIComponent(p.nome)}`;
    try { await navigator.clipboard.writeText(url); aviso("Link copiado: quem o abrir recebe uma cópia deste programa."); }
    catch (e) { prompt("Copie este link:", url); }
  };
  $("limpar").onclick = () => { saida.innerHTML = ""; };

  // ---------- saída ----------
  function escrever(texto, classe) {
    const ultimo = saida.lastChild;
    if (ultimo && ultimo.nodeName === "SPAN" && ultimo.className === (classe || "")) ultimo.textContent += texto;
    else { const s = document.createElement("span"); if (classe) s.className = classe; s.textContent = texto; saida.appendChild(s); }
    saida.scrollTop = saida.scrollHeight;
  }
  function mostrarFigura(png) {
    const img = document.createElement("img"); img.src = "data:image/png;base64," + png; img.alt = "Gráfico";
    saida.appendChild(img); img.onload = () => { saida.scrollTop = saida.scrollHeight; };
  }
  const setEstado = (t, c) => { estado.textContent = t; estado.className = c || ""; };

  // ---------- Python (Pyodide num worker, para se poder parar) ----------
  // Com isolamento (cabeçalhos COOP/COEP postos pelo sw.js) há SharedArrayBuffer: o «Parar» interrompe o
  // Python (KeyboardInterrupt) e o input() espera pela resposta. Sem isolamento, «Parar» recomeça o worker.
  const sab = self.crossOriginIsolated ? new SharedArrayBuffer(16 + 65536) : null;
  const ctl = sab && new Int32Array(sab, 0, 2);        // [0]: 0 à espera, 1 resposta, 2 cancelado; [1]: n.º de bytes
  const interromper = sab && new Uint8Array(sab, 8, 1);
  const bytes = sab && new Uint8Array(sab, 16);
  let worker = null, pronto = false, aCorrer = false, t0 = 0, timerParar = null, campo = null;
  const btnParar = $("parar");

  function criarWorker() {
    pronto = false; btnExec.disabled = true; btnExec.textContent = "A carregar…";
    if (sab) interromper[0] = 0;   // pedido de paragem que o worker anterior não chegou a ler
    worker = new Worker(URL.createObjectURL(new Blob([$("worker").textContent], { type: "text/javascript" })));
    worker.onmessage = e => receber(e.data);
    worker.onerror = e => { console.error("worker:", e.message); setEstado("Não foi possível carregar o Python. Verifique a ligação à Internet e recarregue a página.", "erro"); };
    worker.postMessage({ tipo: "iniciar", sab });
  }
  function receber(m) {
    if (m.tipo === "pronto") {
      pronto = true; btnExec.disabled = false; btnExec.textContent = "▶ Executar";
      if (!aCorrer) setEstado(/Interrompido/.test(estado.textContent) ? "Interrompido. Pronto para executar outra vez." : "Pronto. Ctrl+Enter para executar.");
    }
    else if (m.tipo === "falhou") { console.error("Pyodide:", m.t); setEstado("Não foi possível carregar o Python. Verifique a ligação à Internet e recarregue a página.", "erro"); }
    else if (m.tipo === "out") escrever(m.t);
    else if (m.tipo === "err") escrever(m.t, "err");
    else if (m.tipo === "fig") mostrarFigura(m.png);
    else if (m.tipo === "instalar") setEstado("A instalar bibliotecas… (só da primeira vez)");
    else if (m.tipo === "executar") setEstado("A executar…");
    else if (m.tipo === "input") pedir(m.msg);
    else if (m.tipo === "fim") acabar(`Terminado em ${((performance.now() - t0) / 1000).toLocaleString("pt-PT", { maximumFractionDigits: 2 })} s.`, "ok");
    else if (m.tipo === "erro") {
      if (/KeyboardInterrupt/.test(m.t)) { escrever("Programa interrompido.\n", "info"); acabar("Interrompido."); }
      else { escrever(limparErro(m.t), "err"); acabar("O programa tem um erro.", "erro"); }
    }
  }
  function executar() {
    if (!pronto || aCorrer) return;
    aCorrer = true; guardar();
    btnExec.hidden = true; btnParar.hidden = false;
    saida.innerHTML = ""; setEstado("A executar…");
    t0 = performance.now();
    if (sab) interromper[0] = 0;
    worker.postMessage({ tipo: "executar", codigo: editor.getValue() });
  }
  function acabar(texto, classe) {
    clearTimeout(timerParar); fecharCampo();
    aCorrer = false; btnExec.hidden = false; btnParar.hidden = true;
    setEstado(texto, classe); editor.focus();
  }
  function parar() {
    if (!aCorrer) return;
    setEstado("A parar…");
    if (sab) {
      if (campo) { fecharCampo(); Atomics.store(ctl, 0, 2); Atomics.notify(ctl, 0); }
      interromper[0] = 2;   // SIGINT: o Python lança KeyboardInterrupt
    }
    // se o Python não responder (p. ex. preso numa função do numpy), deita-se fora e recomeça-se
    timerParar = setTimeout(() => {
      worker.terminate();
      escrever("Programa interrompido.\n", "info");
      acabar("Interrompido. A recarregar o Python…");
      criarWorker();
    }, sab ? 1500 : 0);
  }

  // input(): campo de texto na própria saída
  function pedir(msg) {
    const linha = document.createElement("span"); linha.className = "pedido"; linha.textContent = msg;
    const inp = document.createElement("input"); inp.className = "entrada"; inp.setAttribute("aria-label", msg || "Valor");
    linha.appendChild(inp); saida.appendChild(linha); campo = linha;
    setEstado("À espera de um valor (Enter para confirmar)…");
    inp.focus(); saida.scrollTop = saida.scrollHeight;
    inp.onkeydown = e => {
      if (e.key !== "Enter") return;
      const b = new TextEncoder().encode(inp.value).slice(0, bytes.length);
      bytes.set(b); ctl[1] = b.length;
      linha.textContent = msg + inp.value + "\n"; linha.className = ""; campo = null;
      setEstado("A executar…");
      Atomics.store(ctl, 0, 1); Atomics.notify(ctl, 0);
    };
  }
  function fecharCampo() { if (campo) { campo.textContent = campo.firstChild.textContent + "\n"; campo.className = ""; campo = null; } }

  // mostra só a parte do erro que diz respeito ao programa do aluno
  function limparErro(msg) {
    const linhas = msg.split("\n"), i = linhas.findIndex(l => l.includes('File "<exec>"'));
    const util = i >= 0 ? ["Traceback (most recent call last):", ...linhas.slice(i).filter(l => !/, in _input$/.test(l))] : linhas;
    return util.join("\n").replace(/File "<exec>", line (\d+)/g, "Linha $1").replace(/\n+$/, "") + "\n";
  }
  btnExec.onclick = executar;
  btnParar.onclick = parar;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && aCorrer) { e.preventDefault(); parar(); } });

  // o sw.js põe os cabeçalhos COOP/COEP (o GitHub Pages não deixa); da primeira vez é preciso recarregar
  (async () => {
    if (!self.crossOriginIsolated && "serviceWorker" in navigator && location.protocol !== "file:") {
      try {
        await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        if (!sessionStorage.getItem(CHAVE + "-recarregado")) { sessionStorage.setItem(CHAVE + "-recarregado", "1"); location.reload(); return; }
      } catch (e) {}
    }
    criarWorker();
  })();
})();
</script>
