<script>
  // modo escuro: mesma chave do weblog no localStorage ("alternate" = escuro, "default" = claro); sem escolha, segue o sistema
  try {
    const t = localStorage.getItem("quarto-color-scheme");
    if (t) document.documentElement.dataset.theme = t === "alternate" ? "dark" : "light";
  } catch (e) {}
</script>
<style>
  :root { --banner: #170C3A; --bg: #ffffff; --ink: #17202b; --muted: #5b6475; --panel: #f6f7fa; --line: #d5dae2;
          --accent: #EE6A24; --hover: #FB9E07; --err: #c62828; --ok: #2e7d32;
          --kw: #7b1fa2; --str: #2e7d32; --num: #1565c0; --com: #8a94a3; --def: #c75000; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1e1f24; --ink: #e3e6eb; --muted: #a3abb8; --panel: #26282f; --line: #3b3e48;
          --err: #ef7070; --ok: #7fcf85; --kw: #d39cf0; --str: #9ad48f; --num: #82b6f5; --com: #7d8592; --def: #ffb070; }
  }
  :root[data-theme="dark"] { --bg: #1e1f24; --ink: #e3e6eb; --muted: #a3abb8; --panel: #26282f; --line: #3b3e48;
          --err: #ef7070; --ok: #7fcf85; --kw: #d39cf0; --str: #9ad48f; --num: #82b6f5; --com: #7d8592; --def: #ffb070; }
  #tema { font-size: 1.05rem; line-height: 1; padding: 5px 9px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { background: var(--banner); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; }
  header h1 { font-size: 1.15rem; margin: 0 10px 0 0; font-weight: 700; white-space: nowrap; }
  header h1 a { color: inherit; text-decoration: none; }
  .grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .espaco { flex: 1; }
  select, button { font: inherit; font-size: .92rem; border-radius: 6px; border: 1px solid rgba(255,255,255,.35);
                   background: rgba(255,255,255,.1); color: #fff; padding: 5px 10px; cursor: pointer; }
  select { max-width: 14em; }
  select option { color: #17202b; background: #fff; }
  button:hover, select:hover { background: rgba(255,255,255,.2); }
  button:disabled { opacity: .5; cursor: default; }
  #executar { background: var(--accent); border-color: var(--accent); font-weight: 700; padding: 5px 16px; }
  #executar:hover:not(:disabled) { background: var(--hover); border-color: var(--hover); }
  #parar { background: #c62828; border-color: #c62828; font-weight: 700; padding: 5px 16px; }
  #parar:hover { background: #e53935; border-color: #e53935; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  #editor-caixa { min-width: 0; min-height: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .CodeMirror { flex: 1; height: auto; font: 15px/1.5 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
                background: var(--bg); color: var(--ink); }
  .CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--line); }
  .CodeMirror-linenumber { color: var(--muted); }
  .CodeMirror-cursor { border-left-color: var(--ink); }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: rgba(238,106,36,.22); }
  .CodeMirror-matchingbracket { color: var(--accent) !important; font-weight: 600; }
  /* .cm-s-default: para se sobrepor às cores do tema do CodeMirror */
  .cm-s-default .cm-keyword { color: var(--kw); font-weight: 500; } .cm-s-default .cm-builtin { color: var(--def); }
  .cm-s-default .cm-string { color: var(--str); } .cm-s-default .cm-number { color: var(--num); }
  .cm-s-default .cm-comment { color: var(--com); font-style: italic; } .cm-s-default .cm-def { color: var(--def); font-weight: 500; }
  .cm-s-default .cm-operator, .cm-s-default .cm-variable, .cm-s-default .cm-variable-2, .cm-s-default .cm-property { color: var(--ink); }
  #saida-caixa { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  .barra { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--line);
           font-size: .88rem; color: var(--muted); }
  .barra button { color: var(--ink); border-color: var(--line); background: var(--bg); padding: 2px 10px; font-size: .85rem; }
  .barra button:hover { background: var(--panel); }
  #estado { flex: 1; }
  #estado.ok { color: var(--ok); } #estado.erro { color: var(--err); }
  #saida { flex: 1; overflow: auto; margin: 0; padding: 12px 14px; font: 15px/1.5 "IBM Plex Mono", ui-monospace, monospace;
           white-space: pre-wrap; word-break: break-word; }
  #saida .err { color: var(--err); }
  #saida .info { color: var(--muted); font-style: italic; }
  #saida .ajuda { display: block; margin: 10px 0 4px; padding: 8px 12px; border-left: 4px solid var(--accent); border-radius: 0 6px 6px 0;
                  background: var(--bg); font: 15px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; white-space: normal; }
  #saida .ajuda b { display: block; margin-bottom: 2px; }
  #saida .ajuda code { font: .93em "IBM Plex Mono", ui-monospace, monospace; background: var(--panel); padding: 0 4px; border-radius: 3px; }
  #saida .ajuda button { font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; }
  .linha-erro { background: rgba(198,40,40,.16); }
  #saida .entrada { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--accent); border-radius: 4px;
                    padding: 0 6px; min-width: 8em; width: 40%; outline: none; }
  #saida img { display: block; max-width: 100%; margin: 8px 0; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
  #aviso { font-size: .8rem; color: var(--muted); padding: 6px 14px; border-top: 1px solid var(--line); }
  #msg { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--banner); color: #fff;
         padding: 8px 16px; border-radius: 8px; font-size: .92rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #msg.ver { opacity: 1; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 55%) 1fr; }
    #editor-caixa { border-right: 0; border-bottom: 1px solid var(--line); }
    header { padding: 8px 12px; }
    select { max-width: 10em; }
  }
</style>

<body>
<header>
  <h1><a href="../">Python</a></h1>
  <div class="grupo">
    <select id="lista" aria-label="Programa"></select>
    <button id="novo" title="Novo programa">Novo</button>
    <button id="renomear" title="Mudar o nome do programa">Renomear</button>
    <button id="apagar" title="Apagar este programa">Apagar</button>
  </div>
  <div class="grupo">
    <button id="abrir" title="Abrir um ficheiro .py do computador">Abrir .py</button>
    <button id="descarregar" title="Guardar o programa num ficheiro .py">Descarregar</button>
    <button id="partilhar" title="Copiar um link com este programa">Copiar link</button>
  </div>
  <span class="espaco"></span>
  <button id="tema" aria-label="Alternar modo claro/escuro"></button>
  <button id="executar" disabled title="Executar (Ctrl+Enter)">A carregar…</button>
  <button id="parar" hidden title="Parar o programa (Esc)">■ Parar</button>
  <input type="file" id="ficheiro" accept=".py,.txt,text/x-python,text/plain" hidden>
</header>
<main>
  <div id="editor-caixa"><textarea id="codigo"></textarea></div>
  <div id="saida-caixa">
    <div class="barra"><span id="estado">A carregar o Python (só demora da primeira vez)…</span><button id="limpar">Limpar</button></div>
    <pre id="saida"></pre>
    <div id="aviso">Os programas ficam guardados automaticamente <b>neste navegador</b>. Para os levar para outro computador, use «Descarregar».</div>
  </div>
</main>
<div id="msg" role="status"></div>
<script type="text/plain" id="worker">
importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
let py, ctl = null, bytes = null, mplPronto = false;
// input(): espera (Atomics.wait) que a página escreva a resposta no SharedArrayBuffer
function pedirInput(msg) {
  if (!ctl) return false;
  Atomics.store(ctl, 0, 0);
  postMessage({ tipo: "input", msg });
  Atomics.wait(ctl, 0, 0);
  if (Atomics.load(ctl, 0) === 2) return null;
  return new TextDecoder().decode(bytes.slice(0, ctl[1]));
}
const PREPARAR = `
import builtins, _pagina
def _input(msg=""):
    r = _pagina.input(str(msg))
    if r is False:
        raise RuntimeError("input() não funciona neste navegador: recarregue a página.")
    if r is None:
        raise KeyboardInterrupt
    return r
builtins.input = _input
`;
const MPL = `
import matplotlib
matplotlib.use("agg")
import matplotlib.pyplot as plt
def _show(*a, **k):
    import io, base64, _pagina
    for n in plt.get_fignums():
        buf = io.BytesIO()
        plt.figure(n).savefig(buf, format="png", dpi=110, bbox_inches="tight")
        _pagina.figura(base64.b64encode(buf.getvalue()).decode())
    plt.close("all")
plt.show = _show
`;
onmessage = async e => {
  const m = e.data;
  if (m.tipo === "iniciar") {
    try {
      py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
      py.setStdout({ batched: t => postMessage({ tipo: "out", t: t + "\n" }) });
      py.setStderr({ batched: t => postMessage({ tipo: "err", t: t + "\n" }) });
      py.registerJsModule("_pagina", { input: pedirInput, figura: png => postMessage({ tipo: "fig", png }) });
      if (m.sab) { ctl = new Int32Array(m.sab, 0, 2); bytes = new Uint8Array(m.sab, 16); py.setInterruptBuffer(new Uint8Array(m.sab, 8, 1)); }
      await py.runPythonAsync(PREPARAR);
      postMessage({ tipo: "pronto" });
    } catch (err) { postMessage({ tipo: "falhou", t: String(err && (err.stack || err)) }); }
  }
  else if (m.tipo === "executar") {
    const codigo = m.codigo;
    try {
      // instala as bibliotecas usadas (numpy, matplotlib, sympy, …) só quando são precisas
      await py.loadPackagesFromImports(codigo, { messageCallback: msg => /^Loading /.test(msg) && postMessage({ tipo: "instalar" }), errorCallback: () => {} });
      if (!mplPronto && /\bmatplotlib\b/.test(codigo)) { await py.runPythonAsync(MPL); mplPronto = true; }
      postMessage({ tipo: "executar" });
      const globais = py.toPy({ __name__: "__main__" });
      try { await py.runPythonAsync(codigo, { globals: globais }); } finally { globais.destroy(); }
      if (mplPronto) await py.runPythonAsync("plt.show()");
      postMessage({ tipo: "fim" });
    } catch (err) {
      if (mplPronto) try { py.runPython("plt.close('all')"); } catch (e2) {}
      postMessage({ tipo: "erro", t: String(err.message || err) });
    }
  }
};
</script>
<script>
(() => {
  const CHAVE = "apps-mat-python";
  const EXEMPLO = `# Exemplo: soma dos n primeiros números naturais
n = 10
soma = 0
for k in range(1, n + 1):
    soma = soma + k
print("Soma de 1 a", n, "=", soma)

# Gráfico de uma função
import numpy as np
import matplotlib.pyplot as plt

x = np.linspace(-2 * np.pi, 2 * np.pi, 400)
plt.plot(x, np.sin(x), label="sin x")
plt.plot(x, np.cos(x), label="cos x")
plt.axhline(0, color="black", lw=0.8)
plt.axvline(0, color="black", lw=0.8)
plt.grid(alpha=0.3)
plt.legend()
plt.show()
`;
  const $ = id => document.getElementById(id);

  // ---------- modo claro/escuro ----------
  const raiz = document.documentElement, btnTema = $("tema");
  const escuro = () => raiz.dataset.theme ? raiz.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const mostrarTema = () => { btnTema.textContent = escuro() ? "☀" : "☾"; btnTema.title = escuro() ? "Modo claro" : "Modo escuro"; };
  btnTema.onclick = () => {
    const novo = escuro() ? "light" : "dark";
    raiz.dataset.theme = novo;
    try { localStorage.setItem("quarto-color-scheme", novo === "dark" ? "alternate" : "default"); } catch (e) {}
    mostrarTema();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", mostrarTema);
  mostrarTema();
  const saida = $("saida"), estado = $("estado"), lista = $("lista"), btnExec = $("executar");

  // ---------- programas guardados no localStorage ----------
  // o exemplo é fixo (atual = −1): está sempre no topo da lista e não se pode alterar nem apagar
  let dados = { atual: -1, programas: [] };
  try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d && Array.isArray(d.programas)) dados = d; } catch (e) {}
  // versões antigas guardavam o exemplo como um programa normal: se não foi alterado, deixa de ser preciso
  const velho = dados.programas.findIndex(p => p.nome === "exemplo.py" && p.codigo === EXEMPLO);
  if (velho >= 0) { dados.programas.splice(velho, 1); if (dados.atual >= velho) dados.atual--; }
  const exemplo = () => dados.atual < 0;
  const nomeAtual = () => exemplo() ? "exemplo.py" : dados.programas[dados.atual].nome;
  const guardar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch (e) {} };
  const nomeLivre = base => {
    const nomes = new Set(dados.programas.map(p => p.nome));
    if (!nomes.has(base + ".py")) return base + ".py";
    for (let i = 2; ; i++) if (!nomes.has(`${base}-${i}.py`)) return `${base}-${i}.py`;
  };
  const comPy = nome => (nome = nome.trim().replace(/[\\/:*?"<>|]/g, "_")) && (/\.py$/i.test(nome) ? nome : nome + ".py");

  // programa enviado num link (#codigo=...): abre como programa novo
  const m = location.hash.match(/^#codigo=([^&]*)(?:&nome=(.*))?$/);
  if (m) {
    try {
      const codigo = new TextDecoder().decode(Uint8Array.from(atob(decodeURIComponent(m[1])), c => c.charCodeAt(0)));
      const nome = m[2] ? comPy(decodeURIComponent(m[2])) : "";
      const igual = dados.programas.findIndex(p => p.codigo === codigo);
      if (igual >= 0) dados.atual = igual;
      else { dados.programas.push({ nome: nomeLivre((nome || "recebido.py").replace(/\.py$/i, "")), codigo }); dados.atual = dados.programas.length - 1; }
      guardar();
    } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }
  dados.atual = Math.min(Math.max(-1, dados.atual | 0), dados.programas.length - 1);

  const editor = CodeMirror.fromTextArea($("codigo"), {
    mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4, matchBrackets: true, autofocus: true,
    extraKeys: {
      Tab: cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    "),
      "Shift-Tab": cm => cm.indentSelection("subtract"),
      "Ctrl-Enter": () => executar(), "Cmd-Enter": () => executar(),
      "Ctrl-/": "toggleComment",
    },
  });
  let timer = null;
  editor.on("beforeChange", (cm, ch) => {
    if (exemplo() && ch.origin !== "setValue") { ch.cancel(); aviso("O exemplo não se pode alterar. Carregue em «Novo» para escrever um programa seu."); }
  });
  editor.on("change", () => {
    if (exemplo()) return;
    dados.programas[dados.atual].codigo = editor.getValue();
    clearTimeout(timer); timer = setTimeout(guardar, 400);
  });

  function mostrarLista() {
    lista.innerHTML = "";
    lista.add(new Option("exemplo.py (só leitura)", -1, false, exemplo()));
    dados.programas.forEach((p, i) => lista.add(new Option(p.nome, i, false, i === dados.atual)));
  }
  function abrirPrograma(i) {
    dados.atual = i; guardar(); mostrarLista();
    editor.setValue(exemplo() ? EXEMPLO : dados.programas[i].codigo); editor.clearHistory(); editor.focus();
    $("renomear").disabled = $("apagar").disabled = exemplo();
  }
  lista.onchange = () => abrirPrograma(+lista.value);
  abrirPrograma(dados.atual);

  function aviso(texto) {
    const el = $("msg"); el.textContent = texto; el.classList.add("ver");
    clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.remove("ver"), 3500);
  }

  $("novo").onclick = () => {
    const nome = prompt("Nome do novo programa:", nomeLivre("programa"));
    if (nome === null || !comPy(nome)) return;
    dados.programas.push({ nome: comPy(nome), codigo: "" }); abrirPrograma(dados.programas.length - 1);
  };
  $("renomear").onclick = () => {
    const p = dados.programas[dados.atual];
    const nome = prompt("Novo nome:", p.nome);
    if (nome === null || !comPy(nome)) return;
    p.nome = comPy(nome); guardar(); mostrarLista();
  };
  $("apagar").onclick = () => {
    const p = dados.programas[dados.atual];
    if (!confirm(`Apagar «${p.nome}»? Não é possível desfazer.`)) return;
    dados.programas.splice(dados.atual, 1);
    abrirPrograma(Math.min(dados.atual, dados.programas.length - 1));   // sem programas, volta ao exemplo
  };
  $("abrir").onclick = () => $("ficheiro").click();
  $("ficheiro").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const codigo = await f.text();
    dados.programas.push({ nome: nomeLivre(comPy(f.name).replace(/\.py$/i, "")), codigo });
    abrirPrograma(dados.programas.length - 1); e.target.value = "";
  };
  $("descarregar").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([editor.getValue()], { type: "text/x-python" }));
    a.download = nomeAtual(); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("partilhar").onclick = async () => {
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(editor.getValue())));
    const url = `${location.origin}${location.pathname}#codigo=${encodeURIComponent(b64)}&nome=${encodeURIComponent(nomeAtual())}`;
    try { await navigator.clipboard.writeText(url); aviso("Link copiado: quem o abrir recebe uma cópia deste programa."); }
    catch (e) { prompt("Copie este link:", url); }
  };
  $("limpar").onclick = () => { saida.innerHTML = ""; };

  // ---------- saída ----------
  function escrever(texto, classe) {
    const ultimo = saida.lastChild;
    if (ultimo && ultimo.nodeName === "SPAN" && ultimo.className === (classe || "")) ultimo.textContent += texto;
    else { const s = document.createElement("span"); if (classe) s.className = classe; s.textContent = texto; saida.appendChild(s); }
    saida.scrollTop = saida.scrollHeight;
  }
  function mostrarFigura(png) {
    const img = document.createElement("img"); img.src = "data:image/png;base64," + png; img.alt = "Gráfico";
    saida.appendChild(img); img.onload = () => { saida.scrollTop = saida.scrollHeight; };
  }
  const setEstado = (t, c) => { estado.textContent = t; estado.className = c || ""; };

  // ---------- Python (Pyodide num worker, para se poder parar) ----------
  // Com isolamento (cabeçalhos COOP/COEP postos pelo sw.js) há SharedArrayBuffer: o «Parar» interrompe o
  // Python (KeyboardInterrupt) e o input() espera pela resposta. Sem isolamento, «Parar» recomeça o worker.
  const sab = self.crossOriginIsolated ? new SharedArrayBuffer(16 + 65536) : null;
  const ctl = sab && new Int32Array(sab, 0, 2);        // [0]: 0 à espera, 1 resposta, 2 cancelado; [1]: n.º de bytes
  const interromper = sab && new Uint8Array(sab, 8, 1);
  const bytes = sab && new Uint8Array(sab, 16);
  let worker = null, pronto = false, aCorrer = false, t0 = 0, timerParar = null, campo = null;
  const btnParar = $("parar");

  function criarWorker() {
    pronto = false; btnExec.disabled = true; btnExec.textContent = "A carregar…";
    if (sab) interromper[0] = 0;   // pedido de paragem que o worker anterior não chegou a ler
    worker = new Worker(URL.createObjectURL(new Blob([$("worker").textContent], { type: "text/javascript" })));
    worker.onmessage = e => receber(e.data);
    worker.onerror = e => { console.error("worker:", e.message); setEstado("Não foi possível carregar o Python. Verifique a ligação à Internet e recarregue a página.", "erro"); };
    worker.postMessage({ tipo: "iniciar", sab });
  }
  function receber(m) {
    if (m.tipo === "pronto") {
      pronto = true; btnExec.disabled = false; btnExec.textContent = "▶ Executar";
      if (!aCorrer) setEstado(/Interrompido/.test(estado.textContent) ? "Interrompido. Pronto para executar outra vez." : "Pronto. Ctrl+Enter para executar.");
    }
    else if (m.tipo === "falhou") { console.error("Pyodide:", m.t); setEstado("Não foi possível carregar o Python. Verifique a ligação à Internet e recarregue a página.", "erro"); }
    else if (m.tipo === "out") escrever(m.t);
    else if (m.tipo === "err") escrever(m.t, "err");
    else if (m.tipo === "fig") mostrarFigura(m.png);
    else if (m.tipo === "instalar") setEstado("A instalar bibliotecas… (só da primeira vez)");
    else if (m.tipo === "executar") setEstado("A executar…");
    else if (m.tipo === "input") pedir(m.msg);
    else if (m.tipo === "fim") acabar(`Terminado em ${((performance.now() - t0) / 1000).toLocaleString("pt-PT", { maximumFractionDigits: 2 })} s.`, "ok");
    else if (m.tipo === "erro") {
      if (/KeyboardInterrupt/.test(m.t)) { escrever("Programa interrompido.\n", "info"); acabar("Interrompido."); }
      else { escrever(limparErro(m.t), "err"); explicarErro(m.t); acabar("O programa tem um erro.", "erro"); }
    }
  }
  function executar() {
    if (!pronto || aCorrer) return;
    aCorrer = true; guardar();
    btnExec.hidden = true; btnParar.hidden = false;
    saida.innerHTML = ""; setEstado("A executar…"); tirarMarca();
    t0 = performance.now();
    if (sab) interromper[0] = 0;
    worker.postMessage({ tipo: "executar", codigo: editor.getValue() });
  }
  function acabar(texto, classe) {
    clearTimeout(timerParar); fecharCampo();
    aCorrer = false; btnExec.hidden = false; btnParar.hidden = true;
    setEstado(texto, classe); editor.focus();
  }
  function parar() {
    if (!aCorrer) return;
    setEstado("A parar…");
    if (sab) {
      if (campo) { fecharCampo(); Atomics.store(ctl, 0, 2); Atomics.notify(ctl, 0); }
      interromper[0] = 2;   // SIGINT: o Python lança KeyboardInterrupt
    }
    // se o Python não responder (p. ex. preso numa função do numpy), deita-se fora e recomeça-se
    timerParar = setTimeout(() => {
      worker.terminate();
      escrever("Programa interrompido.\n", "info");
      acabar("Interrompido. A recarregar o Python…");
      criarWorker();
    }, sab ? 1500 : 0);
  }

  // input(): campo de texto na própria saída
  function pedir(msg) {
    const linha = document.createElement("span"); linha.className = "pedido"; linha.textContent = msg;
    const inp = document.createElement("input"); inp.className = "entrada"; inp.setAttribute("aria-label", msg || "Valor");
    linha.appendChild(inp); saida.appendChild(linha); campo = linha;
    setEstado("À espera de um valor (Enter para confirmar)…");
    inp.focus(); saida.scrollTop = saida.scrollHeight;
    inp.onkeydown = e => {
      if (e.key !== "Enter") return;
      const b = new TextEncoder().encode(inp.value).slice(0, bytes.length);
      bytes.set(b); ctl[1] = b.length;
      linha.textContent = msg + inp.value + "\n"; linha.className = ""; campo = null;
      setEstado("A executar…");
      Atomics.store(ctl, 0, 1); Atomics.notify(ctl, 0);
    };
  }
  function fecharCampo() { if (campo) { campo.textContent = campo.firstChild.textContent + "\n"; campo.className = ""; campo = null; } }

  // mostra só a parte do erro que diz respeito ao programa do aluno
  function limparErro(msg) {
    const linhas = msg.split("\n"), i = linhas.findIndex(l => l.includes('File "<exec>"'));
    const util = i >= 0 ? ["Traceback (most recent call last):", ...linhas.slice(i).filter(l => !/, in _input$/.test(l))] : linhas;
    return util.join("\n").replace(/File "<exec>", line (\d+)/g, "Linha $1").replace(/\n+$/, "") + "\n";
  }

  // ---------- explicação do erro em português ----------
  // [tipo, padrão da mensagem, título, explicação]: a primeira regra que serve é a usada; $1, $2… são os grupos do padrão
  const C = t => `<code>${t}</code>`;
  const MATH = ["sqrt", "pi", "sin", "cos", "tan", "asin", "acos", "atan", "log", "log10", "exp", "floor", "ceil", "factorial", "radians", "degrees"];
  const REGRAS = [
    ["SyntaxError", /'([([{])' was never closed/, "Falta fechar um parêntese", `Abriu ${C("$1")} e não o fechou. Conte os parênteses: cada ${C("(")} precisa de um ${C(")")}. Às vezes o erro está numa linha anterior.`],
    ["SyntaxError", /unmatched '(.)'/, "Parêntese a mais", `Há um ${C("$1")} que fecha um parêntese que não foi aberto.`],
    ["SyntaxError", /closing parenthesis '(.)' does not match opening parenthesis '(.)'/, "Parênteses trocados", `Abriu com ${C("$2")} mas fechou com ${C("$1")}.`],
    ["SyntaxError", /expected ':'/, "Falta o sinal :", `As linhas que começam por ${C("if")}, ${C("elif")}, ${C("else")}, ${C("for")}, ${C("while")} e ${C("def")} terminam com dois pontos, por exemplo ${C("for k in range(10):")}.`],
    ["SyntaxError", /unterminated (triple-quoted )?string/, "Faltam as aspas a fechar o texto", `Um texto começa e acaba com aspas iguais: ${C('"olá"')} ou ${C("'olá'")}.`],
    ["SyntaxError", /Maybe you meant '==' or ':=' instead of '='/, "Para comparar usa-se ==", `${C("=")} guarda um valor numa variável; para comparar dois valores (por exemplo num ${C("if")}) escreve-se ${C("==")}: ${C("if x == 0:")}.`],
    ["SyntaxError", /Perhaps you forgot a comma/, "Falta uma vírgula (ou um operador)", `Entre os valores de um ${C("print(…)")} ou de uma lista põe-se uma vírgula. Se for uma conta, falta talvez um ${C("*")}, ${C("+")} ou ${C("-")}.`],
    ["SyntaxError", /invalid decimal literal/, "Número seguido de letras", `Para multiplicar escreve-se sempre ${C("*")}: ${C("2*x")} e não ${C("2x")}. Os nomes das variáveis também não podem começar por um algarismo.`],
    ["SyntaxError", /invalid character '(.)'/, "Carácter que o Python não conhece", `O carácter ${C("$1")} não pode ser usado aqui. Use ${C("*")} para multiplicar, ${C("/")} para dividir, ${C("**")} para potências (${C("x**2")}) e aspas direitas ${C('"')}.`],
    ["SyntaxError", /invalid non-printable character/, "Carácter invisível", "Há um carácter invisível na linha (muitas vezes vem de um texto copiado). Apague a linha e escreva-a de novo."],
    ["SyntaxError", /cannot assign to (expression|literal|function call)/, "Do lado esquerdo do = tem de estar uma variável", `Escreve-se ${C("y = 2*x + 1")} (a variável à esquerda, a conta à direita) e não ${C("2*x + 1 = y")}. Para comparar use ${C("==")}.`],
    ["SyntaxError", /Missing parentheses in call to 'print'/, "Faltam os parênteses do print", `Escreve-se ${C('print("olá")')}, com parênteses.`],
    ["SyntaxError", /'return' outside function/, "return fora de uma função", `${C("return")} só se usa dentro de uma função (${C("def …:")}). Verifique o recuo da linha.`],
    ["SyntaxError", /'(break|continue)' (not properly in|outside) loop/, "$1 fora de um ciclo", `${C("$1")} só se usa dentro de um ${C("for")} ou ${C("while")}. Verifique o recuo da linha.`],
    ["SyntaxError", /incomplete input|unexpected EOF/, "O programa acaba a meio", "Falta fechar alguma coisa (parêntese, aspas) ou falta o bloco de um if/for/def no fim do programa."],
    ["SyntaxError", /expected 'else' after 'if' expression/, "Falta o else", "Numa expressão do tipo «a if condição else b» é obrigatório o else."],
    ["SyntaxError", /.*/, "Erro de escrita (sintaxe)", "O Python não percebe esta linha. Procure parênteses ou aspas por fechar, um : em falta ou um * em falta numa multiplicação. Às vezes o erro está na linha anterior."],
    ["IndentationError", /expected an indented block after '(\w+)'/, "Falta recuar as linhas do bloco", `As linhas que estão dentro do ${C("$1")} têm de começar mais à direita (4 espaços, ou a tecla Tab) do que a linha do ${C("$1")}.`],
    ["IndentationError", /expected an indented block/, "Falta recuar as linhas do bloco", "Depois de uma linha que acaba em : as linhas seguintes têm de começar mais à direita (4 espaços ou Tab)."],
    ["IndentationError", /unexpected indent/, "Linha recuada sem razão", "Esta linha começa mais à direita do que a anterior, mas não está dentro de nenhum if/for/while/def. Tire os espaços do início."],
    ["IndentationError", /unindent does not match/, "Recuo desalinhado", "Esta linha não está alinhada com nenhuma das linhas de cima. As linhas do mesmo bloco têm de começar exatamente na mesma coluna."],
    ["TabError", /.*/, "Tabs misturados com espaços", "O recuo mistura Tabs e espaços. Apague os espaços do início das linhas e recue-as de novo."],
    ["NameError", /name '(true|false|none)' is not defined/i, "Maiúscula em falta", `Em Python escreve-se ${C("True")}, ${C("False")} e ${C("None")}, com maiúscula.`],
    ["NameError", new RegExp(`name '(${MATH.join("|")})' is not defined`), "Falta importar o módulo math", `${C("$1")} está no módulo ${C("math")}. Escreva no início do programa ${C("from math import *")} (ou ${C("import math")} e depois ${C("math.$1")}).`],
    ["NameError", /name '(np|plt)' is not defined/, "Falta importar a biblioteca", `Escreva no início do programa ${C("import numpy as np")} ou ${C("import matplotlib.pyplot as plt")}.`],
    ["NameError", /name '(\w+)' is not defined\. Did you mean: '(\w+)'/, "Nome desconhecido: $1", `O Python não conhece ${C("$1")}. Queria escrever ${C("$2")}? Repare nas maiúsculas e minúsculas.`],
    ["NameError", /name '(\w+)' is not defined/, "Nome desconhecido: $1", `O Python não conhece ${C("$1")}. Verifique se está bem escrito, se a variável recebeu um valor <i>antes</i> desta linha, ou, se é um texto, se faltam as aspas: ${C('"$1"')}.`],
    ["UnboundLocalError", /'(\w+)'/, "Variável usada antes de ter valor", `Dentro da função usa-se ${C("$1")} antes de lhe dar um valor. Passe o valor como argumento da função (ou dê-lhe um valor dentro dela).`],
    ["TypeError", /can only concatenate str \(not "(\w+)"\) to str/, "Texto + número", `Não se pode juntar texto e números com ${C("+")}. No ${C("print")} separe-os por vírgulas: ${C('print("x =", x)')}, ou converta o número com ${C("str(x)")}.`],
    ["TypeError", /unsupported operand type\(s\) for .*'str'|'[<>]=?' not supported between instances of 'str'|can't multiply sequence by non-int/, "Conta com texto", `Um dos valores é texto (${C("str")}). Atenção: ${C("input()")} devolve sempre texto; para obter um número use ${C('int(input("…"))')} ou ${C('float(input("…"))')}.`],
    ["TypeError", /'(int|float)' object is not callable/, "Falta um * antes do parêntese", `Para multiplicar por um parêntese escreve-se ${C("2*(x + 1)")} e não ${C("2(x + 1)")}. (Pode também ter dado a uma variável o nome de uma função.)`],
    ["TypeError", /'(\w+)' object is not callable/, "Isto não é uma função", `Usou parênteses depois de algo que não é uma função. Talvez uma variável tenha o mesmo nome de uma função (por exemplo ${C("sum = 0")} e depois ${C("sum(…)")}).`],
    ["TypeError", /'(int|float)' object is not (subscriptable|iterable)/, "Um número não é uma lista", `Usou um número como se fosse uma lista. Para percorrer os números de 0 a n − 1 use ${C("for k in range(n):")}.`],
    ["TypeError", /(\w+)\(\) missing (\d+) required positional argument/, "Faltam argumentos", `A função ${C("$1")} precisa de mais $2 valor(es) entre os parênteses.`],
    ["TypeError", /(\w+)\(\) takes (\d+) positional arguments? but (\d+) (was|were) given/, "Argumentos a mais", `A função ${C("$1")} recebe $2 valor(es), mas foram dados $3.`],
    ["TypeError", /must be real number, not str/, "Conta com texto", `Esperava-se um número mas veio texto. Se o valor veio de ${C("input()")}, converta-o com ${C("float(…)")}.`],
    ["ValueError", /could not convert string to float: '(-?\d+),(\d+)'/, "Use ponto decimal", `Em Python escreve-se ${C("$1.$2")}, com ponto, e não com vírgula.`],
    ["ValueError", /invalid literal for int\(\) with base 10: '(-?\d+[.,]\d+)'/, "Não é um número inteiro", `${C("int(…)")} só aceita inteiros. Para números com casas decimais use ${C("float(…)")} (e ponto decimal).`],
    ["ValueError", /(invalid literal for int\(\)|could not convert string to float).*: '(.*)'/, "Não é um número", `O valor ${C("'$2'")} não é um número, por isso não pode ser convertido.`],
    ["ValueError", /math domain error/, "Fora do domínio", `A função foi calculada fora do domínio: por exemplo ${C("sqrt")} de um número negativo, ${C("log")} de 0 ou de um negativo, ou ${C("acos")}/${C("asin")} de um valor fora de [−1, 1].`],
    ["ValueError", /too many values to unpack/, "Valores a mais", "Há mais valores do que variáveis do lado esquerdo do =."],
    ["ValueError", /not enough values to unpack/, "Valores a menos", "Há menos valores do que variáveis do lado esquerdo do =."],
    ["ZeroDivisionError", /.*/, "Divisão por zero", "O programa dividiu por 0 (com /, // ou %). Verifique o valor do divisor nesta linha."],
    ["IndexError", /.*/, "Posição que não existe", `As posições de uma lista com n elementos vão de 0 a n − 1. Por exemplo, numa lista de 3 elementos ${C("lista[3]")} já não existe.`],
    ["KeyError", /.*/, "Chave que não existe", "O dicionário não tem esta chave. Verifique se está bem escrita."],
    ["AttributeError", /module '(\w+)' has no attribute '(\w+)'\. Did you mean: '(\w+)'/, "$2 não existe em $1", `O módulo ${C("$1")} não tem nada chamado ${C("$2")}. Queria escrever ${C("$3")}?`],
    ["AttributeError", /module '(\w+)' has no attribute '(\w+)'/, "$2 não existe em $1", `O módulo ${C("$1")} não tem nada chamado ${C("$2")}. Verifique se está bem escrito (maiúsculas e minúsculas contam).`],
    ["AttributeError", /'(\w+)' object has no attribute '(\w+)'/, "$2 não existe", `Um valor do tipo ${C("$1")} não tem ${C(".$2")}. Verifique se está bem escrito ou se a variável tem o valor que pensa.`],
    ["ModuleNotFoundError", /No module named '([\w.]+)'/, "Módulo desconhecido: $1", `Verifique se o nome está bem escrito. Alguns módulos não estão disponíveis no navegador.`],
    ["ImportError", /cannot import name '(\w+)' from '(\w+)'/, "$1 não existe em $2", `Verifique se ${C("$1")} está bem escrito.`],
    ["RecursionError", /.*/, "A função não para de se chamar", "A função chama-se a si própria sem parar. Falta um caso de paragem (por exemplo, «se n == 0, devolve 1») ou ele nunca é atingido."],
    ["OverflowError", /.*/, "Número grande demais", "O resultado é grande demais para um número decimal (float). Experimente valores mais pequenos."],
    ["MemoryError", /.*/, "Memória esgotada", "O programa usou memória demais: talvez uma lista que cresce sem parar dentro de um ciclo."],
  ];
  const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function explicarErro(msg) {
    const linhas = msg.trim().split("\n");
    const ultima = linhas[linhas.length - 1].match(/^(\w+): ?(.*)$/);
    if (!ultima) return;
    const [, tipo, texto] = ultima;
    let regra = null, g = null;
    for (const r of REGRAS) if (r[0] === tipo && (g = texto.match(r[1]))) { regra = r; break; }
    if (!regra) return;
    const troca = t => t.replace(/\$(\d)/g, (_, i) => esc(g[i] || ""));
    const n = [...msg.matchAll(/File "<exec>", line (\d+)/g)].pop();   // a linha mais funda do programa do aluno
    const caixa = document.createElement("span"); caixa.className = "ajuda";
    caixa.innerHTML = `<b>${n ? `<button title="Ir para a linha">Linha ${n[1]}</button>: ` : ""}${troca(esc(regra[2]))}</b>${troca(regra[3])}`;
    saida.appendChild(caixa); saida.scrollTop = saida.scrollHeight;
    if (n) {
      const i = Math.min(+n[1], editor.lineCount()) - 1;
      marca = editor.addLineClass(i, "background", "linha-erro");
      caixa.querySelector("button").onclick = () => { editor.setCursor(i, 0); editor.scrollIntoView({ line: i, ch: 0 }, 80); editor.focus(); };
    }
  }
  // a linha do erro fica marcada no editor até se mudar o programa ou executar outra vez
  let marca = null;
  function tirarMarca() { if (marca) { editor.removeLineClass(marca, "background", "linha-erro"); marca = null; } }
  editor.on("change", tirarMarca);

  btnExec.onclick = executar;
  btnParar.onclick = parar;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && aCorrer) { e.preventDefault(); parar(); } });

  // o sw.js põe os cabeçalhos COOP/COEP (o GitHub Pages não deixa); da primeira vez é preciso recarregar
  (async () => {
    if (!self.crossOriginIsolated && "serviceWorker" in navigator && location.protocol !== "file:") {
      try {
        await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        if (!sessionStorage.getItem(CHAVE + "-recarregado")) { sessionStorage.setItem(CHAVE + "-recarregado", "1"); location.reload(); return; }
      } catch (e) {}
    }
    criarWorker();
  })();
})();
</script>
</body>
</html>
