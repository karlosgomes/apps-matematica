<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratório das Ondas Sonoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root { --band: #f6f8fb; --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --band: #1c242d; --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* caixas dos valores (amplitudes, frequências, n.º de períodos), postas por cima do canvas pelo layout */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.3em; border: 2px solid var(--line); border-radius: 7px;
         background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; text-align: right; outline: none; }
  .inp:focus { border-color: var(--focus); }
  .inp.bad { border-color: var(--bad); background: var(--badbg); }
  .inp.off { opacity: 0.5; }
  /* listas do acorde (fundamental e tipo) */
  select.inp { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; text-align: left; padding: 0 0.2em; cursor: pointer; }
</style>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<canvas id="cv" aria-label="Gráfico de quatro ondas sonoras p(t) = A sin(2π f t) e da sua soma, com os controlos da amplitude e da frequência de cada onda"></canvas>
<script>
(() => {
  // Pensada para projeção: contraste forte, controlos desenhados na própria folha; tema claro ou escuro
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", faint: "#6b7685", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    W: ["#1565c0", "#d32f2f", "#2e7d32", "#ef6c00"], sum: "#111827",
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", faint: "#8592a1", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    W: ["#64a8ff", "#ff6b6b", "#5cc26a", "#ffa040"], sum: "#f2f4f7",
  };
  const C = { ...LIGHT };
  // modo escuro: mesma chave do weblog no localStorage ("alternate" = escuro, "default" = claro); sem escolha, segue o sistema
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';

  // ---------- estado ----------
  const S = {
    waves: [
      { A: 0.5, f: 220, on: true },
      { A: 0.5, f: 277, on: false },
      { A: 0.5, f: 330, on: false },
      { A: 0.5, f: 440, on: false },
    ],
    sumOn: false,
    inSum: [true, true, true, true],   // ondas que entram na soma (escolhidas no cartão da soma)
    d: 5,           // duração do som (s), de 1 a 10
    mode: "fixo",   // "fixo" | "auto"
    n: 3,           // n.º de períodos no referencial automático
  };
  const FIXO = { T: 20, Y: 2.5 };  // 0 ≤ t ≤ 20 ms, −2,5 ≤ p ≤ 2,5
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  // ---------- números ----------
  const fmt = (x, dec = 2) => {
    if (!isFinite(x)) return "—";
    let s = (Math.round(x * 10 ** dec) / 10 ** dec).toFixed(dec);
    if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (s === "-0") s = "0";
    return s.replace(".", ",").replace(/^-/, "−");
  };
  const texNum = (x, dec = 3) => fmt(x, dec).replace(",", "{,}").replace("−", "-");
  const parseNum = s => {
    s = String(s).trim().replace(/\s/g, "").replace("−", "-").replace(",", ".");
    return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
  };

  // ---------- nota musical mais próxima ----------
  const NOMES = ["Dó", "Dó#", "Ré", "Ré#", "Mi", "Fá", "Fá#", "Sol", "Sol#", "Lá", "Lá#", "Si"];
  function nota(f) {
    const m = Math.round(69 + 12 * Math.log2(f / 440));
    const fn = 440 * Math.pow(2, (m - 69) / 12);
    const c = Math.round(1200 * Math.log2(f / fn));
    return { nome: NOMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1), cents: c };
  }

  // ---------- alterações dos valores ----------
  function changed() { updateVoices(); draw(); }
  const setA = (i, v) => { v = clamp(Math.round(v * 100) / 100, 0, 1); if (v !== S.waves[i].A) { S.waves[i].A = v; changed(); } };
  const setF = (i, v) => { v = clamp(Math.round(v), 20, 2000); if (v !== S.waves[i].f) { S.waves[i].f = v; chordCheck(); changed(); } };
  const setDur = v => { v = clamp(Math.round(v), 1, 10); if (v !== S.d) { S.d = v; draw(); } };
  const setN = v => { v = clamp(Math.round(v), 1, 20); if (v !== S.n) { S.n = v; draw(); } };
  const toggleWave = i => { S.waves[i].on = !S.waves[i].on; draw(); };

  // ---------- som (Web Audio) ----------
  let actx = null, master = null;
  const voices = {};
  function audio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0.35;  // volume geral moderado; as amplitudes relativas mantêm-se
      master.connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  // nível de cada oscilador; a soma é só das ondas escolhidas no cartão da soma, normalizada por max(1, ΣA) para não saturar
  // (a soma tem sempre os quatro osciladores: ao selecionar ou tirar uma onda durante o som, só muda o nível)
  function level(key, i) {
    const A = S.waves[i].A;
    if (key !== "sum") return A;
    if (!S.inSum[i]) return 0;
    const tot = S.waves.reduce((s, w, j) => s + (S.inSum[j] ? w.A : 0), 0);
    return A / Math.max(1, tot);
  }
  const toggle = key => voices[key] ? stop(key) : play(key);
  function play(key) {
    const c = audio();
    const out = c.createGain();
    out.connect(master);
    const ids = key === "sum" ? [0, 1, 2, 3] : [+key];
    const t0 = c.currentTime + 0.02, t1 = t0 + S.d;
    const oscs = ids.map(i => {
      const o = c.createOscillator();
      o.type = "sine";
      o.frequency.value = S.waves[i].f;
      const g = c.createGain();
      g.gain.value = level(key, i);
      o.connect(g).connect(out);
      o.start(t0);
      o.stop(t1 + 0.05);
      return { i, o, g };
    });
    // rampas curtas no início e no fim para evitar estalidos
    out.gain.setValueAtTime(0, t0);
    out.gain.linearRampToValueAtTime(1, t0 + 0.02);
    out.gain.setValueAtTime(1, t1 - 0.03);
    out.gain.linearRampToValueAtTime(0, t1);
    const timer = setTimeout(() => { delete voices[key]; draw(); }, (S.d + 0.1) * 1000);
    voices[key] = { out, oscs, timer };
    draw();
  }
  function stop(key) {
    const v = voices[key];
    if (!v) return;
    clearTimeout(v.timer);
    const now = actx.currentTime;
    v.out.gain.cancelScheduledValues(now);
    v.out.gain.setValueAtTime(v.out.gain.value, now);
    v.out.gain.linearRampToValueAtTime(0, now + 0.03);
    v.oscs.forEach(x => { try { x.o.stop(now + 0.05); } catch (e) {} });
    delete voices[key];
    draw();
  }
  const stopAll = () => Object.keys(voices).forEach(stop);
  // ao mexer nos cursores durante a reprodução, o som acompanha
  function updateVoices() {
    if (!actx) return;
    const now = actx.currentTime;
    Object.entries(voices).forEach(([key, v]) => v.oscs.forEach(x => {
      x.o.frequency.setTargetAtTime(S.waves[x.i].f, now, 0.01);
      x.g.gain.setTargetAtTime(level(key, x.i), now, 0.01);
    }));
  }

  // ---------- limites do referencial ----------
  function bounds() {
    if (S.mode === "fixo") return { T: FIXO.T, Y: FIXO.Y };
    const cand = S.waves.filter(w => w.on && w.A > 0).map(w => w.f);
    if (S.sumOn) S.waves.forEach((w, i) => { if (S.inSum[i] && w.A > 0) cand.push(w.f); });
    const fmin = cand.length ? Math.min(...cand) : 2000;
    const amps = [0.05];
    S.waves.forEach(w => { if (w.on) amps.push(w.A); });
    if (S.sumOn) amps.push(S.waves.reduce((s, w, i) => s + (S.inSum[i] ? w.A : 0), 0));
    return { T: S.n * 1000 / fmin, Y: 1.15 * Math.max(...amps) };
  }
  function niceStep(range, target) {
    const raw = range / target;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }

  // ---------- caixas de texto ----------
  // cada caixa: valor atual, como o mudar, passo das setas e casas decimais
  const INP = {};
  function makeInput(id, label, get, set, step, dec, mode = "decimal") {
    const el = document.createElement("input");
    el.className = "inp"; el.id = id; el.type = "text"; el.inputMode = mode; el.autocomplete = "off"; el.spellcheck = false;
    el.setAttribute("aria-label", label);
    document.body.appendChild(el);
    const commit = () => {
      const x = parseNum(el.value);
      if (isFinite(x)) { el.classList.remove("bad"); set(x); el.value = fmt(get(), dec); draw(); }
      else el.classList.add("bad");
    };
    el.addEventListener("change", commit);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") { commit(); el.blur(); }
      else if (e.key === "Escape") { el.classList.remove("bad"); el.value = fmt(get(), dec); el.blur(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        set(get() + (e.key === "ArrowUp" ? 1 : -1) * step * (e.shiftKey ? 10 : 1));
        el.classList.remove("bad"); el.value = fmt(get(), dec); draw();
      }
    });
    INP[id] = { el, get, dec };
  }
  S.waves.forEach((w, i) => {
    makeInput("A" + i, `Amplitude A${i + 1}`, () => S.waves[i].A, v => setA(i, v), 0.01, 2);
    makeInput("f" + i, `Frequência f${i + 1} em hertz`, () => S.waves[i].f, v => setF(i, v), 1, 0, "numeric");
  });
  makeInput("nper", "Número de períodos no referencial automático", () => S.n, setN, 1, 0, "numeric");

  // ---------- acordes de 4 notas (afinação justa) ----------
  // cada tipo é uma razão de inteiros n₁ : n₂ : n₃ : n₄ (as notas, da mais grave para a mais aguda);
  // com a fundamental F (temperada, na oitava 3: Dó3 ≈ 130,81 Hz … Si3 ≈ 246,94 Hz), fᵢ = F · nᵢ / n₁, arredondada ao Hz
  const CHORDS = [
    { g: "Clássicos", sym: "", name: "maior (com 8.ª)", n: [4, 5, 6, 8] },
    { g: "Clássicos", sym: "m", name: "menor (com 8.ª)", n: [10, 12, 15, 20] },
    { g: "Clássicos", sym: "7", name: "7.ª da dominante", n: [4, 5, 6, 7] },
    { g: "Clássicos", sym: "7M", name: "maior com 7.ª maior", n: [8, 10, 12, 15] },
    { g: "Clássicos", sym: "m7", name: "menor com 7.ª", n: [10, 12, 15, 18] },
    { g: "Clássicos", sym: "m7(♭5)", name: "meio-diminuto", n: [5, 6, 7, 9] },
    { g: "Clássicos", sym: "°7", name: "diminuto", n: [15, 18, 21, 25] },
    { g: "Jazz e bossa nova", sym: "6", name: "maior com 6.ª", n: [12, 15, 18, 20] },
    { g: "Jazz e bossa nova", sym: "m6", name: "menor com 6.ª", n: [30, 36, 45, 50] },
    { g: "Jazz e bossa nova", sym: "7M(9)", name: "sem a 5.ª", n: [8, 10, 15, 18] },
    { g: "Jazz e bossa nova", sym: "m7(9)", name: "sem a 5.ª", n: [20, 24, 36, 45] },
    { g: "Jazz e bossa nova", sym: "7(9)", name: "sem a 5.ª", n: [4, 5, 7, 9] },
    { g: "Jazz e bossa nova", sym: "6(9)", name: "sem a 5.ª", n: [12, 15, 20, 27] },
    { g: "Jazz e bossa nova", sym: "7(13)", name: "sem a 5.ª", n: [12, 15, 21, 40] },
    { g: "Jazz e bossa nova", sym: "m7(11)", name: "sem a 5.ª", n: [15, 18, 27, 40] },
    { g: "Jazz e bossa nova", sym: "7sus4", name: "4.ª em vez da 3.ª", n: [12, 16, 18, 21] },
  ];
  S.chord = { root: 9, type: -1 };   // type = −1: nenhum acorde (ou já mudado à mão)
  const chordFreqs = (root, type) => {
    const F = 440 * Math.pow(2, (48 + root - 69) / 12), n = CHORDS[type].n;
    return n.map(k => Math.round(F * k / n[0]));
  };
  let injecting = false;
  function setChord(root, type) {
    S.chord = { root, type };
    if (type >= 0) {
      injecting = true;
      chordFreqs(root, type).forEach((f, i) => setF(i, f));
      injecting = false;
      S.inSum = [true, true, true, true];   // (a soma não se liga sozinha)
    }
    changed();
  }
  // se uma frequência mudar à mão, a lista deixa de mostrar o acorde
  function chordCheck() {
    if (injecting || S.chord.type < 0) return;
    const fs = chordFreqs(S.chord.root, S.chord.type);
    if (fs.some((f, i) => f !== S.waves[i].f)) S.chord.type = -1;
  }
  const mkSelect = (id, label, html) => {
    const el = document.createElement("select");
    el.className = "inp"; el.id = id; el.setAttribute("aria-label", label); el.innerHTML = html;
    document.body.appendChild(el);
    return el;
  };
  const $root = mkSelect("ch-root", "Fundamental do acorde", NOMES.map((n, i) => `<option value="${i}">${n}</option>`).join(""));
  const groups = [...new Set(CHORDS.map(c => c.g))];
  const $type = mkSelect("ch-type", "Tipo de acorde", `<option value="-1">— tipo —</option>` + groups.map(g =>
    `<optgroup label="${g}">` + CHORDS.map((c, i) => c.g === g ? `<option value="${i}">${c.sym || "M"} · ${c.name}</option>` : "").join("") + "</optgroup>").join(""));
  $root.addEventListener("change", () => setChord(+$root.value, S.chord.type));
  $type.addEventListener("change", () => setChord(+$root.value, +$type.value));
  const placeSel = (el, r, px) => {
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px"; el.style.fontSize = px + "px";
  };

  // ---------- canvas ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, L = null, hits = [];
  function resize() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // alturas (em fs): cartão de uma onda (cabeçalho + A + f), cartão da soma, cartão das definições
  const HDR = 1.55, ROW = 1.5, CP = 0.35, GAP = 0.4, LEG = 1.9;
  const CARD = CP + HDR + 0.2 + ROW + 0.15 + ROW + 0.45 + CP,   // (+0,45: os nomes dos Lá por baixo do cursor da frequência)
        SUM = CP + HDR + 0.1 + ROW + 0.1 + ROW + CP, SET = CP + ROW + 0.2 + ROW + CP;
  // disposição: ecrã deitado → controlos numa coluna à esquerda e o gráfico à direita;
  // ecrã ao alto → fórmula em cima, gráfico, e os controlos por baixo (ondas em duas colunas se couberem)
  function layout() {
    let fs = clamp(Math.min(W, H) / 26, 12, 21);
    for (let k = 0; k < 40; k++) {
      const L = tryLayout(fs);
      if (L.ok || fs <= 10) return L;
      fs *= 0.95;
    }
    return tryLayout(fs);
  }
  function tryLayout(fs) {
    const pad = Math.round(fs * 0.7), gap = GAP * fs;
    const land = W > H * 1.15 && W >= 640;
    const L = { fs, pad, land, cards: [] };
    if (land) {
      const cw = clamp(W * 0.33, 19 * fs, 25 * fs), x = pad;
      let y = pad;
      L.legend = { x, y, w: cw, h: LEG * fs }; y += LEG * fs + 0.5 * fs;
      for (let i = 0; i < 4; i++) { L.cards.push({ x, y, w: cw, h: CARD * fs }); y += CARD * fs + gap; }
      L.sum = { x, y, w: cw, h: SUM * fs }; y += SUM * fs + gap;
      L.set = { x, y, w: cw, h: SET * fs }; y += SET * fs;
      const gx = x + cw + 1.2 * fs;
      L.graph = { x: gx, y: pad, w: W - pad - gx, h: H - 2 * pad };
      L.ok = y <= H - pad && L.graph.w >= W * 0.42;
    } else {
      const w = W - 2 * pad, nc = w >= 34 * fs ? 2 : 1, cw = (w - (nc - 1) * gap) / nc;
      const ctrl = (4 / nc) * (CARD * fs + gap) + (nc === 2 ? Math.max(SUM, SET) * fs : (SUM + SET) * fs + gap);
      let y = pad;
      L.legend = { x: pad, y, w, h: LEG * fs }; y += LEG * fs + 0.4 * fs;
      const gh = H - pad - ctrl - 0.5 * fs - y;
      L.graph = { x: pad, y, w, h: gh }; y += gh + 0.5 * fs;
      for (let i = 0; i < 4; i++) {
        const c = i % nc, r = Math.floor(i / nc);
        L.cards.push({ x: pad + c * (cw + gap), y: y + r * (CARD * fs + gap), w: cw, h: CARD * fs });
      }
      y += (4 / nc) * (CARD * fs + gap);
      if (nc === 2) {
        L.sum = { x: pad, y, w: cw, h: SUM * fs };
        L.set = { x: pad + cw + gap, y, w: cw, h: SET * fs };
      } else {
        L.sum = { x: pad, y, w, h: SUM * fs }; y += SUM * fs + gap;
        L.set = { x: pad, y, w, h: SET * fs };
      }
      L.ok = gh >= Math.max(0.3 * H, 11 * fs) && cw >= 17 * fs;
    }
    return L;
  }

  // ---------- desenho: primitivas ----------
  function line(x0, y0, x1, y1, c, w, dash) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
  }
  function tri(x, y, ux, uy, s, c) {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x + ux * s, y + uy * s);
    ctx.lineTo(x - uy * s * 0.6, y + ux * s * 0.6);
    ctx.lineTo(x + uy * s * 0.6, y - ux * s * 0.6);
    ctx.closePath(); ctx.fill();
  }
  function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function text(s, x, y, px, color, align = "left", font = FONT, weight = 400) {
    ctx.font = `${weight} ${px}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillText(s, x, y);
    return ctx.measureText(s).width;
  }
  const tw = (s, px, font = FONT, weight = 400) => { ctx.font = `${weight} ${px}px ${font}`; return ctx.measureText(s).width; };
  function button(x, y, w, h, txt, on, kind, extra = {}, col = C.muted, px = 16) {
    rrect(x, y, w, h, 8, on ? col : C.btn, on ? col : C.line, 2);
    text(txt, x + w / 2, y + h / 2 + 1, px, on ? C.on : C.ink, "center", FONT, 700);
    hits.push({ kind, ...extra, rect: { x, y, w, h } });
  }
  // caixa de opção: quadrado (na cor col) e o texto à direita; devolve onde acaba
  function cbox(x, y, h, bs, px, on, txt, hit, col = C.muted, tcol = C.ink, weight = 400) {
    const yy = y + (h - bs) / 2;
    rrect(x, yy, bs, bs, 5, on ? col : C.bg, col, 2);
    if (on) {
      ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = C.on; ctx.lineWidth = 0.14 * bs;
      ctx.beginPath(); ctx.moveTo(x + 0.24 * bs, yy + 0.52 * bs); ctx.lineTo(x + 0.43 * bs, yy + 0.72 * bs);
      ctx.lineTo(x + 0.77 * bs, yy + 0.3 * bs); ctx.stroke();
      ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    }
    const w = bs + 0.45 * bs + text(txt, x + bs * 1.45, y + h / 2 + 1, px, tcol, "left", FONT, weight);
    hits.push({ ...hit, rect: { x, y, w, h } });
    return x + w;
  }
  // põe uma caixa de texto no sítio (as que não forem postas ficam escondidas)
  let usedInp = new Set();
  function place(id, r, px, off = false) {
    const { el, get, dec } = INP[id];
    el.style.display = "";
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
    el.style.fontSize = px + "px";
    el.classList.toggle("off", off);
    if (document.activeElement !== el) { el.value = fmt(get(), dec); el.classList.remove("bad"); }
    usedInp.add(id);
  }
  // cursor: barra com a parte até ao valor na cor col e a pega redonda
  // marks: valores marcados por baixo da barra ({ v, lab }), com íman ao arrastar perto deles
  function slider(x, y, w, h, lo, hi, v, col, fs, set, marks = []) {
    const cy = y + h / 2, X = u => x + (clamp(u, lo, hi) - lo) / (hi - lo) * w;
    ctx.lineCap = "round";
    line(x, cy, x + w, cy, C.grid2, 0.26 * fs);
    line(x, cy, X(v), cy, col, 0.26 * fs);
    ctx.lineCap = "butt";
    if (marks.length) {
      // as marcas todas; os nomes só onde não se sobrepõem (pela ordem da lista: os primeiros têm prioridade)
      const lf = fs * 0.64, taken = [];
      let gave = false;   // depois de um nome que não cabe abaixo do primeiro, os de baixo também ficam sem nome (Lá2 sem Lá3 confundia)
      marks.forEach(m => line(X(m.v), cy + 0.2 * fs, X(m.v), cy + 0.48 * fs, C.muted, 1.3));
      marks.forEach(m => {
        const mw = tw(m.lab, lf, FONT), a = X(m.v) - mw / 2 - 1, b = X(m.v) + mw / 2 + 1;
        if (gave && m.v < marks[0].v) return;
        if (a < x - 0.6 * fs || b > x + w + 0.6 * fs || taken.some(([p, q]) => a < q && b > p)) { if (m.v < marks[0].v) gave = true; return; }
        taken.push([a, b]);
        text(m.lab, X(m.v), cy + 0.82 * fs, lf, C.muted, "center");
      });
    }
    // (com a onda desligada, tudo esbatido: o fundo opaco por baixo da pega esconde a barra)
    const ga = ctx.globalAlpha; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(X(v), cy, 0.48 * fs + 1.25, 0, Math.PI * 2); ctx.fillStyle = C.band; ctx.fill();
    ctx.globalAlpha = ga;
    ctx.beginPath(); ctx.arc(X(v), cy, 0.48 * fs, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.bg; ctx.stroke();
    const snap = 0.3 * fs;
    hits.push({ kind: "slide", rect: { x: x - 0.7 * fs, y, w: w + 1.4 * fs, h }, set, val: px => {
      const m = marks.find(m => Math.abs(X(m.v) - px) <= snap);
      return m ? m.v : lo + (px - x) / w * (hi - lo);
    } });
  }

  // ---------- texto em LaTeX (KaTeX), numa camada HTML por cima do canvas ----------
  const clr = (c, s) => `\\textcolor{${c}}{${s}}`;
  const layer = document.getElementById("tex");
  const pool = new Map();
  let used = new Set();
  function texAt(id, src, x, y, px, color, ax = 0.5, ay = 0.5, halo = false) {
    let el = pool.get(id);
    if (!el) { el = document.createElement("span"); layer.appendChild(el); pool.set(id, el); }
    if (el._src !== src) {
      el._src = src;
      if (window.katex) katex.render(src, el, { throwOnError: false, strict: false });
      else el.textContent = src;
    }
    el.className = halo ? "tx halo" : "tx";
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${px}px;color:${color};transform:translate(${-ax * 100}%,${-ay * 100}%)`;
    used.add(id);
    return el;
  }
  function fit(el, w, h = Infinity) {
    const k = Math.min(w / el.offsetWidth, h / el.offsetHeight);
    if (k < 1) el.style.fontSize = parseFloat(el.style.fontSize) * k + "px";
    return el;
  }

  // ---------- desenho ----------
  let raf = 0;
  function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
  function paint() {
    L = layout(); hits = []; used = new Set(); usedInp = new Set();
    const { fs } = L;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    legend(L.legend, fs);
    graph(L.graph, fs);
    L.cards.forEach((b, i) => waveCard(b, i, fs));
    sumCard(L.sum, fs);
    settings(L.set, fs);
    for (const [id, el] of pool) if (!used.has(id)) el.style.display = "none";
    for (const id in INP) if (!usedInp.has(id)) INP[id].el.style.display = "none";
  }

  // em cima: a fórmula das ondas e o botão do modo escuro
  function legend(b, fs) {
    const bw = b.h * 1.3;
    rrect(b.x, b.y, b.w - bw - 0.4 * fs, b.h, 8, C.band, C.line, 1.5);
    const src = "p_i(t) = A_i \\sin(2\\pi f_i\\, t)";
    const el = fit(texAt("legend", src, b.x + (b.w - bw - 0.4 * fs) / 2, b.y + b.h / 2, fs * 1.25, C.ink), b.w - bw - 1.2 * fs, b.h);
    L.legPx = parseFloat(el.style.fontSize);   // a expressão da soma, no topo do gráfico, usa a mesma letra
    button(b.x + b.w - bw, b.y, bw, b.h, dark ? "☀" : "☾", false, "theme", {}, C.muted, fs * 1.05);
  }

  // um cartão: fundo leve com a barra da cor à esquerda
  function card(b, col, fs) {
    rrect(b.x, b.y, b.w, b.h, 9, C.band, C.line, 1.2);
    ctx.save(); ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 9); ctx.clip();
    ctx.fillStyle = col; ctx.fillRect(b.x, b.y, 0.25 * fs, b.h);
    ctx.restore();
    return { x: b.x + 0.7 * fs, y: b.y + CP * fs, w: b.w - 1.2 * fs };
  }

  // onda i: [✓ Onda i]  nota  período  [▶ Tocar]; por baixo A e f (nome, caixa, cursor)
  function waveCard(b, i, fs) {
    const w = S.waves[i], col = C.W[i];
    const c = card(b, col, fs);
    const hh = HDR * fs, rh = ROW * fs;
    let y = c.y;
    // cabeçalho
    const bw = 4.6 * fs, bh = 1.3 * fs, on = !!voices[String(i)];
    button(c.x + c.w - bw, y + (hh - bh) / 2, bw, bh, on ? "■ Parar" : "▶ Tocar", on, "play", { key: String(i) }, col, fs * 0.8);
    let x = cbox(c.x, y, hh, 0.85 * fs, fs * 0.95, w.on, `Onda ${i + 1}`, { kind: "wave", i }, col, col, 700) + 0.8 * fs;
    const room = c.x + c.w - bw - 0.5 * fs;
    const n = nota(w.f), ns = `${n.nome} ${n.cents >= 0 ? "+" : "−"}${Math.abs(n.cents)} c`;
    const per = `T = ${fmt(1000 / w.f, 2)} ms`;
    const pn = fs * 0.78;
    if (x + tw(n.nome, pn, MONO, 600) <= room) {
      const full = tw(ns, pn, MONO, 600) + 0.7 * fs + tw(per, pn * 0.95, MONO) <= room - x;
      const nn = x + tw(ns, pn, MONO, 600) <= room ? ns : n.nome;
      x += text(nn, x, y + hh / 2 + 1, pn, col, "left", MONO, 600) + 0.7 * fs;
      if (full) text(per, x, y + hh / 2 + 1, pn * 0.95, C.faint, "left", MONO);
    }
    y += hh + 0.2 * fs;
    if (!w.on) ctx.globalAlpha = 0.5;
    paramRow(c, y, rh, fs, "A" + i, `A_${i + 1}`, "", 0, 1, w.A, col, v => setA(i, v), !w.on);
    y += rh + 0.15 * fs;
    paramRow(c, y, rh, fs, "f" + i, `f_${i + 1}`, "Hz", 20, 2000, w.f, col, v => setF(i, v), !w.on, LAS);
    ctx.globalAlpha = 1;
  }
  // uma linha de parâmetro: nome (KaTeX), caixa com o valor, unidade e cursor
  // os Lá (de oitava em oitava: cada um tem o dobro da frequência do anterior), marcados no cursor da frequência
  // (Lá0 = 27,5 Hz; a ordem dá a prioridade dos nomes quando não cabem todos: o primeiro, os de cima, os de baixo)
  const LAS = [440, 880, 1760, 220, 110, 55].map(v => ({ v, lab: "Lá" + Math.round(Math.log2(v / 27.5)) }));
  function paramRow(c, y, rh, fs, id, src, unit, lo, hi, v, col, set, off, marks) {
    const ih = 1.3 * fs, iy = y + (rh - ih) / 2;
    const el = texAt("l" + id, src, c.x + 0.1 * fs, y + rh / 2, fs * 1.05, col, 0, 0.5);
    el.style.opacity = off ? 0.5 : 1;
    const ix = c.x + 1.7 * fs, iw = 3.5 * fs;
    place(id, { x: ix, y: iy, w: iw, h: ih }, fs * 0.82, off);
    if (unit) text(unit, ix + iw + 0.3 * fs, y + rh / 2 + 1, fs * 0.75, C.muted);
    const sx = ix + iw + 2.3 * fs;
    slider(sx, y, c.x + c.w - 0.5 * fs - sx, rh, lo, hi, v, col, fs, set, marks);
  }

  // a soma: [✓ Soma]  p₁ + p₃  [▶ Tocar a soma]; por baixo, as caixas das ondas que entram na soma
  // (independentes das caixas de cada onda, que só a mostram ou escondem no gráfico)
  function sumCard(b, fs) {
    const c = card(b, C.sum, fs), hh = HDR * fs, rh = ROW * fs;
    const lab = "▶ Tocar a soma", on = !!voices.sum;
    const bw = Math.max(4.6 * fs, tw(lab, fs * 0.8, FONT, 700) + 1.2 * fs), bh = 1.3 * fs;
    button(c.x + c.w - bw, c.y + (hh - bh) / 2, bw, bh, on ? "■ Parar" : lab, on, "play", { key: "sum" }, C.sum, fs * 0.8);
    const x = cbox(c.x, c.y, hh, 0.85 * fs, fs * 0.95, S.sumOn, "Soma", { kind: "sum" }, C.sum, C.sum, 700) + 0.6 * fs;
    const room = c.x + c.w - bw - 0.5 * fs - x;
    const sel = S.inSum.map((v, i) => v ? i : -1).filter(i => i >= 0);
    if (!sel.length) text("(nenhuma onda)", x, c.y + hh / 2 + 1, Math.min(fs * 0.75, fs * 0.75 * room / tw("(nenhuma onda)", fs * 0.75)), C.faint);
    else fit(texAt("sumf", sel.map(i => clr(C.W[i], `p_${i + 1}`)).join(" + "), x, c.y + hh / 2, fs * 1.05, C.ink, 0, 0.5), room, hh);
    // ☑ p₁  ☑ p₂  ☑ p₃  ☑ p₄, cada uma na cor da sua onda
    const y = c.y + hh + 0.1 * fs, bs = 0.8 * fs;
    let xx = c.x + text("Ondas", c.x, y + rh / 2 + 1, fs * 0.8, C.muted) + 0.7 * fs;
    const step = Math.min(3.6 * fs, (c.x + c.w - xx) / 4);
    S.inSum.forEach((v, i) => {
      const x0 = xx + i * step;
      cbox(x0, y, rh, bs, fs * 0.8, v, "", { kind: "insum", i }, C.W[i]);
      texAt("ins" + i, `p_${i + 1}`, x0 + bs * 1.45, y + rh / 2, fs * 1.05, C.W[i], 0, 0.5);
      hits.push({ kind: "insum", i, rect: { x: x0, y, w: step - 0.2 * fs, h: rh } });
    });
    // Acorde [Lá ▾] [7M · maior com 7.ª maior ▾]   8 : 10 : 12 : 15
    const y3 = y + rh + 0.1 * fs, sh = 1.3 * fs, sy = y3 + (rh - sh) / 2;
    let x3 = c.x + text("Acorde", c.x, y3 + rh / 2 + 1, fs * 0.8, C.muted) + 0.6 * fs;
    $root.value = S.chord.root; $type.value = S.chord.type;
    placeSel($root, { x: x3, y: sy, w: 4 * fs, h: sh }, fs * 0.8);
    x3 += 4.3 * fs;
    const ch = CHORDS[S.chord.type], rw = ch ? tw(ch.n.join(" : "), fs * 0.75, MONO) + 0.6 * fs : 0;
    const showR = ch && c.x + c.w - x3 - rw >= 6 * fs;
    placeSel($type, { x: x3, y: sy, w: c.x + c.w - x3 - (showR ? rw : 0), h: sh }, fs * 0.8);
    if (showR) text(ch.n.join(" : "), c.x + c.w, y3 + rh / 2 + 1, fs * 0.75, C.muted, "right", MONO);
  }

  // definições: referencial (fixo/automático, n.º de períodos) e duração do som
  function settings(b, fs) {
    const c = card(b, C.faint, fs), rh = ROW * fs, bh = 1.3 * fs, f = fs * 0.8;
    let y = c.y, x = c.x;
    const lab = "Referencial", segs = [["fixo", "Fixo"], ["auto", "Automático"]];
    const sw = segs.map(([, t]) => tw(t, f, FONT, 700) + 1 * fs);
    const perW = tw("Períodos", f) + 0.4 * fs + 2.4 * fs;
    if (tw(lab, f) + 0.5 * fs + sw[0] + sw[1] + 0.8 * fs + perW <= c.w) x += text(lab, x, y + rh / 2 + 1, f, C.muted) + 0.5 * fs;
    segs.forEach(([m, t], k) => {
      button(x, y + (rh - bh) / 2, sw[k], bh, t, S.mode === m, "mode", { m }, C.muted, f);
      x += sw[k] + 0.25 * fs;
    });
    if (S.mode === "auto") {
      x = c.x + c.w - 2.4 * fs;
      text("Períodos", x - 0.4 * fs, y + rh / 2 + 1, f, C.muted, "right");
      place("nper", { x, y: y + (rh - bh) / 2, w: 2.4 * fs, h: bh }, fs * 0.82);
    }
    y += rh + 0.2 * fs; x = c.x;
    // duração do som: cursor de 1 a 10 s, de segundo em segundo (com as marcas), e o valor à direita
    x += text("Duração do som", x, y + rh / 2 + 1, f, C.muted) + 1 * fs;
    const vw = tw("10 s", f, MONO, 600), x1 = c.x + c.w - vw - 0.9 * fs;
    for (let k = 1; k <= 10; k++) { const tx = x + (k - 1) / 9 * (x1 - x); line(tx, y + rh / 2 + 0.3 * fs, tx, y + rh / 2 + 0.5 * fs, C.faint, 1.2); }
    slider(x, y, x1 - x, rh, 1, 10, S.d, C.muted, fs, setDur);
    text(`${S.d} s`, c.x + c.w, y + rh / 2 + 1, f, C.ink, "right", MONO, 600);
  }

  // ---------- gráfico ----------
  function graph(b, fs) {
    const { T, Y } = bounds();
    // no topo, uma faixa (sempre reservada, para o referencial não mudar) com a expressão da soma:
    // p(t) = 0,5 sin(2π·220 t) + …, cada parcela na cor da sua onda, com a letra da fórmula geral.
    // Se a soma das quatro ondas não couber numa linha, a faixa tem duas linhas (e a expressão parte-se em duas)
    const lp = L.legPx || fs * 1.25;
    const term = i => clr(C.W[i], `${S.waves[i].A === 1 ? "" : texNum(S.waves[i].A, 2)}\\sin(2\\pi \\cdot ${S.waves[i].f}\\, t)`);
    const P_ = clr(C.sum, "p(t)");
    const probe = texAt("sumprobe", `${P_} = ${[0, 1, 2, 3].map(term).join(" + ")}`, 0, 0, lp, C.ink, 0, 0);
    const two = probe.offsetWidth > b.w;
    probe.style.display = "none"; used.delete("sumprobe");
    const strip = (two ? 2.75 : 1.6) * lp;
    if (S.sumOn && S.inSum.some(v => v)) {
      const ts = [0, 1, 2, 3].filter(i => S.inSum[i]).map(term);
      const k = Math.ceil(ts.length / 2);
      const src = two && ts.length > 2
        ? `\\begin{aligned} ${P_} = {} & ${ts.slice(0, k).join(" + ")} \\\\ & + ${ts.slice(k).join(" + ")} \\end{aligned}`
        : `${P_} = ${ts.join(" + ")}`;
      fit(texAt("sumexpr", src, b.x + b.w / 2, b.y + strip / 2, lp, C.ink), b.w, strip);
    }
    b = { x: b.x, y: b.y + strip, w: b.w, h: b.h - strip };
    const ml = 3 * fs, mr = 1.5 * fs, mt = 1.7 * fs, mb = 1.6 * fs;
    const gx0 = b.x + ml, gx1 = b.x + b.w - mr, gy0 = b.y + mt, gy1 = b.y + b.h - mb;
    const gw = gx1 - gx0, gh = gy1 - gy0;
    const X = t => gx0 + t / T * gw, Yp = v => (gy0 + gy1) / 2 - v / Y * gh / 2;
    const px = fs * 0.8;
    // grelha e marcas (em LaTeX)
    const sx = niceStep(T, Math.max(3, Math.min(10, gw / (3.6 * fs)))), sy = niceStep(2 * Y, Math.max(3, Math.min(8, gh / (2.2 * fs))));
    let k = 0;
    for (let t = 0; t <= T + 1e-9; t += sx, k++) {
      line(X(t), gy0, X(t), gy1, C.grid, 1);
      if (t > 1e-9) texAt("gx" + k, texNum(t), X(t), gy1 + 0.3 * fs, px, C.muted, 0.5, 0);
    }
    k = 0;
    for (let v = Math.ceil(-Y / sy) * sy; v <= Y + 1e-9; v += sy, k++) {
      if (Math.abs(v) < 1e-9) continue;   // o 0 fica na origem
      line(gx0, Yp(v), gx1, Yp(v), C.grid, 1);
      texAt("gy" + k, texNum(v), gx0 - 0.4 * fs, Yp(v), px, C.muted, 1, 0.5);
    }
    // eixos
    line(gx0, Yp(0), gx1 + 0.5 * fs, Yp(0), C.axis, 1.6); tri(gx1 + 0.7 * fs, Yp(0), 1, 0, fs * 0.4, C.axis);
    line(gx0, gy1, gx0, gy0 - 0.5 * fs, C.axis, 1.6); tri(gx0, gy0 - 0.7 * fs, 0, -1, fs * 0.4, C.axis);
    // curvas, recortadas à área do gráfico (com amostras suficientes para as frequências altas)
    ctx.save();
    ctx.beginPath(); ctx.rect(gx0, gy0, gw, gh); ctx.clip();
    const fmax = Math.max(...S.waves.filter((w, i) => w.on || (S.sumOn && S.inSum[i])).map(w => w.f), 1);
    const N = Math.min(80000, Math.max(Math.round(gw * 2), Math.ceil(T * fmax / 1000 * 24)));
    const val = (i, t) => S.waves[i].A * Math.sin(2 * Math.PI * S.waves[i].f * t / 1000);
    const curve = (fn, color, weight) => {
      ctx.strokeStyle = color; ctx.lineWidth = weight; ctx.lineJoin = "round"; ctx.setLineDash([]);
      ctx.beginPath();
      for (let j = 0; j <= N; j++) { const t = T * j / N, x = X(t), y = Yp(fn(t)); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    };
    S.waves.forEach((w, i) => { if (w.on) curve(t => val(i, t), C.W[i], Math.max(1.8, 0.12 * fs)); });
    if (S.sumOn && S.inSum.some(v => v)) curve(t => S.waves.reduce((s, w, i) => s + (S.inSum[i] ? val(i, t) : 0), 0), C.sum, Math.max(2.6, 0.18 * fs));
    ctx.restore();
    // nomes dos eixos, por cima das curvas
    texAt("ax-t", "t\\ (\\text{ms})", gx1 + 0.4 * fs, Yp(0) - 0.45 * fs, fs * 0.95, C.ink, 1, 1, true);
    texAt("ax-p", "p", gx0 + 0.6 * fs, gy0 - 0.7 * fs, fs * 0.95, C.ink, 0, 0.5, true);
    texAt("gx0", "0", gx0 - 0.4 * fs, Yp(0) + 0.3 * fs, px, C.muted, 1, 0);
  }

  // ---------- toque e rato ----------
  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const hitAt = (x, y) => hits.find(h => h.rect && inRect(h.rect, x, y)) || null;
  let drag = null;
  cv.addEventListener("pointerdown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) document.activeElement.blur();
    const h = hitAt(e.clientX, e.clientY);
    if (!h) return;
    e.preventDefault();
    if (h.kind === "theme") { setDark(!dark, true); for (const el of pool.values()) el._src = null; draw(); return; }
    if (h.kind === "wave") { toggleWave(h.i); return; }
    if (h.kind === "sum") { S.sumOn = !S.sumOn; draw(); return; }
    if (h.kind === "insum") { S.inSum[h.i] = !S.inSum[h.i]; changed(); return; }
    if (h.kind === "play") { toggle(h.key); return; }
    if (h.kind === "mode") { S.mode = h.m; draw(); return; }
    if (h.kind === "slide") {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      drag = h;
      h.set(h.val(e.clientX));
      cv.style.cursor = "grabbing";
    }
  });
  cv.addEventListener("pointermove", e => {
    if (drag) { drag.set(drag.val(e.clientX)); return; }
    const h = hitAt(e.clientX, e.clientY);
    cv.style.cursor = !h ? "default" : h.kind === "slide" ? "ew-resize" : "pointer";
  });
  const end = () => { drag = null; cv.style.cursor = "default"; };
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, end));

  // teclado (fora das caixas): 1 a 4 mostram/ocultam as ondas, s a soma, m troca o referencial, Esc para o som
  window.addEventListener("keydown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= "1" && e.key <= "4") toggleWave(+e.key - 1);
    else if (e.key === "s") { S.sumOn = !S.sumOn; draw(); }
    else if (e.key === "m") { S.mode = S.mode === "fixo" ? "auto" : "fixo"; draw(); }
    else if (e.key === "Escape") stopAll();
    else return;
    e.preventDefault();
  });

  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  if (document.fonts) document.fonts.ready.then(draw);
  resize();
})();
</script>
</body>
</html>
