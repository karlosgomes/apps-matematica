<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Função de Enrolamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root { --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* caixa de texto do valor de t, posta por cima do canvas pelo layout */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.3em; border: 2px solid var(--line); border-radius: 7px;
         background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; text-align: right; outline: none; }
  .inp:focus { border-color: var(--focus); }
  .inp.bad { border-color: var(--bad); background: var(--badbg); }
</style>
<!-- GoatCounter: contagem de visitas, sem cookies (não conta em localhost) -->
<script data-goatcounter="https://karlosgomes.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// GoatCounter: eventos dentro da app (cada um no máximo uma vez por visita), com o nome «app: ação»
(() => {
  const seen = new Set(), app = location.pathname.split("/").filter(Boolean).pop() || "apps";
  const send = (name, tries = 0) => {
    if (window.goatcounter && goatcounter.count) goatcounter.count({ path: app + ": " + name, title: name, event: true });
    else if (tries < 20) setTimeout(() => send(name, tries + 1), 500);
  };
  window.gcEvt = h => {
    if (!h) return;
    let name = typeof h === "string" ? h : [h.kind, h.v ?? h.k ?? h.key ?? ""].filter(x => x !== "" && x != null).join(" ");
    name = String(name).trim().slice(0, 60);
    if (!name || seen.has(name)) return;
    seen.add(name); send(name);
  };
  // botões e menus em HTML (apps Python, Estatística, Folha de cálculo e as janelas das outras)
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("button, [role=button]");
    if (b) gcEvt((b.textContent || "").trim().replace(/\s+/g, " ").slice(0, 40) || b.title || b.id);
  }, true);
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.tagName === "SELECT") gcEvt((t.id || t.name || "menu") + ": " + ((t.options[t.selectedIndex] || {}).text || t.value));
    else if (t.type === "checkbox") gcEvt(((t.closest("label") || {}).textContent || t.id || "caixa").trim().slice(0, 40));
  }, true);
})();
</script>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<canvas id="cv" aria-label="Função de enrolamento: a reta real enrola-se na circunferência trigonométrica; gráficos de cos t, sin t e tan t"></canvas>
<script>
(() => {
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", faint: "#6b7685", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff", tagbg: "rgba(255,255,255,0.88)",
    cos: "#1565c0", sin: "#d32f2f", tan: "#2e7d32", arc: "#ef6c00", pi: "#7b3fb0",
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", faint: "#8592a1", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22", tagbg: "rgba(21,27,34,0.88)",
    cos: "#64a8ff", sin: "#ff6b6b", tan: "#5cc26a", arc: "#ffa040", pi: "#c79bff",
  };
  const C = { ...LIGHT };
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const PI = Math.PI, TAU = 2 * Math.PI;
  const TMAX = 6 * PI;   // até 3 voltas em cada sentido
  const VIEW0 = [0, 6 * PI];   // vista inicial do gráfico (o rato desloca-a e muda a escala)

  // ---------- estado ----------
  const S = {
    t: 0,                 // P começa em (1, 0)
    dir: 0,               // −1 desenrolar, +1 enrolar, 0 parado
    speed: 0.6,           // rad/s
    m: 2,                 // marcas de π/m (o passo ±π/m guarda o último m)
    hidePi: true,         // sem marcas de π ao início
    magnet: false,
    view: { a: VIEW0[0], b: VIEW0[1] },
    graph: false, cos: false, sin: false, tan: false, line: true, full: false, link: true,
  };

  // ---------- formatação ----------
  const fmt = (x, dec = 3) => {
    if (Math.abs(x) < 0.5 * Math.pow(10, -dec)) x = 0;
    return x.toFixed(dec).replace(".", ",").replace(/^-/, "−");
  };
  const texNum = (x, dec = 3) => fmt(x, dec).replace(",", "{,}").replace("−", "-");
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
  // k·π/m em forma reduzida: texto simples (caixa e botões) e LaTeX (desenho)
  function fracPi(k, m) {
    if (k === 0) return "0";
    const g = gcd(k, m); k /= g; m /= g;
    const s = k < 0 ? "−" : ""; k = Math.abs(k);
    const num = (k === 1 ? "" : k) + "π";
    return s + (m === 1 ? num : num + "/" + m);
  }
  function fracPiTex(k, m) {
    if (k === 0) return "0";
    const g = gcd(k, m); k /= g; m /= g;
    const s = k < 0 ? "-" : ""; k = Math.abs(k);
    const num = (k === 1 ? "" : k) + "\\pi";
    return s + (m === 1 ? num : `\\tfrac{${num}}{${m}}`);
  }
  // se t for múltiplo exato de π/12, devolve o inteiro k tal que t = kπ/12
  function k12(t) {
    const k = Math.round(t / (PI / 12));
    return Math.abs(t - k * PI / 12) < 1e-9 ? k : null;
  }
  // valores exatos de cos(jπ/12) quando j é múltiplo de 2 ou de 3
  const COS_EX = { 0: "1", 2: "\\tfrac{\\sqrt{3}}{2}", 3: "\\tfrac{\\sqrt{2}}{2}", 4: "\\tfrac{1}{2}", 6: "0" };
  const neg = s => s === "0" ? "0" : (s[0] === "-" ? s.slice(1) : "-" + s);
  function cosEx(j) {
    j = ((j % 24) + 24) % 24;
    if (j > 12) j = 24 - j;
    if (j > 6) return neg(cosEx(12 - j));
    return COS_EX[j] ?? null;
  }
  const sinEx = j => cosEx(6 - j);
  const TAN_EX = { 0: "0", 2: "\\tfrac{\\sqrt{3}}{3}", 3: "1", 4: "\\sqrt{3}", 8: "-\\sqrt{3}", 9: "-1", 10: "-\\tfrac{\\sqrt{3}}{3}" };

  // aceita "2,5", "-3π/4", "pi/2", "2pi", "π"
  function parseT(str) {
    const s = str.trim().replace(/\s+/g, "").replace(/−/g, "-").replace(/pi/gi, "π");
    const m = s.match(/^(-?)(\d*(?:[.,]\d*)?)(π?)(?:\/(\d+(?:[.,]\d+)?))?$/);
    if (!m || (!m[2] && !m[3])) return null;
    let v = m[2] ? parseFloat(m[2].replace(",", ".")) : 1;
    if (isNaN(v)) return null;
    if (m[3]) v *= PI;
    if (m[4]) { const d = parseFloat(m[4].replace(",", ".")); if (!d) return null; v /= d; }
    return m[1] ? -v : v;
  }
  // t na caixa de texto: com π se for múltiplo de π/12 (e houver marcas de π), senão em decimal
  const tPlain = () => { const k = S.hidePi ? null : k12(S.t); return k !== null ? fracPi(k, 12) : fmt(S.t); };

  // valores escritos no desenho: forma exata quando existe, senão decimal (LaTeX)
  const VAL = { t: "0", cos: "1", sin: "0", tan: "0" };
  function readouts() {
    const t = S.t, k = S.hidePi ? null : k12(t);
    const ce = k !== null ? cosEx(k) : null, se = k !== null ? sinEx(k) : null;
    const te = k !== null ? TAN_EX[((k % 12) + 12) % 12] : undefined;
    VAL.t = k !== null ? fracPiTex(k, 12) : texNum(t);
    VAL.cos = ce ?? texNum(Math.cos(t));
    VAL.sin = se ?? texNum(Math.sin(t));
    VAL.tan = k !== null && ((k % 12) + 12) % 12 === 6 ? null : (te ?? texNum(Math.tan(t)));
  }

  // ---------- ações ----------
  function setT(v, { snap = S.magnet && !S.hidePi, keepView = false } = {}) {
    v = clamp(v, -TMAX, TMAX);
    if (snap) { const st = PI / S.m; v = Math.round(v / st) * st; }
    S.t = v;
    // se t sair da janela do gráfico, a janela desliza para o acompanhar
    const V = S.view, w = V.b - V.a;
    if (!keepView && (v < V.a || v > V.b)) {
      const d = v > V.b ? v - V.b + 0.05 * w : v - V.a - 0.05 * w;
      V.a += d; V.b += d;
    }
    draw();
  }
  function setDir(d) { S.dir = S.dir === d ? 0 : d; go(); }
  function wind(d) {
    if (d === 1 && S.dir !== 1 && S.t >= TMAX - 1e-9) setT(-TMAX, { snap: false });
    if (d === -1 && S.dir !== -1 && S.t <= -TMAX + 1e-9) setT(TMAX, { snap: false });
    setDir(d);
  }
  // os passos em π/m arredondam ao múltiplo de π/m (para se chegar a valores exatos)
  const stepPi = d => { const st = PI / S.m; setT((Math.round(S.t / st + 1e-9 * d) + d) * st, { snap: false }); };
  function step(v) {
    if (v === "zero") { S.dir = 0; setT(0, { snap: false }); }
    else if (v === "-pi" || v === "+pi") stepPi(v[0] === "-" ? -1 : 1);
    else setT(S.t + v, { snap: false });
  }
  // m = 0 («nenhuma») só esconde as marcas; o passo ±π/m guarda o último m
  function setMarks(m) {
    S.hidePi = m === 0;
    if (!S.hidePi) S.m = m;
    setT(S.t, { keepView: true });
  }
  // duplo clique no gráfico: volta à vista inicial (que desliza, se t estiver fora dela)
  function resetView() { S.view.a = VIEW0[0]; S.view.b = VIEW0[1]; setT(S.t, { snap: false }); }
  const toggle = key => { S[key] = !S[key]; if (key === "magnet" && S.magnet) setT(S.t); draw(); };

  // ---------- canvas ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, L = null, hits = [];
  function resize() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- caixa de texto de t ----------
  const tin = document.createElement("input");
  tin.className = "inp"; tin.type = "text"; tin.inputMode = "text"; tin.autocomplete = "off"; tin.spellcheck = false;
  tin.title = "Aceita, por exemplo: 2,5 · π/3 · −3pi/4";
  tin.setAttribute("aria-label", "Valor de t (aceita 3π/4 ou 3pi/4)");
  document.body.appendChild(tin);
  const showT = () => { tin.classList.remove("bad"); tin.value = tPlain(); };
  tin.addEventListener("input", () => {
    const v = parseT(tin.value);
    if (v === null) { tin.classList.add("bad"); return; }
    tin.classList.remove("bad");
    S.dir = 0; setT(v, { snap: false });
  });
  tin.addEventListener("change", () => { showT(); draw(); });
  tin.addEventListener("keydown", e => {
    if (e.key === "Enter") { tin.blur(); showT(); draw(); }
    else if (e.key === "Escape") { showT(); tin.blur(); draw(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      S.dir = 0;
      setT(S.t + (e.key === "ArrowUp" ? 1 : -1) * (e.shiftKey ? 1 : 0.1), { snap: false });
      showT();
    }
  });
  let usedInp = false;
  function placeT(r, px) {
    tin.style.display = "";
    tin.style.left = r.x + "px"; tin.style.top = r.y + "px"; tin.style.width = r.w + "px"; tin.style.height = r.h + "px";
    tin.style.fontSize = px + "px";
    if (document.activeElement !== tin) showT();
    usedInp = true;
  }

  // ---------- disposição ----------
  // controlos em cima (numa linha, se couberem) e, por baixo, a circunferência e os gráficos
  // os cartões usam uma letra menor (cfs = 0,8·fs) para ocuparem pouco espaço
  const ROW = 1.5, LEG = 1.9, CF = 0.8;
  let CP = 0.45, GAP = 0.75, RG = 0.3;
  const CARDS = [["t", 3], ["ver", 3], ["marcas", 2]];
  const cardH = r => CP * 2 + r * ROW + (r - 1) * RG;
  function layout() {
    let fs = clamp(Math.min(W, H) / 26, 12, 21);
    for (let k = 0; k < 40; k++) {
      const L = tryLayout(fs);
      if (L.ok || fs <= 10) return L;
      fs *= 0.95;
    }
    return tryLayout(fs);
  }
  function tryLayout(fs) {
    const pad = Math.round(fs * 0.7), gap = GAP * fs;
    const land = W > H * 1.1 && W >= 640;
    [CP, GAP, RG] = land ? [0.45, 0.75, 0.3] : [0.35, 0.45, 0.2];
    const cfs = fs * CF, L = { fs, cfs, pad, land, cards: {} };
    const hOf = k => cardH(CARDS.find(c => c[0] === k)[1]) * cfs;
    let area;
    // controlos em cima (os três cartões lado a lado, se couberem), circunferência e gráficos por baixo
    const w = W - 2 * pad;
    let y = pad;
    L.legend = { x: pad, y, w, h: LEG * fs }; y += LEG * fs + (land ? 0.6 : 0.4) * fs;
    const nc = w >= 3 * 21 * cfs + 2 * gap ? 3 : w >= 40 * cfs ? 2 : 1, cw = (w - (nc - 1) * gap) / nc;
    const col = nc === 3 ? [["t"], ["ver"], ["marcas"]] : nc === 2 ? [["t"], ["ver", "marcas"]] : [CARDS.map(c => c[0])];
    const rowsOf = k => CARDS.find(c => c[0] === k)[1];
    if (nc === 3) {
      // na mesma linha, todos com a altura do mais alto (o conteúdo fica ao centro)
      const ch = Math.max(...CARDS.map(([k]) => hOf(k)));
      col.forEach(([k], ci) => { L.cards[k] = { x: pad + ci * (cw + gap), y, w: cw, h: ch, r: rowsOf(k) }; });
      y += ch;
    } else {
      let ymax = y;
      col.forEach((cs, ci) => { let yy = y; cs.forEach(k => { L.cards[k] = { x: pad + ci * (cw + gap), y: yy, w: cw, h: hOf(k), r: rowsOf(k) }; yy += hOf(k) + gap; }); ymax = Math.max(ymax, yy - gap); });
      y = ymax;
    }
    y += (land ? 0.8 : 0.6) * fs;
    area = { x: pad, y, w, h: H - pad - y };
    // no ecrã deitado, os três cartões numa só linha (a letra encolhe até caberem)
    L.ok = area.h >= Math.max(0.42 * H, 16 * fs) && cw >= 20 * cfs && (!land || nc === 3);
    // quadros: só a circunferência, ou a circunferência e os gráficos (lado a lado ou um por cima do outro)
    const g2 = 0.5 * fs;
    L.side = false; L.gf = null;
    if (!S.graph) L.circ = area;
    else if (area.w >= 0.9 * area.h) {
      const cw = Math.min(area.h, area.w * 0.45);
      L.side = true;
      L.circ = { x: area.x, y: area.y, w: cw, h: area.h };
      L.gf = { x: area.x + cw + g2, y: area.y, w: area.w - cw - g2, h: area.h };
    } else {
      const ch = Math.min(area.w, area.h * 0.55);
      L.circ = { x: area.x, y: area.y, w: area.w, h: ch };
      L.gf = { x: area.x, y: area.y + ch + g2, w: area.w, h: area.h - ch - g2 };
    }
    const c = L.circ;
    L.cx = c.x + c.w / 2; L.cy = c.y + c.h / 2 + (L.side ? 0 : 0.4 * fs);
    L.R = 0.3 * Math.min(c.w, c.h - 1.4 * fs);
    if (L.gf) {
      const f = L.gf, g = { x0: f.x + 2.4 * fs, x1: f.x + f.w - 1.4 * fs, top: f.y, bot: f.y + f.h };
      if (L.side) {
        // a mesma escala vertical e a mesma altura do centro, para a ligação P → (t, sin t) ficar horizontal
        L.R = Math.min(L.R, (f.h / 2 - 1.8 * fs) / 1.25);
        g.cy = L.cy; g.k = L.R;
      } else {
        g.cy = f.y + f.h / 2 + 0.5 * fs; g.k = Math.min(L.R, (f.h / 2 - 1.6 * fs) / 1.25);
      }
      L.g = g;
      if (f.w < 14 * fs || f.h < 7 * fs) L.ok = false;
    } else L.g = null;
    if (L.R < 3.5 * fs) L.ok = false;
    return L;
  }

  // ---------- primitivas ----------
  function line(x0, y0, x1, y1, c, w, dash) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
  }
  const dashed = (x0, y0, x1, y1, c, w) => line(x0, y0, x1, y1, c, w, [5, 5]);
  function dot(x, y, r, fill, ring) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
    if (ring) { ctx.lineWidth = 2; ctx.strokeStyle = ring; ctx.stroke(); }
  }
  function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function text(s, x, y, px, color, align = "left", font = FONT, weight = 400, style = "") {
    ctx.font = `${style} ${weight} ${px}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillText(s, x, y);
    return ctx.measureText(s).width;
  }
  const tw = (s, px, font = FONT, weight = 400) => { ctx.font = `${weight} ${px}px ${font}`; return ctx.measureText(s).width; };
  // tex: a etiqueta é LaTeX (KaTeX), encolhida se não couber; dentro de um grupo (group/endGroup)
  // todas as etiquetas encolhem na mesma proporção, para ficarem do mesmo tamanho
  let GRP = null;
  const group = () => { GRP = []; };
  function endGroup() {
    const k = Math.min(1, ...GRP.map(([el, w]) => w / el.offsetWidth));
    if (k < 1) GRP.forEach(([el]) => el.style.fontSize = parseFloat(el.style.fontSize) * k + "px");
    GRP = null;
  }
  function button(x, y, w, h, txt, on, kind, extra = {}, col = C.muted, px = 16, tex = false) {
    rrect(x, y, w, h, 8, on ? col : C.btn, on ? col : C.line, 2);
    if (tex) {
      const el = texAt(`bt-${kind}-${extra.v ?? ""}`, txt, x + w / 2, y + h / 2, px, on ? C.on : C.ink);
      if (GRP) GRP.push([el, w - 0.6 * px]); else fit(el, w - 0.6 * px);
    }
    else text(txt, x + w / 2, y + h / 2 + 1, px, on ? C.on : C.ink, "center", FONT, 700);
    hits.push({ kind, ...extra, rect: { x, y, w, h } });
  }
  // caixa de opção; o texto pode ser LaTeX (tex = id da camada KaTeX); dis = esbatida e sem toque
  function cbox(x, y, h, bs, px, on, txt, hit, col = C.muted, { tex = null, dis = false } = {}) {
    const yy = y + (h - bs) / 2, c = dis ? C.grid2 : col;
    rrect(x, yy, bs, bs, 5, on && !dis ? c : C.bg, c, 2);
    if (on && !dis) {
      ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = C.on; ctx.lineWidth = 0.14 * bs;
      ctx.beginPath(); ctx.moveTo(x + 0.24 * bs, yy + 0.52 * bs); ctx.lineTo(x + 0.43 * bs, yy + 0.72 * bs);
      ctx.lineTo(x + 0.77 * bs, yy + 0.3 * bs); ctx.stroke();
      ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    }
    const tcol = dis ? C.faint : C.ink;
    let w;
    if (tex) w = bs * 1.45 + texAt(tex, txt, x + bs * 1.45, y + h / 2, px * 1.08, dis ? C.faint : col, 0, 0.5).offsetWidth;
    else w = bs * 1.45 + text(txt, x + bs * 1.45, y + h / 2 + 1, px, tcol, "left", FONT);
    if (!dis) hits.push({ ...hit, rect: { x, y, w, h } });
    return x + w;
  }
  // cursor (barra, parte até ao valor na cor col, pega redonda); ticks: valores com uma marca por baixo
  function slider(x, y, w, h, lo, hi, v, col, fs, set, ticks = [], from = lo) {
    const cy = y + h / 2, X = u => x + (clamp(u, lo, hi) - lo) / (hi - lo) * w;
    ticks.forEach(t => line(X(t), cy + 0.25 * fs, X(t), cy + 0.45 * fs, C.faint, 1.2));
    ctx.lineCap = "round";
    line(x, cy, x + w, cy, C.grid2, 0.26 * fs);
    line(X(from), cy, X(v), cy, col, 0.26 * fs);
    ctx.lineCap = "butt";
    ctx.beginPath(); ctx.arc(X(v), cy, 0.48 * fs, 0, TAU); ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.bg; ctx.stroke();
    hits.push({ kind: "slide", rect: { x: x - 0.7 * fs, y, w: w + 1.4 * fs, h }, set, val: px => lo + (px - x) / w * (hi - lo) });
  }

  // ---------- KaTeX numa camada por cima ----------
  const layer = document.getElementById("tex");
  const pool = new Map();
  let used = new Set();
  function texAt(id, src, x, y, px, color, ax = 0.5, ay = 0.5, halo = false) {
    let el = pool.get(id);
    if (!el) { el = document.createElement("span"); layer.appendChild(el); pool.set(id, el); }
    if (el._src !== src) {
      el._src = src;
      if (window.katex) katex.render(src, el, { throwOnError: false, strict: false });
      else el.textContent = src;
    }
    el.className = halo ? "tx halo" : "tx";
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${px}px;color:${color};transform:translate(${-ax * 100}%,${-ay * 100}%)`;
    used.add(id);
    return el;
  }
  // só se o ponto de referência estiver dentro do quadro b
  const inBox = (b, x, y, m = 0) => x >= b.x - m && x <= b.x + b.w + m && y >= b.y - m && y <= b.y + b.h + m;
  function texIn(b, id, src, x, y, px, color, ax, ay, halo = true) {
    if (!inBox(b, x, y, -0.3 * L.fs)) return null;
    return texAt(id, src, x, y, px, color, ax, ay, halo);
  }
  function fit(el, w, h = Infinity) {
    const k = Math.min(w / el.offsetWidth, h / el.offsetHeight);
    if (k < 1) el.style.fontSize = parseFloat(el.style.fontSize) * k + "px";
    return k;
  }
  // rótulo com fundo, mantido dentro da zona z; align: "left" (começa em x) ou "right" (acaba em x)
  function tag(id, src, x, y, px, color, align, z) {
    const el = texAt(id, src, x, y, px, color, 0, 0, false);
    const w = el.offsetWidth, h = el.offsetHeight;
    const x0 = clamp(align === "left" ? x : x - w, z.x + 4, z.x + z.w - w - 4);
    const y0 = clamp(y - h / 2, z.y + 4, z.y + z.h - h - 4);
    el.style.left = x0 + "px"; el.style.top = y0 + "px";
    rrect(x0 - 4, y0 - 1, w + 8, h + 2, 5, C.tagbg, null);
  }

  // ---------- desenho ----------
  let raf = 0, last = 0;
  function draw() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    if (S.dir !== 0) {
      let v = S.t + S.dir * S.speed * dt;
      // só pára ao chegar ao fim no sentido em que anda (no fim, o sentido contrário tem de poder arrancar)
      if ((S.dir > 0 && v >= TMAX) || (S.dir < 0 && v <= -TMAX)) { v = clamp(v, -TMAX, TMAX); S.dir = 0; }
      setT(v, { snap: false });
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }
    paint();
    if (S.dir !== 0) { last = now; raf = requestAnimationFrame(frame); } else last = 0;
  }
  const go = () => { last = 0; draw(); };
  function paint() {
    L = layout(); hits = []; used = new Set(); usedInp = false;
    readouts();
    const { fs } = L;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    legend(L.legend, fs);
    cardT(L.cards.t, L.cfs);
    cardVer(L.cards.ver, L.cfs);
    cardMarcas(L.cards.marcas, L.cfs);
    drawCircle(fs);
    if (L.g) drawGraph(fs);
    if (L.side && S.link && S.sin && L.g) {
      // ligação horizontal: P → (t, sin t), à mesma altura nos dois quadros
      const s = Math.sin(S.t), x0 = sx(Math.cos(S.t)), x1 = gx(S.t);
      ctx.globalAlpha = 0.6;
      line(x0 + 0.5 * fs, sy(s), Math.max(x0 + 0.5 * fs, Math.min(x1 - 0.5 * fs, L.g.x1)), sy(s), C.sin, 2, [2, 6]);
      ctx.globalAlpha = 1;
    }
    for (const [id, el] of pool) if (!used.has(id)) el.style.display = "none";
    if (!usedInp) tin.style.display = "none";
  }

  // em cima: a definição da função e o botão do modo escuro
  function legend(b, fs) {
    const bw = b.h * 1.3, w = b.w - bw - 0.4 * fs;
    rrect(b.x, b.y, w, b.h, 8, C.band, C.line, 1.5);
    const long = "E : \\mathbb{R} \\to \\text{circunferência trigonométrica},\\quad E(t) = (\\cos t, \\sin t)";
    let el = texAt("legend", long, b.x + w / 2, b.y + b.h / 2, fs * 1.1, C.ink);
    if (el.offsetWidth > (w - 0.8 * fs) * 1.25) el = texAt("legend", "E(t) = (\\cos t, \\sin t)", b.x + w / 2, b.y + b.h / 2, fs * 1.1, C.ink);
    fit(el, w - 0.8 * fs, b.h);
    button(b.x + b.w - bw, b.y, bw, b.h, dark ? "☀" : "☾", false, "theme", {}, C.muted, fs * 1.05);
  }
  function card(b, col, fs) {
    rrect(b.x, b.y, b.w, b.h, 9, C.band, C.line, 1.2);
    ctx.save(); ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 9); ctx.clip();
    ctx.fillStyle = col; ctx.fillRect(b.x, b.y, 0.25 * fs, b.h);
    ctx.restore();
    const ch = b.r ? (b.r * ROW + (b.r - 1) * RG) * fs : b.h - 2 * CP * fs;
    return { x: b.x + 0.7 * fs, y: b.y + (b.h - ch) / 2, w: b.w - 1.2 * fs };
  }
  const rowY = (c, i, fs) => c.y + i * (ROW + RG) * fs;
  // grupo de botões que ocupam a largura w a partir de x; dis = esbatido e sem toque
  function seg(x, y, w, rh, fs, items, cur, kind, col, px, dis = false) {
    const n = hits.length, g = 0.2 * fs, bh = 1.25 * fs, bw = (w - (items.length - 1) * g) / items.length;
    if (dis) ctx.globalAlpha = 0.45;
    const own = !GRP;
    if (own) group();
    items.forEach(([v, t], i) => button(x + i * (bw + g), y + (rh - bh) / 2, bw, bh, t, cur === v, kind, { v }, col, px, true));
    if (own) endGroup();
    ctx.globalAlpha = 1;
    if (dis) hits.length = n;
    return x + w;
  }

  function cardT(b, fs) {
    const c = card(b, C.arc, fs), rh = ROW * fs, bh = 1.25 * fs, px = fs * 0.95;
    let y = rowY(c, 0, fs);
    texAt("tl", "t", c.x + 0.2 * fs, y + rh / 2, fs * 1.1, C.muted, 0, 0.5);
    const iw = 5 * fs, ix = c.x + c.w - iw, lx = c.x + 1.5 * fs;
    const ticks = []; for (let k = -3; k <= 3; k++) ticks.push(k * TAU);
    slider(lx, y, ix - 0.9 * fs - lx, rh, -TMAX, TMAX, S.t, C.arc, fs, v => { S.dir = 0; setT(v); }, ticks, 0);
    placeT({ x: ix, y: y + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, fs * 0.85);
    // enrolar/desenrolar e, à direita, a velocidade
    y = rowY(c, 1, fs);
    const g = 0.2 * fs, ww = (c.w * 0.56 - g) / 2, by = y + (rh - bh) / 2;
    const PAR = "\\text{❚❚ Parar}";
    group();
    button(c.x, by, ww, bh, S.dir === -1 ? PAR : "\\blacktriangleleft\\ \\text{Desenrolar}", S.dir === -1, "wind", { v: -1 }, C.arc, px, true);
    button(c.x + ww + g, by, ww, bh, S.dir === 1 ? PAR : "\\text{Enrolar}\\ \\blacktriangleright", S.dir === 1, "wind", { v: 1 }, C.arc, px, true);
    const sx0 = c.x + 2 * ww + g + 0.5 * fs;
    seg(sx0, y, c.x + c.w - sx0, rh, fs, [[0.25, "\\text{lenta}"], [0.6, "\\text{média}"], [1.5, "\\text{rápida}"]], S.speed, "speed", C.muted, px);
    endGroup();
    y = rowY(c, 2, fs);
    const p = `\\pi/${S.m}`;
    const items = S.hidePi ? [[-1, "-1"], ["zero", "t = 0"], [1, "+1"]]
      : [["-pi", "-" + p], [-1, "-1"], ["zero", "t = 0"], [1, "+1"], ["+pi", "+" + p]];
    seg(c.x, y, c.w, rh, fs, items, null, "step", C.muted, px);
  }
  function cardVer(b, fs) {
    const c = card(b, C.ink, fs), rh = ROW * fs, bs = 0.8 * fs, px = fs * 0.9, half = c.w * 0.5, third = c.w / 3;
    let y = rowY(c, 0, fs);
    cbox(c.x, y, rh, bs, px, S.graph, "Gráficos", { kind: "tog", key: "graph" }, C.muted);
    cbox(c.x + half, y, rh, bs, px, S.line, "Reta a enrolar", { kind: "tog", key: "line" }, C.arc);
    y = rowY(c, 1, fs);
    cbox(c.x, y, rh, bs, px, S.cos, "\\cos t", { kind: "tog", key: "cos" }, C.cos, { tex: "cb-cos" });
    cbox(c.x + third, y, rh, bs, px, S.sin, "\\sin t", { kind: "tog", key: "sin" }, C.sin, { tex: "cb-sin" });
    cbox(c.x + 2 * third, y, rh, bs, px, S.tan, "\\tan t", { kind: "tog", key: "tan" }, C.tan, { tex: "cb-tan" });
    y = rowY(c, 2, fs);
    cbox(c.x, y, rh, bs, px, S.full, "Curvas completas", { kind: "tog", key: "full" }, C.muted, { dis: !S.graph });
    const linkOk = L.side && S.sin && S.graph;
    cbox(c.x + half, y, rh, bs, px, S.link, "\\text{Ligação } P \\to \\sin", { kind: "tog", key: "link" }, C.sin, { tex: "cb-link", dis: !linkOk });
  }
  function cardMarcas(b, fs) {
    const c = card(b, C.pi, fs), rh = ROW * fs, px = fs * 0.95;
    let y = rowY(c, 0, fs);
    const lx = c.x + text("Marcas de π", c.x, y + rh / 2 + 1, fs * 0.9, C.muted) + 0.7 * fs;
    seg(lx, y, c.x + c.w - lx, rh, fs, [[2, "\\pi/2"], [4, "\\pi/4"], [6, "\\pi/6"], [0, "\\text{nenhuma}"]], S.hidePi ? 0 : S.m, "marks", C.pi, px);
    y = rowY(c, 1, fs);
    cbox(c.x, y, rh, 0.8 * fs, fs * 0.9, S.magnet, "Íman nas marcas de π", { kind: "tog", key: "magnet" }, C.pi, { dis: S.hidePi });
  }

  // moldura de um quadro, com o título em cima à esquerda
  function frame_(b, title, fs, short) {
    rrect(b.x, b.y, b.w, b.h, 9, null, C.line, 1.2);
    if (short && tw(title, fs * 0.8, FONT, 700) > b.w - 1.2 * fs) title = short;
    text(title, b.x + 0.6 * fs, b.y + 0.75 * fs, fs * 0.8, C.muted, "left", FONT, 700);
  }
  function clipTo(b) { ctx.save(); ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 9); ctx.clip(); }

  // ---------- circunferência ----------
  const sx = x => L.cx + L.R * x;
  const sy = y => L.cy - L.R * y;
  // posição (coordenadas matemáticas) do número s da reta, quando o troço [0, t] já está enrolado.
  // Voltas além da primeira ficam numa espiral ligeiramente exterior, para se verem as camadas.
  const GAPR = 0.07;
  const rad = u => 1 + GAPR * Math.max(0, Math.abs(u) - TAU) / TAU;
  function pos(s, t) {
    const u = Math.max(Math.min(0, t), Math.min(Math.max(0, t), s));
    const r = rad(u);
    return [r * Math.cos(u) - (s - u) * Math.sin(u), r * Math.sin(u) + (s - u) * Math.cos(u), u];
  }

  function drawCircle(fs) {
    const b = L.circ, t = S.t, R = L.R, px = fs * 0.7;
    frame_(b, "Circunferência trigonométrica", fs, "Circunferência");
    clipTo(b);
    // eixos
    line(b.x + 0.5 * fs, sy(0), b.x + b.w - 0.5 * fs, sy(0), C.grid2, 1);
    line(sx(0), b.y + 1.5 * fs, sx(0), b.y + b.h - 0.5 * fs, C.grid2, 1);
    for (const v of [-1, 1]) {
      line(sx(v), sy(0) - 4, sx(v), sy(0) + 4, C.axis, 1);
      line(sx(0) - 4, sy(v), sx(0) + 4, sy(v), C.axis, 1);
    }
    texIn(b, "c1x", "1", sx(1) - 0.45 * fs, sy(0) + 0.3 * fs, px, C.muted, 0.5, 0);
    texIn(b, "cm1x", "-1", sx(-1) + 0.5 * fs, sy(0) + 0.3 * fs, px, C.muted, 0.5, 0);
    texIn(b, "c1y", "1", sx(0) - 0.35 * fs, sy(1) + 0.45 * fs, px, C.muted, 1, 0.5);
    texIn(b, "cm1y", "-1", sx(0) - 0.35 * fs, sy(-1) - 0.45 * fs, px, C.muted, 1, 0.5);
    texIn(b, "cO", "O", sx(0) - 0.3 * fs, sy(0) + 0.3 * fs, px, C.muted, 1, 0);

    // circunferência unitária e lado origem dos ângulos [OA], com A(1, 0)
    ctx.beginPath(); ctx.arc(sx(0), sy(0), R, 0, TAU); ctx.strokeStyle = C.axis; ctx.lineWidth = 1.5; ctx.stroke();
    line(sx(0), sy(0), sx(1), sy(0), C.axis, 2.5);

    const c = Math.cos(t), s = Math.sin(t), thick = Math.max(3, 0.2 * fs);
    // tangente: reta OP prolongada até x = 1
    let tanTag = null;
    if (S.tan && Math.abs(c) > 1e-6) {
      const tg = s / c;
      dashed(sx(0), sy(0), sx(1), sy(tg), C.tan, 1);
      line(sx(1), b.y, sx(1), b.y + b.h, C.tan, 1);
      ctx.lineCap = "butt";
      line(sx(1), sy(0), sx(1), sy(tg), C.tan, thick);
      dot(sx(1), sy(tg), 0.22 * fs, C.tan);
      tanTag = tg;
    }
    if (S.line) drawWrappedLine(t, fs);
    // raio OP
    line(sx(0), sy(0), sx(c), sy(s), C.axis, 1.2);
    // projeções de P nos eixos (tracejado), só para as funções escolhidas
    if (S.cos) dashed(sx(c), sy(s), sx(c), sy(0), C.faint, 1);
    if (S.sin) dashed(sx(c), sy(s), sx(0), sy(s), C.faint, 1);
    if (S.cos) dot(sx(c), sy(0), 0.22 * fs, C.cos);
    if (S.sin) dot(sx(0), sy(s), 0.22 * fs, C.sin);
    if (S.cos) {
      line(sx(0), sy(0), sx(c), sy(0), C.cos, thick);
      if (Math.abs(c) > 0.12) texIn(b, "ccos", "\\cos t", sx(c / 2), sy(0) + (s >= 0 ? 0.25 : -0.25) * fs, fs * 0.8, C.cos, 0.5, s >= 0 ? 0 : 1);
    }
    if (S.sin) {
      line(sx(c), sy(0), sx(c), sy(s), C.sin, thick);
      if (Math.abs(s) > 0.12) texIn(b, "csin", "\\sin t", sx(c) + (c >= 0 ? 0.3 : -0.3) * fs, sy(s / 2), fs * 0.8, C.sin, c >= 0 ? 0 : 1, 0.5);
    }
    // ponto P = E(t)
    dot(sx(c), sy(s), 0.36 * fs, C.ink, C.bg);
    ctx.restore();
    texIn(b, "cP", "P", sx(c * 1.16), sy(s * 1.16), fs * 1.05, C.ink, 0.5, 0.5);
    if (tanTag !== null) tag("ctan", `\\tan t = ${VAL.tan}`, sx(1) + 0.4 * fs, sy(tanTag / 2), fs * 0.8, C.tan, "left", b);
  }

  function drawWrappedLine(t, fs) {
    const b = L.circ, SM = 60;
    const a = Math.min(0, t), e = Math.max(0, t);
    // troços que ainda estão direitos (tangentes)
    let p = pos(-SM, t), q = pos(a, t);
    line(sx(p[0]), sy(p[1]), sx(q[0]), sy(q[1]), C.faint, 1.5);
    p = pos(e, t); q = pos(SM, t);
    line(sx(p[0]), sy(p[1]), sx(q[0]), sy(q[1]), C.faint, 1.5);
    // troço enrolado [0, t]
    if (e - a > 1e-6) {
      ctx.strokeStyle = C.arc; ctx.lineWidth = Math.max(3, 0.2 * fs); ctx.lineCap = ctx.lineJoin = "round";
      ctx.beginPath();
      const n = Math.max(2, Math.ceil((e - a) / 0.02));
      for (let i = 0; i <= n; i++) {
        const [x, y] = pos(a + (e - a) * i / n, t);
        i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y));
      }
      ctx.stroke(); ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    }
    // marcas: inteiros (lado interior) e múltiplos de π/m (lado exterior)
    // (sem rótulos em cima do nome do ponto P)
    const Pl = [sx(Math.cos(t) * 1.16), sy(Math.sin(t) * 1.16)];
    const free = (x, y) => Math.hypot(x - Pl[0], y - Pl[1]) > 1.1 * fs;
    const tick = (s, len, col, w) => {
      const [x, y, u] = pos(s, t);
      const nx = Math.cos(u), ny = Math.sin(u);   // normal exterior
      const X = sx(x), Y = sy(y);
      if (!inBox(b, X, Y, fs)) return null;
      line(X - nx * len, Y + ny * len, X + nx * len, Y - ny * len, col, w);
      return { X, Y, nx, ny, wrapped: s >= a && s <= e };
    };
    for (let k = -SM; k <= SM; k++) {
      const r = tick(k, 0.3 * fs, C.ink, 1.3);
      if (!r) continue;
      if (r.wrapped && Math.abs(k) > TAU + 1e-9) continue;       // camadas exteriores: sem rótulo
      const off = 0.8 * fs;
      if (free(r.X - r.nx * off, r.Y + r.ny * off)) texIn(b, "wi" + k, String(k), r.X - r.nx * off, r.Y + r.ny * off, fs * 0.65, C.ink, 0.5, 0.5);
    }
    const km = S.hidePi ? 0 : Math.floor(SM / (PI / S.m));
    for (let k = -km; k <= km; k++) {
      if (k === 0) continue;
      const s = k * PI / S.m;
      const r = tick(s, 0.42 * fs, C.pi, 2);
      if (!r) continue;
      // marcas de π já enroladas: em cada posição só fica o rótulo da última volta
      // (ao passar por uma marca, o rótulo da volta anterior sai e fica o novo, p. ex. π/2 → 5π/2)
      if (r.wrapped && (t > 0 ? s + TAU <= t + 1e-9 : s - TAU >= t - 1e-9)) continue;
      const off = 1.35 * fs;
      if (free(r.X + r.nx * off, r.Y - r.ny * off)) texIn(b, "wp" + k, fracPiTex(k, S.m), r.X + r.nx * off, r.Y - r.ny * off, fs * 0.75, C.pi, 0.5, 0.5);
    }
    // o zero da reta fica sempre em (1, 0)
    dot(sx(1), sy(0), 0.22 * fs, C.arc);
  }

  // ---------- gráficos ----------
  const gx = t => { const { a, b } = S.view; return L.g.x0 + (t - a) / (b - a) * (L.g.x1 - L.g.x0); };
  const gtx = X => { const { a, b } = S.view; return a + (X - L.g.x0) / (L.g.x1 - L.g.x0) * (b - a); };
  const gy = y => L.g.cy - L.g.k * y;

  function drawGraph(fs) {
    const f = L.gf, g = L.g, { a, b } = S.view, t = S.t, cy = g.cy;
    frame_(f, "Gráficos", fs);
    // como mexer na vista (só se couber ao lado do título)
    const hint = "arrastar: deslocar · Shift + arrastar: escala · duplo clique: repor";
    const hw = tw(hint, fs * 0.65, FONT, 400, "italic");
    if (hw < f.w - tw("Gráficos", fs * 0.8, FONT, 700) - 2.5 * fs) text(hint, f.x + f.w - 0.6 * fs, f.y + 0.75 * fs, fs * 0.65, C.faint, "right", FONT, 400, "italic");
    clipTo(f);
    const top = f.y + 1.6 * fs, bot = f.y + f.h - 0.5 * fs;
    // marcas do eixo dos t coordenadas com as da reta a enrolar:
    // múltiplos de π/m (roxo, rótulos por baixo) e inteiros (rótulos por cima).
    // Com pouco zoom, rotula-se só 1 em cada `skip` marcas para não se sobreporem.
    const ppu = (g.x1 - g.x0) / (b - a), st = PI / S.m;
    const skipPi = [1, 2, 3, 4, 6, 12, 24, 48].find(q => q * st * ppu >= 2.6 * fs) || 96;
    const piLab = [];
    if (!S.hidePi) for (let k = Math.ceil(a / st); k <= Math.floor(b / st); k++) {
      const X = gx(k * st);
      if (st * ppu >= 8 || k % skipPi === 0) dashed(X, top, X, bot, k % S.m === 0 ? C.grid2 : C.grid, 1);
      if (st * ppu >= 4 || k % skipPi === 0) line(X, cy - 5, X, cy + 5, C.pi, k % skipPi === 0 ? 2 : 1.2);
      if (k !== 0 && k % skipPi === 0) piLab.push([k, X]);
    }
    const skipInt = [1, 2, 5, 10, 20].find(q => q * ppu >= 1.4 * fs) || 50;
    const intLab = [];
    for (let k = Math.ceil(a); k <= Math.floor(b); k++) {
      if (k === 0 || k % skipInt !== 0) continue;
      // sem marcas de π, a grelha vertical fica nos inteiros rotulados
      if (S.hidePi) dashed(gx(k), top, gx(k), bot, C.grid, 1);
      line(gx(k), cy - 4, gx(k), cy, C.ink, 1.2);
      intLab.push(k);
    }
    for (const v of [-1, 1]) dashed(g.x0, gy(v), g.x1, gy(v), C.grid2, 1);
    // eixos
    line(g.x0 - 0.3 * fs, cy, g.x1 + 0.3 * fs, cy, C.axis, 1.5);
    if (a <= 0 && b >= 0) line(gx(0), top, gx(0), bot, C.axis, 1.5);
    // troço [0, t] desenrolado no eixo (com «Reta a enrolar»)
    if (S.line) {
      ctx.lineCap = "round";
      line(gx(0), cy, gx(t), cy, C.arc, Math.max(3, 0.2 * fs));
      ctx.lineCap = "butt";
      dot(gx(0), cy, 0.22 * fs, C.arc);
    }
    const curves = [];
    if (S.cos) curves.push([Math.cos, C.cos, "cos", "y = \\cos t"]);
    if (S.sin) curves.push([Math.sin, C.sin, "sin", "y = \\sin t"]);
    if (S.tan) curves.push([Math.tan, C.tan, "tan", "y = \\tan t"]);
    const plot = (fn, from, to, isTan) => {
      if (to - from < 1e-6) return;
      const n = Math.ceil((to - from) / (b - a) * (g.x1 - g.x0) / 1.5) + 1;
      let open = false, prev = null;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const x = from + (to - from) * i / n, y = fn(x);
        const bad = isTan && (Math.abs(y) > 8 || (prev !== null && Math.sign(Math.cos(x)) !== Math.sign(Math.cos(prev))));
        prev = x;
        if (bad) { open = false; continue; }
        open ? ctx.lineTo(gx(x), gy(y)) : ctx.moveTo(gx(x), gy(y));
        open = true;
      }
      ctx.stroke();
    };
    ctx.lineJoin = "round";
    for (const [fn, col] of curves) {
      const isTan = fn === Math.tan;
      ctx.strokeStyle = col;
      if (S.full) { ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5; plot(fn, a, b, isTan); ctx.globalAlpha = 1; }
      ctx.lineWidth = Math.max(2.4, 0.16 * fs);
      plot(fn, Math.min(0, t), Math.max(0, t), isTan);
    }
    // ponto que vai à frente em cada curva, com projeção tracejada no eixo dos t
    const pts = [];
    for (const [fn, col, key] of curves) {
      if (fn === Math.tan && Math.abs(Math.cos(t)) < 1e-6) continue;
      const y = fn(t);
      dashed(gx(t), cy, gx(t), gy(y), col, 1.5);
      pts.push({ key, col, y });
    }
    for (const P of pts) dot(gx(t), gy(P.y), 0.3 * fs, P.col, C.bg);
    ctx.restore();

    // rótulos dos eixos
    const zone = { x: f.x, y: f.y + 1.4 * fs, w: f.w, h: f.h - 1.4 * fs };
    const px = fs * 0.68;
    piLab.forEach(([k, X]) => texIn(zone, "gp" + k, fracPiTex(k, S.m), X, cy + 0.35 * fs, fs * 0.72, C.pi, 0.5, 0));
    intLab.forEach(k => texIn(zone, "gi" + k, String(k), gx(k), cy - 0.3 * fs, px, C.ink, 0.5, 1));
    texIn(zone, "g1", "1", g.x0 - 0.4 * fs, gy(1), px, C.muted, 1, 0.5);
    texIn(zone, "gm1", "-1", g.x0 - 0.4 * fs, gy(-1), px, C.muted, 1, 0.5);
    texIn(zone, "gt", "t", g.x1 + 0.3 * fs, cy - 0.3 * fs, fs * 0.9, C.muted, 0.5, 1);
    if (a <= 0 && b >= 0) texIn(zone, "g0", "0", gx(0) - 0.25 * fs, cy + 0.3 * fs, px, C.muted, 1, 0);

    // coordenadas de cada ponto: (t; f(t)), ao lado do ponto; o de cima sobe e o de baixo desce
    const right = gx(t) < (g.x0 + g.x1) / 2;
    const sorted = [...pts].sort((p, q) => q.y - p.y);
    sorted.forEach((P, i) => {
      const Y = gy(P.y);
      if (Y < zone.y || Y > zone.y + zone.h) return;
      const dy = sorted.length > 1 ? (i === 0 ? -0.6 : i === sorted.length - 1 ? 0.6 : 0) * fs : 0;
      tag("gv-" + P.key, `\\left(${VAL.t};\\ ${VAL[P.key]}\\right)`, gx(t) + (right ? 0.6 : -0.6) * fs, Y + dy, fs * 0.78, P.col, right ? "left" : "right", zone);
    });

    // legenda (com fundo), por baixo do título
    const items = curves.map(([, col, key, tx]) => [col, tx, "lg-" + key]);
    if (S.line) items.push([C.arc, "\\text{troço } [0, t] \\text{ desenrolado}", "lg-line"]);
    if (items.length) {
      const lx = f.x + 0.6 * fs, lh = 1.2 * fs;
      let ly = f.y + 2.2 * fs, wmax = 0;
      const els = items.map(([col, tx, id], i) => texAt(id, tx, lx + 1.6 * fs, ly + i * lh, fs * 0.75, col, 0, 0.5));
      els.forEach(el => wmax = Math.max(wmax, el.offsetWidth));
      rrect(lx - 0.3 * fs, ly - 0.6 * fs, wmax + 2.2 * fs, items.length * lh, 5, C.tagbg, null);
      items.forEach(([col], i) => line(lx, ly + i * lh, lx + 1.2 * fs, ly + i * lh, col, 3));
    }
  }

  // ---------- toque e rato ----------
  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const hitAt = (x, y) => hits.find(h => h.rect && inRect(h.rect, x, y)) || null;
  // nos quadros: arrastar P (ou a circunferência) e, no gráfico, a linha de t; arrastar o fundo do gráfico
  // desloca a vista na horizontal; Shift + arrastar estica (para a direita) ou encolhe; duplo clique repõe
  function quadroAt(x, y, shift) {
    const fs = L.fs;
    if (inRect(L.circ, x, y)) {
      const dP = Math.hypot(x - sx(Math.cos(S.t)), y - sy(Math.sin(S.t)));
      if (dP < 1.3 * fs || Math.abs(Math.hypot(x - L.cx, y - L.cy) - L.R) < 0.9 * fs) return "circ";
      return null;
    }
    if (L.g && inRect(L.gf, x, y)) return shift ? "stretch" : Math.abs(x - gx(S.t)) < 0.7 * fs ? "tline" : "pan";
    return null;
  }
  let drag = null;
  function dragTo(x, y) {
    const d = drag, V = S.view;
    if (d.kind === "slide") { d.set(d.val(x)); return; }
    if (d.kind === "circ") {
      const ang = Math.atan2(-(y - L.cy), x - L.cx);
      setT(ang + Math.round((S.t - ang) / TAU) * TAU);
    } else if (d.kind === "tline") {
      setT(gtx(clamp(x, L.g.x0, L.g.x1)), { keepView: true });
    } else if (d.kind === "pan") {
      const dt = (x - d.x) / (L.g.x1 - L.g.x0) * (d.b - d.a);
      V.a = d.a - dt; V.b = d.b - dt; draw();
    } else if (d.kind === "stretch") {
      // para a direita estica, para a esquerda encolhe; o ponto onde se agarrou fica fixo
      const w = clamp((d.b - d.a) * Math.exp(-(x - d.x) / (7 * L.fs)), 0.4, 24 * PI);
      const fx = (d.x - L.g.x0) / (L.g.x1 - L.g.x0);
      V.a = d.tA - fx * w; V.b = V.a + w; draw();
    }
  }
  cv.addEventListener("pointerdown", e => {
    if (document.activeElement === tin) tin.blur();
    const x = e.clientX, y = e.clientY;
    const h = hitAt(x, y);
    if (h && window.gcEvt) gcEvt(h);   // GoatCounter: evento (uma vez por visita)
    if (h) {
      e.preventDefault();
      if (h.kind === "theme") { setDark(!dark, true); for (const el of pool.values()) el._src = null; draw(); return; }
      if (h.kind === "wind") { wind(h.v); return; }
      if (h.kind === "speed") { S.speed = h.v; draw(); return; }
      if (h.kind === "step") { step(h.v); return; }
      if (h.kind === "marks") { setMarks(h.v); return; }
      if (h.kind === "tog") { toggle(h.key); return; }
      if (h.kind === "slide") {
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
        drag = h; dragTo(x, y); cv.style.cursor = "grabbing";
      }
      return;
    }
    const q = quadroAt(x, y, e.shiftKey);
    if (!q) return;
    e.preventDefault();
    drag = { kind: q, x, a: S.view.a, b: S.view.b, tA: L.g && q !== "circ" ? gtx(x) : 0 };
    if (q === "circ" || q === "tline") S.dir = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    cv.style.cursor = q === "pan" ? "grabbing" : cv.style.cursor;
    dragTo(x, y);
  });
  cv.addEventListener("pointermove", e => {
    const x = e.clientX, y = e.clientY;
    if (drag) { dragTo(x, y); return; }
    const h = hitAt(x, y);
    if (h) { cv.style.cursor = h.kind === "slide" ? "ew-resize" : "pointer"; return; }
    const q = quadroAt(x, y, e.shiftKey);
    cv.style.cursor = !q ? "default" : q === "circ" || q === "pan" ? "grab" : q === "stretch" ? "col-resize" : "ew-resize";
  });
  const end = () => { drag = null; cv.style.cursor = "default"; };
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, end));
  cv.addEventListener("dblclick", e => {
    if (L.g && inRect(L.gf, e.clientX, e.clientY)) resetView();
  });

  // teclado (fora da caixa): espaço enrola/para, ←/→ passo π/m (sem marcas: 0,1; Shift: 1), 0 põe t = 0,
  // c, s, t mostram cos, sin, tan; g gráficos; r reta a enrolar
  window.addEventListener("keydown", e => {
    if (document.activeElement === tin) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === " ") wind(S.dir === -1 ? -1 : 1);
    else if (k === "ArrowRight" || k === "ArrowLeft") {
      const d = k === "ArrowRight" ? 1 : -1;
      S.dir = 0;
      if (e.shiftKey) setT(S.t + d, { snap: false });
      else if (S.hidePi) setT(S.t + 0.1 * d, { snap: false });
      else stepPi(d);
    }
    else if (k === "0") step("zero");
    else if (k === "c") toggle("cos");
    else if (k === "s") toggle("sin");
    else if (k === "t") toggle("tan");
    else if (k === "g") toggle("graph");
    else if (k === "r") toggle("line");
    else return;
    e.preventDefault();
  });

  // endereço (tudo opcional): #t=3π/4&marcas=4&graficos&cos&sin&tan
  const hp = decodeURIComponent(location.hash.slice(1)).split("&");
  for (const kv of hp) {
    const [key, val] = kv.split("=");
    if (key === "marcas" && [0, 2, 4, 6].includes(+val)) setMarks(+val);
    else if (key === "graficos") S.graph = true;
    else if (["cos", "sin", "tan", "completas"].includes(key)) S[key === "completas" ? "full" : key] = true;
  }
  const hm = decodeURIComponent(location.hash).match(/(?:^|[#&])t=([^&]+)/);
  const h0 = hm ? parseT(hm[1]) : null;
  if (h0 !== null) setT(h0, { snap: false });
  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  if (document.fonts) document.fonts.ready.then(draw);
  resize();
})();
</script>
</body>
</html>
