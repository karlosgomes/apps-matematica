<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oscilador Harmónico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root { --phys: #00838f; --btn: #eef2f6; --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --phys: #4dd0e1; --btn: #212b36; --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* caixas de texto (tempo e janela de tempo), postas por cima do canvas pelo layout */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.3em; border: 2px solid var(--line); border-radius: 7px;
         background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; text-align: right; outline: none; }
  .inp:focus { border-color: var(--focus); }
  .inp.bad { border-color: var(--bad); background: var(--badbg); }

  /* janela da tabela com ruído (por cima do canvas) */
  /* no ecrã deitado fica por cima dos controlos (à esquerda); ao alto, em baixo — o gráfico fica à vista */
  .dlg { position: fixed; z-index: 3; left: 0.8rem; top: 0.8rem; width: min(25rem, calc(100vw - 1.6rem)); max-height: calc(100vh - 1.6rem); overflow: auto;
         box-sizing: border-box; padding: 0.7rem 0.9rem 0.8rem; background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px;
         box-shadow: 0 6px 24px rgba(0,0,0,0.18); font: 15px/1.35 "Atkinson Hyperlegible", system-ui, sans-serif; }
  .dlg[hidden] { display: none; }
  @media (max-aspect-ratio: 11/10), (max-width: 639px) { .dlg { top: auto; bottom: 0.8rem; max-height: 56vh; } .dlg textarea { height: 7rem; } }
  .dlg .th { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; font-weight: 700; font-size: 1.05em; }
  .dlg .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.8rem; margin: 0.35rem 0; }
  .dlg label { display: inline-flex; align-items: center; gap: 0.3rem; }
  .dlg input, .dlg select { font: 14px "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 7px; padding: 0.15rem 0.3rem; }
  .dlg input { width: 4.2em; text-align: right; }
  .dlg input:focus, .dlg select:focus { outline: none; border-color: var(--focus); }
  .dlg input.bad { border-color: var(--bad); background: var(--badbg); }
  .dlg button { font: 700 14px "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--ink); background: var(--btn); border: 2px solid var(--line); border-radius: 8px; padding: 0.25rem 0.6rem; cursor: pointer; }
  .dlg button:hover { border-color: var(--focus); }
  .dlg .x { padding: 0 0.5rem; font-size: 18px; line-height: 1.3; }
  .dlg textarea { width: 100%; box-sizing: border-box; height: 11rem; margin-top: 0.3rem; resize: vertical; font: 13px/1.35 "IBM Plex Mono", ui-monospace, monospace;
                  color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 7px; padding: 0.3rem 0.4rem; }
  .dlg .note { font-size: 13px; opacity: 0.8; margin: 0.2rem 0; }
  .dlg input.wide { width: 13em; text-align: left; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  .dlg input.wide::placeholder { color: var(--line); opacity: 1; }
  .dlg .fb { min-height: 1.4em; margin: 0.3rem 0 0.1rem; color: var(--phys); font-size: 16px; }
  .dlg .fb.bad { color: var(--bad); font-weight: 700; font-size: 14px; }
  .dlg .msg { min-height: 1.2em; font-size: 13px; color: var(--focus); font-weight: 700; }
</style>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<div id="fxd" class="dlg" role="dialog" aria-label="Escrever a função" hidden>
  <div class="th"><span>Escrever a função</span><button class="x" id="fxd-x" title="Fechar (Esc)">×</button></div>
  <div class="row">
    <label><span id="fxl">d(t) =</span> <input id="fx" class="wide" autocomplete="off" spellcheck="false" aria-label="Função sinusoidal"></label>
    <label>Unidade <select id="fxu" title="Unidade de D e de A na função escrita"><option value="1">m</option><option value="0.1">dm</option><option value="0.01">cm</option></select></label>
  </div>
  <div class="note" id="fxex"></div>
  <div class="fb" id="fxfb"></div>
  <div class="msg" id="fxnote"></div>
  <div class="note">Enter aplica a função: os cartões (montagem, m, k, L₀, x₀, v₀) passam a fazer este movimento.</div>
</div>
<div id="tab" class="dlg" role="dialog" aria-label="Tabela com ruído" hidden>
  <div class="th"><span id="tab-title">Tabela t × d com ruído</span><button class="x" id="tab-x" title="Fechar (Esc)">×</button></div>
  <div class="row">
    <label>t de <input id="tab-a" inputmode="decimal"> a <input id="tab-b" inputmode="decimal"> s</label>
  </div>
  <div class="row">
    <label>Passo <input id="tab-h" inputmode="decimal"> s</label> <span id="tab-n" class="note"></span>
    <label>Ruído <input id="tab-r" inputmode="decimal"> % de A</label>
  </div>
  <div class="row">
    <label>Unidade de <span id="tab-v">d</span> <select id="tab-u"><option value="1">m</option><option value="10">dm</option><option value="100">cm</option></select></label>
    <label>Casas decimais <select id="tab-dec"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></label>
  </div>
  <div class="row">
    <label>Semente <input id="tab-s" inputmode="numeric"></label>
    <button id="tab-new" title="Outra semente: outro ruído">🎲 Outro ruído</button>
  </div>
  <div class="note">Com a mesma semente, todos obtêm a mesma tabela. Os pontos aparecem no gráfico enquanto esta janela estiver aberta.</div>
  <textarea id="tab-out" readonly aria-label="Tabela"></textarea>
  <div class="row">
    <button id="tab-copy" title="Copia com tabulações e vírgula decimal (cola na folha de cálculo ou na app Estatística)">Copiar</button>
    <button id="tab-csv" title="Ficheiro CSV com «;» e vírgula decimal">⤓ CSV</button>
    <button id="tab-est" title="Abre a app Estatística, em duas variáveis, com a nuvem de pontos">Estatística ↗</button>
    <button id="tab-folha" title="Abre a Folha de cálculo com a tabela numa folha nova">Folha de cálculo ↗</button>
  </div>
  <div class="msg" id="tab-msg"></div>
</div>
<canvas id="cv" aria-label="Oscilador harmónico: esfera presa a uma mola, na vertical ou na horizontal, e o gráfico da distância d ao longo do tempo"></canvas>
<script>
(() => {
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", faint: "#6b7685", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    ceil: "#8a96a3", spring: "#4b5563", ball: "#1565c0", curve: "#d32f2f", eq: "#2e7d32", hot: "#ef6c00", phys: "#00838f",
    H: ["#1565c0", "#2e7d32", "#ef6c00", "#7b1fa2", "#00838f"],
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", faint: "#8592a1", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    ceil: "#6b7785", spring: "#aab4c0", ball: "#64a8ff", curve: "#ff6b6b", eq: "#5cc26a", hot: "#ffa040", phys: "#4dd0e1",
    H: ["#64a8ff", "#5cc26a", "#ffa040", "#c792ea", "#4dd0e1"],
  };
  const C = { ...LIGHT };
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const TAU = 2 * Math.PI;

  // ---------- estado ----------
  const g = 9.8;
  const S = {
    pos: "vertical",               // montagem: vertical (suspensa) ou horizontal (sem atrito)
    ref: "teto", Hc: 1,
    href: "parede",                // na horizontal: d a partir da parede O, ou x na reta numérica (origem no equilíbrio)          // na vertical, d mede-se a partir do teto ou do solo (Hc = altura do teto ao solo, m)
    m: 0.5, k: 20, L: 0.4, x0: 0.15, v0: 0,
    t: 0, running: false, speed: 1,
    win: 10,                       // janela de tempo do gráfico (s)
    dir: "down",                   // eixo d do gráfico: para baixo (como a mola) ou para cima (habitual)
    scale: 1,                      // escala de d: 0–1, 0–2 ou 0–4 m
    graph: false, mid: false, law: false, phys: false,   // o que se mostra (tudo escondido ao início)
    keep: false, traces: [],       // traços guardados: { pos, ref, Hc, m, k, L, x0, v0, t, c }
  };
  // limites dos cursores; x₀ e v₀ acompanham a escala (x₀ até ± escala, v₀ até ± 2,5 × escala)
  const LIM = { m: [0.1, 2, 0.05], k: [1, 100, 1], L: [0.2, 3, 0.05], x0: [-0.3, 0.3, 0.01], v0: [-1, 1, 0.05] };
  const lim = key => key === "x0" ? [-S.scale, S.scale, 0.01] : key === "v0" ? [-2.5 * S.scale, 2.5 * S.scale, 0.05] : LIM[key];
  const NCORES = 5, MAXTRACOS = 8;
  let nextColor = 0;

  const fmt = (x, dec = 2, trim = false) => {
    if (!isFinite(x)) return "—";
    let s = (Math.round(x * 10 ** dec) / 10 ** dec).toFixed(dec);
    if (trim && s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return s.replace(".", ",").replace(/^-/, "−");
  };
  const texNum = (x, dec = 2, trim = false) => fmt(x, dec, trim).replace(",", "{,}").replace("−", "-");
  const parseNum = s => {
    s = String(s).trim().replace(/\s/g, "").replace("−", "-").replace(",", ".");
    return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
  };

  // ---------- física: x(t) = x₀ cos ωt + (v₀/ω) sin ωt = A cos(ωt + φ) ----------
  // x₀ e v₀ medem-se no sentido em que d cresce (para baixo a partir do teto; para cima a partir do solo)
  const isSolo = P => P.pos === "vertical" && P.ref === "solo";
  const isReta = P => P.pos === "horizontal" && P.href === "reta";
  function model(P = S) {
    const w = Math.sqrt(P.k / P.m);
    // posição de equilíbrio: na vertical o peso estica a mola mg/k; na horizontal (sem atrito) não
    const Dt = P.L + (P.pos === "vertical" ? P.m * g / P.k : 0);   // distância do teto (ou de O) ao equilíbrio
    const D = isSolo(P) ? P.Hc - Dt : isReta(P) ? 0 : Dt;
    const A = Math.hypot(P.x0, P.v0 / w);
    let phi = Math.atan2(-P.v0 / w, P.x0);
    if (phi < -Math.PI + 1e-9) phi = Math.PI;    // φ ∈ ]−π, π]
    return { w, D, Dt, A, phi, T: TAU / w };
  }
  const dOf = (M, t) => M.D + M.A * Math.cos(M.w * t + M.phi);
  const vOf = (M, t) => -M.A * M.w * Math.sin(M.w * t + M.phi);
  function niceStep(range, target) {
    const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }

  // ---------- ações ----------
  // mudar um parâmetro inicial recomeça o movimento em t = 0;
  // com «Manter traços» ligado, o traço já desenhado fica guardado
  // (ao arrastar um cursor só o primeiro passo guarda, porque depois t = 0)
  function saveTrace() {
    if (!S.keep || S.t <= 0) return;
    const { pos, ref, Hc, href, m, k, L, x0, v0, t } = S;
    S.traces.push({ pos, ref, Hc, href, m, k, L, x0, v0, t, c: nextColor++ % NCORES });
    if (S.traces.length > MAXTRACOS) S.traces.shift();
  }
  const setParam = key => v => {
    const [lo, hi, st] = lim(key);
    v = clamp(Math.round(v / st) * st, lo, hi);
    v = +v.toFixed(4);
    if (v === S[key]) return;
    saveTrace(); S[key] = v; S.t = 0; draw();
  };
  const setTime = x => { S.running = false; S.t = Math.max(0, x); draw(); };
  const setWin = x => { S.win = clamp(x, 0.5, 600); };
  function setPos(p) {
    if (p === S.pos) return;
    saveTrace(); S.pos = p; S.t = 0;
    history.replaceState(null, "", p === "horizontal" ? "#horizontal" : location.pathname + location.search);
    draw();
  }
  // trocar a referência de d (teto ↔ solo) não muda o movimento: x₀ e v₀ trocam de sinal
  // e o tempo continua; os traços guardados passam para a nova referência
  function setRef(r) {
    if (r === S.ref) return;
    S.ref = r; S.x0 = -S.x0; S.v0 = -S.v0;
    S.traces.forEach(tr => { if (tr.pos === "vertical" && tr.ref !== r) { tr.ref = r; tr.Hc = S.Hc; tr.x0 = -tr.x0; tr.v0 = -tr.v0; } });
    // se a esfera deixar de caber, a escala passa à menor que chega
    const M = model();
    if (M.D + M.A + 0.03 > S.scale) S.scale = [1, 2, 4].find(v => M.D + M.A + 0.03 <= v) || 4;
    draw();
  }
  // na horizontal: d desde a parede ↔ x na reta numérica (x = d − L₀); o movimento é o mesmo
  function setHref(r) {
    if (r === S.href) return;
    S.href = r;
    S.traces.forEach(tr => { if (tr.pos === "horizontal") tr.href = r; });
    const M = model();
    if (M.D + M.A + 0.03 > S.scale) S.scale = [1, 2, 4].find(v => M.D + M.A + 0.03 <= v) || 4;
    draw();
  }
  const toggleRef = () => S.pos === "vertical" ? setRef(S.ref === "solo" ? "teto" : "solo") : setHref(S.href === "reta" ? "parede" : "reta");
  const VAR = () => isReta(S) ? "x" : "d";
  const setH = x => { S.Hc = clamp(x, 0.5, 4); S.traces.forEach(tr => { if (isSolo(tr)) tr.Hc = S.Hc; }); };
  function toggleRun() { S.running = !S.running; go(); }
  function restart() { S.running = false; S.t = 0; draw(); }
  // fim do cursor do tempo: a janela; se o tempo passar do fim, alarga-se de janela em janela
  const tMax = () => Math.max(1, Math.ceil(S.t / S.win - 1e-9)) * S.win;

  // ---------- canvas ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, L = null, hits = [];
  function resize() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- caixas de texto ----------
  const INP = {};
  function makeInput(id, label, get, set, step, dec) {
    const el = document.createElement("input");
    el.className = "inp"; el.id = id; el.type = "text"; el.inputMode = "decimal"; el.autocomplete = "off"; el.spellcheck = false;
    el.setAttribute("aria-label", label);
    document.body.appendChild(el);
    const show = () => { el.classList.remove("bad"); el.value = fmt(get(), dec, true); };
    const commit = () => {
      const x = parseNum(el.value);
      if (isFinite(x)) { set(x); show(); draw(); }
      else el.classList.add("bad");
    };
    el.addEventListener("change", commit);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") { commit(); el.blur(); }
      else if (e.key === "Escape") { show(); el.blur(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        set(get() + (e.key === "ArrowUp" ? 1 : -1) * step * (e.shiftKey ? 10 : 1));
        show(); draw();
      }
    });
    INP[id] = { el, get, dec };
  }
  makeInput("tin", "Tempo t em segundos", () => S.t, setTime, 0.01, 2);
  makeInput("win", "Janela de tempo do gráfico, em segundos (0,5 a 600)", () => S.win, setWin, 1, 2);
  makeInput("hin", "Altura do teto ao solo, em metros (0,5 a 4)", () => S.Hc, setH, 0.01, 2);
  let usedInp = new Set();
  function place(id, r, px) {
    const { el, get, dec } = INP[id];
    el.style.display = "";
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
    el.style.fontSize = px + "px";
    if (document.activeElement !== el) { el.value = fmt(get(), dec, true); el.classList.remove("bad"); }
    usedInp.add(id);
  }

  // ---------- função escrita pelo utilizador: d(t) = D + A cos(ωt + φ) (ou com sin) ----------
  // analisador pequeno: números (vírgula ou ponto), π/pi, t, + − * / ^, parênteses, multiplicação implícita, sin/sen/cos
  function fxParse(src) {
    let s = src.replace(/^\s*[dx]\s*\(\s*t\s*\)\s*=/i, "").replace(/[−–]/g, "-").replace(/[·×]/g, "*").replace(/\s+/g, "");
    s = s.replace(/(\d),(\d)/g, "$1.$2");
    const tk = [], re = /(\d+\.?\d*|\.\d+)|(pi|π)|(sin|sen|cos)|(t)|([-+*/^()])/gy;
    let m, i = 0;
    while (i < s.length) {
      re.lastIndex = i; m = re.exec(s);
      if (!m) throw new Error(`Não percebi «${s.slice(i, i + 6)}».`);
      tk.push(m[1] ? { k: "n", v: parseFloat(m[1]) } : m[2] ? { k: "n", v: Math.PI } : m[3] ? { k: "f", v: m[3] === "sen" ? "sin" : m[3] } : m[4] ? { k: "t" } : { k: m[5] });
      i = re.lastIndex;
    }
    if (!tk.length) throw new Error("Escreve uma função.");
    let p = 0;
    const peek = () => tk[p], eat = k => { if (!tk[p] || tk[p].k !== k) throw new Error(k === ")" ? "Falta fechar um parêntese." : "Expressão incompleta."); return tk[p++]; };
    const starts = q => q && (q.k === "n" || q.k === "t" || q.k === "f" || q.k === "(");
    function expr() { let a = term(); while (peek() && (peek().k === "+" || peek().k === "-")) { const o = tk[p++].k, b = term(); a = { k: o, a, b }; } return a; }
    function term() {
      let a = unary();
      for (;;) {
        const q = peek();
        if (q && (q.k === "*" || q.k === "/")) { p++; const b = unary(); a = { k: q.k, a, b }; }
        else if (starts(q)) { const b = power(); a = { k: "*", a, b }; }     // multiplicação implícita: 2cos(…), πt, 2(…)
        else return a;
      }
    }
    function unary() { const q = peek(); if (q && (q.k === "-" || q.k === "+")) { p++; const a = unary(); return q.k === "-" ? { k: "neg", a } : a; } return power(); }
    function power() { const a = atom(); if (peek() && peek().k === "^") { p++; return { k: "^", a, b: unary() }; } return a; }
    function atom() {
      const q = tk[p++];
      if (!q) throw new Error("Expressão incompleta.");
      if (q.k === "n") return { k: "n", v: q.v };
      if (q.k === "t") return { k: "t" };
      if (q.k === "(") { const a = expr(); eat(")"); return a; }
      if (q.k === "f") {
        // sin(…) ou sin 2t (sem parênteses: até ao fim do produto)
        let a; if (peek() && peek().k === "(") { p++; a = expr(); eat(")"); } else a = term();
        return { k: "fn", f: q.v, a };
      }
      throw new Error("Expressão mal escrita.");
    }
    const ast = expr();
    if (p < tk.length) throw new Error(tk[p].k === ")" ? "Há um parêntese a mais." : "Expressão mal escrita.");
    return ast;

  // grupo de botões que ocupam a largura w a partir de x; devolve o fim
  function seg(x, y, w, rh, fs, items, cur, kind, col, px) {
    const g = 0.2 * fs, bh = 1.25 * fs, bw = (w - (items.length - 1) * g) / items.length;
    items.forEach(([v, t], i) => button(x + i * (bw + g), y + (rh - bh) / 2, bw, bh, t, cur === v, kind, { v }, col,
      Math.min(px, px * (bw - 0.5 * fs) / tw(t, px, FONT, 700))));
    return x + w;
  }

  function cardMont(b, fs) {
    const c = card(b, C.muted, fs), rh = ROW * fs, y = rowY(c, 0, fs);
    const lx = c.x + text("Montagem", c.x, y + rh / 2 + 1, fs * 0.8, C.muted) + 0.7 * fs;
    seg(lx, y, c.x + c.w - lx, rh, fs, [["vertical", "↕ Vertical"], ["horizontal", "↔ Horizontal"]], S.pos, "pos", C.muted, fs * 0.85);
    // 2.ª linha: na vertical, a partir de onde se mede d (teto ou solo) e, a partir do solo, a altura do teto
    const y2 = rowY(c, 1, fs), px = fs * 0.8;
    if (S.pos !== "vertical") {
      const l3 = c.x + text("Medir", c.x, y2 + rh / 2 + 1, px, C.muted) + 0.5 * fs;
      seg(l3, y2, c.x + c.w - l3, rh, fs, [["parede", "d desde a parede"], ["reta", "x na reta"]], S.href, "href", C.muted, fs * 0.8);
      return;
    }
    const l2 = c.x + text("d desde", c.x, y2 + rh / 2 + 1, px, C.muted) + 0.5 * fs;
    const solo = S.ref === "solo", iw = 3.2 * fs, hw = solo ? tw("H", px) + iw + tw("m", px) + 1.3 * fs : 0;
    seg(l2, y2, c.x + c.w - l2 - hw, rh, fs, [["teto", "o teto"], ["solo", "o solo"]], S.ref, "ref", C.muted, fs * 0.8);
    if (solo) {
      const ux = c.x + c.w - tw("m", px), ix = ux - 0.3 * fs - iw;
      texAt("hl", "H", ix - 0.3 * fs, y2 + rh / 2, fs * 0.9, C.muted, 1, 0.5);
      place("hin", { x: ix, y: y2 + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, px);
      text("m", c.x + c.w, y2 + rh / 2 + 1, px, C.muted, "right");
    }
  }
  function cardTempo(b, fs) {
    const c = card(b, C.hot, fs), rh = ROW * fs, bh = 1.25 * fs;
    let y = rowY(c, 0, fs);
    const lab = S.running ? "❚❚ Parar" : S.t > 0 ? "▶ Continuar" : "▶ Ligar o tempo";
    const bw = Math.max(tw("▶ Ligar o tempo", fs * 0.85, FONT, 700), tw("▶ Continuar", fs * 0.85, FONT, 700)) + 1.2 * fs;
    button(c.x, y + (rh - bh) / 2, bw, bh, lab, true, "run", {}, C.hot, fs * 0.85);
    const rw = 2.2 * fs;
    button(c.x + bw + 0.3 * fs, y + (rh - bh) / 2, rw, bh, "↺", false, "reset", {}, C.muted, fs);
    const sx = c.x + bw + rw + 0.9 * fs;
    seg(sx, y, c.x + c.w - sx, rh, fs, [[0.25, "¼×"], [0.5, "½×"], [1, "1×"]], S.speed, "speed", C.muted, fs * 0.85);
    y = rowY(c, 1, fs);
    texAt("tl", "t", c.x + 0.2 * fs, y + rh / 2, fs * 0.95, C.muted, 0, 0.5);
    const iw = 3.6 * fs, ux = c.x + c.w - tw("s", fs * 0.8) , ix = ux - 0.3 * fs - iw, lx = c.x + 1.4 * fs;
    slider(lx, y, ix - 0.9 * fs - lx, rh, 0, tMax(), S.t, C.hot, fs, setTime);
    place("tin", { x: ix, y: y + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, fs * 0.8);
    text("s", c.x + c.w, y + rh / 2 + 1, fs * 0.8, C.muted, "right");
  }
  function cardVer(b, fs) {
    const c = card(b, C.curve, fs), rh = ROW * fs, bs = 0.8 * fs, px = fs * 0.8, half = c.w * 0.52;
    let y = rowY(c, 0, fs);
    cbox(c.x, y, rh, bs, px, S.graph, `Gráfico de ${VAR()}(t)`, { kind: "graph" }, C.curve);
    cbox(c.x + half, y, rh, bs, px, S.mid, "Linha média", { kind: "mid" }, C.eq);
    y = rowY(c, 1, fs);
    cbox(c.x, y, rh, bs, px, S.law, `Expressão de ${VAR()}(t)`, { kind: "law" }, C.ink);
    cbox(c.x + half, y, rh, bs, px, S.phys, "Grandezas", { kind: "phys" }, C.phys);
  }
  // linha de um parâmetro: nome (KaTeX), cursor, valor e unidade
  // off: linha esbatida e sem toque (L₀ não conta na reta numérica)
  function paramRow(c, i, fs, key, tex, unit, col, dec, ticks, off = false) {
    const rh = ROW * fs, y = rowY(c, i, fs), [lo, hi] = lim(key);
    texAt("pl-" + key, tex, c.x + 0.1 * fs, y + rh / 2, fs * 0.95, off ? C.faint : C.muted, 0, 0.5);
    const vw = tw("−0,30", fs * 0.85, MONO, 600), uw = tw("N/m", fs * 0.75) + 0.3 * fs;
    const lx = c.x + 2.4 * fs, rx = c.x + c.w - uw - vw - 1 * fs;
    if (off) ctx.globalAlpha = 0.35;
    slider(lx, y, rx - lx, rh, lo, hi, S[key], col, fs, setParam(key), ticks);
    if (off) hits.pop();
    text(fmt(S[key], dec), c.x + c.w - uw, y + rh / 2 + 1, fs * 0.85, C.ink, "right", MONO, 600);
    text(unit, c.x + c.w, y + rh / 2 + 1, fs * 0.75, C.muted, "right");
    ctx.globalAlpha = 1;
  }
  function cardMola(b, fs) {
    const c = card(b, C.spring, fs);
    paramRow(c, 0, fs, "m", "m", "kg", C.ball, 2);
    paramRow(c, 1, fs, "k", "k", "N/m", C.spring, S.k < 10 && Math.abs(S.k - Math.round(S.k)) > 1e-9 ? 2 : 0);
    paramRow(c, 2, fs, "L", "L_0", "m", C.spring, 2, [], isReta(S));
  }
  function cardCI(b, fs) {
    const c = card(b, C.ball, fs);
    paramRow(c, 0, fs, "x0", "x_0", "m", C.ball, 2, [0]);
    paramRow(c, 1, fs, "v0", "v_0", "m/s", C.ball, 2, [0]);
  }
  function cardGraf(b, fs) {
    const c = card(b, C.faint, fs), rh = ROW * fs, bh = 1.25 * fs, px = fs * 0.8;
    let y = rowY(c, 0, fs);
    let lx = c.x + text(`Escala de ${VAR()}`, c.x, y + rh / 2 + 1, px, C.muted) + 0.7 * fs;
    const pm = isReta(S);
    seg(lx, y, c.x + c.w - lx, rh, fs, [[1, pm ? "±1 m" : "0–1 m"], [2, pm ? "±2 m" : "0–2 m"], [4, pm ? "±4 m" : "0–4 m"]], S.scale, "scale", C.muted, fs * 0.8);
    y = rowY(c, 1, fs);
    lx = c.x + text("Janela", c.x, y + rh / 2 + 1, px, C.muted) + 0.5 * fs;
    const iw = 3.2 * fs;
    place("win", { x: lx, y: y + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, fs * 0.8);
    let x = lx + iw + 0.3 * fs;
    x += text("s", x, y + rh / 2 + 1, px, C.muted) + 0.9 * fs;
    if (S.pos === "vertical" && S.ref !== "solo") {
      x += text("Eixo d", x, y + rh / 2 + 1, px, C.muted) + 0.5 * fs;
      seg(x, y, c.x + c.w - x, rh, fs, [["down", "↓ mola"], ["up", "↑ habitual"]], S.dir, "dir", C.muted, fs * 0.75);
    }
    y = rowY(c, 2, fs);
    const ex = cbox(c.x, y, rh, 0.8 * fs, px, S.keep, "Manter traços", { kind: "keep" }, C.muted);
    if (S.traces.length) {
      const t = `Apagar (${S.traces.length})`, w = tw(t, fs * 0.8, FONT, 700) + 1.2 * fs;
      button(Math.max(ex + 0.6 * fs, c.x + c.w - w), y + (rh - bh) / 2, w, bh, t, false, "clear", {}, C.muted, fs * 0.8);
    }
    y = rowY(c, 3, fs);
    const g2 = 0.3 * fs, bw2 = (c.w - g2) / 2, b1 = "⤓ Obter dados…", b2 = "ƒ Escrever a função…";
    const px2 = Math.min(fs * 0.8, fs * 0.8 * (bw2 - 0.8 * fs) / Math.max(tw(b1, fs * 0.8, FONT, 700), tw(b2, fs * 0.8, FONT, 700)));
    button(c.x, y + (rh - bh) / 2, bw2, bh, b1, TAB.open, "table", {}, C.muted, px2);
    button(c.x + bw2 + g2, y + (rh - bh) / 2, bw2, bh, b2, FX.open, "func", {}, C.muted, px2);
  }

  // expressão de d(t) com os valores atuais
  function lawStrip(b, fs, mod) {
    const fase = Math.abs(mod.phi) < 0.005 ? "" : ` ${mod.phi < 0 ? "-" : "+"} ${texNum(Math.abs(mod.phi), 2)}`;
    const cosP = `${texNum(mod.A, 3)}\\cos\\left(${texNum(mod.w, 2)}\\,t${fase}\\right)`;
    const src = isReta(S) ? `x(t) = ${mod.A < 1e-9 ? "0" : cosP}` : `d(t) = ${texNum(mod.D, 3)}` + (mod.A < 1e-9 ? "" : ` + ${cosP}`);
    fit(texAt("law", src, b.x + b.w / 2, b.y + b.h / 2 - 0.1 * fs, fs * 1.35, C.ink), b.w - fs, b.h);
  }
  // grandezas: ω, T, f, D, A, φ
  function physStrip(b, fs, mod) {
    rrect(b.x, b.y, b.w, b.h, 8, null, C.phys, 1.2);
    const vert = S.pos === "vertical";
    const l1 = `\\omega = \\sqrt{\\tfrac{k}{m}} = ${texNum(mod.w, 2)}\\ \\text{rad/s}\\qquad T = \\tfrac{2\\pi}{\\omega} = ${texNum(mod.T, 2)}\\ \\text{s}\\qquad f = \\tfrac{1}{T} = ${texNum(1 / mod.T, 2)}\\ \\text{Hz}`;
    const l2 = isReta(S) ? `x = d - L_0\\qquad A = \\sqrt{x_0^2 + \\left(\\tfrac{v_0}{\\omega}\\right)^2} = ${texNum(mod.A, 3)}\\ \\text{m}\\qquad \\varphi = ${texNum(mod.phi, 2)}\\ \\text{rad}` : `D = ${isSolo(S) ? "H - \\left(L_0 + \\tfrac{mg}{k}\\right)" : vert ? "L_0 + \\tfrac{mg}{k}" : "L_0"} = ${texNum(mod.D, 3)}\\ \\text{m}\\qquad A = \\sqrt{x_0^2 + \\left(\\tfrac{v_0}{\\omega}\\right)^2} = ${texNum(mod.A, 3)}\\ \\text{m}\\qquad \\varphi = ${texNum(mod.phi, 2)}\\ \\text{rad}`;
    const e1 = texAt("ph1", l1, b.x + b.w / 2, b.y + b.h * 0.27, fs * 0.8, C.phys);
    const e2 = texAt("ph2", l2, b.x + b.w / 2, b.y + b.h * 0.72, fs * 0.8, C.phys);
    const k = Math.min(1, (b.w - fs) / Math.max(e1.offsetWidth, e2.offsetWidth));
    if (k < 1) [e1, e2].forEach(e => e.style.fontSize = fs * 0.8 * k + "px");
  }

  // moldura de um quadro, com o título em cima à esquerda; devolve a largura do título
  function frame_(b, title, fs, short) {
    rrect(b.x, b.y, b.w, b.h, 9, null, C.line, 1.2);
    if (short && tw(title, fs * 0.8, FONT, 700) > b.w - 1.2 * fs) title = short;
    return 0.6 * fs + text(title, b.x + 0.6 * fs, b.y + 0.75 * fs, fs * 0.8, C.muted, "left", FONT, 700);
  }

  // ---------- a mola e o gráfico ----------
  function panels(fs, mod) {
    const vert = S.pos === "vertical", top = S.scale, sc = L.scene, gr = L.graph;
    const dNow = dOf(mod, S.t);
    const R = clamp((13 + 6 * Math.cbrt(S.m)) * fs / 16, 0.6 * fs, 1.5 * fs);   // raio só visual
    // escala vertical comum à cena (vertical) e ao gráfico: de iy0 (d = 0) a iy1 (d = top)
    const iy0 = gr.y + 2.0 * fs, iy1 = gr.y + gr.h - 1.6 * fs;
    const Ys = dd => iy0 + (dd / top) * (iy1 - iy0);
    const solo = isSolo(S);
    const down = vert && !solo && S.dir === "down";
    const reta = isReta(S), lo = reta ? -top : 0, V = reta ? "x" : "d";
    // na reta numérica o gráfico vai de −top a top, com o eixo t a meio
    const Yg = down ? Ys : reta ? xx => (iy0 + iy1) / 2 - (xx / top) * (iy1 - iy0) / 2 : dd => iy1 - (dd / top) * (iy1 - iy0);
    // na cena vertical: a partir do teto, d cresce para baixo (Ys); a partir do solo, para cima (Yg)
    const Yc = solo ? Yg : Ys, ceilD = solo ? S.Hc : 0;

    // ---- cena ----
    const scTitle = vert ? "Mola suspensa" : reta ? "Mola na horizontal (sem atrito) — reta numérica com a origem no equilíbrio" : "Mola na horizontal (sem atrito)";
    frame_(sc, scTitle, fs, vert ? "Mola" : reta ? "Mola na horizontal — reta numérica" : "Mola (horizontal)");
    let ballX = 0, ballY = 0;
    if (vert) {
      const cx = sc.x + sc.w * 0.42, yb = Yc(dNow), amp = 0.6 * fs, yC = Yc(ceilD);
      // (se a esfera sair do referencial, o desenho fica cortado pela moldura)
      ctx.save(); ctx.beginPath(); ctx.roundRect(sc.x, sc.y, sc.w, sc.h, 9); ctx.clip();
      // teto tracejado
      line(sc.x + 0.5 * fs, yC, sc.x + sc.w - 0.5 * fs, yC, C.ceil, 3);
      for (let x = sc.x + 0.7 * fs; x < sc.x + sc.w - 0.9 * fs; x += 0.6 * fs) line(x, yC, x + 0.5 * fs, yC - 0.55 * fs, C.ceil, 1.2);
      // solo (só quando d se mede a partir dele)
      if (solo) {
        line(sc.x + 0.5 * fs, iy1, sc.x + sc.w - 0.5 * fs, iy1, C.ceil, 3);
        for (let x = sc.x + 0.7 * fs; x < sc.x + sc.w - 0.9 * fs; x += 0.6 * fs) line(x + 0.5 * fs, iy1, x, iy1 + 0.55 * fs, C.ceil, 1.2);
      }
      if (S.mid) dashed(sc.x + 0.4 * fs, Yc(mod.D), sc.x + sc.w, Yc(mod.D), C.eq, 1.4);
      springV(cx, yC, Math.max(yC + 8, yb - R), amp, fs);
      ball(cx, yb, R);
      // cota d (do teto ou do solo ao centro da esfera)
      const qx = cx + amp + 1.1 * fs, q0 = solo ? iy1 - 2 : iy0 + 2;
      line(qx, q0, qx, yb, C.muted, 1.2);
      line(qx - 4, yb, qx + 4, yb, C.muted, 1.2);
      ctx.restore();
      const qm = solo ? (iy1 + Math.max(yb, iy0)) / 2 : (iy0 + Math.min(yb, iy1)) / 2;
      texAt("cd", "d", qx + 0.25 * fs, qm, fs * 0.85, C.muted, 0, 0.5, true);
      ballX = cx; ballY = yb;
    } else if (reta) {
      sceneR(sc, fs, dNow, R, top);
    } else {
      sceneH(sc, fs, mod, dNow, R, top);
    }

    // ---- gráfico ----
    const cap = reta ? "x — abcissa do centro da esfera P na reta (m)" : solo ? "d — distância do solo ao centro da esfera (m)" : vert ? "d — distância do teto ao centro da esfera (m)" : "d — distância de O ao centro da esfera P (m)";
    const tW = frame_(gr, cap, fs, reta ? "x — abcissa de P" : solo ? "d — distância do solo à esfera" : vert ? "d — distância do teto à esfera" : "d — distância de O a P");
    const now = texAt("now", `t = ${texNum(S.t, 2)}\\ \\text{s}\\quad ${V} = ${texNum(dNow, 3)}\\ \\text{m}\\quad v = ${texNum(vOf(mod, S.t), 2)}\\ \\text{m/s}`,
      gr.x + gr.w - 0.6 * fs, gr.y + 0.75 * fs, fs * 0.75, C.hot, 1, 0.5, true);
    if (now.offsetWidth > gr.w - tW - 1.2 * fs) {
      now._src = null;
      const n2 = texAt("now", `t = ${texNum(S.t, 2)}\\ \\text{s}`, gr.x + gr.w - 0.6 * fs, gr.y + 0.75 * fs, fs * 0.75, C.hot, 1, 0.5, true);
      if (n2.offsetWidth > gr.w - tW - 1.2 * fs) n2.style.display = "none";
    }
    const gx0 = gr.x + 3.2 * fs, gx1 = gr.x + gr.w - 1.4 * fs, GW = gx1 - gx0;
    const tA = Math.max(0, S.t - S.win), tB = tA + S.win;
    const X = t => gx0 + ((t - tA) / S.win) * GW;
    const px = fs * 0.7;
    // grelha e marcas
    const sx = niceStep(S.win, GW < 25 * fs ? 5 : 10);
    let n = 0;
    for (let t = Math.ceil(tA / sx - 1e-9) * sx; t <= tB + 1e-9; t += sx, n++) {
      line(X(t), iy0, X(t), iy1, C.grid, 1);
      if (down && t < 1e-9) continue;   // (a seta do eixo d está aí)
      if (reta && t < 1e-9) continue;   // (na reta, o 0 do eixo vertical já está aí)
      texAt("gt" + n, texNum(+t.toFixed(6), sx < 0.1 ? 2 : sx < 1 ? 1 : 0, true), X(t), (reta ? Yg(0) : iy1) + 0.3 * fs, px, C.muted, 0.5, 0, reta);
    }
    const sy = niceStep(top - lo, (iy1 - iy0) < 14 * fs ? 5 : 10);
    n = 0;
    for (let y = lo; y <= top + 1e-9; y += sy, n++) {
      line(gx0, Yg(y), gx1, Yg(y), C.grid, 1);
      texAt("gy" + n, texNum(+y.toFixed(6), sy < 0.1 ? 2 : sy < 1 ? 1 : 0), gx0 - 0.4 * fs, Yg(y), px, C.muted, 1, 0.5);
    }
    // eixos: o eixo t passa em d = 0
    line(gx0, Yg(0), gx1 + 0.3 * fs, Yg(0), C.axis, 1.5);
    tri(gx1 + 0.5 * fs, Yg(0), 1, 0, 0.35 * fs, C.axis);
    line(gx0, iy0 - (down ? 0 : 0.3 * fs), gx0, iy1 + (down ? 0.3 * fs : 0), C.axis, 1.5);
    if (down) tri(gx0, iy1 + 0.5 * fs, 0, 1, 0.35 * fs, C.axis); else tri(gx0, iy0 - 0.5 * fs, 0, -1, 0.35 * fs, C.axis);
    texAt("axt", "t\\ (\\text{s})", gx1 - 0.2 * fs, Yg(0) + (down ? 0.35 * fs : -0.35 * fs), fs * 0.8, C.ink, 1, down ? 0 : 1, true);
    texAt("axd", `${V}\\ (\\text{m})`, gx0 + 0.4 * fs, down ? iy1 - 0.4 * fs : iy0 + 0.4 * fs, fs * 0.8, C.ink, 0, 0.5, true);

    // linha média (equilíbrio)
    if (S.mid && !reta) {   // (na reta, a linha média é o próprio eixo t)
      dashed(gx0, Yg(mod.D), gx1, Yg(mod.D), C.eq, 1.4);
      texAt("eqt", `\\text{linha média}\\ \\ ${V} = ${texNum(mod.D, 3)}`, gx1 - 0.2 * fs, Yg(mod.D) - 0.2 * fs, fs * 0.7, C.eq, 1, 1, true);
    }

    // reta vertical a tracejado no instante atual (a laranja, a cor do tempo)
    line(X(S.t), iy0 - 0.2 * fs, X(S.t), iy1 + 0.2 * fs, C.hot, 1.4, [6, 5]);

    // traços: os guardados (até ao instante em que pararam) e o atual
    if (S.graph) {
      ctx.save(); ctx.beginPath(); ctx.rect(gx0, iy0 - 2, GW, iy1 - iy0 + 4); ctx.clip();
      const trace = (md, tEnd, color, weight) => {
        const t1 = Math.min(tEnd, tB);
        if (t1 <= tA) return null;
        const N = Math.max(60, Math.round(GW * 2 * (t1 - tA) / S.win));
        ctx.strokeStyle = color; ctx.lineWidth = weight; ctx.lineJoin = "round"; ctx.beginPath();
        for (let i = 0; i <= N; i++) { const t = tA + (t1 - tA) * i / N, xx = X(t), yy = Yg(dOf(md, t)); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
        ctx.stroke();
        return [X(t1), Yg(dOf(md, t1))];
      };
      S.traces.forEach(tr => {
        const c = C.H[tr.c], end = trace(model(tr), tr.t, c, Math.max(1.6, 0.11 * fs));
        if (end && tr.t <= tB) { ctx.beginPath(); ctx.arc(end[0], end[1], 0.2 * fs, 0, TAU); ctx.fillStyle = c; ctx.fill(); }
      });
      if (S.t > 0) trace(mod, S.t, C.curve, Math.max(2.2, 0.16 * fs));
      ctx.restore();
      // ponto atual e ligação à esfera
      const ppx = X(S.t), ppy = Yg(dNow);
      if (down || solo) dashed(ballX + R + 2, ballY, ppx, ppy, C.ball, 1);
      ctx.beginPath(); ctx.arc(ppx, ppy, 0.3 * fs, 0, TAU); ctx.fillStyle = C.curve; ctx.fill();
    }

    // pontos da tabela com ruído (enquanto a janela está aberta)
    if (TAB.open) {
      const pts = tabRows();
      ctx.save(); ctx.beginPath(); ctx.rect(gx0 - 4, iy0 - 6, GW + 8, iy1 - iy0 + 12); ctx.clip();
      pts.forEach(([t, v]) => {
        if (t < tA - 1e-9 || t > tB + 1e-9) return;
        ctx.beginPath(); ctx.arc(X(t), Yg(v / TAB.u), 0.24 * fs, 0, TAU);
        ctx.fillStyle = C.bg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.phys; ctx.stroke();
      });
      ctx.restore();
    }

    // avisos
    const warns = [];
    if (!reta && mod.Dt - mod.A <= 0.08) warns.push(`⚠ Com estes valores a mola ficaria quase toda comprimida: a esfera bateria ${vert ? "no teto" : "na parede"}. Diminui x₀ ou v₀.`);
    if (solo && mod.D - mod.A <= 0.02) warns.push("⚠ A esfera bateria no solo: aumenta a altura H do teto.");
    // (a partir do solo, o teto pode ficar fora do referencial: a mola sai pela moldura)
    if (mod.D + mod.A + (reta ? -0.005 : 0.03) > S.scale) warns.push("⚠ A esfera sai do referencial: escolhe uma escala maior.");
    warns.forEach((w, i) => {
      const wpx = Math.min(fs * 0.72, fs * 0.72 * (GW - fs) / tw(w, fs * 0.72, FONT, 700));
      const yy = (down ? iy0 + 1.2 * fs : iy1 - 1.4 * fs) + (down ? 1 : -1) * i * 1.1 * fs;
      const ww = tw(w, wpx, FONT, 700);
      rrect(gx0 + 0.5 * fs - 0.3 * fs, yy - 0.5 * fs, ww + 0.6 * fs, fs, 5, C.bg, null);
      text(w, gx0 + 0.5 * fs, yy, wpx, C.hot, "left", FONT, 700);
    });
  }

  function ball(x, y, R) {
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fillStyle = C.ball; ctx.fill();
    ctx.beginPath(); ctx.arc(x - R * 0.35, y - R * 0.35, R * 0.35, 0, TAU); ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fill();
  }
  // mola vertical: pontas direitas + zigue-zague com número fixo de espiras
  function springV(cx, y0, y1, amp, fs) {
    const lead = Math.min(0.6 * fs, (y1 - y0) * 0.12), coils = 12, span = (y1 - lead) - (y0 + lead);
    ctx.strokeStyle = C.spring; ctx.lineWidth = Math.max(1.8, 0.12 * fs); ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(cx, y0); ctx.lineTo(cx, y0 + lead);
    for (let i = 0; i < coils * 2; i++) ctx.lineTo(cx + (i % 2 ? -amp : amp), y0 + lead + span * (i + 0.5) / (coils * 2));
    ctx.lineTo(cx, y1 - lead); ctx.lineTo(cx, y1); ctx.stroke();
  }
  // montagem horizontal: parede com O à esquerda, mola, esfera P a deslizar no chão (sem atrito);
  // a régua por baixo do chão usa a escala de d
  function sceneH(b, fs, mod, dNow, R, top) {
    const x0 = b.x + 2.2 * fs, x1 = b.x + b.w - 1.4 * fs;
    const Xs = dd => x0 + (dd / top) * (x1 - x0);
    const floorY = b.y + b.h - 1.9 * fs, cy = floorY - R - 2;
    line(x0 - 0.3 * fs, floorY, x1 + 0.4 * fs, floorY, C.ceil, 4);
    line(x0 - 0.3 * fs, floorY + 2, x0 - 0.3 * fs, Math.max(b.y + 1.6 * fs, cy - R - 1.4 * fs), C.ceil, 4);
    // régua
    const st = niceStep(top, (x1 - x0) < 30 * fs ? 5 : 10);
    let n = 0;
    for (let v = 0; v <= top + 1e-9; v += st, n++) {
      line(Xs(v), floorY + 0.25 * fs, Xs(v), floorY + 0.55 * fs, C.muted, 1);
      texAt("rh" + n, texNum(+v.toFixed(6), st < 0.1 ? 2 : 1), Xs(v), floorY + 0.65 * fs, fs * 0.6, C.muted, 0.5, 0);
    }
    if (S.mid) dashed(Xs(mod.D), cy - R - 1.1 * fs, Xs(mod.D), floorY, C.eq, 1.4);
    // mola presa em O
    const xb = Xs(dNow), xs0 = Xs(0), xs1 = Math.max(xs0 + 8, xb - R);
    const lead = Math.min(0.7 * fs, (xs1 - xs0) * 0.12), coils = 14, amp = 0.5 * fs, span = (xs1 - lead) - (xs0 + lead);
    ctx.strokeStyle = C.spring; ctx.lineWidth = Math.max(1.8, 0.12 * fs); ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(xs0, cy); ctx.lineTo(xs0 + lead, cy);
    for (let i = 0; i < coils * 2; i++) ctx.lineTo(xs0 + lead + span * (i + 0.5) / (coils * 2), cy + (i % 2 ? -amp : amp));
    ctx.lineTo(xs1 - lead, cy); ctx.lineTo(xs1, cy); ctx.stroke();
    ctx.beginPath(); ctx.arc(xs0, cy, 0.2 * fs, 0, TAU); ctx.fillStyle = C.ink; ctx.fill();
    texAt("hO", "O", xs0 - 0.5 * fs, cy, fs * 0.9, C.ink, 1, 0.5);
    ball(xb, cy, R);
    ctx.beginPath(); ctx.arc(xb, cy, 0.14 * fs, 0, TAU); ctx.fillStyle = C.bg; ctx.fill();
    texAt("hP", "P", xb + R * 0.6, cy - R * 0.6, fs * 0.9, C.ink, 0, 1);
    // cota d por cima: de O ao centro de P
    const qy = cy - R - 0.7 * fs;
    line(xs0, qy, xb, qy, C.muted, 1.2);
    line(xs0, qy - 4, xs0, qy + 4, C.muted, 1.2); line(xb, qy - 4, xb, qy + 4, C.muted, 1.2);
    texAt("hd", "d", (xs0 + xb) / 2, qy - 0.15 * fs, fs * 0.85, C.muted, 0.5, 1, true);
  }

  // reta numérica: origem O no equilíbrio, marcas de −top a top; a parede fica à esquerda de −top
  // (o comprimento natural da mola não conta: a mola vai da parede à esfera)
  function sceneR(b, fs, xNow, R, top) {
    const xw = b.x + 1.2 * fs, xl = xw + R + 1.8 * fs, xr = b.x + b.w - Math.max(1.6 * fs, R + 0.6 * fs);
    const Xs = v => xl + ((v + top) / (2 * top)) * (xr - xl);
    const floorY = b.y + b.h - 1.9 * fs, cy = floorY - R - 2;
    // chão = reta numérica, com seta
    line(xw, floorY, xr + 0.5 * fs, floorY, C.ceil, 3);
    tri(xr + 0.8 * fs, floorY, 1, 0, 0.35 * fs, C.ceil);
    texAt("rx", "x", xr + 0.9 * fs, floorY - 0.2 * fs, fs * 0.8, C.muted, 0.5, 1);
    // parede
    line(xw, floorY + 2, xw, Math.max(b.y + 1.6 * fs, cy - R - 1.4 * fs), C.ceil, 4);
    for (let y = floorY - 0.2 * fs; y > Math.max(b.y + 1.7 * fs, cy - R - 1.3 * fs); y -= 0.55 * fs) line(xw, y, xw - 0.5 * fs, y - 0.45 * fs, C.ceil, 1.2);
    // marcas
    const st = niceStep(2 * top, (xr - xl) < 30 * fs ? 8 : 16);
    let n = 0;
    for (let v = Math.ceil(-top / st - 1e-9) * st; v <= top + 1e-9; v += st, n++) {
      const z = Math.abs(v) < 1e-9;
      line(Xs(v), floorY - (z ? 0.3 : 0) * fs, Xs(v), floorY + 0.5 * fs, z ? C.ink : C.muted, z ? 1.6 : 1);
      texAt("rr" + n, texNum(+v.toFixed(6), st < 0.1 ? 2 : st < 1 ? 1 : 0, true), Xs(v), floorY + 0.6 * fs, fs * 0.6, z ? C.ink : C.muted, 0.5, 0);
    }
    if (S.mid) dashed(Xs(0), cy - R - 1.1 * fs, Xs(0), floorY, C.eq, 1.4);
    texAt("rO", "O", Xs(0) - 0.25 * fs, floorY - 0.15 * fs, fs * 0.85, C.ink, 1, 1, true);
    // mola presa na parede
    const xb = Xs(xNow), xs0 = xw, xs1 = Math.max(xs0 + 8, xb - R);
    const lead = Math.min(0.7 * fs, (xs1 - xs0) * 0.12), coils = 16, amp = 0.5 * fs, span = (xs1 - lead) - (xs0 + lead);
    ctx.strokeStyle = C.spring; ctx.lineWidth = Math.max(1.8, 0.12 * fs); ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(xs0, cy); ctx.lineTo(xs0 + lead, cy);
    for (let i = 0; i < coils * 2; i++) ctx.lineTo(xs0 + lead + span * (i + 0.5) / (coils * 2), cy + (i % 2 ? -amp : amp));
    ctx.lineTo(xs1 - lead, cy); ctx.lineTo(xs1, cy); ctx.stroke();
    ball(xb, cy, R);
    ctx.beginPath(); ctx.arc(xb, cy, 0.14 * fs, 0, TAU); ctx.fillStyle = C.bg; ctx.fill();
    texAt("rP", "P", xb + R * 0.6, cy - R * 0.6, fs * 0.9, C.ink, 0, 1);
    // projeção de P na reta e cota x (de O ao centro de P)
    dashed(xb, cy, xb, floorY, C.ball, 1);
    ctx.beginPath(); ctx.arc(xb, floorY, 0.18 * fs, 0, TAU); ctx.fillStyle = C.ball; ctx.fill();
    const qy = cy - R - 0.7 * fs;
    if (Math.abs(xb - Xs(0)) > 6) {
      line(Xs(0), qy, xb, qy, C.muted, 1.2);
      line(Xs(0), qy - 4, Xs(0), qy + 4, C.muted, 1.2); line(xb, qy - 4, xb, qy + 4, C.muted, 1.2);
    }
    texAt("rd", "x", (Xs(0) + xb) / 2, qy - 0.15 * fs, fs * 0.85, C.muted, 0.5, 1, true);
  }

  // ---------- tabela tempo × distância com ruído ----------
  // pontos igualmente espaçados de a a b; ruído gaussiano com desvio padrão = r % da amplitude
  // (gerador com semente: a mesma semente dá a mesma tabela a todos); valores na unidade escolhida
  const TAB = { open: false, a: 0, b: 10, h: 0.5, r: 5, u: 1, dec: 2, seed: 1 };   // h = passo do tempo
  const tabN = () => Math.floor((TAB.b - TAB.a) / TAB.h + 1e-9) + 1;
  function rng(seed) {   // mulberry32
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function tabRows() {
    const M = model(), R = rng(TAB.seed), sd = (TAB.r / 100) * (M.A > 1e-9 ? M.A : 0.1);
    const gauss = () => { const u = 1 - R(), v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
    const rows = [], n = tabN(), k = 10 ** TAB.dec, kt = 1e6;
    for (let i = 0; i < n; i++) {
      const t = Math.round((TAB.a + i * TAB.h) * kt) / kt;
      const v = (dOf(M, t) + sd * gauss()) * TAB.u;
      rows.push([t, Math.round(v * k) / k]);
    }
    return rows;
  }
  const $t = id => document.getElementById(id);
  const tabUnit = () => ({ 1: "m", 10: "dm", 100: "cm" })[TAB.u];
  const tabHead = () => ["t (s)", `${VAR()} (${tabUnit()})`];
  const tDec = () => Math.max(...tabRows().map(([t]) => (String(t).split(".")[1] || "").length), 0);
  function tabText(sep, comma) {
    const rows = tabRows(), td = tDec();
    const f = (x, d) => { const s = x.toFixed(d); return comma ? s.replace(".", ",") : s; };
    return [tabHead().join(sep), ...rows.map(([t, v]) => f(t, td) + sep + f(v, TAB.dec))].join("\n");
  }
  const tabRefresh = () => draw();   // (o paint atualiza a tabela)
  function tabFields() {
    const set = (id, v) => { const el = $t(id); if (document.activeElement !== el) { el.value = String(v).replace(".", ","); el.classList.remove("bad"); } };
    set("tab-a", TAB.a); set("tab-b", TAB.b); set("tab-h", TAB.h); set("tab-r", TAB.r); set("tab-s", TAB.seed);
    $t("tab-u").value = String(TAB.u); $t("tab-dec").value = String(TAB.dec);
  }
  // passo inicial: o maior 1, 2, 2,5 ou 5 × 10ⁿ que dá pelo menos 6 pontos por período (e no máximo 500 pontos)
  function niceH(T, span) {
    let h = Math.max(Math.min(T / 6, span / 4), span / 499);   // (pelo menos 5 pontos)
    const p = 10 ** Math.floor(Math.log10(h)), m = h / p;
    const c = [1, 2, 2.5, 5, 10].filter(v => v <= m + 1e-9).pop();
    h = c * p;
    return span / h > 499 ? [1, 2, 2.5, 5, 10].map(v => v * p).find(v => span / v <= 499) : h;
  }
  function openTab() {
    if (FX.open) closeFx();
    // ao abrir: com o gráfico à vista, de 0 até ao instante a que o tempo chegou; sem gráfico (ou com t ≈ 0), a janela toda
    // (pedido do utilizador); depois edita-se à vontade
    TAB.open = true; TAB.a = 0; TAB.b = S.graph && S.t >= 0.05 ? Math.round(S.t * 100) / 100 : S.win; TAB.h = +niceH(model().T, TAB.b - TAB.a).toPrecision(6);
    if (!$t("tab").hidden) return;
    $t("tab").hidden = false; $t("tab-msg").textContent = "";
    tabFields(); tabRefresh();
  }
  function closeTab() { TAB.open = false; $t("tab").hidden = true; draw(); }
  // caixas: [id, chave, validação]
  [["tab-a", "a", x => x >= 0 && x < TAB.b && (TAB.b - x) / TAB.h < 500], ["tab-b", "b", x => x > TAB.a && x <= 600 && (x - TAB.a) / TAB.h < 500],
   ["tab-h", "h", x => x > 0 && (TAB.b - TAB.a) / x < 500],
   ["tab-r", "r", x => x >= 0 && x <= 100], ["tab-s", "seed", x => Number.isInteger(x) && x >= 0]].forEach(([id, key, ok]) => {
    const el = $t(id);
    el.addEventListener("input", () => {
      const x = parseNum(el.value);
      if (isFinite(x) && ok(x)) { el.classList.remove("bad"); TAB[key] = x; tabRefresh(); } else el.classList.add("bad");
    });
    el.addEventListener("blur", tabFields);
    el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });
  });
  $t("tab-u").onchange = e => { TAB.u = +e.target.value; tabRefresh(); };
  $t("tab-dec").onchange = e => { TAB.dec = +e.target.value; tabRefresh(); };
  $t("tab-new").onclick = () => { TAB.seed = 1 + Math.floor(Math.random() * 9999); tabFields(); tabRefresh(); };
  $t("tab-x").onclick = closeTab;
  const tabMsg = m => { $t("tab-msg").textContent = m; clearTimeout(tabMsg.t); tabMsg.t = setTimeout(() => $t("tab-msg").textContent = "", 4000); };
  $t("tab-copy").onclick = async () => {
    const txt = tabText("\t", true);
    try { await navigator.clipboard.writeText(txt); tabMsg("Tabela copiada: cola-a na folha de cálculo ou na app Estatística."); }
    catch (e) { const ta = $t("tab-out"); ta.focus(); ta.select(); tabMsg("Seleciona a tabela e copia com Ctrl+C."); }
  };
  $t("tab-csv").onclick = () => {
    const blob = new Blob(["\ufeff" + tabText(";", true) + "\n"], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `oscilador-t-${VAR()}-semente-${TAB.seed}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const b64 = str => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
  $t("tab-est").onclick = () => {
    window.open(`../estatistica/#bi&dados=${encodeURIComponent(b64(tabText("\t", true)))}`, "_blank");
  };
  $t("tab-folha").onclick = () => {
    const rows = tabRows(), td = tDec(), cel = {}, [h1, h2] = tabHead();
    cel.A1 = h1; cel.B1 = h2;
    rows.forEach(([t, v], i) => { cel["A" + (i + 2)] = t.toFixed(td); cel["B" + (i + 2)] = v.toFixed(TAB.dec); });
    const f = { celulas: cel, larguras: {}, grafico: null };
    window.open(`../folha-de-calculo/#folha=${encodeURIComponent(b64(JSON.stringify(f)))}&nome=${encodeURIComponent("oscilador semente " + TAB.seed)}`, "_blank");
  };

  // ---------- toque e rato ----------
  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const hitAt = (x, y) => hits.find(h => h.rect && inRect(h.rect, x, y)) || null;
  let drag = null;
  const toggle = key => { S[key] = !S[key]; draw(); };
  cv.addEventListener("pointerdown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) document.activeElement.blur();
    const h = hitAt(e.clientX, e.clientY);
    if (!h) return;
    e.preventDefault();
    if (h.kind === "theme") { setDark(!dark, true); for (const el of pool.values()) el._src = null; draw(); return; }
    if (h.kind === "pos") { setPos(h.v); return; }
    if (h.kind === "run") { toggleRun(); return; }
    if (h.kind === "reset") { restart(); return; }
    if (h.kind === "speed") { S.speed = h.v; draw(); return; }
    if (h.kind === "scale") { S.scale = h.v; draw(); return; }
    if (h.kind === "dir") { S.dir = h.v; draw(); return; }
    if (h.kind === "ref") { setRef(h.v); return; }
    if (h.kind === "href") { setHref(h.v); return; }
    if (h.kind === "table") { TAB.open ? closeTab() : openTab(); return; }
    if (h.kind === "func") { FX.open ? closeFx() : openFx(); return; }
    if (["graph", "mid", "law", "phys", "keep"].includes(h.kind)) { toggle(h.kind); return; }
    if (h.kind === "clear") { S.traces = []; nextColor = 0; draw(); return; }
    if (h.kind === "slide") {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      drag = h; h.set(h.val(e.clientX)); cv.style.cursor = "grabbing";
    }
  });
  cv.addEventListener("pointermove", e => {
    if (drag) {
      // o cursor do tempo não muda de escala enquanto se arrasta
      drag.set(drag.val(e.clientX));
      return;
    }
    const h = hitAt(e.clientX, e.clientY);
    cv.style.cursor = !h ? "default" : h.kind === "slide" ? "ew-resize" : "pointer";
  });
  const end = () => { drag = null; cv.style.cursor = "default"; };
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, end));

  // teclado (fora das caixas): espaço liga/para o tempo, r recomeça, ←/→ mexem no tempo (Shift ×10),
  // g gráfico, l linha média, e expressão, f grandezas, v troca a montagem
  window.addEventListener("keydown", e => {
    if (TAB.open && e.key === "Escape") { closeTab(); e.preventDefault(); return; }
    if (FX.open && e.key === "Escape") { closeFx(); e.preventDefault(); return; }
    if (document.activeElement && (document.activeElement.classList.contains("inp") || document.activeElement.closest(".dlg") || document.activeElement.tagName === "SELECT")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === " ") toggleRun();
    else if (e.key === "r") restart();
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") setTime(S.t + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 0.1 : 0.01));
    else if (e.key === "g") toggle("graph");
    else if (e.key === "l") toggle("mid");
    else if (e.key === "e") toggle("law");
    else if (e.key === "f") toggle("phys");
    else if (e.key === "v") setPos(S.pos === "vertical" ? "horizontal" : "vertical");
    else if (e.key === "s") toggleRef();
    else if (e.key === "t") TAB.open ? closeTab() : openTab();
    else if (e.key === "w") FX.open ? closeFx() : openFx();
    else return;
    e.preventDefault();
  });

  // endereço com condições iniciais: #horizontal&m=1&k=88.83&L=0.6&x0=0.08&v0=0&w=2 (w = janela de tempo)
  // na vertical, «solo» mede d a partir do solo e H = altura do teto; escala = 1, 2 ou 4 (m)
  // (ponto ou vírgula decimal; os valores ficam dentro dos limites dos cursores)
  (() => {
    const parts = location.hash.slice(1).split("&");
    if (parts[0] === "horizontal") S.pos = "horizontal";
    if (parts.includes("solo")) S.ref = "solo";
    if (parts.includes("reta")) { S.pos = "horizontal"; S.href = "reta"; }
    // a escala primeiro, porque os limites de x₀ e v₀ dependem dela
    for (const kv of parts) { const [key, val] = kv.split("="); if (key === "escala" && [1, 2, 4].includes(+val)) S.scale = +val; }
    for (const kv of parts) {
      const [key, val] = kv.split("=");
      if (val === undefined) continue;
      const x = parseFloat(decodeURIComponent(val).replace(",", "."));
      if (!isFinite(x)) continue;
      if (key === "w") { setWin(x); continue; }
      if (key === "H") { setH(x); continue; }
      if (key === "escala" && [1, 2, 4].includes(x)) { S.scale = x; continue; }
      if (key in LIM) { const [a, b] = lim(key); S[key] = clamp(x, a, b); }   // (sem arredondar ao passo do cursor)
    }
    // #f=5+2cos(pi*t+pi/3)&u=dm: escreve a função no campo e aplica-a (depois da montagem: vertical/solo/horizontal/reta)
    const fv = parts.find(kv => kv.startsWith("f=")), uv = parts.find(kv => kv.startsWith("u="));
    if (uv) { const u = { m: "1", dm: "0.1", cm: "0.01" }[decodeURIComponent(uv.slice(2))]; if (u) FX.unit.value = u; }
    if (fv) { FX.el.value = decodeURIComponent(fv.slice(2)); fxRun(); openFx(); FX.el.blur(); }
  })();
  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  if (document.fonts) document.fonts.ready.then(draw);
  resize();
})();
</script>
</body>
</html>
