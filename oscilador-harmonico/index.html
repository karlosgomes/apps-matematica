<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oscilador Harmónico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root { --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* caixas de texto (tempo e janela de tempo), postas por cima do canvas pelo layout */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.3em; border: 2px solid var(--line); border-radius: 7px;
         background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; text-align: right; outline: none; }
  .inp:focus { border-color: var(--focus); }
  .inp.bad { border-color: var(--bad); background: var(--badbg); }
</style>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<canvas id="cv" aria-label="Oscilador harmónico: esfera presa a uma mola, na vertical ou na horizontal, e o gráfico da distância d ao longo do tempo"></canvas>
<script>
(() => {
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", faint: "#6b7685", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    ceil: "#8a96a3", spring: "#4b5563", ball: "#1565c0", curve: "#d32f2f", eq: "#2e7d32", hot: "#ef6c00", phys: "#00838f",
    H: ["#1565c0", "#2e7d32", "#ef6c00", "#7b1fa2", "#00838f"],
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", faint: "#8592a1", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    ceil: "#6b7785", spring: "#aab4c0", ball: "#64a8ff", curve: "#ff6b6b", eq: "#5cc26a", hot: "#ffa040", phys: "#4dd0e1",
    H: ["#64a8ff", "#5cc26a", "#ffa040", "#c792ea", "#4dd0e1"],
  };
  const C = { ...LIGHT };
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const TAU = 2 * Math.PI;

  // ---------- estado ----------
  const g = 9.8;
  const S = {
    pos: "vertical",               // montagem: vertical (suspensa) ou horizontal (sem atrito)
    m: 0.5, k: 20, L: 0.4, x0: 0.15, v0: 0,
    t: 0, running: false, speed: 1,
    win: 10,                       // janela de tempo do gráfico (s)
    dir: "down",                   // eixo d do gráfico: para baixo (como a mola) ou para cima (habitual)
    scale: 1,                      // escala de d: 0–1, 0–2 ou 0–4 m
    graph: false, mid: false, law: false, phys: false,   // o que se mostra (tudo escondido ao início)
    keep: false, traces: [],       // traços guardados: { pos, m, k, L, x0, v0, t, c }
  };
  const LIM = { m: [0.1, 2, 0.05], k: [10, 100, 1], L: [0.2, 1, 0.05], x0: [-0.3, 0.3, 0.01], v0: [-1, 1, 0.05] };
  const NCORES = 5, MAXTRACOS = 8;
  let nextColor = 0;

  const fmt = (x, dec = 2, trim = false) => {
    if (!isFinite(x)) return "—";
    let s = (Math.round(x * 10 ** dec) / 10 ** dec).toFixed(dec);
    if (trim && s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return s.replace(".", ",").replace(/^-/, "−");
  };
  const texNum = (x, dec = 2, trim = false) => fmt(x, dec, trim).replace(",", "{,}").replace("−", "-");
  const parseNum = s => {
    s = String(s).trim().replace(/\s/g, "").replace("−", "-").replace(",", ".");
    return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
  };

  // ---------- física: x(t) = x₀ cos ωt + (v₀/ω) sin ωt = A cos(ωt + φ) ----------
  function model(P = S) {
    const w = Math.sqrt(P.k / P.m);
    // posição de equilíbrio: na vertical o peso estica a mola mg/k; na horizontal (sem atrito) não
    const D = P.L + (P.pos === "vertical" ? P.m * g / P.k : 0);
    const A = Math.hypot(P.x0, P.v0 / w);
    let phi = Math.atan2(-P.v0 / w, P.x0);
    if (phi < -Math.PI + 1e-9) phi = Math.PI;    // φ ∈ ]−π, π]
    return { w, D, A, phi, T: TAU / w };
  }
  const dOf = (M, t) => M.D + M.A * Math.cos(M.w * t + M.phi);
  const vOf = (M, t) => -M.A * M.w * Math.sin(M.w * t + M.phi);
  function niceStep(range, target) {
    const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }

  // ---------- ações ----------
  // mudar um parâmetro inicial recomeça o movimento em t = 0;
  // com «Manter traços» ligado, o traço já desenhado fica guardado
  // (ao arrastar um cursor só o primeiro passo guarda, porque depois t = 0)
  function saveTrace() {
    if (!S.keep || S.t <= 0) return;
    const { pos, m, k, L, x0, v0, t } = S;
    S.traces.push({ pos, m, k, L, x0, v0, t, c: nextColor++ % NCORES });
    if (S.traces.length > MAXTRACOS) S.traces.shift();
  }
  const setParam = key => v => {
    const [lo, hi, st] = LIM[key];
    v = clamp(Math.round(v / st) * st, lo, hi);
    v = +v.toFixed(4);
    if (v === S[key]) return;
    saveTrace(); S[key] = v; S.t = 0; draw();
  };
  const setTime = x => { S.running = false; S.t = Math.max(0, x); draw(); };
  const setWin = x => { S.win = clamp(x, 0.5, 600); };
  function setPos(p) {
    if (p === S.pos) return;
    saveTrace(); S.pos = p; S.t = 0;
    history.replaceState(null, "", p === "horizontal" ? "#horizontal" : location.pathname + location.search);
    draw();
  }
  function toggleRun() { S.running = !S.running; go(); }
  function restart() { S.running = false; S.t = 0; draw(); }
  // fim do cursor do tempo: a janela; se o tempo passar do fim, alarga-se de janela em janela
  const tMax = () => Math.max(1, Math.ceil(S.t / S.win - 1e-9)) * S.win;

  // ---------- canvas ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, L = null, hits = [];
  function resize() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- caixas de texto ----------
  const INP = {};
  function makeInput(id, label, get, set, step, dec) {
    const el = document.createElement("input");
    el.className = "inp"; el.id = id; el.type = "text"; el.inputMode = "decimal"; el.autocomplete = "off"; el.spellcheck = false;
    el.setAttribute("aria-label", label);
    document.body.appendChild(el);
    const show = () => { el.classList.remove("bad"); el.value = fmt(get(), dec, true); };
    const commit = () => {
      const x = parseNum(el.value);
      if (isFinite(x)) { set(x); show(); draw(); }
      else el.classList.add("bad");
    };
    el.addEventListener("change", commit);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") { commit(); el.blur(); }
      else if (e.key === "Escape") { show(); el.blur(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        set(get() + (e.key === "ArrowUp" ? 1 : -1) * step * (e.shiftKey ? 10 : 1));
        show(); draw();
      }
    });
    INP[id] = { el, get, dec };
  }
  makeInput("tin", "Tempo t em segundos", () => S.t, setTime, 0.01, 2);
  makeInput("win", "Janela de tempo do gráfico, em segundos (0,5 a 600)", () => S.win, setWin, 1, 2);
  let usedInp = new Set();
  function place(id, r, px) {
    const { el, get, dec } = INP[id];
    el.style.display = "";
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
    el.style.fontSize = px + "px";
    if (document.activeElement !== el) { el.value = fmt(get(), dec, true); el.classList.remove("bad"); }
    usedInp.add(id);
  }

  // ---------- disposição ----------
  // ecrã deitado: controlos numa coluna à esquerda, a mola e o gráfico à direita;
  // ao alto: a mola e o gráfico em cima e os controlos por baixo
  const ROW = 1.6, LEG = 1.9;
  let CP = 0.55, GAP = 0.75, RG = 0.4;
  const CARDS = [["mont", 1], ["tempo", 2], ["ver", 2], ["mola", 3], ["ci", 2], ["graf", 3]];
  const cardH = r => CP * 2 + r * ROW + (r - 1) * RG;
  function layout() {
    let fs = clamp(Math.min(W, H) / 26, 12, 21);
    for (let k = 0; k < 40; k++) {
      const L = tryLayout(fs);
      if (L.ok || fs <= 10) return L;
      fs *= 0.95;
    }
    return tryLayout(fs);
  }
  function tryLayout(fs) {
    const pad = Math.round(fs * 0.7), gap = GAP * fs;
    const land = W > H * 1.1 && W >= 640;
    [CP, GAP, RG] = land ? [0.55, 0.75, 0.4] : [0.4, 0.45, 0.2];
    const L = { fs, pad, land, cards: {} };
    const hOf = k => cardH(CARDS.find(c => c[0] === k)[1]) * fs;
    let area;
    if (land) {
      const cw = clamp(W * 0.3, 19 * fs, 23 * fs), x = pad;
      let y = pad;
      L.legend = { x, y, w: cw, h: LEG * fs }; y += LEG * fs + 0.8 * fs;
      CARDS.forEach(([k]) => { L.cards[k] = { x, y, w: cw, h: hOf(k) }; y += hOf(k) + gap; });
      const gx = x + cw + 1.2 * fs;
      area = { x: gx, y: pad, w: W - pad - gx, h: H - 2 * pad };
      L.ok = y - gap <= H - pad && area.w >= W * 0.45;
    } else {
      const w = W - 2 * pad, nc = w >= 38 * fs ? 2 : 1, cw = (w - (nc - 1) * gap) / nc;
      const col = nc === 2 ? [["mont", "tempo", "ver"], ["mola", "ci", "graf"]] : [CARDS.map(c => c[0]), []];
      const ctrlH = Math.max(...col.map(cs => cs.reduce((s, k) => s + hOf(k) + gap, 0))) - gap;
      let y = pad;
      L.legend = { x: pad, y, w, h: LEG * fs }; y += LEG * fs + 0.4 * fs;
      const gh = H - pad - ctrlH - 0.6 * fs - y;
      area = { x: pad, y, w, h: gh };
      const y0 = y + gh + 0.6 * fs;
      col.forEach((cs, ci) => { let yy = y0; cs.forEach(k => { L.cards[k] = { x: pad + ci * (cw + gap), y: yy, w: cw, h: hOf(k) }; yy += hOf(k) + gap; }); });
      L.ok = gh >= Math.max(0.42 * H, 17 * fs) && cw >= 18 * fs;
    }
    // por cima dos quadros: a expressão de d(t) e as grandezas (se ligadas)
    let y = area.y;
    if (S.law) { L.law = { x: area.x, y, w: area.w, h: 2.2 * fs }; y += 2.2 * fs; }
    if (S.phys) { L.phys = { x: area.x, y, w: area.w, h: 2.8 * fs }; y += 3.0 * fs; }
    const rest = { x: area.x, y, w: area.w, h: area.y + area.h - y }, g2 = 0.5 * fs;
    if (S.pos === "vertical") {
      // cena estreita à esquerda, gráfico à direita, com a mesma escala vertical
      const sw = clamp(rest.w * 0.17, (L.land ? 7 : 5.5) * fs, 10 * fs);
      L.scene = { x: rest.x, y: rest.y, w: sw, h: rest.h };
      L.graph = { x: rest.x + sw + g2, y: rest.y, w: rest.w - sw - g2, h: rest.h };
    } else {
      const sh = clamp(rest.h * 0.3, 6.5 * fs, 9 * fs);
      L.scene = { x: rest.x, y: rest.y, w: rest.w, h: sh };
      L.graph = { x: rest.x, y: rest.y + sh + g2, w: rest.w, h: rest.h - sh - g2 };
    }
    if (L.graph.h < 9 * fs) L.ok = false;
    return L;
  }

  // ---------- primitivas ----------
  function line(x0, y0, x1, y1, c, w, dash) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
  }
  function tri(x, y, ux, uy, s, c) {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x + ux * s, y + uy * s);
    ctx.lineTo(x - uy * s * 0.6, y + ux * s * 0.6);
    ctx.lineTo(x + uy * s * 0.6, y - ux * s * 0.6);
    ctx.closePath(); ctx.fill();
  }
  function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function text(s, x, y, px, color, align = "left", font = FONT, weight = 400, style = "") {
    ctx.font = `${style} ${weight} ${px}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillText(s, x, y);
    return ctx.measureText(s).width;
  }
  const tw = (s, px, font = FONT, weight = 400) => { ctx.font = `${weight} ${px}px ${font}`; return ctx.measureText(s).width; };
  function button(x, y, w, h, txt, on, kind, extra = {}, col = C.muted, px = 16) {
    rrect(x, y, w, h, 8, on ? col : C.btn, on ? col : C.line, 2);
    text(txt, x + w / 2, y + h / 2 + 1, px, on ? C.on : C.ink, "center", FONT, 700);
    hits.push({ kind, ...extra, rect: { x, y, w, h } });
  }
  function cbox(x, y, h, bs, px, on, txt, hit, col = C.muted, tcol = C.ink) {
    const yy = y + (h - bs) / 2;
    rrect(x, yy, bs, bs, 5, on ? col : C.bg, col, 2);
    if (on) {
      ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = C.on; ctx.lineWidth = 0.14 * bs;
      ctx.beginPath(); ctx.moveTo(x + 0.24 * bs, yy + 0.52 * bs); ctx.lineTo(x + 0.43 * bs, yy + 0.72 * bs);
      ctx.lineTo(x + 0.77 * bs, yy + 0.3 * bs); ctx.stroke();
      ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    }
    const w = bs + 0.45 * bs + text(txt, x + bs * 1.45, y + h / 2 + 1, px, tcol, "left", FONT);
    hits.push({ ...hit, rect: { x, y, w, h } });
    return x + w;
  }
  // cursor (barra, parte até ao valor na cor col, pega redonda); ticks: valores com uma marca por baixo
  function slider(x, y, w, h, lo, hi, v, col, fs, set, ticks = []) {
    const cy = y + h / 2, X = u => x + (clamp(u, lo, hi) - lo) / (hi - lo) * w;
    ticks.forEach(t => line(X(t), cy + 0.25 * fs, X(t), cy + 0.45 * fs, C.faint, 1.2));
    ctx.lineCap = "round";
    line(x, cy, x + w, cy, C.grid2, 0.26 * fs);
    line(x, cy, X(v), cy, col, 0.26 * fs);
    ctx.lineCap = "butt";
    ctx.beginPath(); ctx.arc(X(v), cy, 0.48 * fs, 0, TAU); ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.bg; ctx.stroke();
    hits.push({ kind: "slide", rect: { x: x - 0.7 * fs, y, w: w + 1.4 * fs, h }, set, val: px => lo + (px - x) / w * (hi - lo) });
  }
  function dashed(x0, y0, x1, y1, c, w) { line(x0, y0, x1, y1, c, w, [5, 5]); }

  // ---------- KaTeX numa camada por cima ----------
  const layer = document.getElementById("tex");
  const pool = new Map();
  let used = new Set();
  function texAt(id, src, x, y, px, color, ax = 0.5, ay = 0.5, halo = false) {
    let el = pool.get(id);
    if (!el) { el = document.createElement("span"); layer.appendChild(el); pool.set(id, el); }
    if (el._src !== src) {
      el._src = src;
      if (window.katex) katex.render(src, el, { throwOnError: false, strict: false });
      else el.textContent = src;
    }
    el.className = halo ? "tx halo" : "tx";
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${px}px;color:${color};transform:translate(${-ax * 100}%,${-ay * 100}%)`;
    used.add(id);
    return el;
  }
  function fit(el, w, h = Infinity) {
    const k = Math.min(w / el.offsetWidth, h / el.offsetHeight);
    if (k < 1) el.style.fontSize = parseFloat(el.style.fontSize) * k + "px";
    return el;
  }

  // ---------- desenho ----------
  let raf = 0, last = 0;
  function draw() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    if (S.running) S.t += dt * S.speed;
    paint();
    if (S.running) { last = now; raf = requestAnimationFrame(frame); } else last = 0;
  }
  const go = () => { last = 0; draw(); };
  function paint() {
    L = layout(); hits = []; used = new Set(); usedInp = new Set();
    const { fs } = L, mod = model();
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    legend(L.legend, fs);
    cardMont(L.cards.mont, fs);
    cardTempo(L.cards.tempo, fs);
    cardVer(L.cards.ver, fs);
    cardMola(L.cards.mola, fs);
    cardCI(L.cards.ci, fs);
    cardGraf(L.cards.graf, fs);
    if (L.law) lawStrip(L.law, fs, mod);
    if (L.phys) physStrip(L.phys, fs, mod);
    panels(fs, mod);
    for (const [id, el] of pool) if (!used.has(id)) el.style.display = "none";
    for (const id in INP) if (!usedInp.has(id)) INP[id].el.style.display = "none";
  }

  // em cima: a forma geral da função e o botão do modo escuro
  function legend(b, fs) {
    const bw = b.h * 1.3, w = b.w - bw - 0.4 * fs;
    rrect(b.x, b.y, w, b.h, 8, C.band, C.line, 1.5);
    fit(texAt("legend", "d(t) = D + A\\cos(\\omega t + \\varphi)", b.x + w / 2, b.y + b.h / 2, fs * 1.2, C.ink), w - 0.8 * fs, b.h);
    button(b.x + b.w - bw, b.y, bw, b.h, dark ? "☀" : "☾", false, "theme", {}, C.muted, fs * 1.05);
  }
  function card(b, col, fs) {
    rrect(b.x, b.y, b.w, b.h, 9, C.band, C.line, 1.2);
    ctx.save(); ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 9); ctx.clip();
    ctx.fillStyle = col; ctx.fillRect(b.x, b.y, 0.25 * fs, b.h);
    ctx.restore();
    return { x: b.x + 0.7 * fs, y: b.y + CP * fs, w: b.w - 1.2 * fs };
  }
  const rowY = (c, i, fs) => c.y + i * (ROW + RG) * fs;
  // grupo de botões que ocupam a largura w a partir de x; devolve o fim
  function seg(x, y, w, rh, fs, items, cur, kind, col, px) {
    const g = 0.2 * fs, bh = 1.25 * fs, bw = (w - (items.length - 1) * g) / items.length;
    items.forEach(([v, t], i) => button(x + i * (bw + g), y + (rh - bh) / 2, bw, bh, t, cur === v, kind, { v }, col,
      Math.min(px, px * (bw - 0.5 * fs) / tw(t, px, FONT, 700))));
    return x + w;
  }

  function cardMont(b, fs) {
    const c = card(b, C.muted, fs), rh = ROW * fs, y = rowY(c, 0, fs);
    const lx = c.x + text("Montagem", c.x, y + rh / 2 + 1, fs * 0.8, C.muted) + 0.7 * fs;
    seg(lx, y, c.x + c.w - lx, rh, fs, [["vertical", "↕ Vertical"], ["horizontal", "↔ Horizontal"]], S.pos, "pos", C.muted, fs * 0.85);
  }
  function cardTempo(b, fs) {
    const c = card(b, C.hot, fs), rh = ROW * fs, bh = 1.25 * fs;
    let y = rowY(c, 0, fs);
    const lab = S.running ? "❚❚ Parar" : S.t > 0 ? "▶ Continuar" : "▶ Ligar o tempo";
    const bw = Math.max(tw("▶ Ligar o tempo", fs * 0.85, FONT, 700), tw("▶ Continuar", fs * 0.85, FONT, 700)) + 1.2 * fs;
    button(c.x, y + (rh - bh) / 2, bw, bh, lab, true, "run", {}, C.hot, fs * 0.85);
    const rw = 2.2 * fs;
    button(c.x + bw + 0.3 * fs, y + (rh - bh) / 2, rw, bh, "↺", false, "reset", {}, C.muted, fs);
    const sx = c.x + bw + rw + 0.9 * fs;
    seg(sx, y, c.x + c.w - sx, rh, fs, [[0.25, "¼×"], [0.5, "½×"], [1, "1×"]], S.speed, "speed", C.muted, fs * 0.85);
    y = rowY(c, 1, fs);
    texAt("tl", "t", c.x + 0.2 * fs, y + rh / 2, fs * 0.95, C.muted, 0, 0.5);
    const iw = 3.6 * fs, ux = c.x + c.w - tw("s", fs * 0.8) , ix = ux - 0.3 * fs - iw, lx = c.x + 1.4 * fs;
    slider(lx, y, ix - 0.9 * fs - lx, rh, 0, tMax(), S.t, C.hot, fs, setTime);
    place("tin", { x: ix, y: y + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, fs * 0.8);
    text("s", c.x + c.w, y + rh / 2 + 1, fs * 0.8, C.muted, "right");
  }
  function cardVer(b, fs) {
    const c = card(b, C.curve, fs), rh = ROW * fs, bs = 0.8 * fs, px = fs * 0.8, half = c.w * 0.52;
    let y = rowY(c, 0, fs);
    cbox(c.x, y, rh, bs, px, S.graph, "Gráfico de d(t)", { kind: "graph" }, C.curve);
    cbox(c.x + half, y, rh, bs, px, S.mid, "Linha média", { kind: "mid" }, C.eq);
    y = rowY(c, 1, fs);
    cbox(c.x, y, rh, bs, px, S.law, "Expressão de d(t)", { kind: "law" }, C.ink);
    cbox(c.x + half, y, rh, bs, px, S.phys, "Grandezas", { kind: "phys" }, C.phys);
  }
  // linha de um parâmetro: nome (KaTeX), cursor, valor e unidade
  function paramRow(c, i, fs, key, tex, unit, col, dec, ticks) {
    const rh = ROW * fs, y = rowY(c, i, fs), [lo, hi] = LIM[key];
    texAt("pl-" + key, tex, c.x + 0.1 * fs, y + rh / 2, fs * 0.95, C.muted, 0, 0.5);
    const vw = tw("−0,30", fs * 0.85, MONO, 600), uw = tw("N/m", fs * 0.75) + 0.3 * fs;
    const lx = c.x + 2.4 * fs, rx = c.x + c.w - uw - vw - 1 * fs;
    slider(lx, y, rx - lx, rh, lo, hi, S[key], col, fs, setParam(key), ticks);
    text(fmt(S[key], dec), c.x + c.w - uw, y + rh / 2 + 1, fs * 0.85, C.ink, "right", MONO, 600);
    text(unit, c.x + c.w, y + rh / 2 + 1, fs * 0.75, C.muted, "right");
  }
  function cardMola(b, fs) {
    const c = card(b, C.spring, fs);
    paramRow(c, 0, fs, "m", "m", "kg", C.ball, 2);
    paramRow(c, 1, fs, "k", "k", "N/m", C.spring, 0);
    paramRow(c, 2, fs, "L", "L_0", "m", C.spring, 2);
  }
  function cardCI(b, fs) {
    const c = card(b, C.ball, fs);
    paramRow(c, 0, fs, "x0", "x_0", "m", C.ball, 2, [0]);
    paramRow(c, 1, fs, "v0", "v_0", "m/s", C.ball, 2, [0]);
  }
  function cardGraf(b, fs) {
    const c = card(b, C.faint, fs), rh = ROW * fs, bh = 1.25 * fs, px = fs * 0.8;
    let y = rowY(c, 0, fs);
    let lx = c.x + text("Escala de d", c.x, y + rh / 2 + 1, px, C.muted) + 0.7 * fs;
    seg(lx, y, c.x + c.w - lx, rh, fs, [[1, "0–1 m"], [2, "0–2 m"], [4, "0–4 m"]], S.scale, "scale", C.muted, fs * 0.8);
    y = rowY(c, 1, fs);
    lx = c.x + text("Janela", c.x, y + rh / 2 + 1, px, C.muted) + 0.5 * fs;
    const iw = 3.2 * fs;
    place("win", { x: lx, y: y + (rh - 1.3 * fs) / 2, w: iw, h: 1.3 * fs }, fs * 0.8);
    let x = lx + iw + 0.3 * fs;
    x += text("s", x, y + rh / 2 + 1, px, C.muted) + 0.9 * fs;
    if (S.pos === "vertical") {
      x += text("Eixo d", x, y + rh / 2 + 1, px, C.muted) + 0.5 * fs;
      seg(x, y, c.x + c.w - x, rh, fs, [["down", "↓ mola"], ["up", "↑ habitual"]], S.dir, "dir", C.muted, fs * 0.75);
    }
    y = rowY(c, 2, fs);
    const ex = cbox(c.x, y, rh, 0.8 * fs, px, S.keep, "Manter traços", { kind: "keep" }, C.muted);
    if (S.traces.length) {
      const t = `Apagar (${S.traces.length})`, w = tw(t, fs * 0.8, FONT, 700) + 1.2 * fs;
      button(Math.max(ex + 0.6 * fs, c.x + c.w - w), y + (rh - bh) / 2, w, bh, t, false, "clear", {}, C.muted, fs * 0.8);
    }
  }

  // expressão de d(t) com os valores atuais
  function lawStrip(b, fs, mod) {
    const fase = Math.abs(mod.phi) < 0.005 ? "" : ` ${mod.phi < 0 ? "-" : "+"} ${texNum(Math.abs(mod.phi), 2)}`;
    const src = `d(t) = ${texNum(mod.D, 3)}` + (mod.A < 1e-9 ? "" : ` + ${texNum(mod.A, 3)}\\cos\\left(${texNum(mod.w, 2)}\\,t${fase}\\right)`);
    fit(texAt("law", src, b.x + b.w / 2, b.y + b.h / 2 - 0.1 * fs, fs * 1.35, C.ink), b.w - fs, b.h);
  }
  // grandezas: ω, T, f, D, A, φ
  function physStrip(b, fs, mod) {
    rrect(b.x, b.y, b.w, b.h, 8, null, C.phys, 1.2);
    const vert = S.pos === "vertical";
    const l1 = `\\omega = \\sqrt{\\tfrac{k}{m}} = ${texNum(mod.w, 2)}\\ \\text{rad/s}\\qquad T = \\tfrac{2\\pi}{\\omega} = ${texNum(mod.T, 2)}\\ \\text{s}\\qquad f = \\tfrac{1}{T} = ${texNum(1 / mod.T, 2)}\\ \\text{Hz}`;
    const l2 = `D = ${vert ? "L_0 + \\tfrac{mg}{k}" : "L_0"} = ${texNum(mod.D, 3)}\\ \\text{m}\\qquad A = \\sqrt{x_0^2 + \\left(\\tfrac{v_0}{\\omega}\\right)^2} = ${texNum(mod.A, 3)}\\ \\text{m}\\qquad \\varphi = ${texNum(mod.phi, 2)}\\ \\text{rad}`;
    const e1 = texAt("ph1", l1, b.x + b.w / 2, b.y + b.h * 0.27, fs * 0.8, C.phys);
    const e2 = texAt("ph2", l2, b.x + b.w / 2, b.y + b.h * 0.72, fs * 0.8, C.phys);
    const k = Math.min(1, (b.w - fs) / Math.max(e1.offsetWidth, e2.offsetWidth));
    if (k < 1) [e1, e2].forEach(e => e.style.fontSize = fs * 0.8 * k + "px");
  }

  // moldura de um quadro, com o título em cima à esquerda; devolve a largura do título
  function frame_(b, title, fs, short) {
    rrect(b.x, b.y, b.w, b.h, 9, null, C.line, 1.2);
    if (short && tw(title, fs * 0.8, FONT, 700) > b.w - 1.2 * fs) title = short;
    return 0.6 * fs + text(title, b.x + 0.6 * fs, b.y + 0.75 * fs, fs * 0.8, C.muted, "left", FONT, 700);
  }

  // ---------- a mola e o gráfico ----------
  function panels(fs, mod) {
    const vert = S.pos === "vertical", top = S.scale, sc = L.scene, gr = L.graph;
    const dNow = dOf(mod, S.t);
    const R = clamp((13 + 6 * Math.cbrt(S.m)) * fs / 16, 0.6 * fs, 1.5 * fs);   // raio só visual
    // escala vertical comum à cena (vertical) e ao gráfico: de iy0 (d = 0) a iy1 (d = top)
    const iy0 = gr.y + 2.0 * fs, iy1 = gr.y + gr.h - 1.6 * fs;
    const Ys = dd => iy0 + (dd / top) * (iy1 - iy0);
    const down = vert && S.dir === "down";
    const Yg = down ? Ys : dd => iy1 - (dd / top) * (iy1 - iy0);

    // ---- cena ----
    const scTitle = vert ? "Mola suspensa" : "Mola na horizontal (sem atrito)";
    frame_(sc, scTitle, fs, vert ? "Mola" : "Mola (horizontal)");
    let ballX = 0, ballY = 0;
    if (vert) {
      const cx = sc.x + sc.w * 0.42, yb = Ys(dNow), amp = 0.6 * fs;
      // (se a esfera sair do referencial, o desenho fica cortado pela moldura)
      ctx.save(); ctx.beginPath(); ctx.roundRect(sc.x, sc.y, sc.w, sc.h, 9); ctx.clip();
      // teto tracejado
      line(sc.x + 0.5 * fs, iy0, sc.x + sc.w - 0.5 * fs, iy0, C.ceil, 3);
      for (let x = sc.x + 0.7 * fs; x < sc.x + sc.w - 0.9 * fs; x += 0.6 * fs) line(x, iy0, x + 0.5 * fs, iy0 - 0.55 * fs, C.ceil, 1.2);
      if (S.mid) dashed(sc.x + 0.4 * fs, Ys(mod.D), sc.x + sc.w, Ys(mod.D), C.eq, 1.4);
      springV(cx, iy0, Math.max(iy0 + 8, yb - R), amp, fs);
      ball(cx, yb, R);
      // cota d
      const qx = cx + amp + 1.1 * fs;
      line(qx, iy0 + 2, qx, yb, C.muted, 1.2);
      line(qx - 4, yb, qx + 4, yb, C.muted, 1.2);
      ctx.restore();
      texAt("cd", "d", qx + 0.25 * fs, (iy0 + Math.min(yb, iy1)) / 2, fs * 0.85, C.muted, 0, 0.5, true);
      ballX = cx; ballY = yb;
    } else {
      sceneH(sc, fs, mod, dNow, R, top);
    }

    // ---- gráfico ----
    const cap = vert ? "d — distância do teto ao centro da esfera (m)" : "d — distância de O ao centro da esfera P (m)";
    const tW = frame_(gr, cap, fs, vert ? "d — distância do teto à esfera" : "d — distância de O a P");
    const now = texAt("now", `t = ${texNum(S.t, 2)}\\ \\text{s}\\quad d = ${texNum(dNow, 3)}\\ \\text{m}\\quad v = ${texNum(vOf(mod, S.t), 2)}\\ \\text{m/s}`,
      gr.x + gr.w - 0.6 * fs, gr.y + 0.75 * fs, fs * 0.75, C.hot, 1, 0.5, true);
    if (now.offsetWidth > gr.w - tW - 1.2 * fs) {
      now._src = null;
      const n2 = texAt("now", `t = ${texNum(S.t, 2)}\\ \\text{s}`, gr.x + gr.w - 0.6 * fs, gr.y + 0.75 * fs, fs * 0.75, C.hot, 1, 0.5, true);
      if (n2.offsetWidth > gr.w - tW - 1.2 * fs) n2.style.display = "none";
    }
    const gx0 = gr.x + 3.2 * fs, gx1 = gr.x + gr.w - 1.4 * fs, GW = gx1 - gx0;
    const tA = Math.max(0, S.t - S.win), tB = tA + S.win;
    const X = t => gx0 + ((t - tA) / S.win) * GW;
    const px = fs * 0.7;
    // grelha e marcas
    const sx = niceStep(S.win, GW < 25 * fs ? 5 : 10);
    let n = 0;
    for (let t = Math.ceil(tA / sx - 1e-9) * sx; t <= tB + 1e-9; t += sx, n++) {
      line(X(t), iy0, X(t), iy1, C.grid, 1);
      if (down && t < 1e-9) continue;   // (a seta do eixo d está aí)
      texAt("gt" + n, texNum(+t.toFixed(6), sx < 0.1 ? 2 : sx < 1 ? 1 : 0, true), X(t), iy1 + 0.3 * fs, px, C.muted, 0.5, 0);
    }
    const sy = niceStep(top, (iy1 - iy0) < 14 * fs ? 5 : 10);
    n = 0;
    for (let y = 0; y <= top + 1e-9; y += sy, n++) {
      line(gx0, Yg(y), gx1, Yg(y), C.grid, 1);
      texAt("gy" + n, texNum(+y.toFixed(6), sy < 0.1 ? 2 : 1), gx0 - 0.4 * fs, Yg(y), px, C.muted, 1, 0.5);
    }
    // eixos: o eixo t passa em d = 0
    line(gx0, Yg(0), gx1 + 0.3 * fs, Yg(0), C.axis, 1.5);
    tri(gx1 + 0.5 * fs, Yg(0), 1, 0, 0.35 * fs, C.axis);
    line(gx0, iy0 - (down ? 0 : 0.3 * fs), gx0, iy1 + (down ? 0.3 * fs : 0), C.axis, 1.5);
    if (down) tri(gx0, iy1 + 0.5 * fs, 0, 1, 0.35 * fs, C.axis); else tri(gx0, iy0 - 0.5 * fs, 0, -1, 0.35 * fs, C.axis);
    texAt("axt", "t\\ (\\text{s})", gx1 - 0.2 * fs, Yg(0) + (down ? 0.35 * fs : -0.35 * fs), fs * 0.8, C.ink, 1, down ? 0 : 1, true);
    texAt("axd", "d\\ (\\text{m})", gx0 + 0.4 * fs, down ? iy1 - 0.4 * fs : iy0 + 0.4 * fs, fs * 0.8, C.ink, 0, 0.5, true);

    // linha média (equilíbrio)
    if (S.mid) {
      dashed(gx0, Yg(mod.D), gx1, Yg(mod.D), C.eq, 1.4);
      texAt("eqt", `\\text{linha média}\\ \\ d = ${texNum(mod.D, 3)}`, gx1 - 0.2 * fs, Yg(mod.D) - 0.2 * fs, fs * 0.7, C.eq, 1, 1, true);
    }

    // traços: os guardados (até ao instante em que pararam) e o atual
    if (S.graph) {
      ctx.save(); ctx.beginPath(); ctx.rect(gx0, iy0 - 2, GW, iy1 - iy0 + 4); ctx.clip();
      const trace = (md, tEnd, color, weight) => {
        const t1 = Math.min(tEnd, tB);
        if (t1 <= tA) return null;
        const N = Math.max(60, Math.round(GW * 2 * (t1 - tA) / S.win));
        ctx.strokeStyle = color; ctx.lineWidth = weight; ctx.lineJoin = "round"; ctx.beginPath();
        for (let i = 0; i <= N; i++) { const t = tA + (t1 - tA) * i / N, xx = X(t), yy = Yg(dOf(md, t)); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
        ctx.stroke();
        return [X(t1), Yg(dOf(md, t1))];
      };
      S.traces.forEach(tr => {
        const c = C.H[tr.c], end = trace(model(tr), tr.t, c, Math.max(1.6, 0.11 * fs));
        if (end && tr.t <= tB) { ctx.beginPath(); ctx.arc(end[0], end[1], 0.2 * fs, 0, TAU); ctx.fillStyle = c; ctx.fill(); }
      });
      if (S.t > 0) trace(mod, S.t, C.curve, Math.max(2.2, 0.16 * fs));
      ctx.restore();
      // ponto atual e ligação à esfera
      const ppx = X(S.t), ppy = Yg(dNow);
      if (down) dashed(ballX + R + 2, ballY, ppx, ppy, C.ball, 1);
      ctx.beginPath(); ctx.arc(ppx, ppy, 0.3 * fs, 0, TAU); ctx.fillStyle = C.curve; ctx.fill();
    }

    // avisos
    const warns = [];
    if (mod.D - mod.A <= 0.08) warns.push(`⚠ Com estes valores a mola ficaria quase toda comprimida: a esfera bateria ${vert ? "no teto" : "na parede"}. Diminui x₀ ou v₀.`);
    if (mod.D + mod.A + 0.03 > S.scale) warns.push("⚠ A esfera sai do referencial: escolhe uma escala maior.");
    warns.forEach((w, i) => {
      const wpx = Math.min(fs * 0.72, fs * 0.72 * (GW - fs) / tw(w, fs * 0.72, FONT, 700));
      const yy = (down ? iy0 + 1.2 * fs : iy1 - 1.4 * fs) + (down ? 1 : -1) * i * 1.1 * fs;
      const ww = tw(w, wpx, FONT, 700);
      rrect(gx0 + 0.5 * fs - 0.3 * fs, yy - 0.5 * fs, ww + 0.6 * fs, fs, 5, C.bg, null);
      text(w, gx0 + 0.5 * fs, yy, wpx, C.hot, "left", FONT, 700);
    });
  }

  function ball(x, y, R) {
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fillStyle = C.ball; ctx.fill();
    ctx.beginPath(); ctx.arc(x - R * 0.35, y - R * 0.35, R * 0.35, 0, TAU); ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fill();
  }
  // mola vertical: pontas direitas + zigue-zague com número fixo de espiras
  function springV(cx, y0, y1, amp, fs) {
    const lead = Math.min(0.6 * fs, (y1 - y0) * 0.12), coils = 12, span = (y1 - lead) - (y0 + lead);
    ctx.strokeStyle = C.spring; ctx.lineWidth = Math.max(1.8, 0.12 * fs); ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(cx, y0); ctx.lineTo(cx, y0 + lead);
    for (let i = 0; i < coils * 2; i++) ctx.lineTo(cx + (i % 2 ? -amp : amp), y0 + lead + span * (i + 0.5) / (coils * 2));
    ctx.lineTo(cx, y1 - lead); ctx.lineTo(cx, y1); ctx.stroke();
  }
  // montagem horizontal: parede com O à esquerda, mola, esfera P a deslizar no chão (sem atrito);
  // a régua por baixo do chão usa a escala de d
  function sceneH(b, fs, mod, dNow, R, top) {
    const x0 = b.x + 2.2 * fs, x1 = b.x + b.w - 1.4 * fs;
    const Xs = dd => x0 + (dd / top) * (x1 - x0);
    const floorY = b.y + b.h - 1.9 * fs, cy = floorY - R - 2;
    line(x0 - 0.3 * fs, floorY, x1 + 0.4 * fs, floorY, C.ceil, 4);
    line(x0 - 0.3 * fs, floorY + 2, x0 - 0.3 * fs, Math.max(b.y + 1.6 * fs, cy - R - 1.4 * fs), C.ceil, 4);
    // régua
    const st = niceStep(top, (x1 - x0) < 30 * fs ? 5 : 10);
    let n = 0;
    for (let v = 0; v <= top + 1e-9; v += st, n++) {
      line(Xs(v), floorY + 0.25 * fs, Xs(v), floorY + 0.55 * fs, C.muted, 1);
      texAt("rh" + n, texNum(+v.toFixed(6), st < 0.1 ? 2 : 1), Xs(v), floorY + 0.65 * fs, fs * 0.6, C.muted, 0.5, 0);
    }
    if (S.mid) dashed(Xs(mod.D), cy - R - 1.1 * fs, Xs(mod.D), floorY, C.eq, 1.4);
    // mola presa em O
    const xb = Xs(dNow), xs0 = Xs(0), xs1 = Math.max(xs0 + 8, xb - R);
    const lead = Math.min(0.7 * fs, (xs1 - xs0) * 0.12), coils = 14, amp = 0.5 * fs, span = (xs1 - lead) - (xs0 + lead);
    ctx.strokeStyle = C.spring; ctx.lineWidth = Math.max(1.8, 0.12 * fs); ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(xs0, cy); ctx.lineTo(xs0 + lead, cy);
    for (let i = 0; i < coils * 2; i++) ctx.lineTo(xs0 + lead + span * (i + 0.5) / (coils * 2), cy + (i % 2 ? -amp : amp));
    ctx.lineTo(xs1 - lead, cy); ctx.lineTo(xs1, cy); ctx.stroke();
    ctx.beginPath(); ctx.arc(xs0, cy, 0.2 * fs, 0, TAU); ctx.fillStyle = C.ink; ctx.fill();
    texAt("hO", "O", xs0 - 0.5 * fs, cy, fs * 0.9, C.ink, 1, 0.5);
    ball(xb, cy, R);
    ctx.beginPath(); ctx.arc(xb, cy, 0.14 * fs, 0, TAU); ctx.fillStyle = C.bg; ctx.fill();
    texAt("hP", "P", xb + R * 0.6, cy - R * 0.6, fs * 0.9, C.ink, 0, 1);
    // cota d por cima: de O ao centro de P
    const qy = cy - R - 0.7 * fs;
    line(xs0, qy, xb, qy, C.muted, 1.2);
    line(xs0, qy - 4, xs0, qy + 4, C.muted, 1.2); line(xb, qy - 4, xb, qy + 4, C.muted, 1.2);
    texAt("hd", "d", (xs0 + xb) / 2, qy - 0.15 * fs, fs * 0.85, C.muted, 0.5, 1, true);
  }

  // ---------- toque e rato ----------
  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const hitAt = (x, y) => hits.find(h => h.rect && inRect(h.rect, x, y)) || null;
  let drag = null;
  const toggle = key => { S[key] = !S[key]; draw(); };
  cv.addEventListener("pointerdown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) document.activeElement.blur();
    const h = hitAt(e.clientX, e.clientY);
    if (!h) return;
    e.preventDefault();
    if (h.kind === "theme") { setDark(!dark, true); for (const el of pool.values()) el._src = null; draw(); return; }
    if (h.kind === "pos") { setPos(h.v); return; }
    if (h.kind === "run") { toggleRun(); return; }
    if (h.kind === "reset") { restart(); return; }
    if (h.kind === "speed") { S.speed = h.v; draw(); return; }
    if (h.kind === "scale") { S.scale = h.v; draw(); return; }
    if (h.kind === "dir") { S.dir = h.v; draw(); return; }
    if (["graph", "mid", "law", "phys", "keep"].includes(h.kind)) { toggle(h.kind); return; }
    if (h.kind === "clear") { S.traces = []; nextColor = 0; draw(); return; }
    if (h.kind === "slide") {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      drag = h; h.set(h.val(e.clientX)); cv.style.cursor = "grabbing";
    }
  });
  cv.addEventListener("pointermove", e => {
    if (drag) {
      // o cursor do tempo não muda de escala enquanto se arrasta
      drag.set(drag.val(e.clientX));
      return;
    }
    const h = hitAt(e.clientX, e.clientY);
    cv.style.cursor = !h ? "default" : h.kind === "slide" ? "ew-resize" : "pointer";
  });
  const end = () => { drag = null; cv.style.cursor = "default"; };
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, end));

  // teclado (fora das caixas): espaço liga/para o tempo, r recomeça, ←/→ mexem no tempo (Shift ×10),
  // g gráfico, l linha média, e expressão, f grandezas, v troca a montagem
  window.addEventListener("keydown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === " ") toggleRun();
    else if (e.key === "r") restart();
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") setTime(S.t + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 0.1 : 0.01));
    else if (e.key === "g") toggle("graph");
    else if (e.key === "l") toggle("mid");
    else if (e.key === "e") toggle("law");
    else if (e.key === "f") toggle("phys");
    else if (e.key === "v") setPos(S.pos === "vertical" ? "horizontal" : "vertical");
    else return;
    e.preventDefault();
  });

  // endereço com condições iniciais: #horizontal&m=1&k=88.83&L=0.6&x0=0.08&v0=0&w=2 (w = janela de tempo)
  // (ponto ou vírgula decimal; os valores ficam dentro dos limites dos cursores)
  (() => {
    const parts = location.hash.slice(1).split("&");
    if (parts[0] === "horizontal") S.pos = "horizontal";
    for (const kv of parts) {
      const [key, val] = kv.split("=");
      if (val === undefined) continue;
      const x = parseFloat(decodeURIComponent(val).replace(",", "."));
      if (!isFinite(x)) continue;
      if (key === "w") { setWin(x); continue; }
      if (key in LIM) S[key] = clamp(x, LIM[key][0], LIM[key][1]);   // (sem arredondar ao passo do cursor)
    }
  })();
  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  if (document.fonts) document.fonts.ready.then(draw);
  resize();
})();
</script>
</body>
