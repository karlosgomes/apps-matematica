<style>
  :root { --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  /* campos das coordenadas no modo Espaço */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.45em; border: 2px solid var(--line); border-radius: 8px;
         background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; outline: none; }
  .inp.bad { border-color: var(--bad) !important; background: var(--badbg); }
  /* cursor de k à direita do campo Q(k) (pedido do utilizador, 2026-11-24) */
  .kslider { position: fixed; z-index: 2; margin: 0; accent-color: #00838f; cursor: pointer; }
  :root[data-theme="dark"] .kslider { accent-color: #4dd0e1; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  /* Espaço: contorno fino em vez do halo difuso, que fazia uma «nuvem» clara/escura sobre os planos (pedido do utilizador, 2026-11-13) */
  :root[data-mode="esp"] .tx.halo { text-shadow: 0 0 1px var(--bg), 0 0 1px var(--bg); }
  /* etiqueta do ponto Q(k): halo forte, para se ler por cima do caminho e dos planos (pedido do utilizador, 2026-11-24) */
  :root[data-mode="esp"] .tx.halo.hforte { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg); background: color-mix(in srgb, var(--bg) 60%, transparent); border-radius: 0.3em; padding: 0 0.12em; }
  /* menu do botão direito (modo Vetores): soma e diferença */
  #menu { position: fixed; z-index: 3; display: none; flex-direction: column; min-width: 9em; padding: 3px; border: 1.5px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.25); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  #menu button { all: unset; display: flex; align-items: center; gap: .5em; padding: .25em .6em; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  #menu button:hover, #menu button:focus-visible { background: var(--line); }
  #menu button .ok { width: 1em; text-align: center; }
  #menu .katex { font-size: 1.05em; }
  #toast { position: fixed; z-index: 4; left: 50%; bottom: 1.2rem; transform: translateX(-50%); padding: .45em .9em; border-radius: 8px;
           background: var(--ink); color: var(--bg); font: 15px "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 2px 4px; }
  /* janela do gráfico de f(k) (Ponto Q(k), Espaço): móvel pela barra do título e com tamanho pelo canto (pedido do utilizador, 2026-11-27) */
  #pkw { position: fixed; z-index: 3; display: none; flex-direction: column; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px;
         background: color-mix(in srgb, var(--bg) 95%, transparent); box-shadow: 0 6px 20px rgba(0,0,0,.22); overflow: hidden; }
  #pkw .th { display: flex; align-items: center; gap: .4em; padding: .15em .3em .15em .6em; cursor: move; touch-action: none; user-select: none; -webkit-user-select: none;
             border-bottom: 1px solid var(--line); color: var(--ink); font: 14px "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
  #pkw .th span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pkw .th button { all: unset; cursor: pointer; width: 1.5em; height: 1.5em; text-align: center; line-height: 1.5em; border-radius: 6px; font-size: 15px; }
  #pkw .th button:hover { background: var(--line); }
  #pkw .corpo { position: relative; flex: 1; }
  #pkw canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #pkt { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #pkw .rz { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
             background: linear-gradient(135deg, transparent 50%, var(--line) 50%, var(--line) 60%, transparent 60%, transparent 72%, var(--line) 72%, var(--line) 82%, transparent 82%); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

<!-- GoatCounter: contagem de visitas, sem cookies (não conta em localhost) -->
<script data-goatcounter="https://karlosgomes.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// GoatCounter: eventos dentro da app (cada um no máximo uma vez por visita), com o nome «app: ação»
(() => {
  const seen = new Set(), app = location.pathname.split("/").filter(Boolean).pop() || "apps";
  const send = (name, tries = 0) => {
    if (window.goatcounter && goatcounter.count) goatcounter.count({ path: app + ": " + name, title: name, event: true });
    else if (tries < 20) setTimeout(() => send(name, tries + 1), 500);
  };
  window.gcEvt = h => {
    if (!h) return;
    let name = typeof h === "string" ? h : [h.kind, h.v ?? h.k ?? h.key ?? ""].filter(x => x !== "" && x != null).join(" ");
    name = String(name).trim().slice(0, 60);
    if (!name || seen.has(name)) return;
    seen.add(name); send(name);
  };
  // botões e menus em HTML (apps Python, Estatística, Folha de cálculo e as janelas das outras)
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("button, [role=button]");
    if (b) gcEvt((b.textContent || "").trim().replace(/\s+/g, " ").slice(0, 40) || b.title || b.id);
  }, true);
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.tagName === "SELECT") gcEvt((t.id || t.name || "menu") + ": " + ((t.options[t.selectedIndex] || {}).text || t.value));
    else if (t.type === "checkbox") gcEvt(((t.closest("label") || {}).textContent || t.id || "caixa").trim().slice(0, 40));
  }, true);
})();
</script>

<body>
<div id="tex" aria-hidden="true"></div>
<div id="pkw" role="dialog" aria-label="Gráfico de f(k)"><div class="th"><span>Gráfico de <i>f</i>(<i>k</i>)</span><button type="button" title="Fechar" aria-label="Fechar">×</button></div><div class="corpo"><canvas id="pkc"></canvas><div id="pkt" aria-hidden="true"></div></div><div class="rz" title="Arrastar para mudar o tamanho"></div></div>

<canvas id="cv" aria-label="Produto escalar de dois vetores no plano; declive, inclinação e ângulo de duas retas"></canvas>
<script>
(() => {
  // Pensada para smartphone e projeção: controlos desenhados no canvas, texto matemático em KaTeX por cima; tema claro ou escuro
  const PI = Math.PI, TAU = 2 * PI;
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    u: "#1565c0", v: "#7b1fa2", pos: "#2e7d32", neg: "#d32f2f", zero: "#ef6c00",
    al: "#1565c0", be: "#7b1fa2", rr: "#e65100", qq: "#2e7d32", w: "#00838f",
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    u: "#64a8ff", v: "#d09cff", pos: "#5cc26a", neg: "#ff6b6b", zero: "#ffa040",
    al: "#64a8ff", be: "#d09cff", rr: "#ffa040", qq: "#5cc26a", w: "#4dd0e1",
  };
  const C = { ...LIGHT };
  // modo escuro: mesma chave do weblog no localStorage ("alternate" = escuro, "default" = claro); sem escolha, segue o sistema
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const CBFONT = '"KaTeX_Main", "Times New Roman", serif';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // estado: modo «vet» (vetores u e v com origem em O) ou «retas» (r por A e B, s por C e D)
  const INI = { u: [3, 1], v: [1, 2], A: [0, 1], B: [2, 2], C: [1, 4], D: [3, -2] };
  const S = { mode: "vet", ...JSON.parse(JSON.stringify(INI)),
              ang: false, proj: false, s: false, incl: false, dir: false, dO: false, angR: false,
              z: 1, vx: 0, vy: 0,
              uo: [0, 0], vo: [0, 0],   // origens de u e v (arrastar o corpo do vetor desloca-o; duplo clique volta a O)
              op: null,   // vetor soma/diferença (botão direito em Vetores): "s" = u+v, "d" = u−v, "e" = v−u
              rot: false, R: 3, tr: 0, run: false,   // «v a rodar»: v(t) = R(cos t, sin t) e o gráfico de f(t) = u·v(t)                // texto da esquerda à vista (botão «Texto», tecla t)
              eA: true, eR: false, eB: false, eUV: false, eC: false, nO: false, vert: {},
              nrm: false,   // Retas: vetores diretores normalizados (botão direito; só com «r, s → O»)
              eI: false,   // Espaço: reta de interseção de α e β (botão direito)
              // (xs: definido abaixo, um valor no Espaço e outro na Esfera)   // Espaço: plano xOy — 0 grelha, 1 cinzento, 2 grelha e cinzento, 3 escondido (botão «xOy» à direita, cada toque passa ao seguinte)
              noAx: false,   // Espaço: esconder o referencial Oxyz (botão «Oxyz» à direita)
              tX: false,   // Espaço: interseção de α e β com xOy, linha cinzenta ténue (botão direito; experiência 2026-11-15)
              gP: false,   // Espaço: grelha fina nos planos α e β, de 1 em 1, estática (botão direito; desligada ao início)
              sph: false,   // Esfera (botão «Esfera»; por dentro é o modo Espaço só com u, v e a esfera de raio ‖v‖; pedido do utilizador, 2026-11-16)
              sL: false, sM: true, sP: false,
              sG: false, sRun: false,
              sK: false,
              sR: false,   // Esfera, com o cone: «v em torno de u» (na circunferência de nível; θ e u·v constantes)   // Esfera: cone dos vetores com o mesmo θ que v (caixa; o resto fica translúcido)
              sC: false,   // Esfera: pré-visualizar a circunferência máxima que v percorre com o ▶ (botão direito)   // Esfera: v a percorrer uma circunferência máxima pela direção de u (▶) e o gráfico de f(t) = u·v(t)   // Esfera: circunferências de nível, máximo e mínimo, plano perpendicular a u
              eX: false,   // Espaço: ponto X do plano α e o vetor PX (botão direito)
              xR: false,   // Espaço: rasto do ponto X em α (botão direito; pedido do utilizador, 2026-11-23)
              eT: false,
              eK: false, kv: 0, kG: false,
              kO: false, kP: false, kL: true,   // Ponto Q(k): vetor OQ e etiqueta de Q no referencial (caixas à direita do cursor de k; pedido do utilizador, 2026-11-26)   // kG: gráfico de f(k) por baixo da figura (botão direito)   // Espaço: caixa «Ponto P(k)» e o valor de k do ponto P (arrasta-se ao longo do caminho; 2026-11-24)
              orto: false,   // Espaço: vista ortográfica em vez da perspetiva (botão à direita; pedido do utilizador, 2026-11-25)
              esc: 0,   // Espaço: escala dos eixos (Shift + roda; pedido do utilizador, 2026-11-24): 0 → ±5, 1 → ±10, 2 → ±20   // Espaço: polígono das interseções de α com os eixos (botão direito; pedido do utilizador, 2026-11-23)
              xst: [-2.4, -1.2] };   // posição de X em α: P + s·e1 + t·e2 (arrasta-se no plano)   // Espaço: ponto X do plano α e o vetor PX (botão direito)   // Espaço: esconder o referencial Oxyz — eixos, marcas, números, x/y/z e O (botão direito)   // Espaço: esconder a quadrícula do plano xOy (botão direito)

  // «Mostrar texto»: um valor por modo; os três começam sem texto (pedido do utilizador)
  const TXT = { vet: false, retas: false, esp: false };
  // «Eixos: esconder números» (botão direito): também um valor por modo (pedido do utilizador)
  const NONUM = { vet: false, retas: false, esp: false };
  Object.defineProperty(S, "noNum", { get: () => NONUM[S.mode], set: v => { NONUM[S.mode] = v; }, enumerable: true });
  // «Coordenadas inteiras» (botão direito, antes caixa): um valor por modo (pedido do utilizador, 2026-11-14)
  // no Espaço começa desligada (os saltos de 1 em 1 no 3D eram grandes demais; pedido do utilizador, 2026-11-23);
  // a Esfera tem o seu próprio valor, ligado (pontos inteiros da esfera)
  const INT = { vet: true, retas: true, esp: false, sph: true };
  const intK = () => S.mode === "esp" && S.sph ? "sph" : S.mode;
  Object.defineProperty(S, "int", { get: () => INT[intK()], set: v => { INT[intK()] = v; }, enumerable: true });
  // plano xOy (botão «xOy»): um valor no Espaço (grelha ao início) e outro na Esfera (escondido ao início; pedido do utilizador, 2026-11-16)
  const XS = { esp: 0, sph: 3 };
  Object.defineProperty(S, "xs", { get: () => XS[S.sph ? "sph" : "esp"], set: v => { XS[S.sph ? "sph" : "esp"] = v; }, enumerable: true });
  Object.defineProperty(S, "txt", { get: () => TXT[S.mode], set: v => { TXT[S.mode] = v; }, enumerable: true });

  // ---------- números em LaTeX ----------
  const EPS = 1e-9;
  const r1 = v => Math.round(v * 10) / 10;                       // coordenadas: inteiras ou com uma casa decimal
  const ten = v => Math.round(v * 10);                            // em décimas (inteiro)
  const isInt = v => Math.abs(v - Math.round(v)) < EPS;
  // decimal com vírgula (até d casas, sem zeros à direita)
  const fmt = (v, d = 2) => { if (Math.abs(v) < 0.5 * 10 ** -d) v = 0; return (+v.toFixed(d)).toString().replace(".", "{,}"); };
  const num = v => fmt(v, 2);
  const apx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace(".", "{,}");   // valor aproximado (casas fixas)
  const par = v => v < 0 ? `(${num(v)})` : num(v);
  const sq = v => `${par(v)}^2`;
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const clr = (c, s) => `\\textcolor{${c}}{${s}}`;
  const U = s => clr(C.u, s), V = s => clr(C.v, s);
  const sgnCol = d => d > EPS ? C.pos : d < -EPS ? C.neg : C.zero;
  // √n simplificado (n inteiro: k√m); n decimal fica dentro da raiz
  function sqrtTex(n) {
    n = Math.round(n * 100) / 100;
    if (!isInt(n)) return `\\sqrt{${num(n)}}`;
    n = Math.round(n);
    if (n === 0) return "0";
    let k = 1, m = n;
    for (let f = 2; f * f <= m; f++) while (m % (f * f) === 0) { m /= f * f; k *= f; }
    if (m === 1) return `${k}`;
    return `${k > 1 ? k : ""}\\sqrt{${m}}`;
  }
  // fração p/q (inteiros) irredutível
  function frac(p, q) {
    if (q < 0) { p = -p; q = -q; }
    const g = gcd(p, q) || 1; p /= g; q /= g;
    if (q === 1) return `${p}`;
    return `${p < 0 ? "-" : ""}\\frac{${Math.abs(p)}}{${q}}`;
  }
  const fracPar = (p, q) => p * q < 0 && Math.abs(q / gcd(p, q)) !== 1 ? `\\left(${frac(p, q)}\\right)` : p * q < 0 ? `(${frac(p, q)})` : frac(p, q);
  // ângulo em graus: «=» se for exato (inteiro), senão «≈» com uma casa
  const degTex = (a, sym) => { const g = a * 180 / PI; return isInt(Math.round(g * 1e6) / 1e6) ? `${sym} = ${Math.round(g)}^\\circ` : `${sym} \\approx ${apx(g, 1)}^\\circ`; };
  const cosTex = c => Math.abs(c * 2 - Math.round(c * 2)) < 1e-9 ? `= ${num(c)}` : `\\approx ${apx(c, 2)}`;
  const pt = (p) => `(${num(p[0])}${p.every(isInt) ? ",\\," : ";\\,"}${num(p[1])})`;

  // ---------- texto da faixa de cima (grupos de afirmações; cada grupo começa numa linha nova) ----------
  // cada peça é uma string, ou {t, cont: true} para continuar a anterior sem grande espaço
  const UU = () => U("\\vec u"), VV = () => V("\\vec v");
  // «v a rodar»: f(t) = u·v(t) = a cos t + b sin t = ‖u‖R cos(t − φ)
  function rotInfo() {
    const [u1, u2] = S.u, Rr = S.R, A = Math.hypot(u1, u2) * Rr;
    let phi = Math.atan2(u2, u1); if (phi < 0) phi += TAU;
    return { u1, u2, Rr, A, phi, a: u1 * Rr, b: u2 * Rr, f: t => A * Math.cos(t - phi) };
  }
  function rotPieces() {
    const o = rotInfo(), nu = o.u1 ** 2 + o.u2 ** 2, RT = num(o.Rr), ft = o.f(S.tr);
    const lin = (a, b) => { let s_ = ""; if (Math.abs(a) > EPS) s_ += `${num(a)}\\cos t`; if (Math.abs(b) > EPS) s_ += `${s_ ? (b < 0 ? " - " : " + ") : (b < 0 ? "-" : "")}${num(Math.abs(b))}\\sin t`; return s_ || "0"; };
    const AT = sqrtTex(Math.round(nu * o.Rr * o.Rr * 100) / 100);
    return [
      [`${VV()}(t) = (${RT}\\cos t,\\ ${RT}\\sin t)`],
      [`f(t) = ${UU()}\\cdot${VV()}(t) = ${U(par(o.u1))}\\times ${RT}\\cos t + ${U(par(o.u2))}\\times ${RT}\\sin t`, { cont: true, t: `= ${lin(o.a, o.b)}` }],
      [`f(t) = \\|${UU()}\\|\\,\\|${VV()}\\|\\cos(t - \\varphi) = ${AT}\\cos(t - \\varphi)`, { cont: true, sep: 1, t: `\\varphi \\approx ${apx(o.phi)}\\ \\text{rad}\\ (${apx(o.phi * 180 / PI, 1)}^\\circ)` }],
      [`\\text{máximo } ${AT} \\approx ${apx(o.A)}\\ (${VV()}\\ \\text{com o sentido de}\\ ${UU()}),`, `\\text{mínimo } -${AT}\\ (\\text{sentido oposto}),`, `\\text{zeros: } ${VV()} \\perp ${UU()}`],
      [`t \\approx ${apx(S.tr)}:\\quad f(t) \\approx ${clr(sgnCol(Math.round(ft * 100) / 100), apx(ft))}`],
    ];
  }
  // vetor soma/diferença (S.op): w = a ± b, com a e b os representantes na origem
  const OPS = { s: ["u", "v", 1], d: ["u", "v", -1], e: ["v", "u", -1] };
  function opInfo() {
    if (!OPS[S.op]) return null;
    const [ka, kb, sg] = OPS[S.op], a = S[ka], b = S[kb];
    const T = k => k === "u" ? UU() : VV(), cl = k => k === "u" ? U : V, sub = k => k === "u" ? "u" : "v";
    return { ka, kb, sg, a, b, w: [r1(a[0] + sg * b[0]), r1(a[1] + sg * b[1])],
             name: `${T(ka)} ${sg > 0 ? "+" : "-"} ${T(kb)}`, nm: `\\vec ${ka} ${sg > 0 ? "+" : "-"} \\vec ${kb}`, plain: `${ka}${sg > 0 ? "+" : "−"}${kb}`, cl, sub };
  }
  function vecPieces() {
    const [u1, u2] = S.u, [v1, v2] = S.v;
    const d = Math.round((u1 * v1 + u2 * v2) * 100) / 100, sc = sgnCol(d);
    const nu = u1 * u1 + u2 * u2, nv = v1 * v1 + v2 * v2;
    const G = S.rot ? rotPieces() : [[
      `${UU()}\\cdot${VV()} = ${U("u_1")}${V("v_1")} + ${U("u_2")}${V("v_2")}`,
      { cont: true, t: `= ${U(par(u1))}\\times${V(par(v1))} + ${U(par(u2))}\\times${V(par(v2))} = ${clr(sc, num(d))}` },
    ]];
    if (S.ang) {
      const g = [
        `\\|${UU()}\\| = \\sqrt{${sq(u1)} + ${sq(u2)}} = ${sqrtTex(nu)}`,

  // reta infinita (recortada pela figura) e ponto onde corta o eixo Ox

  // zona do texto (fora da figura e fora dos botões e caixas de baixo): o botão direito aí dá «Mostrar texto» (pedido do utilizador, 2026-11-15)
  function inText(x, y) {
    if (inFig(x, y)) return false;
    return !hits.some(h => h.rect && x >= h.rect.x && x <= h.rect.x + h.rect.w && y >= h.rect.y && y <= h.rect.y + h.rect.h);
  }
  let menuClosedAt = -1e9;
  window.addEventListener("pointerdown", e => { if (menu.style.display === "flex" && !menu.contains(e.target)) { closeMenu(); menuClosedAt = performance.now(); } }, true);
  menu.addEventListener("keydown", e => {
    const bs = [...menu.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
    if (e.key === "Escape") closeMenu();
    else if (e.key === "ArrowDown") bs[(i + 1) % bs.length].focus();
    else if (e.key === "ArrowUp") bs[(i - 1 + bs.length) % bs.length].focus();
    else return;
    e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener("resize", closeMenu);
  const end = e => {
    if (drag3 && e.pointerId === drag3.id) {
      // toque sem arrastar: a pega passa a mover-se na vertical (↕), ou volta à horizontal
      if (!drag3.moved && drag3.key !== "Xa" && drag3.key !== "vS" && drag3.key !== "Pk") S.vert[drag3.key] = !S.vert[drag3.key];
      if (!drag3.moved && drag3.key === "Pk") S.kL = !S.kL;   // clique em Q (sem arrastar): mostra/esconde a etiqueta (pedido do utilizador, 2026-11-27)
      drag3 = null; cv.style.cursor = "default"; draw();
      return;
    }
    ptrs.delete(e.pointerId);
    if (drag && drag.kind === "pinch" && ptrs.size === 1) {
      // fica um dedo: continua a deslocar a vista
      const [p] = [...ptrs.values()];
      drag = { kind: "pan", x: p.x, y: p.y, vx: S.vx, vy: S.vy };
      return;
    }
    if (!ptrs.size) { drag = null; cv.style.cursor = "default"; }
  };
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, end));
  // Espaço: Shift + roda muda a escala dos eixos (±5 → ±10 → ±20), um degrau por movimento da roda
  // (pedido do utilizador, 2026-11-24); apanhado antes das OrbitControls, que fariam zoom
  let escT = 0;
  window.addEventListener("wheel", e => {
    if (!e.shiftKey || S.mode !== "esp" || S.sph || e.target !== cv) return;
    { const h = hitAt(e.clientX, e.clientY);   // sobre o gráfico de f(k): as duas escalas à volta do ponteiro
      if (h && h.kind === "pkT" && PKA) {
        e.preventDefault(); e.stopImmediatePropagation();
        const A = PKA, dl = e.deltaY || e.deltaX, f = Math.exp(clamp(dl, -100, 100) * 0.0025), ka = A.k0 + (e.clientX - A.x0) / (A.x1 - A.x0) * (A.k1 - A.k0);
        const w = clamp((A.k1 - A.k0) * f, 0.05, 2000), t = (ka - A.k0) / (A.k1 - A.k0);
        PKV = { k0: ka - t * w, k1: ka - t * w + w, top: clamp(A.top * f, 1e-3, 1e7), c: A.c, sig: A.sig }; draw(); return;
      } }
    if (!inFig(e.clientX, e.clientY)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const dl = e.deltaY || e.deltaX;   // com Shift, alguns sistemas mandam a roda em deltaX
    if (!dl || performance.now() - escT < 300) return;
    escT = performance.now();
    const n = clamp(S.esc + (dl > 0 ? 1 : -1), 0, ESC.length - 1);
    if (n === S.esc) return;
    S.esc = n; draw();
    toast("Eixos de −" + 5 * ESC[n][0] + " a " + 5 * ESC[n][0], 1400);
  }, { capture: true, passive: false });
  // roda do rato (ou pinça no trackpad) na figura: zoom à volta do cursor
  cv.addEventListener("wheel", e => {
    if (S.mode === "esp") { if (!inFig(e.clientX, e.clientY) || pkDentro(e.clientX, e.clientY)) { e.stopImmediatePropagation(); e.preventDefault(); } return; }
    if (!inFig(e.clientX, e.clientY)) return;
    e.preventDefault();
    zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)), e.clientX, e.clientY);
  }, { passive: false });

  // teclado: v/r mudam de modo; a (normas e ângulo / ângulo das retas), p (projeção), i (inclinação), s (reta s), d (vetores diretores), c (coordenadas inteiras)
  window.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.classList && e.target.classList.contains("inp")) return;
    if (e.target instanceof Node && menu.contains(e.target)) return;
    const k = e.key.toLowerCase(), vet = S.mode === "vet";
    if (k === "e") { S.mode = "esp"; S.sph = false; e.preventDefault(); draw(); return; }
    if (k === "t") { S.txt = !S.txt; e.preventDefault(); draw(); return; }
    if (k === " " && S.mode === "esp" && S.sph) { act({ kind: "sphPlay" }); e.preventDefault(); return; }
    if (S.mode === "esp") return;
    const tog = n => { S[n] = !S[n]; if (n === "int" && S.int) roundAll(); };
    if (k === "v") S.mode = "vet";
    else if (k === "r") S.mode = "retas";
    else if (k === "a") tog(vet ? "ang" : "angR");
    else if (k === "p" && vet) tog("proj");
    else if (k === "i" && !vet) tog("incl");
    else if (k === "s" && !vet) tog("s");
    else if (k === "d" && !vet) tog("dir");
    else if (k === "o" && !vet) { act({ kind: "dirO" }); return; }
    else if (k === "c") tog("int");
    else if (k === "t") S.txt = !S.txt;
    else if (k === " " && vet && S.rot) { S.run = !S.run; if (S.run) rotAnim(); }
    else if (k === "+" || k === "=") return zoomAt(1.25, F.fcx, F.fcy);
    else if (k === "-") return zoomAt(0.8, F.fcx, F.fcy);
    else if (k === "0") { S.z = 1; S.vx = S.vy = 0; }
    else return;
    e.preventDefault(); draw();
  });

  // ---------- «Copiar link da cena» (botão direito): o estado do modo atual num link #cena=… ----------
  // (JSON em base64 «url-safe»; os valores por modo — texto, inteiras, números — só os do modo atual)
  const KEYS = {
    vet: ["u", "v", "uo", "vo", "ang", "proj", "rot", "R", "tr", "op"],
    retas: ["A", "B", "C", "D", "s", "incl", "dir", "angR", "dO", "nrm"],
    esp: ["eA", "eR", "eB", "eUV", "eC", "nO", "eI", "xs", "noAx", "eX", "xR", "eT", "eK", "kv", "kG", "kO", "kP", "kL", "orto", "esc", "gP", "tX", "xst", "vert", "sph", "sL", "sM", "sP", "sG", "sK", "sC"],
  };
  const b64e = t => btoa(unescape(encodeURIComponent(t))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64d = t => decodeURIComponent(escape(atob(t.replace(/-/g, "+").replace(/_/g, "/"))));
  function sceneLink() {
    const o = { m: S.mode, z: S.z, vx: S.vx, vy: S.vy, txt: S.txt, int: S.int, noNum: S.noNum };
    for (const k of KEYS[S.mode]) o[k] = S[k];
    if (S.mode === "esp") {
      o.f = {}; for (const [k] of FIELDS) o.f[k] = ESP[k];
      if (cam && ctl) { o.cp = cam.position.toArray().map(v => +v.toFixed(3)); o.ct = ctl.target.toArray().map(v => +v.toFixed(3)); o.c3 = C3F.map(v => +v.toFixed(3)); }
    }
    return location.origin + location.pathname + "#cena=" + b64e(JSON.stringify(o));
  }
  let camPend = null;
  function applyScene(code) {
    let o; try { o = JSON.parse(b64d(code)); } catch (e) { return; }
    if (!["vet", "retas", "esp"].includes(o.m)) return;
    S.mode = o.m;
    for (const k of ["z", "vx", "vy"]) if (typeof o[k] === "number") S[k] = o[k];
    if (o.m === "esp" && "sph" in o) S.sph = !!o.sph;   // antes das outras chaves (o xs e o int são do Espaço ou da Esfera)
    for (const k of ["txt", "int", "noNum"]) if (typeof o[k] === "boolean") S[k] = o[k];
    for (const k of KEYS[o.m]) if (k in o) S[k] = o[k];
    if (o.m === "retas") tD = S.dO ? (S.nrm ? 2 : 1.25) : 0;
    if (o.m === "esp") {
      for (const [k] of FIELDS) if (o.f && typeof o.f[k] === "string") { ESP[k] = o.f[k]; INP[k].value = o.f[k]; }
      tN = S.nO ? 1 : 0; tK = S.sK ? 1 : 0;
      if (o.cp && o.ct) camPend = { p: o.cp, t: o.ct };
      if (typeof S.esc !== "number" || !ESC[S.esc]) S.esc = 0;
      if (!S.sph) { [SK, TK] = ESC[S.esc]; B3 = 5 * SK; }   // a câmara do link já vem com a distância desta escala
      if (o.c3) C3F = o.c3.slice();
    }
  }
  // link curto pelo is.gd (JSONP: o is.gd não tem CORS); null se falhar ou demorar mais de 5 s
  function shorten(url) {
    return new Promise(res => {
      const cb = "__isgd" + Date.now(), sc = document.createElement("script");
      const done = v => { clearTimeout(t); delete window[cb]; sc.remove(); res(v); };
      const t = setTimeout(() => done(null), 5000);
      window[cb] = d => done(d && d.shorturl ? d.shorturl : null);
      sc.onerror = () => done(null);
      sc.src = "https://is.gd/create.php?format=json&callback=" + cb + "&url=" + encodeURIComponent(url);
      document.head.appendChild(sc);
    });
  }
  async function copyScene() {
    const url = sceneLink();
    toast("A criar o link curto…", 6000);
    const short = shorten(url);   // começa já
    let ok = false, used = url;
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        // a escrita começa ainda dentro do clique (o Safari exige-o); o texto chega quando o is.gd responder
        await navigator.clipboard.write([new ClipboardItem({ "text/plain": short.then(sh => { used = sh || url; return new Blob([used], { type: "text/plain" }); }) })]);
      } else { used = (await short) || url; await navigator.clipboard.writeText(used); }
      ok = true;
    } catch (e) {
      used = (await short) || url;
      const ta = document.createElement("textarea"); ta.value = used; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch (_) {} ta.remove();
    }
    toast(!ok ? "Não foi possível copiar o link" : used !== url ? "Link curto copiado: " + used : "Link da cena copiado (sem encurtar)");
  }
  function toast(msg, ms = 2600) {
    let el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.opacity = 0; }, ms);
  }

  // valores iniciais no endereço, p. ex. #u=3,1&v=1,2&angulo  ou  #retas&A=0,1&B=2,2&C=1,4&D=3,-2
  let txtPend = false;   // «texto»: mostra o texto da esquerda no modo escolhido pelo endereço (links da Matemática A...Z)
  decodeURIComponent(location.hash.slice(1)).split("&").forEach(tok => {
    const m = tok.match(/^([uvABCD])=(-?[\d.]+)[,;](-?[\d.]+)$/);
    if (m) { S[m[1]] = [r1(+m[2]), r1(+m[3])]; if ("CD".includes(m[1])) S.s = true; if ("ABCD".includes(m[1])) S.mode = "retas"; if (!S[m[1]].every(isInt)) INT["ABCD".includes(m[1]) ? "retas" : "vet"] = false; return; }
    if (tok === "retas") S.mode = "retas";
    else if (tok === "espaco") S.mode = "esp";
    else if (tok === "esfera") { S.mode = "esp"; S.sph = true; }
    else if (tok === "angulo") { S.ang = true; S.angR = true; }
    else if (tok === "projecao") S.proj = true;
    else if (tok === "diretores") S.dir = true;
    else if (tok === "origem") { S.dir = S.dO = true; tD = 1.25; }
    else if (tok === "normalizar") { S.dir = S.dO = S.nrm = true; tD = 2; }
    else if (tok === "rodar") { S.rot = true; rotOn(true); }
    else if (tok.startsWith("cena=")) applyScene(tok.slice(5));
    else if (tok === "texto") txtPend = true;
  });
  if (txtPend) S.txt = true;

  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  // as letras do KaTeX só se carregam quando aparecem: medir outra vez quando chegam
  if (document.fonts) { document.fonts.ready.then(() => { mcache.clear(); draw(); }); document.fonts.addEventListener("loadingdone", () => { mcache.clear(); draw(); }); }
  resize();
})();
</script>
</body>
</html>
