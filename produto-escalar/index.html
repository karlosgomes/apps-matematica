<style>
  :root { --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  /* campos das coordenadas no modo Espaço */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.45em; border: 2px solid var(--line); border-radius: 8px;
         background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; outline: none; }
  .inp.bad { border-color: var(--bad) !important; background: var(--badbg); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
  /* menu do botão direito (modo Vetores): soma e diferença */
  #menu { position: fixed; z-index: 3; display: none; flex-direction: column; min-width: 9em; padding: 4px; border: 2px solid var(--line); border-radius: 10px;
          background: var(--bg); color: var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.25); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size: 17px; }
  #menu button { all: unset; display: flex; align-items: center; gap: .5em; padding: .35em .7em; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  #menu button:hover, #menu button:focus-visible { background: var(--line); }
  #menu button .ok { width: 1em; text-align: center; }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
<!-- GoatCounter: contagem de visitas, sem cookies (não conta em localhost) -->
<script data-goatcounter="https://karlosgomes.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// GoatCounter: eventos dentro da app (cada um no máximo uma vez por visita), com o nome «app: ação»
(() => {
  const seen = new Set(), app = location.pathname.split("/").filter(Boolean).pop() || "apps";
  const send = (name, tries = 0) => {
    if (window.goatcounter && goatcounter.count) goatcounter.count({ path: app + ": " + name, title: name, event: true });
    else if (tries < 20) setTimeout(() => send(name, tries + 1), 500);
  };
  window.gcEvt = h => {
    if (!h) return;
    let name = typeof h === "string" ? h : [h.kind, h.v ?? h.k ?? h.key ?? ""].filter(x => x !== "" && x != null).join(" ");
    name = String(name).trim().slice(0, 60);
    if (!name || seen.has(name)) return;
    seen.add(name); send(name);
  };
  // botões e menus em HTML (apps Python, Estatística, Folha de cálculo e as janelas das outras)
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("button, [role=button]");
    if (b) gcEvt((b.textContent || "").trim().replace(/\s+/g, " ").slice(0, 40) || b.title || b.id);
  }, true);
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.tagName === "SELECT") gcEvt((t.id || t.name || "menu") + ": " + ((t.options[t.selectedIndex] || {}).text || t.value));
    else if (t.type === "checkbox") gcEvt(((t.closest("label") || {}).textContent || t.id || "caixa").trim().slice(0, 40));
  }, true);
})();
</script>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<div id="menu" role="menu"></div>
<canvas id="cv" aria-label="Produto escalar de dois vetores no plano; declive, inclinação e ângulo de duas retas"></canvas>
<script>
(() => {
  // Pensada para smartphone e projeção: controlos desenhados no canvas, texto matemático em KaTeX por cima; tema claro ou escuro
  const PI = Math.PI, TAU = 2 * PI;
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    u: "#1565c0", v: "#7b1fa2", pos: "#2e7d32", neg: "#d32f2f", zero: "#ef6c00",
    al: "#1565c0", be: "#7b1fa2", rr: "#e65100", qq: "#2e7d32", w: "#00838f",
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    u: "#64a8ff", v: "#d09cff", pos: "#5cc26a", neg: "#ff6b6b", zero: "#ffa040",
    al: "#64a8ff", be: "#d09cff", rr: "#ffa040", qq: "#5cc26a", w: "#4dd0e1",
  };
  const C = { ...LIGHT };
  // modo escuro: mesma chave do weblog no localStorage ("alternate" = escuro, "default" = claro); sem escolha, segue o sistema
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const CBFONT = '"KaTeX_Main", "Times New Roman", serif';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // estado: modo «vet» (vetores u e v com origem em O) ou «retas» (r por A e B, s por C e D)
  const INI = { u: [3, 1], v: [1, 2], A: [0, 1], B: [2, 2], C: [1, 4], D: [3, -2] };
  const S = { mode: "vet", ...JSON.parse(JSON.stringify(INI)),
              ang: false, proj: false, int: true, s: false, incl: false, dir: false, dO: false, angR: false,
              z: 1, vx: 0, vy: 0,
              uo: [0, 0], vo: [0, 0],   // origens de u e v (arrastar o corpo do vetor desloca-o; duplo clique volta a O)
              op: null,   // vetor soma/diferença (botão direito em Vetores): "s" = u+v, "d" = u−v, "e" = v−u
              rot: false, R: 3, tr: 0, run: false,   // «v a rodar»: v(t) = R(cos t, sin t) e o gráfico de f(t) = u·v(t)                // texto da esquerda à vista (botão «Texto», tecla t)
              eA: true, eR: false, eB: false, eUV: false, eC: false, nO: false, vert: {},
              nrm: false };   // Retas: vetores diretores normalizados (botão direito; só com «r, s → O»)   // modo Espaço: o que se mostra   // vista: zoom e ponto no centro da figura (arrastar o fundo, roda do rato, pinça, + e −)

  // «Mostrar texto»: um valor por modo; os três começam sem texto (pedido do utilizador)
  const TXT = { vet: false, retas: false, esp: false };
  Object.defineProperty(S, "txt", { get: () => TXT[S.mode], set: v => { TXT[S.mode] = v; }, enumerable: true });

  // ---------- números em LaTeX ----------
  const EPS = 1e-9;
  const r1 = v => Math.round(v * 10) / 10;                       // coordenadas: inteiras ou com uma casa decimal
  const ten = v => Math.round(v * 10);                            // em décimas (inteiro)
  const isInt = v => Math.abs(v - Math.round(v)) < EPS;
  // decimal com vírgula (até d casas, sem zeros à direita)
  const fmt = (v, d = 2) => { if (Math.abs(v) < 0.5 * 10 ** -d) v = 0; return (+v.toFixed(d)).toString().replace(".", "{,}"); };
  const num = v => fmt(v, 2);
  const apx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace(".", "{,}");   // valor aproximado (casas fixas)
  const par = v => v < 0 ? `(${num(v)})` : num(v);
  const sq = v => `${par(v)}^2`;
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const clr = (c, s) => `\\textcolor{${c}}{${s}}`;
  const U = s => clr(C.u, s), V = s => clr(C.v, s);
  const sgnCol = d => d > EPS ? C.pos : d < -EPS ? C.neg : C.zero;
  // √n simplificado (n inteiro: k√m); n decimal fica dentro da raiz
  function sqrtTex(n) {
    n = Math.round(n * 100) / 100;
    if (!isInt(n)) return `\\sqrt{${num(n)}}`;
    n = Math.round(n);
    if (n === 0) return "0";
    let k = 1, m = n;
    for (let f = 2; f * f <= m; f++) while (m % (f * f) === 0) { m /= f * f; k *= f; }
    if (m === 1) return `${k}`;
    return `${k > 1 ? k : ""}\\sqrt{${m}}`;
  }
  // fração p/q (inteiros) irredutível
  function frac(p, q) {
    if (q < 0) { p = -p; q = -q; }
    const g = gcd(p, q) || 1; p /= g; q /= g;
    if (q === 1) return `${p}`;
    return `${p < 0 ? "-" : ""}\\frac{${Math.abs(p)}}{${q}}`;
  }
  const fracPar = (p, q) => p * q < 0 && Math.abs(q / gcd(p, q)) !== 1 ? `\\left(${frac(p, q)}\\right)` : p * q < 0 ? `(${frac(p, q)})` : frac(p, q);
  // ângulo em graus: «=» se for exato (inteiro), senão «≈» com uma casa
  const degTex = (a, sym) => { const g = a * 180 / PI; return isInt(Math.round(g * 1e6) / 1e6) ? `${sym} = ${Math.round(g)}^\\circ` : `${sym} \\approx ${apx(g, 1)}^\\circ`; };
  const cosTex = c => Math.abs(c * 2 - Math.round(c * 2)) < 1e-9 ? `= ${num(c)}` : `\\approx ${apx(c, 2)}`;
  const pt = (p) => `(${num(p[0])}${p.every(isInt) ? ",\\," : ";\\,"}${num(p[1])})`;

  // ---------- texto da faixa de cima (grupos de afirmações; cada grupo começa numa linha nova) ----------
  // cada peça é uma string, ou {t, cont: true} para continuar a anterior sem grande espaço
  const UU = () => U("\\vec u"), VV = () => V("\\vec v");
  // «v a rodar»: f(t) = u·v(t) = a cos t + b sin t = ‖u‖R cos(t − φ)
  function rotInfo() {
    const [u1, u2] = S.u, Rr = S.R, A = Math.hypot(u1, u2) * Rr;
    let phi = Math.atan2(u2, u1); if (phi < 0) phi += TAU;
    return { u1, u2, Rr, A, phi, a: u1 * Rr, b: u2 * Rr, f: t => A * Math.cos(t - phi) };
  }
  function rotPieces() {
    const o = rotInfo(), nu = o.u1 ** 2 + o.u2 ** 2, RT = num(o.Rr), ft = o.f(S.tr);
    const lin = (a, b) => { let s_ = ""; if (Math.abs(a) > EPS) s_ += `${num(a)}\\cos t`; if (Math.abs(b) > EPS) s_ += `${s_ ? (b < 0 ? " - " : " + ") : (b < 0 ? "-" : "")}${num(Math.abs(b))}\\sin t`; return s_ || "0"; };
    const AT = sqrtTex(Math.round(nu * o.Rr * o.Rr * 100) / 100);
    return [
      [`${VV()}(t) = (${RT}\\cos t,\\ ${RT}\\sin t)`],
      [`f(t) = ${UU()}\\cdot${VV()}(t) = ${U(par(o.u1))}\\times ${RT}\\cos t + ${U(par(o.u2))}\\times ${RT}\\sin t`, { cont: true, t: `= ${lin(o.a, o.b)}` }],
      [`f(t) = \\|${UU()}\\|\\,\\|${VV()}\\|\\cos(t - \\varphi) = ${AT}\\cos(t - \\varphi)`, { cont: true, sep: 1, t: `\\varphi \\approx ${apx(o.phi)}\\ \\text{rad}\\ (${apx(o.phi * 180 / PI, 1)}^\\circ)` }],
      [`\\text{máximo } ${AT} \\approx ${apx(o.A)}\\ (${VV()}\\ \\text{com o sentido de}\\ ${UU()}),`, `\\text{mínimo } -${AT}\\ (\\text{sentido oposto}),`, `\\text{zeros: } ${VV()} \\perp ${UU()}`],
      [`t \\approx ${apx(S.tr)}:\\quad f(t) \\approx ${clr(sgnCol(Math.round(ft * 100) / 100), apx(ft))}`],
    ];
  }
  // vetor soma/diferença (S.op): w = a ± b, com a e b os representantes na origem
  const OPS = { s: ["u", "v", 1], d: ["u", "v", -1], e: ["v", "u", -1] };
  function opInfo() {
    if (!OPS[S.op]) return null;
    const [ka, kb, sg] = OPS[S.op], a = S[ka], b = S[kb];
    const T = k => k === "u" ? UU() : VV(), cl = k => k === "u" ? U : V, sub = k => k === "u" ? "u" : "v";
    return { ka, kb, sg, a, b, w: [r1(a[0] + sg * b[0]), r1(a[1] + sg * b[1])],
             name: `${T(ka)} ${sg > 0 ? "+" : "-"} ${T(kb)}`, nm: `\\vec ${ka} ${sg > 0 ? "+" : "-"} \\vec ${kb}`, plain: `${ka}${sg > 0 ? "+" : "−"}${kb}`, cl, sub };
  }
  function vecPieces() {
    const [u1, u2] = S.u, [v1, v2] = S.v;
    const d = Math.round((u1 * v1 + u2 * v2) * 100) / 100, sc = sgnCol(d);
    const nu = u1 * u1 + u2 * u2, nv = v1 * v1 + v2 * v2;
    const G = S.rot ? rotPieces() : [[
      `${UU()}\\cdot${VV()} = ${U("u_1")}${V("v_1")} + ${U("u_2")}${V("v_2")}`,
      { cont: true, t: `= ${U(par(u1))}\\times${V(par(v1))} + ${U(par(u2))}\\times${V(par(v2))} = ${clr(sc, num(d))}` },
    ]];
    if (S.ang) {
      const g = [
        `\\|${UU()}\\| = \\sqrt{${sq(u1)} + ${sq(u2)}} = ${sqrtTex(nu)}`,
        `\\|${VV()}\\| = \\sqrt{${sq(v1)} + ${sq(v2)}} = ${sqrtTex(nv)}`,
      ];
      if (nu < EPS || nv < EPS) g.push(`\\text{com um vetor nulo, o ângulo } \\theta \\text{ não está definido}`);
      else {
        const c = clamp(d / Math.sqrt(nu * nv), -1, 1), th = Math.acos(c);
        g.push(`${UU()}\\cdot${VV()} = \\|${UU()}\\|\\,\\|${VV()}\\|\\cos\\theta`);
        g.push(`\\cos\\theta = \\frac{${clr(sc, num(d))}}{${sqrtTex(nu)}\\times${sqrtTex(nv)}} ${cosTex(c)}`);
        g.push({ cont: true, sep: 1, t: degTex(th, "\\theta") });
        const what = Math.abs(c - 1) < 1e-12 ? "\\text{os vetores têm a mesma direção e o mesmo sentido}"
                   : Math.abs(c + 1) < 1e-12 ? "\\text{os vetores têm sentidos opostos}"
                   : d > EPS ? "\\theta\\ \\text{é agudo}" : d < -EPS ? "\\theta\\ \\text{é obtuso}" : "\\theta\\ \\text{é reto}\\ (" + UU() + "\\perp" + VV() + ")";
        g.push(`${UU()}\\cdot${VV()} ${d > EPS ? ">" : d < -EPS ? "<" : "="} 0 \\;\\Rightarrow\\; ${clr(sc, what)}`);
      }
      G.push(g);
    }
    if (S.proj && nu > EPS) {
      const OH = "\\|\\overrightarrow{OH}\\|";
      if (Math.abs(d) < EPS) G.push([`H = O \\;\\Rightarrow\\; ${UU()}\\cdot${VV()} = 0`]);
      else G.push([
        `${UU()}\\cdot${VV()} = ${clr(sc, d < 0 ? "-" : "")}\\|${UU()}\\|\\times${OH}`,
        { cont: true, t: `\\approx ${clr(sc, d < 0 ? "-" : "")}${apx(Math.sqrt(nu))}\\times${apx(Math.abs(d) / Math.sqrt(nu))}` },
        `\\overrightarrow{OH}\\ \\text{e}\\ ${UU()}\\ \\text{têm ${d > 0 ? "o mesmo sentido" : "sentidos opostos"}}`,
      ]);
    }
    return G;
  }

  // reta por P e Q (coordenadas em décimas → frações exatas)
  function lineInfo(P, Q, nm, col) {
    const DX = ten(Q[0]) - ten(P[0]), DY = ten(Q[1]) - ten(P[1]);
    const vert = DX === 0, horiz = DY === 0;
    let a = Math.atan2(DY, DX); if (a < 0) a += PI; if (a >= PI - 1e-12) a = 0;
    const o = { P, Q, nm, col, DX, DY, dx: DX / 10, dy: DY / 10, vert, horiz, alpha: vert ? PI / 2 : a };
    if (!vert) {
      o.m = DY / DX; o.mT = frac(DY, DX); o.mP = fracPar(DY, DX);
      const bp = ten(P[1]) * DX - DY * ten(P[0]), bq = 10 * DX;   // b = y_P − m x_P
      const g = gcd(DY, DX) || 1, p = DY / g, q = DX / g;
      const mx = DY === 0 ? "" : q * Math.sign(q) === 1 ? (p * Math.sign(q) === 1 ? "x" : p * Math.sign(q) === -1 ? "-x" : `${p * Math.sign(q)}x`) : `${frac(DY, DX)}x`;
      const bs = bp * bq;
      const bT = mx === "" ? frac(bp, bq) : bs > 0 ? `+ ${frac(Math.abs(bp), Math.abs(bq))}` : bs < 0 ? `- ${frac(Math.abs(bp), Math.abs(bq))}` : "";
      o.eq = `y = ${mx} ${bT}`;
      o.b = bp / bq;
    } else o.eq = `x = ${num(P[0])}`;
    return o;
  }
  function lineGroup(o, n1, n2) {
    const nm = clr(o.col, o.nm), sub = s => `${s}_${o.nm}`, vec = clr(o.col, `\\vec ${o.nm}`);
    const g = [`${nm}:\\ ${o.eq}`];
    if (S.dir) g.push(`${vec} = \\overrightarrow{${n1}${n2}} = (${num(o.dx)}${isInt(o.dx) && isInt(o.dy) ? ",\\," : ";\\,"}${num(o.dy)})`);
    if (o.vert) g.push(`${sub("m")}\\ \\text{não está definido (reta vertical)}`);
    else {
      const f = `\\frac{${num(o.dy)}}{${num(o.dx)}}`;
      g.push(S.dir && f !== o.mT ? `${sub("m")} = ${f} = ${o.mT}` : `${sub("m")} = ${o.mT}`);
    }
    if (S.incl) {
      if (o.vert) g.push(`${sub("\\alpha")} = 90^\\circ`);
      else g.push(`\\tan ${sub("\\alpha")} = ${sub("m")} = ${o.mT}`, { cont: true, t: `\\;\\Rightarrow\\; ${degTex(o.alpha, sub("\\alpha"))}` });
    }
    return g;
  }
  // posição relativa (lista de peças da faixa)
  function relation(r, s) {
    const cross = r.DX * s.DY - r.DY * s.DX, dot = r.DX * s.DX + r.DY * s.DY;
    const so = t => ({ cont: true, t: `\\Rightarrow\\; ${t}` });
    if (cross === 0) {
      const same = (ten(s.P[0]) - ten(r.P[0])) * r.DY - (ten(s.P[1]) - ten(r.P[1])) * r.DX === 0;
      const end = same ? `r\\ \\text{e}\\ s\\ \\text{são coincidentes}` : `r \\parallel s\\ (\\text{estritamente paralelas})`;
      return r.vert ? [end] : [`m_r = m_s = ${r.mT}`, so(end)];
    }
    if (dot === 0) {
      if (r.vert || s.vert) return [`r \\perp s\\ (\\text{uma vertical e a outra horizontal})`];
      return [`m_r\\times m_s = ${r.mP}\\times${s.mP} = -1`, so(`r \\perp s`)];
    }
    const conc = [so(`r\\ \\text{e}\\ s\\ \\text{são concorrentes}`), { cont: true, t: `\\text{(não perpendiculares)}` }];
    if (r.vert || s.vert) return [`${r.vert ? "r" : "s"}\\ \\text{é vertical e}\\ ${r.vert ? "s" : "r"}\\ \\text{não é horizontal}`, ...conc];
    return [`m_r \\ne m_s,\\ \\ m_r\\times m_s \\ne -1`, ...conc];
  }
  function retasPieces() {
    const r = lineInfo(S.A, S.B, "r", C.u), G = [lineGroup(r, "A", "B")];
    if (S.s) {
      const s = lineInfo(S.C, S.D, "s", C.v);
      G.push(lineGroup(s, "C", "D"));
      const g = relation(r, s);
      if (S.angR) {
        const d = Math.round((r.dx * s.dx + r.dy * s.dy) * 100) / 100, nr = r.dx ** 2 + r.dy ** 2, ns = s.dx ** 2 + s.dy ** 2;
        const c = clamp(Math.abs(d) / Math.sqrt(nr * ns), 0, 1);
        const rv = U("\\vec r"), sv = V("\\vec s");
        g.push(`${rv}\\cdot${sv} = ${U(par(r.dx))}\\times${V(par(s.dx))} + ${U(par(r.dy))}\\times${V(par(s.dy))} = ${num(d)}`);
        g.push(`\\cos\\theta = \\frac{|${rv}\\cdot${sv}|}{\\|${rv}\\|\\,\\|${sv}\\|} = \\frac{${num(Math.abs(d))}}{${sqrtTex(nr)}\\times${sqrtTex(ns)}} ${cosTex(c)}`);
        g.push({ cont: true, sep: 1, t: degTex(Math.acos(c), "\\theta") });
      }
      G.push(g);
    }
    // «r, s → O»: os vetores diretores normalizados e o ângulo deles
    if (S.dO) {
      const lines_ = S.s ? [r, lineInfo(S.C, S.D, "s", C.v)] : [r], g = [];
      if (S.nrm) for (const o of lines_) {

    const g = NICE.find(v => v * k >= 0.8 * fs && (!S.int || v >= 1)) ?? 20, st = NICE.find(v => v * k >= 1.5 * fs && v >= g) ?? 20;
    ctx.save();
    ctx.beginPath(); ctx.rect(f.x, f.y, f.w, f.h); ctx.clip();

    for (let i = Math.ceil(x0 / g); i * g <= x1; i++) if (i) line(X(i * g), f.y, X(i * g), f.y + f.h, C.grid, 1);
    for (let j = Math.ceil(y0 / g); j * g <= y1; j++) if (j) line(f.x, Y(j * g), f.x + f.w, Y(j * g), C.grid, 1);
    line(X(0), f.y, X(0), f.y + f.h, C.axis, 1.6);
    line(f.x, Y(0), f.x + f.w, Y(0), C.axis, 1.6);

    const s = 0.45 * fs, xin = cx > f.x && cx < f.x + f.w, yin = cy > f.y && cy < f.y + f.h;
    ctx.fillStyle = C.axis;

      texAt("ty" + j, fmt(v, 1), lx - 0.3 * fs, Y(v), fs * 0.6, C.muted, 1, 0.5);

  // etiqueta junto de um ponto, afastada na direção (ux, uy) (no sentido matemático)
  function labelAt(id, src, x, y, ux, uy, fs, col, px = 0.85) {
    const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
    const ax = 0.5 - 0.5 * ux, ay = 0.5 + 0.5 * uy;
    const el = texAt(id, src, x + ux * 0.75 * fs, y - uy * 0.75 * fs, fs * px, col, ax, ay);
    // sem sair da figura

    const l = clamp(x + ux * 0.75 * fs - ax * w, f.x + 2, f.x + f.w - w - 2), t = clamp(y - uy * 0.75 * fs - ay * h, f.y + 2, f.y + f.h - h - 2);

  // etiquetas que não se tapam: experimenta 16 direções à volta do ponto, a começar pela preferida (ux, uy),

  const rectOf = el => { const b = el.getBoundingClientRect(); return { x: b.left, y: b.top, w: b.width, h: b.height }; };
  const overlap = (a, b, m = 2) => a.x < b.x + b.w + m && b.x < a.x + a.w + m && a.y < b.y + b.h + m && b.y < a.y + a.h + m;

    return pos && neg;
  }
  function placeLabel(id, src, x, y, ux, uy, fs, col, px, OB, LN) {
    OB.forEach(o => { o.self = Math.abs(o.x + o.w / 2 - x) < 1 && Math.abs(o.y + o.h / 2 - y) < 1 && o.dot; });
    const el = texAt(id, src, x, y, fs * px, col, 0, 0);
    el.style.transform = "none";
    const w = el.offsetWidth, h = el.offsetHeight, f = F.f, d = 0.7 * fs, a0 = Math.atan2(uy, ux);
    let best = null;
    for (let i = 0; i < 16; i++) {
      const a = a0 + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * PI / 8, cx = Math.cos(a), cy = Math.sin(a);
      // encostada ao ponto pelo lado (ou canto) dessa direção
      const ax = cx > 0.38 ? 0 : cx < -0.38 ? 1 : 0.5, ay = cy > 0.38 ? 1 : cy < -0.38 ? 0 : 0.5;
      const l = clamp(x + cx * d - ax * w, f.x + 2, f.x + f.w - w - 2), t = clamp(y - cy * d - ay * h, f.y + 2, f.y + f.h - h - 2);
      const Rr = { x: l, y: t, w, h };
      let score = i * 0.01;
      for (const o of OB) if (!o.self && overlap(Rr, o)) score += 10;
      for (const ln of LN) if (crosses(Rr, ln)) score += 1;

  }

  function vectors(fs) {
    const { X, Y } = F, [u1, u2] = S.u, [v1, v2] = S.v;
    const ox = X(0), oy = Y(0);
    const nu = Math.hypot(u1, u2), nv = Math.hypot(v1, v2), d = u1 * v1 + u2 * v2, sc = sgnCol(Math.round(d * 100) / 100);
    // projeção de v sobre a reta de u
    if (S.proj && nu > EPS) {
      const t = d / (nu * nu), hx = t * u1, hy = t * u2;
      const ex = u1 / nu, ey = u2 / nu, big = 400;
      line(X(-big * ex), Y(-big * ey), X(big * ex), Y(big * ey), alpha(C.u, 0.45), 1.5, [6, 6]);
      line(X(v1), Y(v2), X(hx), Y(hy), C.muted, 1.8, [5, 5]);
      if (Math.hypot(v1 - hx, v2 - hy) > 0.3 && Math.abs(t) * nu > 0.3) {
        const a0 = Math.atan2(v2 - hy, v1 - hx), a1 = Math.atan2(-hy, -hx);
        rightMark(X(hx), Y(hy), 0.55 * fs, a0, a1, C.muted);
      }
      if (Math.abs(d) > EPS) {
        ctx.globalAlpha = 0.9;
        line(ox, oy, X(hx), Y(hy), sc, 0.42 * fs);
        ctx.globalAlpha = 1;
      }
      dot(X(hx), Y(hy), 0.28 * fs, C.muted, 2);
      labelAt("H", "H", X(hx), Y(hy), -(v1 - hx) || -ey, -(v2 - hy) || ex, fs, C.muted);
    }
    // ângulo θ (sempre visível; o texto das normas e do ângulo é que depende da caixa «Normas e ângulo»)
    if (nu > EPS && nv > EPS) {
      const a0 = Math.atan2(u2, u1), a1 = Math.atan2(v2, v1);
      let da = angNorm(a1 - a0);
      const c = d / (nu * nv);
      const r = clamp(0.32 * Math.min(nu, nv) * F.k, 1.04 * fs, 2.4 * fs);   // raio 20 % menor que o inicial
      if (Math.abs(Math.round(d * 100) / 100) < EPS) rightMark(ox, oy, 0.56 * fs, a0, a1, C.zero);
      else {

    if (S.rot) { ctx.beginPath(); ctx.arc(ox, oy, S.R * F.k, 0, TAU); ctx.setLineDash([5, 5]); ctx.strokeStyle = alpha(C.v, 0.6); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]); }

    const o = opInfo();
    if (o) {
      const [w1, w2] = o.w, nw = Math.hypot(w1, w2), XA = X(o.a[0]), YA = Y(o.a[1]), XB = X(o.b[0]), YB = Y(o.b[1]), XW = X(w1), YW = Y(w2);
      const ca = o.ka === "u" ? C.u : C.v, cb = o.kb === "u" ? C.u : C.v;
      if (o.sg > 0) {
        // regra do paralelogramo: cópias de v na ponta de u e de u na ponta de v
        line(XA, YA, XW, YW, alpha(cb, 0.7), 1.8, [6, 5]);
        line(XB, YB, XW, YW, alpha(ca, 0.7), 1.8, [6, 5]);
      } else if (Math.hypot(o.a[0] - o.b[0], o.a[1] - o.b[1]) > EPS) {
        // a − b vai da ponta de b à ponta de a (representante esbatido) e fecha o paralelogramo O, b, a, a − b
        ctx.globalAlpha = 0.45; arrow(XB, YB, XA, YA, C.w, fs); ctx.globalAlpha = 1;
        line(XW, YW, XA, YA, alpha(cb, 0.7), 1.8, [6, 5]);
      }
      if (nw > EPS) arrow(ox, oy, XW, YW, C.w, fs); else dot(ox, oy, 0.272 * fs, C.w, 2);
      labelAt("lw", clr(C.w, `${o.nm} = ${pt(o.w)}`), XW, YW, nw > EPS ? w1 / nw : 0.7, nw > EPS ? w2 / nw : -0.7, fs, C.w);
    }
    // u e v: se foram deslocados (origem ≠ O), o representante na origem fica esbatido e o deslocado desenha-se a cheio
    for (const [key, col, nm] of [["u", C.u, "u"], ["v", C.v, "v"]]) {
      const [a, b] = S[key], [p, q] = S[key + "o"], moved = Math.abs(p) > EPS || Math.abs(q) > EPS, n = Math.hypot(a, b);
      if (moved && n > EPS) { ctx.globalAlpha = 0.3; arrow(ox, oy, X(a), Y(b), col, fs); ctx.globalAlpha = 1; }
      const x0 = X(p), y0 = Y(q), x = X(p + a), y = Y(q + b);
      if (n > EPS) arrow(x0, y0, x, y, col, fs); else dot(x, y, 0.272 * fs, col, 2);
      labelAt("l" + key, clr(col, `\\vec ${nm} = ${pt(S[key])}`), x, y, n > EPS ? a / n : (key === "u" ? 1 : -1), n > EPS ? b / n : 0.4, fs, col);
      hits.push({ kind: "pt", key, x, y, r: 1.0 * fs });
      // o corpo do vetor (sem a zona da ponta) agarra-se para o deslocar

    }
  }

  // ---------- «v a rodar»: tempo e gráfico de f(t) = u·v(t) ----------
  function setRotV() { S.v = [S.R * Math.cos(S.tr), S.R * Math.sin(S.tr)].map(x => Math.abs(x) < 1e-9 ? 0 : x); }
  let rotRaf = 0;
  function rotAnim() {
    if (rotRaf) return;
    let last = performance.now();
    const step = now => {
      rotRaf = 0;
      if (!S.rot || !S.run || S.mode !== "vet") return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      S.tr = (S.tr + 0.5 * dt) % TAU; setRotV(); draw();
      rotRaf = requestAnimationFrame(step);
    };
    rotRaf = requestAnimationFrame(step);
  }
  function rotOn(on) {
    if (on) {
      const [a, b] = S.v, n = Math.hypot(a, b);
      S.R = n > EPS ? (S.int ? Math.max(1, Math.round(n)) : Math.max(0.1, r1(n))) : 3;
      S.tr = n > EPS ? (Math.atan2(b, a) + TAU) % TAU : 0;
      S.vo = [0, 0]; S.run = false; setRotV();   // espera pelo ▶ (pedido do utilizador)
    } else {
      S.run = false;
      const st = S.int ? 1 : 0.1; S.v = S.v.map(x => r1(Math.round(x / st) * st));
    }
  }
  function rotGraph(g, fs) {
    const o = rotInfo(), pad = 1.2 * fs, x0 = g.x + 2.4 * fs, x1 = g.x + g.w - 0.8 * fs, y0 = g.y + 0.5 * fs, y1 = g.y + g.h - 1.4 * fs;

    const top = o.A <= 28 ? 30 : Math.ceil(o.A * 1.07 / 30) * 30, TX = t => x0 + t / TAU * (x1 - x0), TY = v => (y0 + y1) / 2 - v / top * (y1 - y0) / 2;
    rrect(g.x, g.y, g.w, g.h, 8, null, C.line, 1);
    // eixos e marcas em múltiplos de π/2
    line(x0, TY(0), x1 + 0.4 * fs, TY(0), C.axis, 1.4); line(x0, y0, x0, y1, C.axis, 1.4);
    ["0", "\\frac{\\pi}{2}", "\\pi", "\\frac{3\\pi}{2}", "2\\pi"].forEach((lb, i) => {
      const x = TX(i * PI / 2); if (i) line(x, TY(0) - 0.15 * fs, x, TY(0) + 0.15 * fs, C.axis, 1.2);
      texAt("rg" + i, lb, x, TY(0) + 0.3 * fs, fs * 0.6, C.muted, 0.5, 0);
    });
    texAt("rgt", "t", x1 + 0.5 * fs, TY(0), fs * 0.75, C.axis, 0, 0.5);
    texAt("rgf", "f(t)", x0 - 0.3 * fs, g.y + 0.1 * fs, fs * 0.7, C.axis, 1, 0);
    // marcas do eixo vertical (de 10 em 10, ou de 30 em 30 com escalas maiores)
    const stY = top <= 30 ? 10 : 30;
    for (let v = -top; v <= top + 1e-9; v += stY) if (v) {
      line(x0 - 0.12 * fs, TY(v), x0 + 0.12 * fs, TY(v), C.axis, 1.2);
      line(x0, TY(v), x1, TY(v), C.grid, 1);

      if (v < top && Math.abs(TY(Math.abs(v)) - TY(o.A)) > 0.7 * fs) texAt("rgy" + v, `${v}`, x0 - 0.25 * fs, TY(v), fs * 0.5, C.muted, 1, 0.5);
    }
    // máximo e mínimo (tracejado) com o valor
    for (const [v, id] of [[o.A, "mx"], [-o.A, "mn"]]) {
      line(x0, TY(v), x1, TY(v), C.grid2, 1, [4, 4]);
      texAt("rg" + id, (v < 0 ? "-" : "") + apx(o.A), x0 - 0.25 * fs, TY(v), fs * 0.55, C.muted, 1, 0.5);

    }

    const marks = [[o.phi, o.A, "máx", C.pos], [(o.phi + PI) % TAU, -o.A, "mín", C.neg], [(o.phi + PI / 2) % TAU, 0, "", C.zero], [(o.phi + 3 * PI / 2) % TAU, 0, "", C.zero]];

      dot(TX(t), TY(v), 0.2 * fs, col, 1.5);
      if (lb) texAt("rgm" + i, `\\text{${lb}}`, TX(t), TY(v) + (v > 0 ? -0.35 : 0.35) * fs, fs * 0.6, col, 0.5, v > 0 ? 1 : 0);
    });

  }

  // reta infinita (recortada pela figura) e ponto onde corta o eixo Ox
  function retas(fs) {
    const { X, Y } = F;
    const e1 = ease(clamp(tD, 0, 1)), eA = clamp((tD - 1) / 0.25, 0, 1), eN = ease(clamp((tD - 1.25) / 0.75, 0, 1));
    const fadeL = 1 - 0.85 * e1;   // as retas (e o que é delas) esbatem-se com «r, s → O»
    const r = lineInfo(S.A, S.B, "r", C.u), s = S.s ? lineInfo(S.C, S.D, "s", C.v) : null;
    const list = s ? [[r, "A", "B"], [s, "C", "D"]] : [[r, "A", "B"]];

    const OB = [], LN = [], add = el => { if (el) OB.push(rectOf(el)); };
    for (const [o] of list) for (const p of [o.P, o.Q]) OB.push({ x: X(p[0]) - 0.4 * fs, y: Y(p[1]) - 0.4 * fs, w: 0.8 * fs, h: 0.8 * fs, dot: true });
    for (const [o] of list) { const n = Math.hypot(o.dx, o.dy); LN.push({ x: X(o.P[0]), y: Y(o.P[1]), ex: o.dx / n, ey: -o.dy / n }); }
    for (const [o] of list) {
      const n = Math.hypot(o.dx, o.dy), ex = o.dx / n, ey = o.dy / n, big = 400;
      ctx.globalAlpha = fadeL;
      line(X(o.P[0] - big * ex), Y(o.P[1] - big * ey), X(o.P[0] + big * ex), Y(o.P[1] + big * ey), o.col, 2.6);
      ctx.globalAlpha = 1;
      // nome da reta, perto da borda
      const tEnd = Math.min(...[ex ? ((ex > 0 ? F.x1 : F.x0) - o.P[0]) / ex : Infinity, ey ? ((ey > 0 ? F.y1 : F.y0) - o.P[1]) / ey : Infinity]) - 1.4;
      const lx = o.P[0] + tEnd * ex, ly = o.P[1] + tEnd * ey, side = -ey * -lx + ex * -ly >= 0 ? 1 : -1;   // do lado do centro da figura
      const elN = labelAt("n" + o.nm, clr(o.col, o.nm), X(lx), Y(ly), -ey * side, ex * side, fs, o.col, 1);
      elN.style.opacity = fadeL < 1 ? Math.max(0.3, fadeL) : "";   // o nome esbate-se com a reta
      add(elN);
    }
    // inclinação: ângulo do semieixo positivo Ox para a reta, a partir do ponto em que a reta corta Ox
    // com «r, s → O» fica esbatida como as retas (fadeL)
    if (S.incl) for (const [o] of list) {
      if (o.horiz) continue;
      const ix = o.vert ? o.P[0] : -o.b / o.m;
      if (ix < F.x0 + 0.5 / S.z || ix > F.x1 - 0.5 / S.z || F.y0 > 0 || F.y1 < 0) continue;
      const R = 1.5 * fs;
      ctx.globalAlpha = fadeL;
      line(X(ix), Y(0), X(ix) + R * 1.5, Y(0), o.col, 3.5);
      if (o.vert) rightMark(X(ix), Y(0), 0.6 * fs, 0, PI / 2, o.col);
      else sector(X(ix), Y(0), R, 0, o.alpha, o.col);
      OB.push({ x: X(ix) - (o.alpha > PI / 2 ? R : 0), y: Y(0) - R, w: o.alpha > PI / 2 ? 2.5 * R : 1.5 * R, h: R });
      ctx.globalAlpha = 1;
      const am = o.alpha / 2, rr = R + 0.9 * fs;
      const el = texAt("al" + o.nm, clr(o.col, `\\alpha_${o.nm}`), X(ix) + Math.cos(am) * rr, Y(0) - Math.sin(am) * rr, fs * 0.9, o.col);
      el.style.opacity = fadeL < 1 ? Math.max(0.3, fadeL) : "";
      if (fadeL > 0.6) add(el);
    }
    // ângulo das duas retas (o agudo, ou reto), no ponto de interseção
    // com «r, s → O» fica esbatido como as retas (fadeL)
    if (s && S.angR) {

  // roda do rato (ou pinça no trackpad) na figura: zoom à volta do cursor
  cv.addEventListener("wheel", e => {
    if (S.mode === "esp") { if (!inFig(e.clientX, e.clientY)) e.stopImmediatePropagation(); return; }
    if (!inFig(e.clientX, e.clientY)) return;
    e.preventDefault();
    zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)), e.clientX, e.clientY);
  }, { passive: false });

  // teclado: v/r mudam de modo; a (normas e ângulo / ângulo das retas), p (projeção), i (inclinação), s (reta s), d (vetores diretores), c (coordenadas inteiras)
  window.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.classList && e.target.classList.contains("inp")) return;
    if (e.target instanceof Node && menu.contains(e.target)) return;
    const k = e.key.toLowerCase(), vet = S.mode === "vet";
    if (k === "e") { S.mode = "esp"; e.preventDefault(); draw(); return; }
    if (k === "t") { S.txt = !S.txt; e.preventDefault(); draw(); return; }
    if (S.mode === "esp") return;
    const tog = n => { S[n] = !S[n]; if (n === "int" && S.int) roundAll(); };
    if (k === "v") S.mode = "vet";
    else if (k === "r") S.mode = "retas";
    else if (k === "a") tog(vet ? "ang" : "angR");
    else if (k === "p" && vet) tog("proj");
    else if (k === "i" && !vet) tog("incl");
    else if (k === "s" && !vet) tog("s");
    else if (k === "d" && !vet) tog("dir");
    else if (k === "o" && !vet) { act({ kind: "dirO" }); return; }
    else if (k === "c") tog("int");
    else if (k === "t") S.txt = !S.txt;
    else if (k === " " && vet && S.rot) { S.run = !S.run; if (S.run) rotAnim(); }
    else if (k === "+" || k === "=") return zoomAt(1.25, F.fcx, F.fcy);
    else if (k === "-") return zoomAt(0.8, F.fcx, F.fcy);
    else if (k === "0") { S.z = 1; S.vx = S.vy = 0; }
    else return;
    e.preventDefault(); draw();
  });

  // valores iniciais no endereço, p. ex. #u=3,1&v=1,2&angulo  ou  #retas&A=0,1&B=2,2&C=1,4&D=3,-2
  decodeURIComponent(location.hash.slice(1)).split("&").forEach(tok => {
    const m = tok.match(/^([uvABCD])=(-?[\d.]+)[,;](-?[\d.]+)$/);
    if (m) { S[m[1]] = [r1(+m[2]), r1(+m[3])]; if (!S[m[1]].every(isInt)) S.int = false; if ("CD".includes(m[1])) S.s = true; if ("ABCD".includes(m[1])) S.mode = "retas"; return; }
    if (tok === "retas") S.mode = "retas";
    else if (tok === "espaco") S.mode = "esp";
    else if (tok === "angulo") { S.ang = true; S.angR = true; }
    else if (tok === "projecao") S.proj = true;
    else if (tok === "diretores") S.dir = true;
    else if (tok === "origem") { S.dir = S.dO = true; tD = 1.25; }
    else if (tok === "normalizar") { S.dir = S.dO = S.nrm = true; tD = 2; }
    else if (tok === "rodar") { S.rot = true; rotOn(true); }
  });

  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  // as letras do KaTeX só se carregam quando aparecem: medir outra vez quando chegam
  if (document.fonts) { document.fonts.ready.then(() => { mcache.clear(); draw(); }); document.fonts.addEventListener("loadingdone", () => { mcache.clear(); draw(); }); }
  resize();
})();
</script>
</body>
</html>
