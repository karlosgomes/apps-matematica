<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do método de Jefferson ao método de Hondt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root { --band: #f6f8fb; --bg: #ffffff; --ink: #17202b; --line: #b3bfcc; --focus: #ef6c00; --bad: #d32f2f; --badbg: #fff5f5; }
  :root[data-theme="dark"] { --band: #1c242d; --bg: #151b22; --ink: #e6ebf1; --line: #46525f; --focus: #ffa040; --bad: #ff6b6b; --badbg: #3a1f22; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  #tex { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .tx { position: absolute; white-space: nowrap; line-height: 1.1; }
  .tx .katex { font-size: 1em; }
  .tx.halo { text-shadow: 0 0 2px var(--band), 0 0 3px var(--band), 0 0 4px var(--band), 0 0 6px var(--band); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* caixas de texto (votos, lugares e divisor), postas por cima do canvas pelo layout */
  .inp { position: fixed; z-index: 2; box-sizing: border-box; margin: 0; padding: 0 0.5em; border: 2px solid var(--line); border-radius: 8px;
         background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; outline: none; }
  .inp:focus { border-color: var(--focus); }
  .inp.bad { border-color: var(--bad); background: var(--badbg); }
  #dval, #seats { text-align: center; font-family: "IBM Plex Mono", ui-monospace, monospace; padding: 0 0.2em; }
  #dval { border-color: var(--focus); }
</style>
</head>
<body>
<div id="tex" aria-hidden="true"></div>
<canvas id="cv" aria-label="Método de Jefferson (divisor por tentativas), gráfico dos lugares em função dos votos e tabela do método de Hondt"></canvas>
<input class="inp" id="votes" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Votos das listas, separados por ponto e vírgula; por exemplo A 606; B 341; C 191; D 68">
<input class="inp" id="seats" type="text" inputmode="numeric" autocomplete="off" aria-label="Número de lugares">
<input class="inp" id="dval" type="text" inputmode="decimal" autocomplete="off" aria-label="Divisor d">
<script>
(() => {
  // Pensada para projeção: contraste forte, controlos desenhados na própria folha; tema claro ou escuro
  const LIGHT = {
    bg: "#ffffff", ink: "#17202b", muted: "#333d4a", faint: "#6b7685", grid: "#e6eaf0", grid2: "#c4cdd8",
    axis: "#1f2833", btn: "#eef2f6", line: "#b3bfcc", band: "#f6f8fb", on: "#ffffff",
    d: "#ef6c00", ok: "#2e7d32", bad: "#c62828",
    L: ["#1565c0", "#d32f2f", "#2e7d32", "#7b1fa2", "#00838f", "#6d4c41", "#ad1457", "#455a64"],
  };
  const DARK = {
    bg: "#151b22", ink: "#e6ebf1", muted: "#b4bdc8", faint: "#8592a1", grid: "#232c36", grid2: "#3a4552",
    axis: "#cfd6de", btn: "#212b36", line: "#46525f", band: "#1c242d", on: "#151b22",
    d: "#ffa040", ok: "#5cc26a", bad: "#ff6b6b",
    L: ["#64a8ff", "#ff6b6b", "#5cc26a", "#d09cff", "#4dd0e1", "#c8a27c", "#f48fb1", "#b0bec5"],
  };
  const C = { ...LIGHT };
  // modo escuro: mesma chave do weblog no localStorage ("alternate" = escuro, "default" = claro); sem escolha, segue o sistema
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  try { const v = localStorage.getItem("quarto-color-scheme"); if (v) dark = v === "alternate"; } catch (e) {}
  function setDark(on, save) {
    dark = on;
    Object.assign(C, on ? DARK : LIGHT);
    document.documentElement.dataset.theme = on ? "dark" : "light";
    if (save) try { localStorage.setItem("quarto-color-scheme", on ? "alternate" : "default"); } catch (e) {}
  }
  setDark(dark, false);
  const FONT = '"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const MAXL = 8;

  // exemplos (botões em baixo): o da ficha de MACS e um empate no último lugar
  const EXAMPLES = [
    { label: "Assembleia de Alunos", n: 11, src: "A 606; B 341; C 191; D 68" },
    { label: "Empate", n: 7, src: "A 7080; B 6573; C 1770" },
  ];
  // exemplo inicial: Assembleia de Alunos da ficha de MACS, 11 lugares, 4 listas
  const S = { n: 11, src: "A 606; B 341; C 191; D 68", lists: [], d: 0, tries: [], showGraph: false, showHondt: false, hot: null };
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  // ---------- números ----------
  const fmt = (x, dec = 2) => {
    if (!isFinite(x)) return "—";
    let s = (Math.round(x * 10 ** dec) / 10 ** dec).toFixed(dec);
    if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s.replace(".", ",").replace(/^-/, "−");
  };
  const fmtInt = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const texNum = x => fmt(x).replace(",", "{,}");
  const parseNum = s => {
    s = String(s).trim().replace(/\s/g, "").replace("−", "-").replace(",", ".");
    return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
  };
  // parte inteira de v/d (a folga evita 606/(606/6) = 5,9999…)
  const seatsOf = (v, d) => Math.floor(v / d + 1e-9);

  // ---------- leitura dos votos: "A 606; B 341; …" (o nome é opcional; sem nome: A, B, C, …) ----------
  function readVotes(src) {
    const parts = src.split(/[;\n]/).map(p => p.trim()).filter(Boolean);
    if (parts.length < 2) throw new Error("Escreve pelo menos duas listas, separadas por ponto e vírgula.");
    if (parts.length > MAXL) throw new Error(`No máximo ${MAXL} listas.`);
    const used = new Set();
    return parts.map((p, i) => {
      const m = p.match(/^(.*?)[\s:=]*(\d[\d\s.]*)$/);
      if (!m) throw new Error(`Não percebi «${p}»: escreve o nome (opcional) e o número de votos.`);
      let name = m[1].trim().replace(/[:=]$/, "").trim();
      const v = parseInt(m[2].replace(/[\s.]/g, ""), 10);
      if (!name) name = "ABCDEFGH"[i];
      if (used.has(name)) name += "′";
      used.add(name);
      return { name, v };
    });
  }

  // ---------- cálculos ----------
  const total = () => S.lists.reduce((p, l) => p + l.v, 0);
  const stdDiv = () => total() / S.n;
  const seatsAt = d => S.lists.map(l => l.v > 0 ? seatsOf(l.v, d) : 0);
  const sumAt = d => seatsAt(d).reduce((p, x) => p + x, 0);
  // quocientes de Hondt v/k, do maior para o menor
  function quotients() {
    const q = [];
    S.lists.forEach((l, i) => { if (l.v > 0) for (let k = 1; k <= S.n + 3; k++) q.push({ i, k, q: l.v / k }); });
    // quocientes iguais: primeiro a lista com menos votos (é a ela que a lei eleitoral dá o lugar em caso de empate)
    const eq = (x, y) => Math.abs(x - y) <= 1e-9 * Math.max(x, y);
    q.sort((a, b) => eq(a.q, b.q) ? (S.lists[a.i].v - S.lists[b.i].v || a.i - b.i) : b.q - a.q);
    return q;
  }
  let Q = [];
  // empate no último lugar: há quocientes iguais ao n.º maior também depois dele, e nenhum divisor dá n lugares.
  // TIE = { q, above (quocientes maiores), group (os iguais, por ordem de votos), r (lugares que lhes cabem), lot (sorteio) }
  let TIE = null, ALLOC = [];
  function analyse() {
    TIE = null;
    const qn = Q[S.n - 1];
    ALLOC = S.lists.map(() => 0);
    Q.slice(0, S.n).forEach(o => ALLOC[o.i]++);
    if (!qn) return;
    const same = o => Math.abs(o.q - qn.q) <= 1e-9 * qn.q;
    const a = Q.findIndex(same);
    let b = a; while (b + 1 < Q.length && same(Q[b + 1])) b++;
    if (b < S.n) return;
    const group = Q.slice(a, b + 1), r = S.n - a;
    const lot = S.lists[group[r - 1].i].v === S.lists[group[r].i].v;
    TIE = { q: qn.q, above: a, group, r, lot };
  }
  // intervalo do cursor do divisor e escala do gráfico (fixos enquanto os dados não mudam)
  let DR = [1, 2], YMAX = 5, XMAX = 100;
  function dataChanged() {
    Q = quotients();
    analyse();
    const dp = stdDiv();
    const lo = Math.min(dp, (Q[S.n + 2] || Q[Q.length - 1]).q) * 0.8;
    const hi = Math.max(dp, (Q[S.n - 1] || Q[0]).q) * 1.25;
    DR = [Math.max(0.01, lo), hi];
    const vmax = Math.max(...S.lists.map(l => l.v));
    YMAX = clamp(Math.ceil(vmax / DR[0]), 2, 40);
    XMAX = vmax * 1.12;
    S.tries = [];
    S.d = dp;
    writeHash();
  }
  // o passo do divisor: 0,1 (ou 0,01 com números pequenos, 1 com números grandes)
  const STEP = () => DR[1] < 20 ? 0.01 : DR[1] < 2000 ? 0.1 : 1;
  const round = d => { const s = STEP(); return Math.round(d / s) * s; };
  function setD(d, log, exact) {
    d = clamp(d, 0.01, 1e9);
    if (!exact) d = round(d);
    if (d !== S.d) {
      // cada lugar ganho (de qualquer lista) faz um som baço; cada lugar perdido, um som mais grave
      const before = seatsAt(S.d), after = seatsAt(d);
      const gained = after.reduce((p, x, i) => p + Math.max(0, x - before[i]), 0);
      const lost = after.reduce((p, x, i) => p + Math.max(0, before[i] - x), 0);
      S.d = d; draw();
      if (gained) thud(gained, false);
      if (lost) thud(lost, true);
    }
    if (log) logTry();
  }

  // ---------- som: um «toc» baço (seno a descer de 420 para 210 Hz, filtrado, ~0,2 s) por lugar ganho;
  // por lugar perdido, um «toc» uma oitava abaixo, mais abafado e um pouco mais longo (210 → 95 Hz, ~0,28 s) ----------
  let actx = null;
  function thud(n, lose) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      // vários lugares de uma vez (empates ou saltos grandes): um toque por lugar, seguidos (no máximo 4)
      for (let i = 0; i < Math.min(n, 4); i++) {
        const t0 = actx.currentTime + 0.01 + i * 0.09;
        const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
        o.type = "sine";
        const [f0, f1, lp, dur] = lose ? [210, 95, 800, 0.26] : [420, 210, 1400, 0.18];
        o.frequency.setValueAtTime(f0, t0);
        o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.7);
        f.type = "lowpass"; f.frequency.value = lp;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(lose ? 0.6 : 0.5, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(f).connect(g).connect(actx.destination);
        o.start(t0); o.stop(t0 + dur + 0.02);
      }
    } catch (e) {}
  }
  function logTry() {
    const last = S.tries[S.tries.length - 1];
    if (last && last.d === S.d) return;
    S.tries.push({ d: S.d, s: sumAt(S.d) });
    if (S.tries.length > 10) S.tries.shift();
    draw();
  }

  // ---------- canvas ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const $votes = document.getElementById("votes"), $seats = document.getElementById("seats"), $dval = document.getElementById("dval");
  let W = 0, H = 0, L = null, hits = [];
  function resize() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // disposição: em cima os votos e os lugares; em baixo o divisor e as opções; no meio os quadros
  // (Jefferson sempre; o gráfico e a tabela de Hondt quando ligados)
  function layout() {
    const fs = clamp(Math.min(W, H) / 30, 13, 22);
    const pad = Math.round(fs * 0.7), gap = 0.6 * fs;
    const land = W > H * 1.15 && W >= 640;
    const L = { fs, pad, land };
    const w = W - 2 * pad, ih = 1.75 * fs;
    let y = pad;
    // Votos [……] Lugares [..] ☾
    const sw = 3.2 * fs, tw = ih * 1.3, seatsLab = 4.6 * fs, votesLab = 3.4 * fs;
    if (w > 30 * fs) {
      L.votes = { x: pad + votesLab, y, w: w - votesLab - seatsLab - sw - tw - 1.6 * fs, h: ih };
      L.seats = { x: L.votes.x + L.votes.w + 0.8 * fs + seatsLab, y, w: sw, h: ih };
    } else {
      L.votes = { x: pad + votesLab, y, w: w - votesLab, h: ih }; y += ih + 0.4 * fs;
      L.seats = { x: pad + seatsLab, y, w: sw, h: ih };
    }
    L.theme = { x: W - pad - tw, y, w: tw, h: ih };
    y += ih + gap + (err ? 0.6 * fs : 0);
    // em baixo: cursor do divisor e opções
    const rowD = 3.3 * fs, rowO = 1.5 * fs;
    // opções em grupos (botões | caixas | exemplos), arrumados no menor número de linhas
    const gw = optGroups(fs).map(g => g.w), rows = [[]];
    let used = 0;
    gw.forEach((g, i) => { if (rows[rows.length - 1].length && used + 1.5 * fs + g > w) { rows.push([]); used = 0; } rows[rows.length - 1].push(i); used += (used ? 1.5 * fs : 0) + g; });
    const nr = rows.length;
    const bottom = rowD + gap + rowO * nr + 0.3 * fs * (nr - 1);
    const yb = H - pad - bottom;
    L.dRow = { x: pad, y: yb, w, h: rowD };
    L.opt = { x: pad, y: yb + rowD + gap, w, h: rowO, rows };
    // quadros: Jefferson com a altura do que tem; o gráfico e a tabela de Hondt ocupam o resto
    const main = { x: pad, y, w, h: yb - gap - y };
    const G = S.showGraph, Hd = S.showHondt;
    const jh = Math.min(main.h, jNeed(fs, !land && (G || Hd) ? 1.35 : 1.75));
    if (land && (G || Hd)) {
      const jw = Math.min(main.w * 0.44, 32 * fs), rx = main.x + jw + gap, rw = main.w - jw - gap;
      if (G && Hd && main.w >= 52 * fs) {   // ecrã largo: três colunas (Jefferson, Hondt, gráfico)
        const cw = (main.w - 2 * gap) * 0.31;
        L.J = { x: main.x, y: main.y, w: cw, h: jh };
        L.G = { x: main.x + cw + gap, y: main.y, w: main.w - 2 * (cw + gap), h: main.h };
        L.H = { x: main.x + main.w - cw, y: main.y, w: cw, h: main.h };
      } else if (G && Hd) {   // à esquerda Jefferson e Hondt, à direita o gráfico
        L.J = { x: main.x, y: main.y, w: jw, h: jh };
        L.H = { x: main.x, y: main.y + jh + gap, w: jw, h: main.h - jh - gap };
        L.G = { x: rx, y: main.y, w: rw, h: main.h };
      } else {
        L.J = { x: main.x, y: main.y, w: jw, h: jh };
        L[G ? "G" : "H"] = { x: rx, y: main.y, w: rw, h: main.h };
      }
    } else if (land) {
      const jw = Math.min(main.w, 36 * fs);
      L.J = { x: main.x + (main.w - jw) / 2, y: main.y, w: jw, h: jh };
    } else {
      L.J = { x: main.x, y: main.y, w: main.w, h: jh };
      let yy = main.y + jh + gap, rest = main.y + main.h - yy;
      if (G && Hd) { const gh = (rest - gap) * 7 / (7 + hondtRows() + 4); L.G = { x: main.x, y: yy, w: main.w, h: gh }; yy += gh + gap; rest -= gh + gap; }
      if (G && !Hd) L.G = { x: main.x, y: yy, w: main.w, h: rest };
      if (Hd) L.H = { x: main.x, y: yy, w: main.w, h: rest };
    }
    return L;
  }
  // altura do quadro de Jefferson: título, cabeçalho, linhas, veredicto e tentativas
  const jNeed = (fs, rr = 1.75) => (1.7 + 1.6 + (S.lists.length + 1) * rr + 1.5 + (tieNote() ? 4.4 : 0) + (S.tries.length ? 1.4 : 0) + 0.5) * fs;
  // a explicação do empate só aparece quando o total já saltou por cima de n
  // (no gráfico, a reta passa pelos pontos empatados ou já está acima deles)
  function tieNote() {
    return !!TIE && sumAt(S.d) === TIE.above + TIE.group.length;
  }
  const names = ix => ix.map(i => S.lists[i].name);
  const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " e " + a[a.length - 1];
  const allocText = () => S.lists.map((l, i) => `${l.name} ${ALLOC[i]}`).join(", ");
  function tieLaw() {
    const w = names(TIE.group.slice(0, TIE.r).map(o => o.i));
    return (TIE.r === 1 ? "Pela lei, o lugar fica para a lista com menos votos: " : `Pela lei, os ${TIE.r} lugares ficam para as listas com menos votos: `)
      + andList(w) + (TIE.lot ? " (com votos iguais: sorteio)" : "") + ".";
  }
  function hondtRows() {
    if (!Q.length) return 3;
    const qn = Q[S.n - 1], qn1 = Q[S.n];
    return Math.max(...seatsAt(S.d), qn ? qn.k : 1, qn1 ? qn1.k : 1) + 1;
  }

  // ---------- desenho: primitivas ----------
  function line(x0, y0, x1, y1, c, w, dash) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
  }
  function tri(x, y, ux, uy, s, c) {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x + ux * s, y + uy * s);
    ctx.lineTo(x - uy * s * 0.6, y + ux * s * 0.6);
    ctx.lineTo(x + uy * s * 0.6, y - ux * s * 0.6);
    ctx.closePath(); ctx.fill();
  }
  function rrect(x, y, w, h, r, fill, stroke, lw = 1, dash) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); }
  }
  function text(s, x, y, px, color, align = "left", font = FONT, weight = 400) {
    ctx.font = `${weight} ${px}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillText(s, x, y);
    return ctx.measureText(s).width;
  }
  // texto partido em linhas que caibam em w; devolve o número de linhas
  function wrap(s, x, y, w, px, color, weight = 400, lh = 1.3) {
    const words = s.split(" "), lines = [];
    let cur = "";
    for (const wd of words) {
      const t = cur ? cur + " " + wd : wd;
      if (cur && tw(t, px, FONT, weight) > w) { lines.push(cur); cur = wd; } else cur = t;
    }
    if (cur) lines.push(cur);
    lines.forEach((l, i) => text(l, x, y + i * px * lh, px, color, "left", FONT, weight));
    return lines.length;
  }
  const tw = (s, px, font = FONT, weight = 400) => { ctx.font = `${weight} ${px}px ${font}`; return ctx.measureText(s).width; };
  function button(x, y, w, h, txt, on, kind, extra = {}, col = C.muted, px = 16, texSrc = null) {
    rrect(x, y, w, h, 8, on ? col : C.btn, on ? col : C.line, 2);
    if (texSrc) fit(texAt("b" + kind, texSrc, x + w / 2, y + h / 2, px, on ? C.on : C.ink), w - 0.3 * px, h);
    else text(txt, x + w / 2, y + h / 2 + 1, px, on ? C.on : C.ink, "center", FONT, 700);
    hits.push({ kind, ...extra, rect: { x, y, w, h } });
  }
  function cbox(x, y, h, bs, fs, on, txt, hit) {
    const yy = y + (h - bs) / 2;
    rrect(x, yy, bs, bs, 5, on ? C.muted : C.bg, C.muted, 2);
    if (on) {
      ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = C.on; ctx.lineWidth = 0.14 * bs;
      ctx.beginPath(); ctx.moveTo(x + 0.24 * bs, yy + 0.52 * bs); ctx.lineTo(x + 0.43 * bs, yy + 0.72 * bs);
      ctx.lineTo(x + 0.77 * bs, yy + 0.3 * bs); ctx.stroke();
      ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    }
    const w = bs + 0.4 * fs + text(txt, x + bs + 0.4 * fs, y + h / 2 + 1, fs * 0.85, C.ink);
    hits.push({ ...hit, rect: { x, y, w, h } });
    return x + w;
  }
  function place(el, r, px) {
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
    el.style.fontSize = px + "px";
  }
  function niceStep(raw) {
    const p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
    return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  }

  // ---------- texto em LaTeX (KaTeX), numa camada HTML por cima do canvas ----------
  const clr = (c, s) => `\\textcolor{${c}}{${s}}`;
  const layer = document.getElementById("tex");
  const pool = new Map();
  let used = new Set();
  function texAt(id, src, x, y, px, color, ax = 0.5, ay = 0.5, halo = false) {
    let el = pool.get(id);
    if (!el) { el = document.createElement("span"); layer.appendChild(el); pool.set(id, el); }
    if (el._src !== src) {
      el._src = src;
      if (window.katex) katex.render(src, el, { throwOnError: false, strict: false });
      else el.textContent = src;
    }
    el.className = halo ? "tx halo" : "tx";
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${px}px;color:${color};transform:translate(${-ax * 100}%,${-ay * 100}%)`;
    used.add(id);
    return el;
  }
  function fit(el, w, h = Infinity) {
    const k = Math.min(w / el.offsetWidth, h / el.offsetHeight);
    if (k < 1) el.style.fontSize = parseFloat(el.style.fontSize) * k + "px";
    return el;
  }
  const D_ = () => clr(C.d, "d");

  // ---------- desenho ----------
  let raf = 0, err = "";
  function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
  function paint() {
    L = layout(); hits = []; used = new Set();
    const { fs } = L;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    top(fs);
    if (S.lists.length) {
      jefferson(L.J, fs);
      if (L.G) graph(L.G, fs);
      if (L.H) hondt(L.H, fs);
      dRow(L.dRow, fs);
      options(L.opt, fs);
    }
    for (const [id, el] of pool) if (!used.has(id)) el.style.display = "none";
  }

  function top(fs) {
    const v = L.votes, s = L.seats;
    place($votes, v, fs * 0.95);
    text("Votos", L.pad, v.y + v.h / 2 + 1, fs * 0.95, C.ink, "left", FONT, 700);
    place($seats, s, fs * 0.95);
    text("Lugares", s.x - 0.4 * fs, s.y + s.h / 2 + 1, fs * 0.95, C.ink, "right", FONT, 700);
    button(L.theme.x, L.theme.y, L.theme.w, L.theme.h, dark ? "☀" : "☾", false, "theme", {}, C.muted, fs * 1.05);
    if (err) text(err, v.x, Math.max(v.y, s.y) + v.h + 0.45 * fs, fs * 0.75, C.bad);
  }

  // um quadro: fundo leve e título
  function panel(b, fs, title, reserve = 0) {
    rrect(b.x, b.y, b.w, b.h, 10, C.band, C.line, 1.2);
    const f = Math.min(fs * 0.9, fs * 0.9 * (b.w - 1.4 * fs - reserve) / tw(title, fs * 0.9, FONT, 700));
    text(title, b.x + 0.7 * fs, b.y + 0.85 * fs, f, C.muted, "left", FONT, 700);
    return { x: b.x + 0.7 * fs, y: b.y + 1.7 * fs, w: b.w - 1.4 * fs, h: b.h - 2.2 * fs };
  }

  // 1. Jefferson: votos ÷ d, parte inteira, total e veredicto; as tentativas
  function jefferson(b, fs) {
    const c = panel(b, fs, "1.  Método de Jefferson: divisor por tentativas");
    const nL = S.lists.length, rows = nL + 1;
    const note = tieNote();
    const extra = 1.6 + 1.4 + (note ? 4.4 : 0) + (S.tries.length ? 1.4 : 0);   // cabeçalho, veredicto, empate, tentativas (em fs)
    const rh = clamp((c.h - extra * fs) / rows, 1.1 * fs, 2.1 * fs), px = clamp(rh * 0.5, 11, fs * 1.05);
    // colunas: lista | votos | votos ÷ d | lugares
    const xs = [c.x, c.x + c.w * 0.4, c.x + c.w * 0.72, c.x + c.w];
    const hy = c.y + 0.7 * fs, D = D_();
    texAt("jh1", "\\text{votos}", xs[1], hy, fs * 0.85, C.muted, 1, 0.5);
    texAt("jh2", `\\dfrac{\\text{votos}}{${D}}`, xs[2], hy, fs * 0.85, C.muted, 1, 0.5);
    texAt("jh3", `\\left\\lfloor\\dfrac{\\text{votos}}{${D}}\\right\\rfloor`, xs[3], hy, fs * 0.85, C.muted, 1, 0.5);
    let y = c.y + 1.6 * fs;
    line(c.x, y, c.x + c.w, y, C.line, 1);
    const seats = seatsAt(S.d);
    S.lists.forEach((l, i) => {
      const yy = y + rh * (i + 0.5), col = C.L[i % 8];
      text(l.name, xs[0], yy, px * 1.05, col, "left", FONT, 700);
      text(fmtInt(l.v), xs[1], yy, px, C.ink, "right", MONO);
      text(fmt(l.v / S.d, 3), xs[2], yy, px, C.ink, "right", MONO);
      text(String(seats[i]), xs[3], yy, px * 1.15, col, "right", MONO, 600);
      line(c.x, y + rh * (i + 1), c.x + c.w, y + rh * (i + 1), C.grid2, 1);
    });
    const sum = seats.reduce((p, x) => p + x, 0), yt = y + rh * (nL + 0.5);
    text("Total", xs[0], yt, px * 1.05, C.ink, "left", FONT, 700);
    text(fmtInt(total()), xs[1], yt, px, C.ink, "right", MONO, 600);
    text(String(sum), xs[3], yt, px * 1.15, C.ink, "right", MONO, 600);
    // veredicto
    y += rh * rows + 0.75 * fs;
    const msg = note ? [`${sum} lugares: ${sum < S.n ? "falta" + (S.n - sum > 1 ? "m " : " ") + (S.n - sum) : "sobra" + (sum - S.n > 1 ? "m " : " ") + (sum - S.n)}`, C.bad]
      : sum === S.n ? [`✓  ${sum} lugares: este divisor serve`, C.ok]
      : sum < S.n ? [`${sum} lugares: faltam ${S.n - sum}, é preciso diminuir o divisor`, C.bad]
      : [`${sum} lugares: sobram ${sum - S.n}, é preciso aumentar o divisor`, C.bad];
    const mw = tw(msg[0], fs * 0.95, FONT, 700);
    text(msg[0], c.x, y, Math.min(fs * 0.95, fs * 0.95 * c.w / mw), msg[1], "left", FONT, 700);
    // empate: o total salta de n − 1 para n + 1 (ou mais) sem passar por n
    if (note) {
      const g = TIE.group, who = andList([...new Set(names(g.map(o => o.i)))]);
      const l1 = `Nenhum divisor dá ${S.n}: com d = ${fmt(TIE.q)}, ${who} ganham um lugar ao mesmo tempo (${TIE.above} → ${TIE.above + g.length}).`;
      const l2 = tieLaw() + ` Fica ${allocText()}.`;
      const f = fs * 0.72;
      y += 1.1 * fs;
      y += wrap(l1, c.x, y, c.w, f, C.d, 700) * f * 1.3 + 0.15 * fs;
      y += (wrap(l2, c.x, y, c.w, f, C.ink) - 1) * f * 1.3 + 0.2 * fs;
    }
    // tentativas, das mais recentes para as mais antigas (tocar numa volta a esse divisor)
    if (S.tries.length) {
      y += 1.4 * fs;
      let x = c.x + text("Tentativas:", c.x, y, fs * 0.72, C.muted) + 0.4 * fs;
      const ch = 1.15 * fs, f = fs * 0.68;
      for (let i = S.tries.length - 1; i >= 0; i--) {
        const t = S.tries[i], s = `${fmt(t.d)} → ${t.s}`, w = tw(s, f, MONO) + 0.8 * fs;
        if (x + w > c.x + c.w) break;
        const col = t.s === S.n ? C.ok : C.bad;
        rrect(x, y - ch / 2, w, ch, ch / 2, C.bg, col, 1.3);
        text(s, x + w / 2, y + 1, f, col, "center", MONO);
        hits.push({ kind: "try", d: t.d, rect: { x, y: y - ch / 2, w, h: ch } });
        x += w + 0.35 * fs;
      }
    }
  }

  // 2. gráfico: votos no eixo horizontal, lugares no vertical; a reta lugares = votos ÷ d roda com d.
  // A lista com v votos tem os pontos (v, 1), (v, 2), …: os que ficam debaixo da reta são os seus lugares
  // (o ponto (v, k) está na reta quando d = v ÷ k, o quociente de Hondt)
  function graph(b, fs) {
    const legW = tw("divisor padrão", fs * 0.68, FONT, 700) + 2.6 * fs;
    const c = panel(b, fs, "2.  Gráfico: lugares = votos ÷ d", legW);
    const ml = 1.6 * fs, mb = 1.5 * fs, mt = 1.3 * fs, mr = 2.2 * fs;
    const gx0 = c.x + ml, gx1 = c.x + c.w - mr, gy0 = c.y + mt, gy1 = c.y + c.h - mb;
    const X = v => gx0 + v / XMAX * (gx1 - gx0), Y = s => gy1 - s / YMAX * (gy1 - gy0);
    // grelha: lugares inteiros e marcas dos votos
    const ys = [1, 2, 5, 10].find(s => s * (gy1 - gy0) / YMAX >= 0.9 * fs) || 10;
    for (let k = ys; k <= YMAX; k += ys) {
      line(gx0, Y(k), gx1, Y(k), C.grid, 1);
      text(String(k), gx0 - 0.4 * fs, Y(k), fs * 0.62, C.muted, "right", MONO);
    }
    const xs = niceStep(XMAX / Math.max(2, Math.floor((gx1 - gx0) / (4.5 * fs))));
    for (let v = xs; v < XMAX; v += xs) {
      line(X(v), gy1, X(v), gy1 + 0.25 * fs, C.muted, 1);
      text(fmtInt(v), X(v), gy1 + 0.75 * fs, fs * 0.6, C.muted, "center", MONO);
    }
    line(gx0, gy1, gx1 + 0.6 * fs, gy1, C.axis, 1.6); tri(gx1 + 0.8 * fs, gy1, 1, 0, fs * 0.4, C.axis);
    line(gx0, gy1, gx0, gy0 - 0.6 * fs, C.axis, 1.6); tri(gx0, gy0 - 0.8 * fs, 0, -1, fs * 0.4, C.axis);
    text("votos", gx1 + 1.2 * fs, gy1 - 0.7 * fs, fs * 0.7, C.ink, "right");
    // retas que passam na origem (cortadas pela caixa do gráfico)
    const ray = (d, col, w, dash) => {
      const xe = Math.min(XMAX, YMAX * d);
      line(X(0), Y(0), X(xe), Y(xe / d), col, w, dash);
      return [X(xe), Y(xe / d)];
    };
    ray(stdDiv(), C.faint, 1.6, [7, 5]);
    const lx = b.x + b.w - 0.7 * fs, ly = b.y + 0.85 * fs;
    const lw = text("divisor padrão", lx, ly, fs * 0.68, C.faint, "right", FONT, 700);
    line(lx - lw - 2.2 * fs, ly, lx - lw - 0.4 * fs, ly, C.faint, 1.6, [7, 5]);
    // uma coluna de pontos por lista
    const step = (gy1 - gy0) / YMAX, r = clamp(step * 0.3, 2.5, 0.42 * fs);
    S.lists.forEach((l, i) => {
      const x = X(l.v), col = C.L[i % 8];
      ctx.globalAlpha = 0.45; line(x, gy1, x, gy0, col, 1.5); ctx.globalAlpha = 1;
      text(l.name, x, gy0 - 0.75 * fs, fs * 0.8, col, "center", FONT, 700);
      for (let k = 1; k <= YMAX; k++) {
        const on = k <= l.v / S.d + 1e-9, key = i + "-" + k, hot = S.hot === key, y = Y(k);
        // pontos em cor ténue (a reta e os lugares sobressaem); o realçado fica forte
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = C.band; ctx.fill();
        ctx.globalAlpha = hot ? 1 : on ? 0.5 : 0.35;
        if (on) { ctx.fillStyle = col; ctx.fill(); }
        ctx.lineWidth = hot ? 3.5 : 1.4; ctx.strokeStyle = hot ? C.d : col; ctx.stroke();
        ctx.globalAlpha = 1;
        hits.push({ kind: "cell", key, x, y, r: Math.max(r + 3, 6) });
      }
    });
    // empate: os pontos empatados estão na mesma reta que passa na origem (d = quociente empatado)
    if (TIE && tieNote()) {
      ray(TIE.q, C.d, 1.5, [2, 4]);
      TIE.group.forEach(o => {
        if (o.k > YMAX) return;
        ctx.beginPath(); ctx.arc(X(S.lists[o.i].v), Y(o.k), r + 4, 0, Math.PI * 2);
        ctx.lineWidth = 2.5; ctx.strokeStyle = C.d; ctx.stroke();
      });
    }
    // a reta do divisor atual e onde corta cada coluna (votos ÷ d)
    const [ex, ey] = ray(S.d, C.d, 2.8);
    S.lists.forEach(l => {
      const s = l.v / S.d;
      if (s > YMAX) return;
      const x = X(l.v), y = Y(s);
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = C.d; ctx.fillRect(-0.22 * fs, -0.22 * fs, 0.44 * fs, 0.44 * fs);
      ctx.restore();
    });
    texAt("gd", `${D_()} = ${texNum(S.d)}`, ex, ey - 0.35 * fs, fs * 0.8, C.d, 1, 1, true);   // por cima da ponta da reta
  }

  // 3. tabela de Hondt: votos ÷ 1, votos ÷ 2, … ; os n maiores quocientes dão os lugares
  function hondt(b, fs) {
    const c = panel(b, fs, "3.  Método de Hondt: os maiores quocientes");
    const rank = new Map();
    Q.forEach((o, r) => rank.set(o.i + "-" + o.k, r + 1));
    const qn = Q[S.n - 1], qn1 = Q[S.n];
    const K = hondtRows(), nL = S.lists.length;
    const keyH = TIE ? 4.2 * fs : 3.3 * fs;
    const rh = clamp((c.h - 1.8 * fs - keyH) / K, 10, 2 * fs), px = clamp(rh * 0.55, 9, fs * 0.95);
    const kw = 2 * fs, cw = (c.w - kw) / nL;
    // a mesma letra em todas as células (a que faz caber o quociente mais comprido, com a ordem)
    let pxc = px;
    S.lists.forEach(l => { for (let k = 1; k <= K; k++) pxc = Math.min(pxc, px * (cw - 4 - 0.5 * fs) / (tw(fmt(l.v / k), px, MONO, 600) + tw("10.º", px * 0.7, FONT, 700) + 0.3 * fs)); });
    const hy = c.y + 0.7 * fs;
    texAt("hdiv", "\\div", c.x + kw / 2, hy, fs * 0.85, C.muted);
    S.lists.forEach((l, i) => {
      const x = c.x + kw + cw * (i + 1) - 0.35 * fs;
      text(l.name, x, hy - 0.4 * fs, fs * 0.85, C.L[i % 8], "right", FONT, 700);
      text(fmtInt(l.v), x, hy + 0.45 * fs, fs * 0.64, C.L[i % 8], "right", MONO);
    });
    const y = c.y + 1.6 * fs;
    line(c.x, y, c.x + c.w, y, C.line, 1);
    for (let k = 1; k <= K; k++) {
      const yy = y + rh * (k - 0.5);
      text(String(k), c.x + kw / 2, yy, px, C.muted, "center", FONT);
      S.lists.forEach((l, i) => {
        if (!(l.v > 0)) return;
        const val = l.v / k, key = i + "-" + k, on = val >= S.d - 1e-9, col = C.L[i % 8];
        const x0 = c.x + kw + cw * i + 2, w = cw - 4, y0 = y + rh * (k - 1) + 2, h = rh - 4;
        if (on) { ctx.globalAlpha = dark ? 0.28 : 0.16; rrect(x0, y0, w, h, 5, col); ctx.globalAlpha = 1; }
        if (qn1 && qn1.i === i && qn1.k === k) rrect(x0, y0, w, h, 5, null, C.d, 2, [5, 4]);
        if (S.hot === key) rrect(x0, y0, w, h, 5, null, C.d, 3.5);
        const xr = c.x + kw + cw * (i + 1) - 0.35 * fs;
        const f = pxc;
        const vw = text(fmt(val), xr, yy, f, on ? C.ink : C.faint, "right", MONO, on ? 600 : 400);
        const rk = rank.get(key);
        if (on && rk) text(rk + ".º", xr - vw - 0.25 * fs, yy, f * 0.7, col, "right", FONT, 700);
        hits.push({ kind: "cell", key, rect: { x: x0, y: y0, w, h } });
      });
      line(c.x, y + rh * k, c.x + c.w, y + rh * k, C.grid2, 1);
    }
    // a ligação a Jefferson: o n.º maior quociente é o maior divisor que serve
    if (!qn) return;
    const ky = y + rh * K + 0.85 * fs, D = D_();
    const tie = qn1 && Math.abs(qn.q - qn1.q) < 1e-9;
    if (tie && TIE && !tieNote()) {   // antes do salto: ainda sem a explicação do empate
      fit(texAt("hkey", `\\text{Os ${S.n} maiores quocientes dão os lugares.}`, c.x, ky, fs * 0.8, C.ink, 0, 0.5), c.w);
      return;
    }
    if (tie && TIE) {
      const g = TIE.group, from = TIE.above + 1, to = TIE.above + g.length;
      const eqs = g.map(o => `${S.lists[o.i].name} ÷ ${o.k}`).join(" = ");
      const f = fs * 0.72;
      const n1 = wrap(`Empate: o ${from}.º ${to - from > 1 ? "ao" : "e o"} ${to}.º quocientes são iguais (${eqs} = ${fmt(TIE.q)}).`, c.x, ky - 0.3 * fs, c.w, f, C.d, 700);
      wrap(`${tieLaw()} Fica ${allocText()}.`, c.x, ky - 0.3 * fs + n1 * f * 1.3, c.w, f, C.ink);
      return;
    }
    fit(texAt("hkey", `\\text{Os ${S.n} maiores quocientes dão os lugares.}`, c.x, ky, fs * 0.8, C.ink, 0, 0.5), c.w);
    const bwid = 5.2 * fs, k2 = ky + 1.55 * fs;
    fit(texAt("hkey2", `\\text{Serve } ${qn1 ? texNum(qn1.q) + " <" : ""} ${D} \\leq ${texNum(qn.q)}`, c.x, k2, fs * 0.85, C.ink, 0, 0.5), c.w - bwid - 0.5 * fs);
    button(c.x + c.w - bwid, k2 - 0.7 * fs, bwid, 1.4 * fs, "", false, "useqn", {}, C.d, fs * 0.85, `${D} = ${texNum(qn.q)}`);
    hits.useqn = qn.q;
  }

  // cursor do divisor: d = [caixa]  −  ——●——  +
  function dRow(b, fs) {
    const ih = 1.75 * fs, cy = b.y + ih / 2;
    texAt("dlab", `${D_()} =`, b.x, cy, fs * 1.2, C.ink, 0, 0.5);
    const iw = 5.4 * fs, ix = b.x + 2.2 * fs;
    if (document.activeElement !== $dval) { $dval.value = fmt(S.d); $dval.classList.remove("bad"); }
    place($dval, { x: ix, y: b.y, w: iw, h: ih }, fs * 0.95);
    const bs = ih, x0 = ix + iw + 0.6 * fs;
    button(x0, b.y, bs, bs, "−", false, "step", { d: -1 }, C.muted, fs * 1.2);
    button(b.x + b.w - bs, b.y, bs, bs, "+", false, "step", { d: 1 }, C.muted, fs * 1.2);
    const tx0 = x0 + bs + 1 * fs, tx1 = b.x + b.w - bs - 1 * fs;
    const [lo, hi] = DR, TX = v => tx0 + (v - lo) / (hi - lo) * (tx1 - tx0);
    ctx.lineCap = "round";
    line(tx0, cy, tx1, cy, C.grid2, 0.3 * fs);
    line(tx0, cy, TX(clamp(S.d, lo, hi)), cy, C.d, 0.3 * fs);
    ctx.lineCap = "butt";
    const step = niceStep((hi - lo) / Math.max(3, Math.floor((tx1 - tx0) / (4.5 * fs))));
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
      line(TX(v), cy + 0.25 * fs, TX(v), cy + 0.45 * fs, C.muted, 1.2);
      text(fmt(v), TX(v), cy + 0.85 * fs, fs * 0.62, C.muted, "center", MONO);
    }
    // o divisor padrão, por baixo do cursor
    const dp = stdDiv();
    line(TX(dp), cy - 0.55 * fs, TX(dp), cy + 0.45 * fs, C.ink, 1.5);
    text("divisor padrão", TX(dp), cy + 1.55 * fs, fs * 0.62, C.ink, "center", FONT, 700);
    const dv = clamp(S.d, lo, hi);
    ctx.beginPath(); ctx.arc(TX(dv), cy, 0.55 * fs, 0, Math.PI * 2); ctx.fillStyle = C.d; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.bg; ctx.stroke();
    hits.push({ kind: "slide", rect: { x: tx0 - fs, y: b.y - 0.3 * fs, w: tx1 - tx0 + 2 * fs, h: ih + 0.6 * fs }, val: px => lo + (px - tx0) / (tx1 - tx0) * (hi - lo) });
  }

  // em baixo: d = divisor padrão, limpar as tentativas e as duas caixas
  // os grupos da linha de opções: largura e desenho (em x, y)
  function optGroups(fs) {
    const f = fs * 0.8, bh = 1.35 * fs, gap = 0.5 * fs, bs = 0.72 * fs;
    const bw = t => tw(t, f, FONT, 700) + 1.2 * fs;
    const cw = t => bs + 0.4 * fs + tw(t, fs * 0.85);
    const btns = [["std", "d = divisor padrão"], ["clear", "Limpar tentativas"]];
    const ex = EXAMPLES.map(e => e.label), exLab = "Exemplos:";
    return [
      { w: bw(btns[0][1]) + gap + bw(btns[1][1]), draw: (x, y, h) => {
        const by = y + (h - bh) / 2, w1 = bw(btns[0][1]);
        button(x, by, w1, bh, "", false, "std", {}, C.muted, f, `${D_()} = \\text{divisor padrão}`);
        button(x + w1 + gap, by, bw(btns[1][1]), bh, btns[1][1], false, "clear", {}, C.muted, f);
      } },
      { w: cw("Gráfico") + 1.1 * fs + cw("Método de Hondt"), draw: (x, y, h) => {
        x = cbox(x, y, h, bs, fs, S.showGraph, "Gráfico", { kind: "box", k: "showGraph" }) + 1.1 * fs;
        cbox(x, y, h, bs, fs, S.showHondt, "Método de Hondt", { kind: "box", k: "showHondt" });
      } },
      { w: tw(exLab, fs * 0.8) + 0.5 * fs + ex.reduce((p, t) => p + bw(t) + gap, -gap), draw: (x, y, h) => {
        const by = y + (h - bh) / 2;
        x += text(exLab, x, y + h / 2 + 1, fs * 0.8, C.muted) + 0.5 * fs;
        EXAMPLES.forEach((e, i) => {
          const on = S.n === e.n && S.src.replace(/\s+/g, " ").trim() === e.src;
          button(x, by, bw(e.label), bh, e.label, on, "example", { i }, C.muted, f);
          x += bw(e.label) + gap;
        });
      } },
    ];
  }
  // em baixo: d = divisor padrão, limpar as tentativas, as duas caixas e os exemplos
  function options(b, fs) {
    const G = optGroups(fs);
    b.rows.forEach((row, r) => {
      const y = b.y + r * (b.h + 0.3 * fs);
      let x = b.x;
      row.forEach((gi, j) => {
        // numa linha só, os exemplos ficam encostados à direita
        if (gi === 2 && b.rows.length === 1) x = b.x + b.w - G[gi].w;
        G[gi].draw(x, y, b.h);
        x += G[gi].w + 1.5 * fs;
      });
    });
  }

  // ---------- caixas de texto ----------
  function update() {
    try {
      const lists = readVotes($votes.value);
      const n = parseInt($seats.value, 10);
      if (!(n >= 1 && n <= 99 && String(n) === $seats.value.trim())) { $seats.classList.add("bad"); err = "O número de lugares tem de ser um inteiro de 1 a 99."; draw(); return; }
      if (lists.reduce((p, l) => p + l.v, 0) <= 0) throw new Error("Os votos não podem ser todos 0.");
      $seats.classList.remove("bad"); $votes.classList.remove("bad"); err = "";
      S.src = $votes.value; S.n = n; S.lists = lists;
      dataChanged();
    } catch (e) {
      $votes.classList.add("bad"); err = e.message;
    }
    draw();
  }
  $votes.addEventListener("input", update);
  $seats.addEventListener("input", update);
  $dval.addEventListener("change", () => {
    const x = parseNum($dval.value);
    if (x > 0) { $dval.classList.remove("bad"); setD(x, true); $dval.value = fmt(S.d); }
    else $dval.classList.add("bad");
  });
  $dval.addEventListener("keydown", e => { if (e.key === "Enter") { $dval.dispatchEvent(new Event("change")); $dval.blur(); } });

  // ---------- toque e rato ----------
  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  function hitAt(x, y) {
    let best = null, bd = Infinity;
    for (const h of hits) if (h.r) { const d = Math.hypot(x - h.x, y - h.y); if (d < h.r && d <= bd) { best = h; bd = d; } }
    return best || hits.find(h => h.rect && inRect(h.rect, x, y)) || null;
  }
  let drag = null, rep = null;
  const stopRep = () => { clearTimeout(rep); clearInterval(rep); rep = null; };
  cv.addEventListener("pointerdown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) document.activeElement.blur();
    const h = hitAt(e.clientX, e.clientY);
    if (!h || h.kind === "cell") return;
    e.preventDefault();
    if (h.kind === "theme") { setDark(!dark, true); draw(); return; }
    if (h.kind === "box") { S[h.k] = !S[h.k]; draw(); return; }
    if (h.kind === "std") { setD(stdDiv(), true, true); return; }
    if (h.kind === "clear") { S.tries = []; draw(); return; }
    if (h.kind === "example") { const ex = EXAMPLES[h.i]; $votes.value = ex.src; $seats.value = ex.n; update(); return; }
    if (h.kind === "try") { setD(h.d, false); return; }
    if (h.kind === "useqn") { setD(hits.useqn, true, true); return; }
    if (h.kind === "step") {
      const f = () => setD(S.d + h.d * STEP(), false);   // (arredonda ao passo)
      f(); stopRep();
      rep = setTimeout(() => { rep = setInterval(f, 60); }, 400);
      drag = { kind: "step" };
      return;
    }
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    drag = h;
    setD(h.val(e.clientX), false);
    cv.style.cursor = "grabbing";
  });
  cv.addEventListener("pointermove", e => {
    if (drag) { if (drag.kind === "slide") setD(drag.val(e.clientX), false); return; }
    const h = hitAt(e.clientX, e.clientY);
    const hot = h && h.kind === "cell" ? h.key : null;
    if (hot !== S.hot) { S.hot = hot; draw(); }
    cv.style.cursor = !h || h.kind === "cell" ? "default" : h.kind === "slide" ? "ew-resize" : "pointer";
  });
  const end = () => { if (drag) logTry(); drag = null; stopRep(); cv.style.cursor = "default"; };
  ["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, end));
  cv.addEventListener("pointerleave", () => { if (S.hot) { S.hot = null; draw(); } });

  // teclado (fora das caixas): ←/→ mudam o divisor (Shift: ×10), p = divisor padrão, g e h mostram/ocultam o gráfico e a tabela de Hondt
  window.addEventListener("keydown", e => {
    if (document.activeElement && document.activeElement.classList.contains("inp")) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") setD(S.d + (e.key === "ArrowLeft" ? -1 : 1) * STEP() * (e.shiftKey ? 10 : 1), false);
    else if (e.key === "p") setD(stdDiv(), true, true);
    else if (e.key === "g") { S.showGraph = !S.showGraph; draw(); }
    else if (e.key === "h") { S.showHondt = !S.showHondt; draw(); }
    else return;
    e.preventDefault();
  });
  window.addEventListener("keyup", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") logTry(); });

  // ---------- endereço: #n=11&v=A 606; B 341; … ----------
  function writeHash() {
    history.replaceState(null, "", "#n=" + S.n + "&v=" + encodeURIComponent(S.src));
  }
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get("v")) S.src = hp.get("v");
  if (+hp.get("n") >= 1) S.n = Math.min(99, +hp.get("n"));
  $votes.value = S.src; $seats.value = S.n;
  update();

  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);
  if (document.fonts) document.fonts.ready.then(draw);
  resize();
})();
</script>
