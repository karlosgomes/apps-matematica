<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do método de Jefferson ao método de Hondt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #17202b;
    --muted: #5b6776;
    --line: #d6dde6;
    --soft: #f4f6f9;
    --axis: #36414d;
    --btn: #eef2f6;
    --btn-hover: #e1e7ee;
    --d: #ef6c00;
    --ok: #2e7d32;
    --bad: #c62828;
    --focus: #1565c0;
    --c0: #1565c0; --c1: #d32f2f; --c2: #2e7d32; --c3: #7b1fa2; --c4: #00838f; --c5: #6d4c41; --c6: #ad1457;
    --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1419; --panel: #171e26; --ink: #e6ebf1; --muted: #9aa6b4; --line: #2a3440; --soft: #1c242d;
      --axis: #aab4c0; --btn: #202a35; --btn-hover: #2a3642; --d: #ffa040; --ok: #5cc26a; --bad: #ff6b6b; --focus: #64a8ff;
      --c0: #64a8ff; --c1: #ff6b6b; --c2: #5cc26a; --c3: #d09cff; --c4: #4dd0e1; --c5: #c8a27c; --c6: #f48fb1;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1419; --panel: #171e26; --ink: #e6ebf1; --muted: #9aa6b4; --line: #2a3440; --soft: #1c242d;
    --axis: #aab4c0; --btn: #202a35; --btn-hover: #2a3642; --d: #ffa040; --ok: #5cc26a; --bad: #ff6b6b; --focus: #64a8ff;
    --c0: #64a8ff; --c1: #ff6b6b; --c2: #5cc26a; --c3: #d09cff; --c4: #4dd0e1; --c5: #c8a27c; --c6: #f48fb1;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.4;
    padding-inline: 16px; padding-block: 16px 24px;
  }
  .wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; }
  h1 { font-size: 1.45rem; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  .projbar { display: flex; gap: 8px; align-items: center; }

  main { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; gap: 14px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  @media (min-width: 901px) { .controls { position: sticky; top: 16px; } }

  .controls, .stage { display: grid; gap: 10px; min-width: 0; }
  .box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px 12px; display: grid; gap: 8px; min-width: 0;
  }
  .box h2 { margin: 0; font-size: 0.95rem; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stage .box h2 { font-size: 1.05rem; color: var(--ink); }
  .stage .box h2 .step { color: var(--muted); font-weight: 400; }
  .hint { font-size: 0.85rem; color: var(--muted); }

  .btn {
    font: inherit; font-weight: 700; font-size: 0.95rem;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    background: var(--btn); color: var(--ink); border: 1px solid var(--line); white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.small { font-size: 0.82rem; padding: 3px 9px; font-weight: 400; }
  #proj[aria-pressed="true"] { background: var(--axis); border-color: var(--axis); color: var(--panel); }

  input[type="text"] {
    font-family: var(--mono); font-size: 0.92rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; text-align: right;
    font-variant-numeric: tabular-nums; width: 100%; min-width: 0;
  }
  input[type="text"].bad { border-color: var(--bad); }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--axis); cursor: pointer; }

  /* listas */
  .lists { display: grid; grid-template-columns: 14px 1fr 6.5rem 1.6rem; gap: 6px 8px; align-items: center; }
  .lists .sw { width: 14px; height: 14px; border-radius: 3px; background: var(--c); }
  .lists input.name { text-align: left; font-family: var(--font); font-weight: 700; color: var(--c); }
  .lists .del { padding: 0; width: 1.6rem; height: 1.6rem; font-weight: 400; }
  .lists .head { font-size: 0.8rem; color: var(--muted); }
  .seats { display: flex; align-items: center; gap: 8px; }
  .seats input { width: 4rem; text-align: center; }
  .facts { font-family: var(--mono); font-size: 0.88rem; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; }
  .facts dt { color: var(--muted); font-family: var(--font); }
  .facts dd { margin: 0; }

  /* divisor */
  .drow { display: grid; grid-template-columns: auto 1fr 6.5rem; gap: 10px; align-items: center; }
  .drow label { font-style: italic; font-size: 1.3rem; color: var(--d); font-weight: 700; padding-inline: 4px; }
  .drow input[type="range"] { width: 100%; accent-color: var(--d); margin: 0; }
  .drow input[type="text"] { font-size: 1.05rem; border-color: var(--d); }
  .nudge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.t th, table.t td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.t th { font-size: 0.85rem; color: var(--muted); font-weight: 700; vertical-align: bottom; }
  table.t td { font-family: var(--mono); font-size: 0.98rem; }
  table.t td.name, table.t th.name { text-align: left; font-family: var(--font); font-weight: 700; }
  table.t td.seat { font-weight: 700; font-size: 1.1rem; }
  table.t td .q { color: var(--muted); }
  table.t tfoot td { border-bottom: 0; font-weight: 700; }
  .tscroll { overflow-x: auto; }
  .narrow { display: none; }
  @media (max-width: 560px) {
    table.t th, table.t td { padding: 4px 5px; }
    table.t td { font-size: 0.9rem; }
    table.t td .q, .wide { display: none; }
    .narrow { display: inline; }
  }

  .verdict { font-weight: 700; font-size: 1.05rem; padding: 6px 10px; border-radius: 6px; background: var(--soft); }
  .verdict.ok { color: var(--ok); }
  .verdict.low, .verdict.high { color: var(--bad); }
  .tries { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; }
  .tries .lab { color: var(--muted); }
  .chip { font-family: var(--mono); padding: 2px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); cursor: pointer; }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.low, .chip.high { color: var(--bad); }

  /* eixo do divisor */
  #axis svg { display: block; width: 100%; height: auto; overflow: visible; }
  #axis text { font-family: var(--font); }
  #axis .mono { font-family: var(--mono); }

  /* tabela de Hondt */
  table.h td { position: relative; }
  table.h td.on { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); font-weight: 500; }
  table.h td.off { color: var(--muted); }
  table.h td.next { outline: 2px dashed var(--d); outline-offset: -3px; }
  table.h td .rk { font-family: var(--font); font-size: 0.72rem; font-weight: 700; color: var(--c); margin-right: 6px; }
  table.h th.k, table.h td.k { text-align: center; font-family: var(--font); color: var(--muted); }
  table.h td.hot, #axis .hot { outline: 3px solid var(--d); outline-offset: -2px; }
  .key { padding: 8px 10px; border-radius: 6px; background: var(--soft); font-size: 0.98rem; display: grid; gap: 6px; }
  .key b.d { color: var(--d); }

  /* modo projeção: texto maior, mais contraste, tema claro */
  :root[data-proj] { --muted: #333d4a; --line: #b3bfcc; --axis: #1f2833; }
  :root[data-proj] { font-size: 19px; }
  :root[data-proj] body { font-size: 18px; }
  :root[data-proj] table.t td { font-size: 1.15rem; }
  :root[data-proj] table.t th { font-size: 1rem; }
  :root[data-hidectl] main { grid-template-columns: 1fr; }
  :root[data-hidectl] .controls { display: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Do método de Jefferson ao método de Hondt</h1>
    <div class="projbar">
      <button class="btn small" id="hidectl" hidden>Esconder controlos</button>
      <button class="btn small" id="proj" aria-pressed="false" title="Texto maior, para projetar na sala">📽 Modo projeção</button>
      <button class="btn small" id="theme" title="Modo claro / escuro">☾</button>
    </div>
  </header>
  <main>
    <section class="controls" aria-label="Dados">
      <div class="box">
        <h2>Eleição <button class="btn small" id="example" title="Assembleia de Alunos: 11 lugares, 4 listas">↺ Exemplo</button></h2>
        <div class="seats"><span>Lugares a distribuir</span>
          <button class="btn small" id="n-minus" aria-label="Menos um lugar">−</button>
          <input type="text" id="n" inputmode="numeric" value="11" aria-label="Número de lugares">
          <button class="btn small" id="n-plus" aria-label="Mais um lugar">+</button>
        </div>
        <div class="lists" id="lists"></div>
        <div><button class="btn small" id="add">+ Lista</button></div>
        <dl class="facts" id="facts"></dl>
      </div>
      <div class="box">
        <h2>Mostrar</h2>
        <label class="check"><input type="checkbox" id="show-axis"> 2. Onde muda o número de lugares</label>
        <label class="check"><input type="checkbox" id="show-hondt"> 3. Tabela do método de Hondt</label>
      </div>
    </section>

    <section class="stage" aria-label="Métodos">
      <div class="box" id="jefferson">
        <h2><span><span class="step">1.</span> Método de Jefferson: divisor modificado, por tentativas</span></h2>
        <div class="drow">
          <label for="d-range">d</label>
          <input type="range" id="d-range" min="1" max="200" step="0.01" value="100">
          <input type="text" id="d" inputmode="decimal" aria-label="Divisor d">
        </div>
        <div class="nudge">
          <button class="btn small" data-step="-10">−10</button>
          <button class="btn small" data-step="-1">−1</button>
          <button class="btn small" data-step="-0.1">−0,1</button>
          <button class="btn small" data-step="0.1">+0,1</button>
          <button class="btn small" data-step="1">+1</button>
          <button class="btn small" data-step="10">+10</button>
          <button class="btn small" id="d-std">d = divisor padrão</button>
        </div>
        <div class="tscroll"><table class="t" id="jtable"></table></div>
        <div class="verdict" id="verdict" aria-live="polite"></div>
        <div class="tries" id="tries"></div>
      </div>

      <div class="box" id="axis-box" hidden>
        <h2><span><span class="step">2.</span> Onde muda o número de lugares?</span></h2>
        <div class="hint" id="axis-hint"></div>
        <div id="axis"></div>
      </div>

      <div class="box" id="hondt-box" hidden>
        <h2><span><span class="step">3.</span> Método de Hondt: os maiores quocientes</span></h2>
        <div class="tscroll"><table class="t h" id="htable"></table></div>
        <div class="key" id="key"></div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MAXL = 7;
  const EXAMPLE = { n: 11, lists: [["A", 606], ["B", 341], ["C", 191], ["D", 68]] };
  const S = { n: 11, lists: [], d: 0, tries: [] };

  // ---------- números ----------
  const fmt = (x, dec = 2) => {
    if (!isFinite(x)) return "—";
    let s = (Math.round(x * 10 ** dec) / 10 ** dec).toFixed(dec).replace(/\.?0+$/, "");
    if (s === "-0") s = "0";
    return s.replace(".", ",").replace(/^-/, "−");
  };
  const fmtInt = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const parseNum = s => {
    s = String(s).trim().replace(/\s/g, "").replace("−", "-").replace(",", ".");
    if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
    return parseFloat(s);
  };
  // parte inteira de v/d (a folga evita 606/(606/6) = 5,9999…)
  const seatsOf = (v, d) => Math.floor(v / d + 1e-9);
  const tex = (el, src) => { try { katex.render(src, el, { throwOnError: false }); } catch (e) { el.textContent = src; } };

  // ---------- cálculos ----------
  const valid = () => S.lists.filter(l => l.v > 0);
  const total = () => valid().reduce((p, l) => p + l.v, 0);
  const stdDiv = () => total() / S.n;
  // quocientes de Hondt v/k, do maior para o menor (com a lista e o k)
  function quotients(extra = 3) {
    const q = [];
    const kmax = S.n + extra;
    S.lists.forEach((l, i) => { if (l.v > 0) for (let k = 1; k <= kmax; k++) q.push({ i, k, q: l.v / k }); });
    q.sort((a, b) => b.q - a.q || a.i - b.i);
    return q;
  }
  const seatsAt = d => S.lists.map(l => l.v > 0 ? seatsOf(l.v, d) : 0);

  // ---------- dados (lado esquerdo) ----------
  function color(i) { return `var(--c${i % 7})`; }
  function buildLists() {
    const box = $("lists");
    box.innerHTML = `<span></span><span class="head">Lista</span><span class="head" style="text-align:right">Votos</span><span></span>`;
    S.lists.forEach((l, i) => {
      const sw = document.createElement("span"); sw.className = "sw"; sw.style.setProperty("--c", color(i));
      const nm = document.createElement("input"); nm.type = "text"; nm.className = "name"; nm.value = l.name; nm.style.setProperty("--c", color(i));
      nm.setAttribute("aria-label", "Nome da lista " + (i + 1));
      nm.addEventListener("input", () => { l.name = nm.value.trim() || "?"; render(); });
      const vv = document.createElement("input"); vv.type = "text"; vv.inputMode = "numeric"; vv.value = l.v ? fmtInt(l.v) : "";
      vv.setAttribute("aria-label", "Votos da lista " + (i + 1));
      vv.addEventListener("input", () => {
        const x = parseNum(vv.value);
        const ok = Number.isInteger(x) && x >= 0;
        vv.classList.toggle("bad", !ok);
        if (ok) { l.v = x; dataChanged(); }
      });
      const del = document.createElement("button"); del.className = "btn small del"; del.textContent = "×"; del.title = "Retirar a lista";
      del.disabled = S.lists.length <= 2;
      del.addEventListener("click", () => { S.lists.splice(i, 1); buildLists(); dataChanged(); });
      box.append(sw, nm, vv, del);
    });
    $("add").disabled = S.lists.length >= MAXL;
  }
  $("add").addEventListener("click", () => {
    const used = new Set(S.lists.map(l => l.name));
    const name = "ABCDEFGHIJ".split("").find(c => !used.has(c)) || "?";
    S.lists.push({ name, v: 0 });
    buildLists(); dataChanged();
  });
  function setN(n) {
    if (!Number.isInteger(n) || n < 1 || n > 60) { $("n").classList.add("bad"); return; }
    $("n").classList.remove("bad");
    S.n = n; $("n").value = n; dataChanged();
  }
  $("n").addEventListener("input", () => setN(parseNum($("n").value)));
  $("n-minus").addEventListener("click", () => setN(S.n - 1));
  $("n-plus").addEventListener("click", () => setN(S.n + 1));
  function loadExample() {
    S.n = EXAMPLE.n; $("n").value = S.n; $("n").classList.remove("bad");
    S.lists = EXAMPLE.lists.map(([name, v]) => ({ name, v }));
    buildLists(); dataChanged();
  }
  $("example").addEventListener("click", loadExample);

  // os dados mudaram: o divisor volta ao divisor padrão e as tentativas recomeçam
  function dataChanged() {
    S.tries = [];
    const t = total();
    if (t > 0) setD(stdDiv(), false);
    writeHash();
    render();
  }

  // ---------- divisor ----------
  function rangeBounds() {
    const q = quotients();
    const dp = stdDiv();
    const lo = Math.max(0.01, Math.min(dp, (q[S.n + 2] || q[q.length - 1] || { q: dp }).q) * 0.8);
    const hi = Math.max(dp, (q[S.n - 1] || { q: dp }).q) * 1.25;
    return [lo, hi];
  }
  function setD(d, log = true) {
    if (!(d > 0)) return;
    S.d = Math.round(d * 100) / 100;
    if (log) logTry();
    render();
  }
  function logTry() {
    const s = seatsAt(S.d).reduce((p, x) => p + x, 0);
    const last = S.tries[S.tries.length - 1];
    if (last && last.d === S.d) return;
    S.tries.push({ d: S.d, s });
    if (S.tries.length > 12) S.tries.shift();
  }
  const dRange = $("d-range"), dText = $("d");
  dRange.addEventListener("input", () => { S.d = Math.round(parseFloat(dRange.value) * 100) / 100; render(false); });
  dRange.addEventListener("change", () => { logTry(); render(); });
  dText.addEventListener("change", () => {
    const x = parseNum(dText.value);
    if (x > 0) { dText.classList.remove("bad"); setD(x); } else dText.classList.add("bad");
  });
  dText.addEventListener("keydown", e => { if (e.key === "Enter") dText.dispatchEvent(new Event("change")); });
  document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => setD(Math.max(0.01, S.d + parseFloat(b.dataset.step)))));
  $("d-std").addEventListener("click", () => setD(stdDiv()));

  // ---------- desenho ----------
  function render(syncRange = true) {
    const t = total();
    const ok = t > 0 && S.n >= 1;
    // factos
    $("facts").innerHTML = ok
      ? `<dt>Total de votos</dt><dd>${fmtInt(t)}</dd><dt>Divisor padrão</dt><dd>${fmtInt(t)} ÷ ${S.n} ≈ ${fmt(stdDiv())}</dd>`
      : `<dt>Faltam dados</dt><dd>escreve os votos das listas</dd>`;
    if (!ok) { $("jtable").innerHTML = ""; $("verdict").textContent = ""; return; }

    // cursor do divisor
    const [lo, hi] = rangeBounds();
    dRange.min = lo.toFixed(2); dRange.max = hi.toFixed(2);
    if (syncRange) dRange.value = S.d;
    else if (S.d < lo || S.d > hi) dRange.value = S.d;
    if (document.activeElement !== dText) { dText.value = fmt(S.d); dText.classList.remove("bad"); }

    // 1. tabela de Jefferson
    const seats = seatsAt(S.d), sum = seats.reduce((p, x) => p + x, 0);
    let h = `<thead><tr><th class="name">Lista</th><th>Votos</th><th id="th-q"></th><th><span class="wide" id="th-s"></span><span class="narrow" id="th-s2"></span></th></tr></thead><tbody>`;
    S.lists.forEach((l, i) => {
      const q = l.v / S.d;
      h += `<tr style="--c:${color(i)}"><td class="name" style="color:var(--c)">${esc(l.name)}</td><td>${fmtInt(l.v)}</td>`
        + `<td><span class="q">${fmtInt(l.v)} ÷ ${fmt(S.d)} =</span> ${fmt(q, 3)}</td><td class="seat">${seats[i]}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td class="name">Total</td><td>${fmtInt(t)}</td><td></td><td class="seat">${sum}</td></tr></tfoot>`;
    $("jtable").innerHTML = h;
    tex($("th-q"), "\\dfrac{\\text{votos}}{d}");
    tex($("th-s"), "\\text{lugares} = \\left\\lfloor \\dfrac{\\text{votos}}{d} \\right\\rfloor");
    tex($("th-s2"), "\\left\\lfloor \\dfrac{\\text{votos}}{d} \\right\\rfloor");
    const v = $("verdict");
    if (sum === S.n) { v.className = "verdict ok"; v.textContent = `✓ ${sum} lugares: este divisor serve.`; }
    else if (sum < S.n) { v.className = "verdict low"; v.textContent = `Só ${sum} lugares — faltam ${S.n - sum}: é preciso diminuir o divisor.`; }
    else { v.className = "verdict high"; v.textContent = `${sum} lugares — sobram ${sum - S.n}: é preciso aumentar o divisor.`; }

    // tentativas
    const tr = $("tries");
    tr.innerHTML = S.tries.length ? `<span class="lab">Tentativas:</span>` : "";
    S.tries.forEach(x => {
      const c = document.createElement("span");
      c.className = "chip " + (x.s === S.n ? "ok" : x.s < S.n ? "low" : "high");
      c.textContent = `d = ${fmt(x.d)} → ${x.s}`;
      c.title = "Voltar a este divisor";
      c.addEventListener("click", () => setD(x.d, false));
      tr.append(c);
    });

    if (!$("axis-box").hidden) drawAxis(seats);
    if (!$("hondt-box").hidden) drawHondt();
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // 2. eixo do divisor: cada lista ganha o k-ésimo lugar quando d desce até votos/k
  function drawAxis(seats) {
    const box = $("axis");
    const W = Math.max(320, box.clientWidth || 700);
    const L = S.lists.map((l, i) => ({ l, i })).filter(o => o.l.v > 0);
    const proj = document.documentElement.dataset.proj !== undefined;
    const fs = proj ? 17 : 14, rowH = proj ? 46 : 38, ml = proj ? 60 : 48, mr = proj ? 54 : 44, top = 18;
    const H = top + L.length * rowH + 46;
    const [lo, hi] = rangeBounds();
    const pad = proj ? 16 : 14;   // os pontos das pontas não encostam aos nomes
    const X = d => ml + pad + (d - lo) / (hi - lo) * (W - ml - mr - 2 * pad);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Eixo do divisor">`;
    // marcas do eixo
    const step = niceStep((hi - lo) / Math.max(3, Math.floor((W - ml - mr) / 90)));
    const yA = top + L.length * rowH + 6;
    s += `<line x1="${ml}" y1="${yA}" x2="${W - mr + 10}" y2="${yA}" stroke="var(--axis)" stroke-width="1.5"/>`;
    s += `<path d="M${W - mr + 16},${yA} l-8,-4 v8 z" fill="var(--axis)"/>`;
    s += `<text x="${W - mr + 20}" y="${yA + 5}" font-size="${fs + 4}" font-style="italic" font-weight="700" fill="var(--d)">d</text>`;
    for (let x = Math.ceil(lo / step) * step; x <= hi + 1e-9; x += step) {
      s += `<line x1="${X(x)}" y1="${top - 6}" x2="${X(x)}" y2="${yA}" stroke="var(--line)" stroke-width="1"/>`;
      s += `<text x="${X(x)}" y="${yA + fs + 6}" font-size="${fs - 1}" text-anchor="middle" fill="var(--muted)" class="mono">${fmt(x)}</text>`;
    }
    // uma linha por lista: pontos em votos/k
    L.forEach(({ l, i }, r) => {
      const y = top + r * rowH + rowH / 2;
      const c = color(i);
      s += `<line x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}" stroke="${c}" stroke-opacity="0.25" stroke-width="2"/>`;
      s += `<text x="${ml - 10}" y="${y + 5}" font-size="${fs + 1}" font-weight="700" text-anchor="end" fill="${c}">${esc(l.name)}</text>`;
      let beyond = 0;
      for (let k = 1; k <= S.n + 3; k++) {
        const q = l.v / k;
        if (q > hi) { beyond++; continue; }
        if (q < lo) break;
        const on = q >= S.d - 1e-9;
        const rr = proj ? 11 : 9;
        s += `<g data-key="${i}-${k}"><title>${esc(l.name)}: ${fmtInt(l.v)} ÷ ${k} = ${fmt(q)}</title>`
          + `<circle cx="${X(q)}" cy="${y}" r="${rr}" fill="${on ? c : "var(--panel)"}" stroke="${c}" stroke-width="2"/>`
          + `<text x="${X(q)}" y="${y + 4.5}" font-size="${fs - 2}" font-weight="700" text-anchor="middle" fill="${on ? "var(--panel)" : c}">${k}</text></g>`;
      }
      if (beyond) s += `<text x="${W - mr + 6}" y="${y + 5}" font-size="${fs - 1}" fill="${c}" font-weight="700">+${beyond}</text>`;
      s += `<text x="${W - 2}" y="${y + 5}" font-size="${fs + 1}" font-weight="700" text-anchor="end" fill="${c}">${seats[i]}</text>`;
    });
    // o divisor atual
    if (S.d >= lo && S.d <= hi) {
      s += `<line x1="${X(S.d)}" y1="${top - 10}" x2="${X(S.d)}" y2="${yA}" stroke="var(--d)" stroke-width="2.5" stroke-dasharray="6 4"/>`;
      s += `<text x="${X(S.d)}" y="${top - 13}" font-size="${fs}" text-anchor="middle" fill="var(--d)" font-weight="700" class="mono">d = ${fmt(S.d)}</text>`;
    }
    s += `</svg>`;
    box.innerHTML = s;
    $("axis-hint").innerHTML = `O ponto <b>k</b> da lista está em <i>votos</i> ÷ <i>k</i>: quando <i>d</i> desce abaixo desse valor, a lista ganha o <b>k</b>.º lugar. `
      + `Os pontos cheios (à direita de <i>d</i>) são os lugares; à direita de cada linha, o total da lista (+n: pontos à direita, fora do eixo).`;
  }
  function niceStep(raw) {
    const p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
    return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  }

  // 3. tabela de Hondt: votos/1, votos/2, … ; os n maiores quocientes dão os lugares
  function drawHondt() {
    const q = quotients();
    const rank = new Map();
    q.forEach((o, r) => rank.set(o.i + "-" + o.k, r + 1));
    const seats = seatsAt(S.d);
    const qn = q[S.n - 1], qn1 = q[S.n];
    const K = Math.max(...seats, qn ? qn.k : 1, qn1 ? qn1.k : 1) + 1;
    let h = `<thead><tr><th class="k">÷</th>` + S.lists.map((l, i) => `<th style="color:${color(i)}">${esc(l.name)}<br><span style="font-weight:400" class="mono">${fmtInt(l.v)}</span></th>`).join("") + `</tr></thead><tbody>`;
    for (let k = 1; k <= K; k++) {
      h += `<tr><td class="k">${k}</td>`;
      S.lists.forEach((l, i) => {
        if (!(l.v > 0)) { h += `<td></td>`; return; }
        const val = l.v / k, key = i + "-" + k, rk = rank.get(key);
        const on = val >= S.d - 1e-9;
        const nxt = qn1 && qn1.i === i && qn1.k === k;
        h += `<td data-key="${key}" class="${on ? "on" : "off"}${nxt ? " next" : ""}" style="--c:${color(i)}">${on && rk ? `<span class="rk">${rk}.º</span>` : ""}${fmt(val)}</td>`;
      });
      h += `</tr>`;
    }
    h += `</tbody>`;
    $("htable").innerHTML = h;

    const key = $("key");
    if (!qn) { key.textContent = ""; return; }
    const tie = qn1 && Math.abs(qn.q - qn1.q) < 1e-9;
    const nm = o => `<b style="color:${color(o.i)}">${esc(S.lists[o.i].name)}</b>`;
    key.innerHTML =
      `<div>Nas células coloridas, o quociente é maior ou igual a <b class="d">d = ${fmt(S.d)}</b>: são exatamente os lugares do método de Jefferson (a ordem 1.º, 2.º, … é a ordem dos quocientes).</div>`
      + (tie
        ? `<div>O ${S.n}.º e o ${S.n + 1}.º quocientes são iguais (${fmt(qn.q)}): há um empate e nenhum divisor dá exatamente ${S.n} lugares.</div>`
        : `<div>Método de Hondt: os <b>${S.n}</b> maiores quocientes dão os lugares. O ${S.n}.º maior, ${nm(qn)} ${fmtInt(S.lists[qn.i].v)} ÷ ${qn.k} = <b>${fmt(qn.q)}</b>, é o maior divisor que serve no método de Jefferson; `
          + (qn1 ? `o seguinte (a tracejado), ${nm(qn1)} ${fmtInt(S.lists[qn1.i].v)} ÷ ${qn1.k} = ${fmt(qn1.q)}, já daria ${S.n + 1} lugares. Serve qualquer divisor <i>d</i> com ${fmt(qn1.q)} &lt; <i>d</i> ≤ ${fmt(qn.q)}.` : "")
          + ` <button class="btn small" id="use-qn">Usar d = ${fmt(qn.q)}</button></div>`);
    const u = $("use-qn");
    if (u) u.addEventListener("click", () => setD(qn.q));
  }

  // realce cruzado: célula da tabela de Hondt ↔ ponto do eixo
  function hot(keyv, on) {
    document.querySelectorAll(`[data-key="${keyv}"]`).forEach(el => {
      if (el.tagName === "TD") el.classList.toggle("hot", on);
      else { const c = el.querySelector("circle"); if (c) c.setAttribute("stroke-width", on ? 5 : 2); }
    });
  }
  ["htable", "axis"].forEach(id => {
    $(id).addEventListener("mouseover", e => { const t = e.target.closest("[data-key]"); if (t) hot(t.dataset.key, true); });
    $(id).addEventListener("mouseout", e => { const t = e.target.closest("[data-key]"); if (t) hot(t.dataset.key, false); });
  });

  ["axis", "hondt"].forEach(k => $("show-" + k).addEventListener("change", e => { $(k + "-box").hidden = !e.target.checked; render(); }));
  window.addEventListener("resize", () => { if (!$("axis-box").hidden) render(); });

  // ---------- endereço: #n=11&l=A:606,B:341,… ----------
  function writeHash() {
    const h = `n=${S.n}&l=` + S.lists.map(l => encodeURIComponent(l.name) + ":" + l.v).join(",");
    history.replaceState(null, "", "#" + h);
  }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const n = parseInt(p.get("n"), 10), l = p.get("l");
    if (!(n >= 1) || !l) return false;
    const lists = l.split(",").map(x => { const [a, b] = x.split(":"); return { name: decodeURIComponent(a || "?"), v: parseInt(b, 10) || 0 }; }).slice(0, MAXL);
    if (lists.length < 2) return false;
    S.n = Math.min(60, n); $("n").value = S.n; S.lists = lists;
    return true;
  }

  // ---------- modo projeção e modo escuro ----------
  const PROJ_KEY = "apps-mat-projecao", THEME_KEY = "quarto-color-scheme";
  const root = document.documentElement;
  const sysDark = matchMedia("(prefers-color-scheme: dark)");
  function userTheme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
  function applyTheme() {
    if (root.dataset.proj !== undefined) { root.dataset.theme = "light"; $("theme").hidden = true; return; }
    $("theme").hidden = false;
    const t = userTheme();
    const dark = t ? t === "alternate" : sysDark.matches;
    if (t) root.dataset.theme = dark ? "dark" : "light"; else delete root.dataset.theme;
    $("theme").textContent = dark ? "☀" : "☾";
  }
  $("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : sysDark.matches;
    try { localStorage.setItem(THEME_KEY, dark ? "default" : "alternate"); } catch (e) {}
    applyTheme();
  });
  sysDark.addEventListener("change", applyTheme);
  function setProj(on) {
    if (on) root.dataset.proj = ""; else { delete root.dataset.proj; delete root.dataset.hidectl; }
    $("proj").setAttribute("aria-pressed", on);
    $("hidectl").hidden = !on;
    $("hidectl").textContent = root.dataset.hidectl !== undefined ? "Mostrar controlos" : "Esconder controlos";
    try { localStorage.setItem(PROJ_KEY, on ? "1" : "0"); } catch (e) {}
    applyTheme(); render();
  }
  $("proj").addEventListener("click", () => setProj(root.dataset.proj === undefined));
  $("hidectl").addEventListener("click", () => {
    if (root.dataset.hidectl !== undefined) delete root.dataset.hidectl; else root.dataset.hidectl = "";
    setProj(true);
  });

  // ---------- início ----------
  if (readHash()) { buildLists(); S.tries = []; S.d = Math.round(stdDiv() * 100) / 100; }
  else { S.lists = EXAMPLE.lists.map(([name, v]) => ({ name, v })); buildLists(); S.d = Math.round(stdDiv() * 100) / 100; }
  let proj = false;
  try { proj = localStorage.getItem(PROJ_KEY) === "1"; } catch (e) {}
  setProj(proj);
})();
</script>
</body>
</html>
